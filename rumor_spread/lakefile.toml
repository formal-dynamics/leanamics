name = "rumor_spread"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RumorSpread"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the repository has no LICENSE and its files carry no copyright header
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "dynamics"
path = "../dynamics"

[[lean_lib]]
name = "RumorSpread"
