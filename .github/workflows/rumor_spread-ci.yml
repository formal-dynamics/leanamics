name: rumor_spread CI

on:
  push:
    paths:
      - 'rumor_spread/**'
      - '.github/workflows/rumor_spread-ci.yml'
  pull_request:
    paths:
      - 'rumor_spread/**'
      - '.github/workflows/rumor_spread-ci.yml'
  workflow_dispatch:

# NOTE: this only runs `lake build` + lint, scoped to rumor_spread/ via
# lake-package-directory. The blueprint, the API docs and their deployment to
# GitHub Pages are handled for every project at once by
# .github/workflows/pages.yml.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          lake-package-directory: rumor_spread
          # No GitHub cache: it would store ~2.6 GB of `.lake` (mostly Mathlib, which
          # `lake exe cache get` fetches in seconds) per run and evict the Pages
          # workflow's documentation cache from the 10 GB repository quota.
          use-github-cache: false
