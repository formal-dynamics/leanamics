name = "epidemics"
version = "0.1.0"
defaultTargets = ["Epidemics", "RumorSpread"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "2d8c533bd0a0515caa32f18c0ab4485bd6229378"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[require]]
name = "dynamics"
path = "../dynamics"

[[lean_lib]]
name = "Epidemics"

# Rumor spreading on K_n without self-calls (namespace `RumorPush`), with the options it was
# developed under: Mathlib's style linters and a higher synthesis depth.
[[lean_lib]]
name = "RumorSpread"

[lean_lib.leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
weak.linter.mathlibStandardSet = true
# Mathlib's header linter only accepts its Apache 2.0 header; the repository is MIT-licensed
weak.linter.style.header = false
maxSynthPendingDepth = 3
