[[source]]
item = "dynamics:thm:drifthitting"
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "SPAA 2011"
version = "SPAA 2011 proceedings"
