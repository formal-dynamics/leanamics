# Becchetti, Clementi, Natale, Pasquale, Silvestri, Trevisan (SPAA 2014): nested phases.

[[source]]
item = "dynamics:thm:phases"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "SPAA 2014 proceedings version (author copy)"
result = "Lemma A.4"
page = 10
url = "https://www.mat.uniroma2.it/~pasquale/papers/bcnpst_spaa14.pdf"
status = "transcribed by an AI agent from the PDF of the SPAA 2014 proceedings version (author copy; no LaTeX source of this version is available), formulas read from the page image; not yet checked by a person"
statement = '''
Let $\{X_t\}_t$ be a finite-state Markov chain with state space $S$. If $A_1, \ldots, A_T$ are such that $S \supseteq A_1 \supseteq A_2 \supseteq \cdots \supseteq A_T$ and, for any $i = 1, \ldots, T$, $\mathbf{P}\left( X_t \in A_i \mid X_{t-1} \in A_i \right) \geqslant 1 - \epsilon$ and for $i < T$, $\mathbf{P}\left( X_t \in A_{i+1} \mid X_{t-1} \in A_i \right) \geqslant 1 - \nu$ where $0 \leqslant \epsilon \leqslant \nu < 1$, then, for any integer $\ell \geqslant 1$ it holds that
\[
\mathbf{P}\left( X_{\ell T} \in A_T \mid X_0 \in A_1 \right) \geqslant 1 - T(\ell\, \epsilon + \nu^{\ell})
\]
'''
context = '''
[Appendix A, p. 10 (printed page 256), just before the lemma:] We now provide a useful result on finite Markov chains. The proof is given in the full-version [4].
[References, p. 10:] [4] L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, and L. Trevisan. Simple dynamics for plurality consensus. arXiv:1310.2858, 2013.
'''
notes = "PDF page 10 of the 10-page proceedings paper (printed page 256). The library's numbering (Lemma A.4, stated without proof) is that of the proceedings version. In arXiv:1310.2858v1 and v2 the same lemma is Lemma A.5 (label lemma:converge), stated with a proof and with the opening 'Let $\\mathcal{M}$ be any finite Markov chain and let $S$ be its set of states. Let $X_t$ be the random variable representing the state of the chain at time $t$.'; there, Lemma A.4 is Bernstein's inequality. PROVENANCE.md says the lemma was dropped in the journal version (not checked here). Formulas typeset with standard LaTeX (\\mathbf{P}, \\mid) as they appear in the PDF."

# Berenbrink, Giakkoupis, Kermarrec, Mallmann-Trenn (ICALP 2016): drift lemmas.

[[source]]
item = "dynamics:thm:drift"
paper = "P. Berenbrink, G. Giakkoupis, A.-M. Kermarrec, F. Mallmann-Trenn. Bounds on the voter model in dynamic networks"
venue = "ICALP 2016"
version = "arXiv:1603.01895v2"
result = "Lemma 2.2"
page = 7
url = "https://arxiv.org/abs/1603.01895v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
Assume that $s_{\hat t}$ is fixed for an arbitrary $(\hat{t}\ge 0)$ and $\kappa=2$.
Let $\tau^*= \min\left\{t' : \sum_{i= \hat t}^{t'} \phi_i \geq 129 \cdot \operatorname{vol}(s_{\hat t})/d_{min} \right\}$.
Then
$\Pr\left(T \leq \tau^*+\hat t\right) \geq 1/2.$
In particular, if the graph is static with conductance $\phi$, then $\Pr\big(T \leq \frac{129 \cdot \mbox{vol}(s_{\hat t})}{\phi \cdot d_{min}}+\hat t\big) \geq 1/2.$
'''
context = '''
[Section 1, p. 2:] For static graphs the above bound simplifies to
$O(m/(d_{min} \cdot \phi))$, where $d_{min}$ is the minimum degree.
[Section 1.1, Model and New Results, p. 3:] Our protocols work in synchronous steps. The consensus time $T$ is defined at the first time step at which all nodes have the same opinion.
[Standard Voter Model, p. 3:] In every synchronous time step every node chooses a neighbour u.a.r. and adopts its opinion with probability $1/2$.
We assume that the dynamic graphs $\mathcal{G}=G_1, G_2,\ldots$ are generated by an adversary. We assume that each graph has $n$ nodes and the nodes are numbered from $1$ to $n$. The sequence of conductances
$\phi_1,\phi_2,\ldots$ is given in advance, as well as a degree sequence
$d_1,d_2,\ldots, d_n$.
The adversary is now allowed to create every graph $G_i$ by redistributing the edges of the graph. The constraints are that each graph $G_i$ has to have conductance $\phi_i$ and node $j$ has to have degree $d_j$ (the degrees of the nodes do not change over time).
[...] For the redistribution of the edges we assume that the adversary
knows the distribution of all opinions during all previous rounds.
[Theorem 1.1, p. 3:] Assume
$\kappa \leq n$ opinions are arbitrarily distributed over the nodes of $G_1$.
Let $\phi_t$ be a lower bound on the conductance at time step $t$.
[Section 2, p. 5:] Let $G = (V,E)$.
For a fixed set $S\subseteq V$ we define $cut(S,V\setminus S)$ to be the set of edges between the sets $S\subseteq V$ and $V\setminus S$ and let $\lambda_{u}$ be the number of neighbours of $u$ in $V\setminus S$. Let
$\operatorname{vol}(S)=\sum_{u\in S} d_u.$
The \emph{conductance} of $G$ is defined as
$$\phi=\phi(G)=\min \left\{ \tfrac{\sum_{u \in U} \lambda_{u}
}{\operatorname{vol}(U)}\colon U\subset V \text{ with } 0 < \operatorname{vol}(U) \leq m\right\}.$$
We note $1/n^2 \leq \phi \leq 1$. [...] We denote by $v_t^{(i)}$ the set of nodes that have opinion $i$ after the first $t$ rounds and $t\geq0$. If we refer to the random variable we use $V_t^{(i)}$ instead.
First we show Theorem 1.1 for $\kappa=2$ (two opinions), which we call $0$ and $1$ in the following. [...]
Let $s_t$ denote the set having the smaller volume, i.e., $s_t = v^{(0)}_t$ if $\operatorname{vol}(v^{(0)}_t)\leq \operatorname{vol}(v^{(1)}_t)$, and $s_t = v^{(1)}_t$ otherwise. Note that we use $s_t, v^{(0)}_t$ and $v_t^{(1)}$ whenever the state at time $t$ is fixed, and $S_t, V^{(0)}_t$ and $V_t^{(1)}$ for the corresponding random
variables.
[...] We define $$\Psi(S_{t}) = \sqrt{\operatorname{vol}(S_t)}.$$
[Lemma 2.1, p. 5:] Assume $s_t\not= \emptyset$ and $\kappa=2$.
Then
$$\mathbf{E}[\Psi(S_{t+1}) \mid S_t=s_t] \leq \Psi(s_{t}) - \frac{\sum_{u \in V} \lambda_{u,t}\cdot d_u}{32\cdot (\Psi(s_{t}))^3}.$$
[Proof of Lemma 2.2, p. 7:] Recall that $T=\min_t\{S_t = \emptyset\}$.
'''
notes = "Label lem:two-op-const-prob; same numbering in v1. Macros replaced: \\vol -> \\operatorname{vol}, \\dmin -> d_{min}, \\de -> d, \\pot{t} -> \\Psi(S_{t}), \\potfixed{t} -> \\Psi(s_{t}), \\Exp -> \\mathbf{E}; forced line breaks (\\\\) and LaTeX comments dropped. The statement's second sentence keeps the source's \\mbox{vol}. In the Section 2 excerpt, $m$ is the number of edges (stated in the proof of Lemma 2.1, p. 5: 'We define $m$ as the number of edges'); the conductance is a minimum over sets of volume at most $m$, as printed. Lemma 2.1, quoted in the context, is the drift that the proof of Lemma 2.2 combines with $\\Psi(s_t)^2 \\cdot \\phi_t \\cdot d_{min} \\leq \\sum_{u} \\lambda_{u,t} d_u$ to get $\\mathbf{E}[\\Psi(S_{t+1}) \\mid S_t = s_t] \\leq \\Psi(s_t) - d_{min}\\phi_t/(32\\Psi(s_t))$ (Eq. (4)), the form the library abstracts. 'w.h.p.' (footnote 1, p. 2) means with probability at least $1 - 1/n$; it does not occur in this lemma. The library cites the lemma for a generic potential; PROVENANCE.md and dynamics/FORMALIZATION_DIFFERENCES.md describe how its statement relates to this one."

[[source]]
item = "dynamics:thm:multdrift"
paper = "P. Berenbrink, G. Giakkoupis, A.-M. Kermarrec, F. Mallmann-Trenn. Bounds on the voter model in dynamic networks"
venue = "ICALP 2016"
version = "arXiv:1603.01895v2"
result = "Lemma 2.4"
page = 8
url = "https://arxiv.org/abs/1603.01895v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
Assume $\kappa=2$. We have
$\Pr\left(T \leq \tau' \right) \geq 1/n^2.$
In particular, if the graph is static with conductance $\phi$, then $\Pr\big(T \leq \frac{96\cdot n\log n}{\phi^2 }\big) \geq 1-1/n^2$.
'''
context = '''
[Section 1.1, Model and New Results, p. 3:] Our protocols work in synchronous steps. The consensus time $T$ is defined at the first time step at which all nodes have the same opinion.
[Standard Voter Model, p. 3:] In every synchronous time step every node chooses a neighbour u.a.r. and adopts its opinion with probability $1/2$.
We assume that the dynamic graphs $\mathcal{G}=G_1, G_2,\ldots$ are generated by an adversary. We assume that each graph has $n$ nodes and the nodes are numbered from $1$ to $n$. The sequence of conductances
$\phi_1,\phi_2,\ldots$ is given in advance, as well as a degree sequence
$d_1,d_2,\ldots, d_n$.
The adversary is now allowed to create every graph $G_i$ by redistributing the edges of the graph. The constraints are that each graph $G_i$ has to have conductance $\phi_i$ and node $j$ has to have degree $d_j$ (the degrees of the nodes do not change over time).
[...] For the redistribution of the edges we assume that the adversary
knows the distribution of all opinions during all previous rounds.
[Theorem 1.1, p. 3:] Assume
$\kappa \leq n$ opinions are arbitrarily distributed over the nodes of $G_1$.
Let $\phi_t$ be a lower bound on the conductance at time step $t$.
Let $b>0$ be a suitable chosen constant.
[...]
(ii) $\tau'$ is the first round so that $\sum_{t=1}^{\tau'} \phi_t^2 \geq b \cdot n \log n.$
[Section 2, p. 5:] Let $G = (V,E)$.
For a fixed set $S\subseteq V$ we define $cut(S,V\setminus S)$ to be the set of edges between the sets $S\subseteq V$ and $V\setminus S$ and let $\lambda_{u}$ be the number of neighbours of $u$ in $V\setminus S$. Let
$\operatorname{vol}(S)=\sum_{u\in S} d_u.$
The \emph{conductance} of $G$ is defined as
$$\phi=\phi(G)=\min \left\{ \tfrac{\sum_{u \in U} \lambda_{u}
}{\operatorname{vol}(U)}\colon U\subset V \text{ with } 0 < \operatorname{vol}(U) \leq m\right\}.$$
We note $1/n^2 \leq \phi \leq 1$. [...]
Let $s_t$ denote the set having the smaller volume, i.e., $s_t = v^{(0)}_t$ if $\operatorname{vol}(v^{(0)}_t)\leq \operatorname{vol}(v^{(1)}_t)$, and $s_t = v^{(1)}_t$ otherwise. [...]
We define $$\Psi(S_{t}) = \sqrt{\operatorname{vol}(S_t)}.$$
[Section 2.2, p. 8, before the lemma:] The following lemma is similar to Lemma 2.2 in the last section: We first bound the expected potential drop in round $t+1$, i.e., we bound $\mathbf{E}[\Psi(S_{t+1}) -\Psi(s_{t}) \mid S_t=s_t]$.
This time however, we express the drop as a function which is linear in $\Psi(s_{t})$. This allows us to bound the expected size of the potential at time $\tau'$, i.e., $\mathbf{E}[\Psi(S_{\tau'})]$, directly. From the expected size of the potential at time $\tau'$ we derive the desired bound on $Pr\left(T \leq \tau' \right)$.
'''
notes = "Label lem:forsecondpart; same numbering in v1. Verbatim, including the printed '\\geq 1/n^2' in the first claim (the last line of the proof reads 'Pr(T <= tau') = Pr(Psi(S_tau') = 0) >= 1 - 1/n^2'). Macros replaced: \\vol -> \\operatorname{vol}, \\dmin -> d_{min}, \\de -> d, \\pot{t} -> \\Psi(S_{t}), \\potfixed{t} -> \\Psi(s_{t}), \\Exp -> \\mathbf{E}. The library abstracts the argument of the proof (a multiplicative drift $\\mathbf{E}[\\Psi(S_{t+1})] \\leq (1 - \\phi_t^2/(32n)) \\mathbf{E}[\\Psi(S_t)]$ followed by Markov's inequality), not the statement's voter-specific bound; see dynamics/FORMALIZATION_DIFFERENCES.md. The same lemma is the source of the item voter:thm:bgkm-sq in verification/sources.toml. In the Section 2 excerpt, $m$ is the number of edges (proof of Lemma 2.1, p. 5)."

# Galam (2002): majority rule with groups of size three. Boyd and Richerson (1985): conformist
# transmission.

[[source]]
items = ["dynamics:def:majority-map", "dynamics:lem:majority-map"]
paper = "S. Galam. Minority opinion spreading in random geometry"
venue = "Eur. Phys. J. B 25, 403-406 (2002)"
version = "arXiv:cond-mat/0203553v1"
result = "Eq. (4)"
page = 4
url = "https://arxiv.org/abs/cond-mat/0203553v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
\begin{equation}
P_{+}(t+1)=\sum_{k=1}^L a_k \sum_{j=N[\frac{k}{2}+1]}^k C_j^k P_+(t)^j P_-(t)^{(k-j)} ,
\end{equation}
at time $(t+1)$ where $C_j^k\equiv \frac{k!}{(k-j)! j!}$ and
$N[\frac{k}{2}+1]\equiv IntegerPart \ of \ (\frac{k}{2}+1)$.
'''
context = '''
[p. 3:] We start from a population with $N$ individuals, which have to decide whether or not
to accept a reform proposal. At time $t$ prior to the discussion the proposal has
a support by $N_+(t)$ individuals leaving $N_-(t)$ persons against it. Each person
is supposed to have an opinion making $N_+(t)+N_-(t)=N$. Associated individual
probabilities to be
in favor or against the proposal are thus,
\begin{equation}
P_{\pm}(t)\equiv \frac{N_{\pm}(t)}{N} ,
\end{equation}
with,
\begin{equation}
P_+(t)+P_-(t)=1 .
\end{equation}
[p. 3:] Accordingly a given social life yields a random local
geometry landscape characterized by a probability
distribution for gathering sizes $\{a_i\}$ which
satisfy the constraint,
\begin{equation}
\sum_{i=1}^L a_i=1 ,
\end{equation}
where $i=1, 2, ..., L$ stands
for respective sizes $1, ..., L$ with $L$ being the larger group.
[pp. 3-4:] During these meetings all individuals are assumed to be involved
in one group gathering. It means a given person is, on average, taking part to a
group of size $i$ with probability $a_i$. The existence of one-person groups makes
this assumption realistic. Each new cycle of multi-size discussions is marked by a time
increment $+1$.
[p. 4:] On this basis a local majority argument determines the outcome of the discussion.
People align along the local initial majority view.
For instance a group of five
persons with at start three in favor of the reform and two against it ends up with
five people in favor of the reform. On the reverse two initial reform supporters
leads to five persons against it.
However in case of an even group this rule of one person - one argument leaves
the local possibility of a temporary absence of a collective majority. The group
is then at a tie within a non-decisional state. It doubts.
[...] In terms of our model, at a tie the group does not move and thus decides
not to move, i. e., the full group turns against the reform proposal to preserve the
existing situation. [...] Accordingly having $P_{\pm}(t)$ at time $t$ yields,
'''
notes = "The library cites 'Galam 2002, Eq. 4 with a_3 = 1' without the title; this paper is the one whose Eq. (4) gives, for $a_3 = 1$ (all groups of size three), $P_+(t+1) = P_+(t)^3 + 3 P_+(t)^2 P_-(t)$, the library's galamMap; the identification of the paper was made by the agent. arXiv v1 is the only version; the equation is numbered (4) in the PDF. The statement is the displayed equation and the sentence that follows it, verbatim (the source writes 'IntegerPart \\ of', as printed). No paper macros."

