version = "arXiv:1508.06782v1"
result = "Theorem 3.1"
page = 7
url = "https://arxiv.org/abs/1508.06782v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
[The Adversary-Free Case.]
Starting from any initial configuration with $k \leqslant n^{1/3 - \varepsilon}$ active opinions,
where $\varepsilon > 0$ is an arbitrarily-small constant, the 3-majority dynamics reaches
consensus within
$\mathcal{O}\left( (k^{2} \log^{1/2} n + k \log n) (k + \log n) \right)$ rounds, w.h.p.
'''
context = '''
[Section 1.1, footnote 3, p. 3:]
According to
the standard definition, we say that a sequence of events
$\mathcal E_n$, $n= 1,2, \ldots$ holds \emph{with high
probability} if $ \mathbf{P}\left( \mathcal E_n \right) = 1-\mathcal{O} (1/n^{\lambda})$ for
some positive constant $\lambda >0$.

[Section 2, pp. 4-5:]
We assume a distributed system consisting of $n$ nodes that
communicate with each other over a complete graph via the
synchronous \emph{uniform-gossip} mechanism: In every
round, each node can pull information from (at most) $h$ random
neighbors, where $h$ is an absolute constant (in this work, $h = 3$).
At the onset, every node chooses an arbitrary item, called
\emph{opinion}, from an arbitrary finite
set $\Sigma$.
A simple dynamics for consensus is the \emph{$3$-majority protocol}
\cite{BCNPST13}:

\begin{quote}
\textit{In each round, every node
samples three nodes uniformly at random (including itself and with repetitions)
and revises its opinion according to the majority of the opinions it sees.
If it sees three different opinions, it picks the first one.}
\end{quote}
\noindent
Clearly, in the case of three different opinions, choosing the second or
the third one would not make any difference, nor would choosing one of
the observed opinions uniformly at random.

Since the communication graph is complete and nodes are anonymous, the
overall system state at any round can be described by a \emph{
configuration} $\mathbf{c}:=\left(c_{1},...,c_{|\Sigma|}\right)$,
where the \emph{support} $c_{i}$ of opinion $i$ is the number of nodes holding opinion $i$ in
that system's state. Given configuration $\mathbf{c}$, we say that an opinion $i$ is \emph{active} in $\mathbf{c}$ if
$c_i >0$ and,
for any set of active opinions $W\subseteq \Sigma$, we define $\mathbbm m\left(W\right):=\arg\min_{i\in W}c_{i}$.
For any variable $x$ of the process, we write
$x^{\left(t\right)}$ if we are considering its value at round $t$ and $X^{\left(t\right)}$ to
denote the corresponding random variable.
Furthermore, following \cite{lpw08}, considered a configuration
$\mathbf{c}$ and a random variable $X$ defined over the process, we
write $\mathbf{P}_{\mathbf{c}} \left( X^{(t)} = x \right)$ for $\mathbf{P}\left( X^{(t)} = x
\, \vert \, \mathbf{C}^{(0)} = \mathbf{c} \right)$, i.e., to denote the probability
distribution of the variable $X$ when the system evolves for $t$
consecutive rounds starting from configuration $\mathbf{c}$.
Analogously, we write $\mathbf{E}_{\mathbf{c}} \left[ X^{(t)} \right]$ for the associated
conditional expectation.

