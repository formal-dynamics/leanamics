item = "plurality:def:mono"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Section 4.1, monochromatic coloring"
page = 18
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
Let us say that a coloring $\overline{c} = (c_1, \dots, c_k) \in \{ 0, 1, \dots, n \}^k$ with $\sum_{h=1}^k c_h = n$ is \emph{monochromatic} if there is an $h \in [k]$ such that $c_h = n$.
'''
context = '''
[Section 1, p. 2:]
the goal
is to design an efficient fully-distributed protocol that lets the network
converge to the \emph{majority consensus}, i.e., to the monochromatic configuration in which all nodes support
the majority color.

[Section 4.2, p. 20 (after Definition 4.7):]
Let us observe that, by definition of $h$-dynamics, any monochromatic configuration is an absorbing state of the relative Markovian process.
'''
notes = "The paper calls the absorbing configurations monochromatic; the second context excerpt is its remark that they are absorbing for every h-dynamics. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

