item = "plurality:thm:as-main"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Theorem 4"
page = 8
url = "https://arxiv.org/abs/1702.04921v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
Starting from \emph{any} configuration $c \in \mathcal{C}$, $3$-\textsc{Majority}
reaches consensus w.h.p. in $\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds.
'''
context = '''
[Section 2.1, p. 6:]
We consider the \emph{consensus problem} on the complete graph of $n$ nodes.
Initially, each node supports one opinion (or color) from the set $[k]
:= \{1, 2, \dots, k\}$, where $k \leq n$. Nodes interact in
synchronous, discrete rounds using the \emph{Uniform Pull}
mechanism~\cite{DGHILSSST87}. That is, during every round each node can ask the
opinion of a constant number of random neighbors. Given these opinions, it
updates its own opinion according to some fixed update rule. The goal of the
system is to reach \emph{consensus} (a configuration where all nodes support the
same opinion).

Let $\mathbb{N} := \{1, 2, \dots\}$ and $\mathbb{N}_0 := \{0, 1, \dots\}$. We
describe the system state after any round by an $n$-dimensional integral vector
$c = (c_i)_{i \in [n]} \in \mathbb{N}_0^n$ with $\sum_{ i \in [n] }
c_i = n$. Here, the $i$-th component $c_i \in \mathbb{N}_0$ corresponds to the number of
nodes supporting opinion $i$. If $k < n$, then $c_i = 0$ for all $i \in
\{k+1, k+2, \dots, n\}$. We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid
\sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible
configurations.

[Section 3, p. 8, after Theorem 4:]
\item[Phase~2: From up to $n^{1/4}\log^{1/8} n$ to $1$ color (consensus).]
Once we reached a configuration with $n^{1/4}\log^{1/8} n$ colors, we can
apply~\cite[Theorem 3.1]{BCNPT16} (see
Theorem~8 in Appendix~A), a
previous analysis of $3$-\textsc{Majority}. It works only for initial configurations
with at most $k \leq n^{1/3 - \epsilon}$ colors ($\epsilon > 0$ arbitrarily
small). In that case, \cite[Theorem 3.1]{BCNPT16} yields a runtime of
$\mathrm{O}\bigl((k^2 \log^{1/2} n + k \log n) \cdot (k+ \log n)\bigr)$. Since the first phase leaves us with
$\mathrm{O}\bigl(n^{1/4}\bigr)$ colors, this immediately implies that the second
phase takes $\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds.

[Appendix A.5, Theorem 8, p. 15:]
[{\cite[Theorem 3.1]
{BCNPT16}}]
Let $\varepsilon >0$ be an arbitrarily small constant. Starting from any initial
configuration with $k \leq n^{1/3-\varepsilon}$ colors, $3$-\textsc{Majority} reaches
consensus w.h.p. in
\[
\mathrm{O}\left((k^2 \log^{1/2} n + k \log n) \cdot (k+ \log n)\right)
\]
rounds.
'''
notes = "The item is Theorem 4 with the cited Theorem 8 as a hypothesis; the context gives Phase 2 of the proof. arXiv v1 is the only version. Paper macros replaced where they occur: \\hmajority{3} -> $3$-\\textsc{Majority}, \\voter -> \\textsc{Voter}, \\AC/ -> \\textsc{AC}, \\aclong/ and \\AClong/ -> the words, \\aggfvoter -> \\alpha^{({\\mathcal{V}})}, \\aggfhmajority{3} -> \\alpha^{(3M)}, \\sortDown{x} -> {x}^{\\downarrow}, \\Mult -> \\operatorname{Mult}, \\E, \\Ex, \\ex -> \\mathbb{E}[...], \\Pr{.} -> \\Pr\\left[.\\right], \\intcc{.} -> [.], \\intoo{.} -> (.), \\set{.}/\\Set{.} -> \\{.\\} (with | -> \\mid), \\norm{.} -> \\left\\lVert.\\right\\rVert, \\N, \\R -> \\mathbb{N}, \\mathbb{R}, \\coloneqq -> :=, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); \\label commands dropped, \\cref and \\ref replaced by the printed names and numbers. The paper does not define w.h.p."

