For $N \in \mathbb{N}$ and a probability vector $\Theta \in [0,1]^l$, consider a
random vector $X$ having the multinomial distribution $\operatorname{Mult}(N,\Theta)$. Let
\begin{equation}
\phi\colon \{ x \in \mathbb{N}_0^l \mid \sum_{ i \in [l] } x_i = N \} \to \mathbb{R}
\end{equation}
be such that $\mathbb{E}\left[\phi(X)\right]$ exists. Note that this expected value depends on
$\Theta$. Define the function $\psi$ on probability vectors as $\psi(\Theta)
:= \mathbb{E}\left[\phi(X)\right]$. If $\phi$ is Schur-convex, then so is $\psi$.
'''
