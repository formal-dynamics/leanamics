result = "Proof of Lemma 4.11, Equation (19) and P(Y = 1)"
page = 23
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
Consider a specific node, say $u \in [n]$, let $N_j$ be the number of $j$-colored nodes picked by $u$ during the sampling stage of the $t$-th time step and let $Y$ be the indicator random variable of the event that node $u$ chooses color $j$ at time step $t+1$. We give an upper bound on the probability of the event $Y=1$ by conditioning it on $N_j = 1$ and $N_j \geqslant 2$ (observe that if $N_j = 0$ node $u$ cannot choose $j$ as its color at the next time step)
\begin{equation}
\mathbf{P}\left( Y_u = 1 \right) \leqslant \mathbf{P}\left( Y_u = 1 \,|\, N_j = 1 \right) \mathbf{P}\left( N_j = 1 \right) + \mathbf{P}\left( N_j \geqslant 2 \right)
\end{equation}
Now observe that
\begin{itemize}
\item $\mathbf{P}\left( Y_u = 1 \,|\, N_j(u) = 1 \right) \leqslant 1/h$, since it is exactly $1/h$ if all other sampled nodes have distinct colors and it is $0$ otherwise;
\item $\mathbf{P}\left( N_j = 1 \right) \leqslant h \frac{a}{n}$, since it can be bounded by the probability that at least one of the $h$ samples gives color $j$;
\item $\mathbf{P}\left( N_j \geqslant 2 \right) \leqslant \binom{h}{2} \frac{a^2}{n^2}$, since it is the probability that a pair of sampled nodes exist with the same color $j$.
\end{itemize}
Hence in (19) we have that
$$
\mathbf{P}\left( Y = 1 \right) \leqslant \frac{a}{n} + \frac{h^2}{2} \cdot \frac{a^2}{n^2}
$$
Thus, for the expected number of $j$-colored nodes at the next time step we get
$$
'''
context = '''
[Section 4.3, p. 23:]
Let us consider a set of $n$ nodes, each node colored with one out of $k$ colors. The $h$-majority protocol runs as follows:
\begin{quote}
\textit{At every time step, every node picks $h$ nodes uniformly at random (including itself and with repetitions) and recolors itself according to the majority of the colors it sees (breaking ties u.a.r.)}
\end{quote}

[Lemma 4.11, p. 23:]
Let $j \in [k]$ be a color and let $X_t$ be the random variable counting the number of $j$-colored nodes at time $t$. If $k/h = \mathcal{O}(n^{(1-\varepsilon) / 4})$, then for every $(n/k) \leqslant a \leqslant 2(n/k)$ it holds that
$$
\mathbf{P}\left( X_{t+1} \geqslant \left( 1 + \frac{h^2}{k} \right) a \,|\, X_t = a \right) \leqslant e^{-\Theta(n^\varepsilon)}
$$
'''
