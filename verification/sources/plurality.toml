'''
context = '''
[Section 4.2, p. 20:]
Given any $3$-input dynamics function
$f(x_1,x_2,x_3)$, for any triple of distinct colors $r,g,b \in [k]$, let $\Pi(r,g,b)$ be the subset of permutations of the colors $r,g,b$ and define the following ``counters'':
\begin{eqnarray*}
\delta_r & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = r \}| \\
\delta_g & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = g \}| \\
\delta_b & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = b \}|
\end{eqnarray*}

\noindent
Observe that for any $3$-inputs dynamics it must hold $\delta_g + \delta_r + \delta_b = 6$.

