item = "plurality:def:as-ac"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Definition 2"
page = 7
url = "https://arxiv.org/abs/1702.04921v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
[Protocol Dominance]
Consider two (not necessarily \textsc{AC}-) processes $P, \tilde{P}$. We say $P$
dominates $\tilde{P}$ if $\mathbb{E}\left[P(c)\right] \succeq \mathbb{E}[\tilde{P}(\tilde{c})]$ holds for
all $c, \tilde{c} \in \mathcal{C}$ with $c \succeq \tilde{c}$.
'''
context = '''
[Section 2.1, p. 6:]
We consider the \emph{consensus problem} on the complete graph of $n$ nodes.
Initially, each node supports one opinion (or color) from the set $[k]
:= \{1, 2, \dots, k\}$, where $k \leq n$. Nodes interact in
synchronous, discrete rounds using the \emph{Uniform Pull}
mechanism~\cite{DGHILSSST87}. That is, during every round each node can ask the
opinion of a constant number of random neighbors. Given these opinions, it
updates its own opinion according to some fixed update rule. The goal of the
system is to reach \emph{consensus} (a configuration where all nodes support the
same opinion).

Let $\mathbb{N} := \{1, 2, \dots\}$ and $\mathbb{N}_0 := \{0, 1, \dots\}$. We
describe the system state after any round by an $n$-dimensional integral vector
$c = (c_i)_{i \in [n]} \in \mathbb{N}_0^n$ with $\sum_{ i \in [n] }
c_i = n$. Here, the $i$-th component $c_i \in \mathbb{N}_0$ corresponds to the number of
nodes supporting opinion $i$. If $k < n$, then $c_i = 0$ for all $i \in
\{k+1, k+2, \dots, n\}$. We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid
\sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible
configurations.

[Section 2.1, p. 6:]
Let $d \in \mathbb{N}$ and $x, y \in \mathbb{R}^d$. We define $\left\lVert x \right\rVert_1 := \sum_{i \in
[d] } x_i$ and $\left\lVert x \right\rVert_2 := \smash{{\bigl( \sum_{ i \in [d]
} x_i^2 \bigr)}^{1/2}}$. Moreover, let $\smash{{x}^{\downarrow}}$ denote a
permutation of $x$ such that all components are sorted non-increasingly.
We write $x \succeq y$ and say $x$ \emph{majorizes}
$y$ if, for all $l \in [d]$, we have $\sum_{ i \in [l] }
{x}^{\downarrow}_i \geq \sum_{ i \in [l] } {y}^{\downarrow}_i$ and $\left\lVert x \right\rVert_1 =
\left\lVert y \right\rVert_1$.
For two random variables $X$ and $Y$ we write $X \leq^{\text{st}} Y$ if $X$ is \emph{stochastically dominated} by $Y$, i.e., $\Pr\left[X \geq x\right] \leq \Pr\left[Y \geq x\right]$ for all $x\in \mathbb{N}_0$.
A function $f\colon \mathbb{R}^d \to \mathbb{R}$ is \emph{Schur-convex} if $x
\succeq y \Rightarrow f(x) \geq f(y)$. For a probability vector $\Theta \in
[0,1]^d$, we use $\operatorname{Mult}(m,\Theta)$ to denote the multinomial distribution
for $m$ trials and $d$ categories (the $i$-th category having probability
$\Theta_i$).

[Section 2.2, p. 6 (text and footnote 7 after Definition 1):]
Given an \textsc{AC}-process $P_{\alpha}$ and a fixed initial configuration,
let\footnote{
Recall that, with a slight abuse of notation we also write $P(c)$ for the
(random) configuration obtained by performing one step of a process $P$ on
configuration $c$.
} $P_{\alpha}(t)$ denote the configuration of $P_{\alpha}$ at time $t$. By
Definition~1, $\bigl( P_{\alpha}(t) \bigr)_{t \geq 0}$ is a
Markov chain, since $P_{\alpha}(t)$ depends only on $P_{\alpha}(t-1)$. Another
immediate consequence of Definition~1 is that $ P_{\alpha}(t)$
conditional on $P_{\alpha}(t-1)=c$ is distributed according to $\operatorname{Mult}\bigl(n,
\alpha(c)\bigr)$. In other words, the 1-step distribution of an \textsc{AC}-process is
a multinomial distribution.

[Section 2.2, p. 7:]
Note that, in the case of \textsc{AC}-protocols, Definition~2 can be stated
as follows: $P_{\alpha}$ dominates $P_{\tilde{\alpha}}$ if and only if $c
\succeq \tilde{c} \Rightarrow \alpha(c) \succeq \tilde{\alpha}(\tilde{c})$ for
all $c, \tilde{c} \in \mathcal{C}$ with $c \succeq \tilde{c}$.
'''
notes = "The optional definition title is shown in brackets. The context includes the sentence after the definition, which restates it for AC-processes. arXiv v1 is the only version. Paper macros replaced where they occur: \\hmajority{3} -> $3$-\\textsc{Majority}, \\voter -> \\textsc{Voter}, \\AC/ -> \\textsc{AC}, \\aclong/ and \\AClong/ -> the words, \\aggfvoter -> \\alpha^{({\\mathcal{V}})}, \\aggfhmajority{3} -> \\alpha^{(3M)}, \\sortDown{x} -> {x}^{\\downarrow}, \\Mult -> \\operatorname{Mult}, \\E, \\Ex, \\ex -> \\mathbb{E}[...], \\Pr{.} -> \\Pr\\left[.\\right], \\intcc{.} -> [.], \\intoo{.} -> (.), \\set{.}/\\Set{.} -> \\{.\\} (with | -> \\mid), \\norm{.} -> \\left\\lVert.\\right\\rVert, \\N, \\R -> \\mathbb{N}, \\mathbb{R}, \\coloneqq -> :=, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); \\label commands dropped, \\cref and \\ref replaced by the printed names and numbers. The paper does not define w.h.p."

