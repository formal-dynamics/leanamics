item = "plurality:def:as-model"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Section 2.2, Voter and 3-Majority processes"
page = 6
url = "https://arxiv.org/abs/1702.04921v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
Two important examples of \textsc{AC}-processes include
\textsc{Voter} and $3$-\textsc{Majority}:
\begin{itemize}
\item
In the \textsc{Voter} process $P_{\alpha^{({\mathcal{V}})}}$, each node samples one node
(according to the pull mechanism) and (always) adopts that node's opinion.
Thus
\begin{equation}
\alpha^{({\mathcal{V}})}_i(c)
= \frac{c_i}{n}
.
\end{equation}

\item
In the $3$-\textsc{Majority} process $P_{\alpha^{(3M)}}$, each node samples
independently and uniformly at random three nodes. If a color is supported
by at least two of the samples, adopt it. Otherwise, adopt a random one of
the sampled colors. Simple calculations (see~\cite{BCNPST14}) show
\begin{equation}
\alpha^{(3M)}_i(c)
= \frac{c_i}{n} \cdot \left(1 + \frac{c_i}{n}-\left\lVert \frac cn \right\rVert_2^2\right)
.
\end{equation}
\end{itemize}
'''
context = '''
[Section 2.1, p. 6:]
We consider the \emph{consensus problem} on the complete graph of $n$ nodes.
Initially, each node supports one opinion (or color) from the set $[k]
:= \{1, 2, \dots, k\}$, where $k \leq n$. Nodes interact in
synchronous, discrete rounds using the \emph{Uniform Pull}
mechanism~\cite{DGHILSSST87}. That is, during every round each node can ask the
opinion of a constant number of random neighbors. Given these opinions, it
updates its own opinion according to some fixed update rule. The goal of the
system is to reach \emph{consensus} (a configuration where all nodes support the
same opinion).

Let $\mathbb{N} := \{1, 2, \dots\}$ and $\mathbb{N}_0 := \{0, 1, \dots\}$. We
describe the system state after any round by an $n$-dimensional integral vector
$c = (c_i)_{i \in [n]} \in \mathbb{N}_0^n$ with $\sum_{ i \in [n] }
c_i = n$. Here, the $i$-th component $c_i \in \mathbb{N}_0$ corresponds to the number of
nodes supporting opinion $i$. If $k < n$, then $c_i = 0$ for all $i \in
\{k+1, k+2, \dots, n\}$. We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid
\sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible
configurations.

[Section 2.2, p. 6:]
We first define a class of processes defined by update rules that depend only on
the current configuration.
The update rule states that each nodes adopts a color
$i$ with the same probability $\alpha_i(c)$, where $c \in \mathcal{C}$ is the
current configuration. In particular, node IDs (including the sampling node's
ID) do not influence the outcome. In this sense, such update rules are
\emph{anonymous}.

[Section 2.2, Definition 1, p. 6:]
[Anonymous Consensus Processes]
Given a distributed system of $n$ nodes, an \emph{anonymous consensus process} $P_{\alpha}$
is characterized by a \emph{process function} $\alpha\colon \mathcal{C} \to
[0,1]^n$ with $\sum_{i\in[n]}\alpha_i(c) = 1$ for all $c \in
\mathcal{C}$. When in configuration $c \in \mathcal{C}$, each node independently
adopts opinion $i\in[k]$ with probability $\alpha_i(c)$. We use the
shorthand \emph{\textsc{AC}-processes} to refer to this class.
'''
notes = "The bullets also contain Equations (1) and (2). arXiv v1 is the only version. Paper macros replaced where they occur: \\hmajority{3} -> $3$-\\textsc{Majority}, \\voter -> \\textsc{Voter}, \\AC/ -> \\textsc{AC}, \\aclong/ and \\AClong/ -> the words, \\aggfvoter -> \\alpha^{({\\mathcal{V}})}, \\aggfhmajority{3} -> \\alpha^{(3M)}, \\sortDown{x} -> {x}^{\\downarrow}, \\Mult -> \\operatorname{Mult}, \\E, \\Ex, \\ex -> \\mathbb{E}[...], \\Pr{.} -> \\Pr\\left[.\\right], \\intcc{.} -> [.], \\intoo{.} -> (.), \\set{.}/\\Set{.} -> \\{.\\} (with | -> \\mid), \\norm{.} -> \\left\\lVert.\\right\\rVert, \\N, \\R -> \\mathbb{N}, \\mathbb{R}, \\coloneqq -> :=, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); \\label commands dropped, \\cref and \\ref replaced by the printed names and numbers. The paper does not define w.h.p."

