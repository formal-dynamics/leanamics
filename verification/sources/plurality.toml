\textit{In each round, every node
samples three nodes uniformly at random (including itself and with repetitions)
and revises its opinion according to the majority of the opinions it sees.
If it sees three different opinions, it picks the first one.}
\end{quote}
\noindent
Clearly, in the case of three different opinions, choosing the second or
the third one would not make any difference, nor would choosing one of
the observed opinions uniformly at random.

Since the communication graph is complete and nodes are anonymous, the
overall system state at any round can be described by a \emph{
