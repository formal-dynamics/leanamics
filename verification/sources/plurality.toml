status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
[$\mathcal{D}_h(k)$ protocols]
An \emph{$h$-dynamics} is a synchronous protocol where at each time step every node picks $h$ random neighbors (including itself and with repetition) and recolors itself according to some deterministic rule that depends only on the colors it sees.
Let $\mathcal{D}_h(k)$ be the class of $h$-dynamics and observe that a dynamics $\mathcal{P} \in \mathcal{D}_h$ can be specified by a function
\[
f\,:\, [k]^h \rightarrow [k]
\]
such that $f(x_1, \dots, x_h) \in \{ x_1, \dots, x_h \}$. Where $f(x_1, \dots, x_h)$ is the color chosen by a node that sees the (ordered) sequence $(x_1, \dots, x_h)$ of colors.
'''
context = '''
[Section 1, p. 2:]
We consider a communication network in which each of
$n$ anonymous nodes
supports an initial opinion (a color chosen from a finite set
$[k]$).
[...]
we study a discrete-time, synchronous process in which, at every time step, each of the $n$ anonymous
nodes can revise his color according to a random sample of neighbors.

We consider one of the simplest models, in which the network is a clique, and the
update rule, called here \emph{$3$-majority dynamics}, is that each node samples at random three neighbors,
and picks the majority color among them (breaking ties uniformly).
'''
notes = "The optional definition title is shown in brackets. Applies to item def:rule for the notion of a 3-input rule f : [k]^3 -> [k] with f(x_1,x_2,x_3) in {x_1,x_2,x_3}. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

