item = "plurality:def:mo-broken"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Stabilizing consensus with many opinions"
venue = "SODA 2016"
version = "arXiv:1508.06782v1"
result = "Section 2, exit of the symmetry-breaking stage"
page = 6
url = "https://arxiv.org/abs/1508.06782v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
We clearly need a good bound on the length of a phase
beginning with at most $j$ opinions. To
this aim, we derive
a new upper bound - stated in Lemma 3.2 - on the \emph{hitting
time} of stochastic processes with expected drift that are defined by finite-state Markov
chains \cite{lpw08}. Thanks to this result, we can use the negative drift in
(2) to
prove that, from any configuration with $j \leqslant k$ active opinions,
$C_{\mathbbm{m}}^{(t)}$ drops below the threshold $n/j - \sqrt{j n
\log n}$ within $\mathcal{O}(\mathrm{poly}(j,\log n))$ rounds, with
constant positive probability: This ``hitting'' event represents the exit condition
from the \emph
{\em symmetry-breaking stage} of the phase. Indeed, once it occurs, we can consider
\emph{any fixed} active opinion $i$ having support size $c_i$ below the above threshold
(thanks to the previous stage, we know that
there is a good chance this opinion exists): We then show that $C_i$
has a negative drift of order $\Omega(c_i/j)$. This allows us
to prove that $C_i$ drops from
$n/j - \sqrt{j n
\log n}$ to zero within $\mathcal{O}(\mathrm{poly}(j,\log n))$ further rounds,
with positive constant probability.
This interval of rounds is the \emph {\em dropping stage} of the phase.
'''
context = '''
[Section 2, pp. 4-5:]
We assume a distributed system consisting of $n$ nodes that
communicate with each other over a complete graph via the
synchronous \emph{uniform-gossip} mechanism: In every
round, each node can pull information from (at most) $h$ random
neighbors, where $h$ is an absolute constant (in this work, $h = 3$).
