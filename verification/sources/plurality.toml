item = "plurality:lem:3_2"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Lemma 3.2"
page = 7
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
Let $\overline{c}$ be any $k$-cd. Let $m$ be any color in $M(\overline{c})$ and let $\ell\in [k] - \{m\}$ be such that
$c_\ell = \max_{h \in [k] - \{m\}} c_h$.
\begin{enumerate}
\item[a)] $\mu_m(\overline{c}) = c_m(1 + \gamma(\overline{c}) + \alpha(\overline{c}))$
\item[b)] $\forall j \in [k] - M(\overline{c})\quad \mu_j(\overline{c}) = c_j\left(1 + \gamma(\overline{c}) + \alpha(\overline{c}) - \frac{m(\overline{c}) - c_j}{n}\right)$
\item[c)] $\mu_\ell(\overline{c}) = c_\ell\left(1 + \gamma(\overline{c}) + \alpha(\overline{c}) - \frac{s(\overline{c})}{n}\right)$
\end{enumerate}
'''
context = '''
[Section 2, p. 4:]
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
A color $m$ is said to be a \emph{majority color} of $\overline c$ if $c_m \geqslant c_j$ for every other color $j \in [k]\setminus \{m\}$.
We say that $\overline c$ is $s$-biased if a color $m$ exists such that $c_m \geqslant c_j + s$ for every other color $j \in [k]\setminus m$.

[Section 3, p. 5:]
For a $k$-cd $\overline{c}$, we define
\begin{align*}
& m(\overline{c}) = \max_{h\in [k]} c_h\\
& M(\overline{c}) = \left\{ j \in [k] \;\left|\; c_j = m(\overline{c}) \right.\right\}\\
& s(\overline{c}) = \left\{ \begin{array}{ll}
m(\overline{c})- \max_{h \in [k] - M(\overline{c})} & \mbox{if $|M(\overline{c})| = 1$}\\
0 & \mbox{otherwise}
\end{array}\right.\\
& \alpha(\overline{c}) = \frac{(n - m(\overline{c}))s(\overline{c})}{n^2}\\
& \gamma(\overline{c}) = \frac{n\cdot m(\overline{c}) - \sum_{h \in [k]} c_h^2}{n^2} - \alpha(\overline{c})
\end{align*}

[Section 2, pp. 4-5:]
For any time step $t$ and for any $j\in [k]$, let $C_{j,t}$ be the r. v. counting the number of nodes colored $j$ at time step $t$ and let $C_t = (C_{1,t},\ldots,C_{k,t})$ denote the random variable that is the $k$-cd at time $t$ of the execution of the 3-majority protocol.

For every $j\in [k]$ let $\mu_j(\overline{c})$ be the expected number of nodes with color $j$ at the next step when the current $k$-cd is $\overline{c}$,
\[
\mu_j(\overline{c}) = \mathbb{E}\left[\left. C_{j, t+1} \;\right| C_t = \overline{c} \right]
\]
'''
notes = "The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

