item = "plurality:def:kernel"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Proof of Theorem 3.8, the Markov chain"
page = 14
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
In order to make use of Lemma~A.5 (see the appendix), we consider the
Markov chain determined by the 3-majority protocol. The states of the Markov chain are all the possible assignments of
the $k$ colors to the $n$ nodes. For any assignment $\mathbf{a}$, let $\overline{c}(\mathbf{a})$ denote the $k$-cd determined by
$\mathbf{a}$ and let $c_j(\mathbf{a})$ denote any its component. Let $X_t$ be the random variable that is the state at time $t$ given that
$X_0$ is a state whose $k$-cd is $\overline{c}$.
'''
context = '''
[Section 2, p. 4:]
The $3$-majority protocol runs as follows:
\begin{quote}
\textit{At every time step, every node picks three nodes uniformly at random (including itself and with repetitions)
and recolors itself according to the majority of the colors it sees. If it sees three different colors, it chooses the first one.}
\end{quote}
\noindent
Clearly, in the case of three different colors, choosing the second or the third one would not make any difference. The same holds even if the choice would be uniformly at random among the three colors.

[Appendix A.2, Lemma A.5, p. 27:]
Let $\mathcal{M}$ be any finite Markov chain and let $S$ be its set of states. Let $X_t$ be the random variable
representing the state of the chain at time $t$. If $A_1,\ldots,A_T$ are
such that $S \supseteq A_1 \supseteq A_2 \supseteq \cdots \supseteq A_T$ and, for any $i = 1,\ldots, T$,
\[
\mathbf{P}\left(\left. X_t\in A_i \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \epsilon \quad \mbox{ and, for $i < T$,}\quad
\mathbf{P}\left(\left. X_t\in A_{i+1} \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \nu
\]
where $0\leqslant \epsilon \leqslant \nu < 1$, then, for any integer $\ell \geqslant 1$,
\[
\mathbf{P}\left(\left. X_{\ell \, T} \in A_T \;\right| X_0 \in A_1 \right) \geqslant 1 - T(\ell\, \epsilon + \nu^\ell)
\]
'''
notes = "Excerpt of the proof of Theorem 3.8; the lemma it refers to is Lemma A.5 of v2 (Lemma A.4 of the SPAA proceedings), given in the context. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

