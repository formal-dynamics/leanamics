Let $\{X_t\}_t$ be a finite-state Markov chain with state space $S$. If $A_1, \ldots, A_T$ are such that $S \supseteq A_1 \supseteq A_2 \supseteq \cdots \supseteq A_T$ and, for any $i = 1, \ldots, T$, $\mathbf{P}\left( X_t \in A_i \mid X_{t-1} \in A_i \right) \geqslant 1 - \epsilon$ and for $i < T$, $\mathbf{P}\left( X_t \in A_{i+1} \mid X_{t-1} \in A_i \right) \geqslant 1 - \nu$ where $0 \leqslant \epsilon \leqslant \nu < 1$, then, for any integer $\ell \geqslant 1$ it holds that
\[
\mathbf{P}\left( X_{\ell T} \in A_T \mid X_0 \in A_1 \right) \geqslant 1 - T(\ell \epsilon + \nu^\ell)
\]
'''
context = '''
[Appendix A, p. 10, sentence before the lemma:]
We now provide a useful result on finite Markov chains. The proof is given in the full-version [4].
'''
notes = "No LaTeX source of the proceedings version is available; the statement was typed by the agent from the rendered PDF of the authors' copy (10 pages, proceedings pages 247-256) formerly at https://www.mat.uniroma2.it/~pasquale/papers/bcnpst_spaa14.pdf, retrieved from the Internet Archive snapshot of 2022-09-29; the lemma starts on page 10 of that PDF (printed page 256). In arXiv v1 and v2 the same lemma is Lemma A.5 (Lemma A.4 there is Bernstein's inequality), worded \"Let M be any finite Markov chain and let S be its set of states. Let X_t be the random variable representing the state of the chain at time t\", with the same hypotheses and conclusion, and with a proof; reference [4] of the proceedings is the arXiv version. The journal version (v3) does not contain the lemma. The formulas were typed from the PDF."

