items = ["plurality:lem:mo-phase", "plurality:lem:mo-phases"]
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Stabilizing consensus with many opinions"
venue = "SODA 2016"
version = "arXiv:1508.06782v1"
result = "Proof of Theorem 3.1"
page = 10
url = "https://arxiv.org/abs/1508.06782v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
\textbf{Proof of Theorem 3.1}. From Lemmas 3.3, 3.4, and 3.5 it follows that from any configuration with $j \leqslant k$ active opinions, within $\mathcal{O}(k^2 \sqrt{\log n} + k \log n)$ rounds at least one of the opinions disappears with probability at least $1/4$. Thus, within $\mathcal{O}((k^2 \sqrt{\log n} + k \log n) (k + \log n))$ rounds, all opinions but one disappear w.h.p.
'''
context = '''
[Section 1.1, footnote 3, p. 3:]
According to
the standard definition, we say that a sequence of events
$\mathcal E_n$, $n= 1,2, \ldots$ holds \emph{with high
probability} if $ \mathbf{P}\left( \mathcal E_n \right) = 1-\mathcal{O} (1/n^{\lambda})$ for
some positive constant $\lambda >0$.

[Section 2, p. 7:]
Ideally, the process proceeds along $k$ consecutive phases, indexed as
$j= k, k-1, \ldots, 2$, such that we are left with at most $j-1$ active
opinions at the end of Phase $j$. In practice, we only have a constant probability
that at least one opinion disappears during Phase $j$. However, using
standard probabilistic arguments, we can prove that, w.h.p., for every $j$, the
transition from $j$ to $j-1$ active opinions takes a constant (amortized)
number of phases, each requiring $\mathcal{O}(\mathrm{poly}(j,\log n))$ rounds.

[Lemma 3.3, p. 8:]
[Symmetry-breaking stage]
Let $\mathbf{c}$ be any configuration with $j$ active opinions. Within $t = \mathcal{O}\left(j^2 \log^{1/2} n\right)$ rounds it holds that
$$
\mathbf{P}_{\mathbf{c}} \left( \exists i \mbox{ such that } C_i^{(t)} \leqslant n/j - \sqrt{j n \log n} \right) \geqslant \frac{1}{2}
$$

[Lemma 3.4, p. 9:]
[Dropping stage 1]
Let $\mathbf{c}$ be any configuration with $j \leqslant n^{1/3 - \varepsilon}$
active opinions, where $\varepsilon > 0$ is an arbitrarily-small positive constant,
and such that an opinion $i$ exists with $c_i \leqslant n/j - \sqrt{j n \log
n}$. Within $t = \mathcal{O}(j \log n)$ rounds opinion $i$ becomes
$\mathcal{O}\left(j^2 \log n\right)$ w.h.p.

[Lemma 3.5, p. 9:]
[Dropping stage 2]
Let $\mathbf{c}$ be any configuration with $j \leqslant n^{1/3 - \varepsilon}$ active opinions, where $\varepsilon > 0$ is an arbitrarily-small positive constant, and such that an opinion $i$ exists with $c_i \leqslant n/(2j)$. Within $t = \mathcal{O}(j \log n)$ rounds opinion $i$ disappears with probability at least $1/2$.
'''
notes = "The whole proof of Theorem 3.1 as printed. lem:mo-phase is its first sentence (one opinion disappears with probability at least 1/4 within one phase); lem:mo-phases makes precise the step to w.h.p., which Section 2 calls \"standard probabilistic arguments\". arXiv v1 is the only version. Paper macros replaced where they occur: \\Prob{c}{X} -> \\mathbf{P}_{c} \\left( X \\right) (\\mathbf{P}\\left( X \\right) with an empty subscript), \\Expec{c}{X} -> \\mathbf{E}_{c} \\left[ X \\right], \\expec{A}{B} -> \\mathbf{E}\\left[\\left. A \\;\\right| B \\right], \\bigO -> \\mathcal{O}, \\poly -> \\mathrm{poly}, \\col -> \\mathbf{C}, \\goodcols -> \\mathcal{C}, \\mincol[W] -> \\mathbbm m\\left(W\\right); \\mathbbm (package bbm) kept; the paper redefines \\leq and \\geq as \\leqslant and \\geqslant; \\label commands dropped, \\ref replaced by the printed numbers."

