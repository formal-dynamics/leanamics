item = "plurality:def:quantities"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Section 3, m(c), M(c), s(c), alpha(c), gamma(c)"
page = 5
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
For a $k$-cd $\overline{c}$, we define
\begin{align*}
& m(\overline{c}) = \max_{h\in [k]} c_h\\
& M(\overline{c}) = \left\{ j \in [k] \;\left|\; c_j = m(\overline{c}) \right.\right\}\\
& s(\overline{c}) = \left\{ \begin{array}{ll}
m(\overline{c})- \max_{h \in [k] - M(\overline{c})} & \mbox{if $|M(\overline{c})| = 1$}\\
0 & \mbox{otherwise}
\end{array}\right.\\
& \alpha(\overline{c}) = \frac{(n - m(\overline{c}))s(\overline{c})}{n^2}\\
& \gamma(\overline{c}) = \frac{n\cdot m(\overline{c}) - \sum_{h \in [k]} c_h^2}{n^2} - \alpha(\overline{c})
\end{align*}
'''
context = '''
[Section 2, p. 4:]
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
A color $m$ is said to be a \emph{majority color} of $\overline c$ if $c_m \geqslant c_j$ for every other color $j \in [k]\setminus \{m\}$.
We say that $\overline c$ is $s$-biased if a color $m$ exists such that $c_m \geqslant c_j + s$ for every other color $j \in [k]\setminus m$.
'''
notes = "The definition of s(c) is quoted as printed, with no c_h after the max (the proof of Lemma 3.1 uses s(c) = m(c) - max{c_h | h in [k] - {m}}). The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

