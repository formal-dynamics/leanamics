item = "plurality:lem:as-phase1"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Section 3, Phase 1 of the proof of Theorem 4"
page = 8
url = "https://arxiv.org/abs/1702.04921v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
The analysis is split into two phases, each consisting of
$\mathrm{O}\bigl(n^{3/4}\log^{7/8} n\bigr)$ rounds.
\begin{description}
\item[Phase~1: From up to $n$ to $n^{1/4}\log^{1/8}$ colors.]
This is the crucial part of the analysis. Instead of analyzing $3$-\textsc{Majority}
directly, we use our machinery from Section~2.2 to show that
$3$-\textsc{Majority} is not slower than \textsc{Voter} (Lemma~2).
Then, we prove that \textsc{Voter} reaches $\mathrm{O}\bigl(n^{1/4}\bigr)$ colors in
$\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds (Lemma~3).
'''
context = '''
[Theorem 4, p. 8:]
Starting from \emph{any} configuration $c \in \mathcal{C}$, $3$-\textsc{Majority}
reaches consensus w.h.p. in $\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds.

[Appendix A.7, p. 19:]
Consider any initial configuration $c \in \mathcal{C}$. By applying
Lemma~3 for $k = n^{1/4}$, we get that \textsc{Voter} reduces the number
of remaining colors w.h.p. from initially at most $n$ to $n^{1/4}$ in
$\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds. By Lemma~2, the time it
takes $3$-\textsc{Majority} to reach some fixed number of remaining colors is dominated
by the time it takes \textsc{Voter} to reach the same number of remaining colors. In
particular, we get that $3$-\textsc{Majority} also reduces the number of remaining
colors w.h.p. to $n^{1/4}$ in
$\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds. That is, the first phase takes
$\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds.

[Lemma 2, p. 9:]
Consider \textsc{Voter} ($\mathcal{V}$) and $3$-\textsc{Majority} ($3M$) started from the same initial configuration $c
\in \mathcal{C}$. There is a coupling such that after any round, the number of
remaining colors in \textsc{Voter} is not smaller than those in $3$-\textsc{Majority}. In
particular, the time \textsc{Voter} needs to reach consensus stochastically dominates
the time needed by $3$-\textsc{Majority} to reach consensus, i.e.,
\[ T_{3M}^\kappa(c) \leq^{\text{st}} T_{\mathcal{V}}^\kappa(c). \]

[Lemma 3, p. 10:]
Consider an arbitrary initial configuration $c \in \mathcal{C}$. \textsc{Voter} reaches
a configuration $c'$ having at most $k$ remaining colors w.h.p. in
$\mathrm{O}\bigl(\frac n k \, \log n\bigr)$ rounds, i.e.,
$\Pr\left[ T_\mathcal{V}^k = \mathrm{O}\bigl(\frac n k \, \log n\bigr)\right] \geq 1-1/n $.

[Section 2.2, p. 7:]
For any protocol $P$ starting with configuration $c\in \mathcal{C}$ let $T_P^\kappa(c)$ denote the first time step where the number of remaining
colors reduces to $\kappa$ where $\kappa \in \mathbb{N}$.
'''
notes = "Phase 1 is described in Section 3 and carried out in the first paragraph of Appendix A.7, which applies Lemma 3 with k = n^{1/4}. The heading \"From up to $n$ to $n^{1/4}\\log^{1/8}$ colors\" is as printed. arXiv v1 is the only version. Paper macros replaced where they occur: \\hmajority{3} -> $3$-\\textsc{Majority}, \\voter -> \\textsc{Voter}, \\AC/ -> \\textsc{AC}, \\aclong/ and \\AClong/ -> the words, \\aggfvoter -> \\alpha^{({\\mathcal{V}})}, \\aggfhmajority{3} -> \\alpha^{(3M)}, \\sortDown{x} -> {x}^{\\downarrow}, \\Mult -> \\operatorname{Mult}, \\E, \\Ex, \\ex -> \\mathbb{E}[...], \\Pr{.} -> \\Pr\\left[.\\right], \\intcc{.} -> [.], \\intoo{.} -> (.), \\set{.}/\\Set{.} -> \\{.\\} (with | -> \\mid), \\norm{.} -> \\left\\lVert.\\right\\rVert, \\N, \\R -> \\mathbb{N}, \\mathbb{R}, \\coloneqq -> :=, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); \\label commands dropped, \\cref and \\ref replaced by the printed names and numbers. The paper does not define w.h.p."

