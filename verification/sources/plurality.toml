statement = '''
[Bernstein inequality \cite{AleBook}]
Let the random variables $X_1, . . . , X_n$
be independent with $X_i-\mathbb{E}\left[X_i\right] \leqslant b$ for each $i \in [n]$. Let $X = \sum_i X_i$
and let $\sigma^2 = \sum_i \sigma^2_i$ be the variance of $X$. Then, for any $\lambda>0$,
\[ \mathbf{P}\left( X > \mathbb{E}\left[X\right] + \lambda  \right)
\leqslant \exp\left( - \frac{\lambda^2}{2 \sigma^2(1 + b\lambda/ 3\sigma^2)} \right) \]
'''
notes = "The optional lemma title is shown in brackets; \\cite{AleBook} is reference [9] of v2, Dubhashi and Panconesi, Concentration of measure for the analysis of randomized algorithms. In the SPAA proceedings this is Lemma A.3. The item also contains the Hoeffding, Chernoff and Markov bounds; the paper's additive Chernoff bound is the next entry. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

