item = "plurality:lem:phase_steps"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Proof of Theorem 3.8, one step from each A_i"
page = 15
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
It is easy to verify that $A_{T_1} \supseteq A_{T_1 + 1} \supseteq A_{T_1 + 2} \supseteq\cdots\supseteq A_{T_1 + T_2}\supseteq A_{T_1 + T_2 + 1}\supseteq A_{T_1 + T_2 + 2}$.
Thus it holds that $A_1 \supseteq\cdots\supseteq A_{T_1 + T_2 + 2}$. Taking into account that $c_m(\mathbf{a}) > (2/3)n$ implies
$s(\overline{c}(\mathbf{a})) \geqslant n/3$, from Lemma~3.5 we have that, for any $i=1,\ldots,T_1$,
\[
\mathbf{P}\left(\left. X_t\in A_i \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \frac{1}{n^2} \quad \mbox{and}\quad
\mathbf{P}\left(\left. X_t\in A_{i+1} \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \frac{1}{n^2}
\]
From Lemma~3.7 we get, for any $i = T_1 + 1,\ldots, T_1 + T_2$
\[
\mathbf{P}\left(\left. X_t\in A_i \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \frac{1}{n^2} \quad \mbox{and}\quad
\mathbf{P}\left(\left. X_t\in A_{i+1} \;\right| X_{t-1}\in A_i \right) \geqslant 1 - \frac{1}{n^2}
\]
moreover
\begin{align*}
& \mathbf{P}\left(\left. X_t\in A_{T_1 + T_2 + 1} \;\right| X_{t-1}\in A_{T_1 + T_2 + 1} \right) \geqslant 1 - \frac{1}{n^2} \quad \mbox{and}\\
& \mathbf{P}\left(\left. X_t\in A_{T_1 + T_2 + 2} \;\right| X_{t-1}\in A_{T_1 + T_2 + 1} \right) \geqslant 1 -\frac{1}{\sqrt[5]{n}}
\end{align*}
'''
context = '''
[Section 3, proof of Theorem 3.8, p. 14:]
For the sake of convenience, let
\[
\Lambda = 22\sqrt{\lambda \, n\log n }
\]
Notice that $\Lambda \leqslant 22n^{3/4}\sqrt{\log n}$. In order to make use of Lemma~A.5 (see the appendix), we consider the
Markov chain determined by the 3-majority protocol. The states of the Markov chain are all the possible assignments of
the $k$ colors to the $n$ nodes. For any assignment $\mathbf{a}$, let $\overline{c}(\mathbf{a})$ denote the $k$-cd determined by
$\mathbf{a}$ and let $c_j(\mathbf{a})$ denote any its component. Let $X_t$ be the random variable that is the state at time $t$ given that
$X_0$ is a state whose $k$-cd is $\overline{c}$.

[Section 3, proof of Theorem 3.8, p. 15:]
Define
\begin{align*}
& T_1 = \left\lfloor 1 + \frac{\log\frac{n}{3\Lambda}}{\log\left(1 + \frac{1}{6 \, \lambda}\right)} \right\rfloor\\
& T_2 = \left\lfloor 1 + \frac{3}{2\log(18/17)}\log\frac{n^{3/4}}{\log n} \right\rfloor
\end{align*}
For any $i = 1,\ldots, T_1$, let
\[
A_i = \left\{ \mathbf{a} \;\left|\; c_m(\mathbf{a}) > \frac{2}{3}n \vee \left(M(\overline{c}(\mathbf{a})) = \{m\} \wedge c_m(\mathbf{a}) \geqslant \frac{n}{\lambda} \wedge s(\overline{c}(\mathbf{a}))
\geqslant \Lambda\left(1 + \frac{1}{6\,\lambda}\right)^{i - 1}\right)\right.\right\}
\]
Observe that $X_0 \in A_1$ and $A_1 \supseteq A_2 \supseteq\cdots\supseteq A_{T_1}$. For any $i = 1,\ldots, T_2$, let
\[
A_{T_1 + i} = \left\{ \mathbf{a} \;\left|\; M(\overline{c}(\mathbf{a})) = \{m\} \wedge s(\overline{c}(\mathbf{a})) \geqslant \frac{n}{3} \wedge n - c_m(\mathbf{a})
\leqslant \frac{2n}{3}\left(\frac{17}{18}\right)^{i - 1}\right.\right\}
\]
and let
\begin{align*}
& A_{T_1 + T_2 + 1} = \left\{ \mathbf{a} \;\left|\; M(\overline{c}(\mathbf{a})) = \{m\} \wedge s(\overline{c}(\mathbf{a})) \geqslant \frac{n}{3} \wedge n - c_m(\mathbf{a})
< \sqrt[4]{n}\log n\right.\right\}\\
& A_{T_1 + T_2 + 2} = \left\{ \mathbf{a} \;\left|\; c_m(\mathbf{a}) = n \right.\right\}
\end{align*}

[Section 3, p. 5:]
For a $k$-cd $\overline{c}$, we define
\begin{align*}
& m(\overline{c}) = \max_{h\in [k]} c_h\\
& M(\overline{c}) = \left\{ j \in [k] \;\left|\; c_j = m(\overline{c}) \right.\right\}\\
& s(\overline{c}) = \left\{ \begin{array}{ll}
m(\overline{c})- \max_{h \in [k] - M(\overline{c})} & \mbox{if $|M(\overline{c})| = 1$}\\
0 & \mbox{otherwise}
\end{array}\right.\\
& \alpha(\overline{c}) = \frac{(n - m(\overline{c}))s(\overline{c})}{n^2}\\
& \gamma(\overline{c}) = \frac{n\cdot m(\overline{c}) - \sum_{h \in [k]} c_h^2}{n^2} - \alpha(\overline{c})
\end{align*}

[Lemma 3.5, p. 10:]
[large majority and large bias]
Let $\overline{c}$ be any $k$-cd such that $M(\overline{c}) = \{m\}$ for some $m \in [k]$. For any value $\lambda$ with $0 < \lambda \leqslant 2/3$,
if $\lambda n \leqslant c_m \leqslant (2/3)n$ and $s(\overline{c}) \geqslant 22\sqrt{(1/\lambda)n\log n}$, then, for every $j\in [k] - \{m\}$,
\[
\mathbf{P}\left(\left. C_{m, t+1} - C_{j, t+1} \leqslant s(\overline{c})\left(1 +\frac{\lambda}{6}\right) \;\right| C_t = \overline{c} \right)
\;\leqslant\; \frac{1}{n^2}
\]
and
\[
\mathbf{P}\left(\left. C_{m, t+1} \leqslant c_m \;\right| C_t = \overline{c} \right) \;\leqslant\; \frac{1}{n^2}
\]

[Lemma 3.7, p. 12:]
[very-large majority]
Let $\overline{c}$ be any $k$-cd such that $s(\overline{c}) \geqslant n/3$ for some $m\in [k]$. If $n - c_m \geqslant \sqrt[4]{n}\log n$, then
\[
\mathbf{P}\left(\left. \overline{C}_{m, t+1} \geqslant \frac{17}{18}(n - c_m) \;\right| C_t = \overline{c} \right) \leqslant \frac{1}{n^2}
\]
If $n - c_m < \sqrt[4]{n}\log n$, then
\[
\mathbf{P}\left(\left. \overline{C}_{m, t+1} > 0 \;\right| C_t = \overline{c} \right) \leqslant \frac{1}{\sqrt[5]{n}} \qquad\mbox{and}\qquad
\mathbf{P}\left(\left. \overline{C}_{m, t+1} \geqslant \sqrt[4]{n}\log n \;\right| C_t = \overline{c} \right) \leqslant \frac{1}{n^2}
\]

[Section 3, p. 11:]
For any $m \in [k]$, let $\overline{C}_{m, t} = n - C_{m, t}$ denote the random variable counting the number of nodes with colors different from $m$ at time $t$.
For any $k$-cd $\overline{c}$ and for any $m\in [k]$, let
\[
\overline{\mu}_m(\overline{c}) = \mathbb{E}\left[\left. \overline{C}_{m, t+1} \;\right| C_t = \overline{c} \right]
\]
'''
notes = "Excerpt of the proof of Theorem 3.8, with the two lemmas it applies. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

