item = "plurality:lem:mo-drift"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Stabilizing consensus with many opinions"
venue = "SODA 2016"
version = "arXiv:1508.06782v1"
result = "Lemma 3.2"
page = 7
url = "https://arxiv.org/abs/1508.06782v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person yet"
statement = '''
Let $\{X_t\}_t$ be a Markov chain with finite state space $\Omega$, let $f : \Omega \rightarrow N$ be a function mapping states of the chain in non-negative integer numbers, and let $\{Y_t\}_t$ be the stochastic process over $N$ defined by $Y_t = f(X_t)$. Let $m \in N$ be a ``target value'' and let
$$
\tau = \inf \{ t \in \mathbb{N} \,:\, Y_t \geqslant m \}
$$
be the random variable indicating the first time $Y_t$ reaches or exceeds value $m$.
Assume that, for every state $x \in \Omega$ with $f(x) \leqslant m-1$, it holds that
\begin{enumerate}
\item (Positive drift). $\mathbf{E}\left[ Y_{t+1} \,|\, X_t = x \right] \geqslant f(x) + \lambda$ for some $\lambda > 0$
\item (Bounded jumps). $\mathbf{P}_{x} \left( Y_{\tau} \geqslant \alpha m \right) \leqslant \alpha m /n$, for some $\alpha > 1$.
\end{enumerate}
Then, for every starting state $x \in \Omega$, it holds that
$$
\mathbf{E}_{x} \left[ \tau \right] \leqslant 2 \alpha \frac{m}{\lambda}
$$
'''
