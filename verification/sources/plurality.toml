item = "plurality:def:phases"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Proof of Theorem 3.8, the sets A_i"
page = 15
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
Define
\begin{align*}
& T_1 = \left\lfloor 1 + \frac{\log\frac{n}{3\Lambda}}{\log\left(1 + \frac{1}{6 \, \lambda}\right)} \right\rfloor\\
& T_2 = \left\lfloor 1 + \frac{3}{2\log(18/17)}\log\frac{n^{3/4}}{\log n} \right\rfloor
\end{align*}
For any $i = 1,\ldots, T_1$, let
\[
A_i = \left\{ \mathbf{a} \;\left|\; c_m(\mathbf{a}) > \frac{2}{3}n \vee \left(M(\overline{c}(\mathbf{a})) = \{m\} \wedge c_m(\mathbf{a}) \geqslant \frac{n}{\lambda} \wedge s(\overline{c}(\mathbf{a}))
\geqslant \Lambda\left(1 + \frac{1}{6\,\lambda}\right)^{i - 1}\right)\right.\right\}
\]
Observe that $X_0 \in A_1$ and $A_1 \supseteq A_2 \supseteq\cdots\supseteq A_{T_1}$. For any $i = 1,\ldots, T_2$, let
\[
A_{T_1 + i} = \left\{ \mathbf{a} \;\left|\; M(\overline{c}(\mathbf{a})) = \{m\} \wedge s(\overline{c}(\mathbf{a})) \geqslant \frac{n}{3} \wedge n - c_m(\mathbf{a})
\leqslant \frac{2n}{3}\left(\frac{17}{18}\right)^{i - 1}\right.\right\}
\]
and let
\begin{align*}
& A_{T_1 + T_2 + 1} = \left\{ \mathbf{a} \;\left|\; M(\overline{c}(\mathbf{a})) = \{m\} \wedge s(\overline{c}(\mathbf{a})) \geqslant \frac{n}{3} \wedge n - c_m(\mathbf{a})
< \sqrt[4]{n}\log n\right.\right\}\\
& A_{T_1 + T_2 + 2} = \left\{ \mathbf{a} \;\left|\; c_m(\mathbf{a}) = n \right.\right\}
\end{align*}
'''
context = '''
[Section 3, proof of Theorem 3.8, p. 14:]
For the sake of convenience, let
\[
\Lambda = 22\sqrt{\lambda \, n\log n }
\]
Notice that $\Lambda \leqslant 22n^{3/4}\sqrt{\log n}$. In order to make use of Lemma~A.5 (see the appendix), we consider the
Markov chain determined by the 3-majority protocol. The states of the Markov chain are all the possible assignments of
the $k$ colors to the $n$ nodes. For any assignment $\mathbf{a}$, let $\overline{c}(\mathbf{a})$ denote the $k$-cd determined by
$\mathbf{a}$ and let $c_j(\mathbf{a})$ denote any its component. Let $X_t$ be the random variable that is the state at time $t$ given that
$X_0$ is a state whose $k$-cd is $\overline{c}$.

[Section 2, p. 4:]
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
A color $m$ is said to be a \emph{majority color} of $\overline c$ if $c_m \geqslant c_j$ for every other color $j \in [k]\setminus \{m\}$.
We say that $\overline c$ is $s$-biased if a color $m$ exists such that $c_m \geqslant c_j + s$ for every other color $j \in [k]\setminus m$.

[Section 3, p. 5:]
For a $k$-cd $\overline{c}$, we define
\begin{align*}
& m(\overline{c}) = \max_{h\in [k]} c_h\\
& M(\overline{c}) = \left\{ j \in [k] \;\left|\; c_j = m(\overline{c}) \right.\right\}\\
& s(\overline{c}) = \left\{ \begin{array}{ll}
m(\overline{c})- \max_{h \in [k] - M(\overline{c})} & \mbox{if $|M(\overline{c})| = 1$}\\
0 & \mbox{otherwise}
\end{array}\right.\\
& \alpha(\overline{c}) = \frac{(n - m(\overline{c}))s(\overline{c})}{n^2}\\
& \gamma(\overline{c}) = \frac{n\cdot m(\overline{c}) - \sum_{h \in [k]} c_h^2}{n^2} - \alpha(\overline{c})
\end{align*}
'''
notes = "Excerpt of the proof of Theorem 3.8. log is not given a base in the paper. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

