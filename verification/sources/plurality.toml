all $c, \tilde{c} \in \mathcal{C}$ with $c \succeq \tilde{c}$.
'''
notes = "arXiv v1 is the only version. Paper macros replaced where they occur: \\hmajority{3} -> $3$-\\textsc{Majority}, \\voter -> \\textsc{Voter}, \\AC/ -> \\textsc{AC}, \\aclong/ and \\AClong/ -> the words, \\aggfvoter -> \\alpha^{({\\mathcal{V}})}, \\aggfhmajority{3} -> \\alpha^{(3M)}, \\sortDown{x} -> {x}^{\\downarrow}, \\Mult -> \\operatorname{Mult}, \\E, \\Ex, \\ex -> \\mathbb{E}[...], \\Pr{.} -> \\Pr\\left[.\\right], \\intcc{.} -> [.], \\intoo{.} -> (.), \\set{.}/\\Set{.} -> \\{.\\} (with | -> \\mid), \\norm{.} -> \\left\\lVert.\\right\\rVert, \\N, \\R -> \\mathbb{N}, \\mathbb{R}, \\coloneqq -> :=, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); \\label commands dropped, \\cref and \\ref replaced by the printed names and numbers. The paper does not define w.h.p."

