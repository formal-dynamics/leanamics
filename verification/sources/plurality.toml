the third one would not make any difference, nor would choosing one of
the observed opinions uniformly at random.

Since the communication graph is complete and nodes are anonymous, the
overall system state at any round can be described by a \emph{
configuration} $\mathbf{c}:=\left(c_{1},...,c_{|\Sigma|}\right)$,
where the \emph{support} $c_{i}$ of opinion $i$ is the number of nodes holding opinion $i$ in
that system's state. Given configuration $\mathbf{c}$, we say that an opinion $i$ is \emph{active} in $\mathbf{c}$ if
$c_i >0$ and,
for any set of active opinions $W\subseteq \Sigma$, we define $\mathbbm m\left(W\right):=\arg\min_{i\in W}c_{i}$.
For any variable $x$ of the process, we write
$x^{\left(t\right)}$ if we are considering its value at round $t$ and $X^{\left(t\right)}$ to
denote the corresponding random variable.
Furthermore, following \cite{lpw08}, considered a configuration
$\mathbf{c}$ and a random variable $X$ defined over the process, we
write $\mathbf{P}_{\mathbf{c}} \left( X^{(t)} = x \right)$ for $\mathbf{P}\left( X^{(t)} = x
\, \vert \, \mathbf{C}^{(0)} = \mathbf{c} \right)$, i.e., to denote the probability
distribution of the variable $X$ when the system evolves for $t$
consecutive rounds starting from configuration $\mathbf{c}$.
Analogously, we write $\mathbf{E}_{\mathbf{c}} \left[ X^{(t)} \right]$ for the associated
conditional expectation.

[Lemma 3.3, p. 8:]
[Symmetry-breaking stage]
Let $\mathbf{c}$ be any configuration with $j$ active opinions. Within $t = \mathcal{O}\left(j^2 \log^{1/2} n\right)$ rounds it holds that
$$
\mathbf{P}_{\mathbf{c}} \left( \exists i \mbox{ such that } C_i^{(t)} \leqslant n/j - \sqrt{j n \log n} \right) \geqslant \frac{1}{2}
$$
'''
notes = "The paper has no separate definition; the threshold is the one of Lemma 3.3. arXiv v1 is the only version. Paper macros replaced where they occur: \\Prob{c}{X} -> \\mathbf{P}_{c} \\left( X \\right) (\\mathbf{P}\\left( X \\right) with an empty subscript), \\Expec{c}{X} -> \\mathbf{E}_{c} \\left[ X \\right], \\expec{A}{B} -> \\mathbf{E}\\left[\\left. A \\;\\right| B \\right], \\bigO -> \\mathcal{O}, \\poly -> \\mathrm{poly}, \\col -> \\mathbf{C}, \\goodcols -> \\mathcal{C}, \\mincol[W] -> \\mathbbm m\\left(W\\right); \\mathbbm (package bbm) kept; the paper redefines \\leq and \\geq as \\leqslant and \\geqslant; \\label commands dropped, \\ref replaced by the printed numbers."

