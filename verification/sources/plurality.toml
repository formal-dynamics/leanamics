item = "plurality:def:config"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Section 2, k-color distribution (k-cd)"
page = 4
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
'''
context = '''
[Section 1, p. 2:]
We consider a communication network in which each of
$n$ anonymous nodes
supports an initial opinion (a color chosen from a finite set
$[k]$).
[...]
we study a discrete-time, synchronous process in which, at every time step, each of the $n$ anonymous
nodes can revise his color according to a random sample of neighbors.

We consider one of the simplest models, in which the network is a clique, and the
update rule, called here \emph{$3$-majority dynamics}, is that each node samples at random three neighbors,
and picks the majority color among them (breaking ties uniformly).

[Section 2, pp. 4-5:]
For any time step $t$ and for any $j\in [k]$, let $C_{j,t}$ be the r. v. counting the number of nodes colored $j$ at time step $t$ and let $C_t = (C_{1,t},\ldots,C_{k,t})$ denote the random variable that is the $k$-cd at time $t$ of the execution of the 3-majority protocol.

For every $j\in [k]$ let $\mu_j(\overline{c})$ be the expected number of nodes with color $j$ at the next step when the current $k$-cd is $\overline{c}$,
\[
\mu_j(\overline{c}) = \mathbb{E}\left[\left. C_{j, t+1} \;\right| C_t = \overline{c} \right]
\]
'''
notes = "The statement is the first sentence of Section 2; the context gives the count variables C_{j,t}. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

