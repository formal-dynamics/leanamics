\smallskip
For any time step $t$ and for any $j\in [k]$, let $C_{j,t}$ be the r. v. counting the number of nodes colored $j$ at time step $t$ and let $C_t = (C_{1,t},\ldots,C_{k,t})$ denote the random variable that is the $k$-cd at time $t$ of the execution of the 3-majority protocol.
