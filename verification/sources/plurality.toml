item = "plurality:lem:4_1"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus (arXiv v1 and v2: Simple dynamics for majority consensus)"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Lemma 4.1"
page = 17
url = "https://arxiv.org/abs/1310.2858v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person yet"
statement = '''
Let the number of colors $k$ be such that $k \leqslant \left(n/\log n \right)^{1/4}$, let $b$ be any number with $k \sqrt{n \log n} \leqslant b \leqslant n/k$, and let $\{X_t\}$ be the sequence of random variables where $X_t$ is the number of a specific color at time $t$. If $X_t = n/k + a$ for some $a \leqslant b$ then $X_{t+1} \leqslant n/k + (1+3/k)b$ w.h.p.; more precisely, for any $a \leqslant b$ it holds that
$$
\mathbf{P}\left( X_{t+1} \geqslant \left.\frac{n}{k} + \left( 1 + \frac{3}{k} \right) b \;\right|\; X_t = \frac{n}{k} + a \right) \leqslant \frac{1}{n^2}
$$
'''
context = '''
[Section 4.1, p. 17:]
In what follows, all events and random variables thus concern the Markovian process yielded by the $3$-majority dynamics.

[Section 2, p. 4:]
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
A color $m$ is said to be a \emph{majority color} of $\overline c$ if $c_m \geqslant c_j$ for every other color $j \in [k]\setminus \{m\}$.
We say that $\overline c$ is $s$-biased if a color $m$ exists such that $c_m \geqslant c_j + s$ for every other color $j \in [k]\setminus m$.

[Section 2, p. 4:]
The $3$-majority protocol runs as follows:
\begin{quote}
\textit{At every time step, every node picks three nodes uniformly at random (including itself and with repetitions)
and recolors itself according to the majority of the colors it sees. If it sees three different colors, it chooses the first one.}
\end{quote}
\noindent
Clearly, in the case of three different colors, choosing the second or the third one would not make any difference. The same holds even if the choice would be uniformly at random among the three colors.
'''
notes = "The paper uses 'w.h.p.' (with high probability) without a formal definition and does not state the base of log. The library numbers this paper after the SPAA 2014 proceedings; arXiv v1 and v2 have the same numbering in Sections 2 to 4 and say 'majority' where the proceedings say 'plurality' (for example Lemma 3.5 'large plurality and large bias', Definition 4.7 '(s, eps)-plurality consensus solver', Section 4.3 'h-plurality'). Paper macros replaced where they occur: \\probc{A}{B} -> \\mathbf{P}\\left(\\left. A \\;\\right| B \\right), \\probb, \\Prob{}{X} -> \\mathbf{P}\\left( X \\right), \\expe, \\expec, \\Expec{}{X} -> \\mathbf{E}\\left[ X \\right]; \\label commands dropped, \\ref replaced by the printed numbers."

