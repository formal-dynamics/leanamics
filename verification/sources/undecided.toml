[[source]]
item = "undecided:thm:pmodel"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri. Plurality consensus in the gossip model"
venue = "SODA 2015"
version = "arXiv:1407.2565v2"
result = "Section 2, Table 1 (update rule)"
page = 5
url = "https://arxiv.org/abs/1407.2565v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
The Undecided-State Dynamics works as follows.
According to the (uniform) gossip model,
at every round $t \geqslant 0$, each agent $u$ chooses a neighbor $v$ uniformly at random and
decides to get a new color/state according to the rules in Table 1,

\begin{tabular}{|c||c|c|c|}
\hline
$u\big\backslash v$ & undecided & color $i$ & color $j$\tabularnewline
\hline
\hline
undecided & undecided & $i$ & $j$\tabularnewline
\hline
color $i$ & $i$ & $i$ & undecided\tabularnewline
\hline
color $j$ & $j$ & undecided & $j$\tabularnewline
\hline
\end{tabular}

Table 1: The update rule of the Undecided-State Dynamics where $i,j\in\left[k\right]$ and $i\neq j$.
'''
context = '''
[Section 1, p. 2:] We study plurality consensus in the \emph{$\mathcal{GOSSIP}$ model} [9, 15, 21] in which each of $n$
agents of a communication network can, in every round, contact one (possibly random)
neighbor to exchange information.

[Section 2, p. 5:] Let us consider a complete graph of $n$ anonymous nodes (\emph{agents}): each of them is initially
colored with one out of $k$ possible colors, where $k = k(n) \in [n]$. It is assumed that
there is an initial \emph{plurality} $c_{1} > n/k$ of agents colored with the \emph{plurality color} $1$.
A synchronous protocol for the \emph{plurality problem} is a finite set of local rules (applied by
every agent) that bring the system
into the \emph{target} configuration where all agents are colored by $1$.

\textbf{The Undecided-State Dynamics.}
We analyze the synchronous version of the Undecided-State Dynamics introduced in [3] and [30].
Differently from other ones (e.g., the majority dynamics considered in [5]), in this protocol,
after the first round, agents can also enter an \emph{undecided} state $q$, to which no color is associated.
Accordingly, at each round $t$, the global state
of the system can be represented by a \emph{color configuration} $\mathbf{c}^{(t)}=\langle c_1^{(t)},\dots,c_k^{(t)}, q^{(t)}\rangle$ where $c_{i}^{(t)}$ is the number of $i$-colored agents, and $q^{(t)}$ is the number of undecided agents.
In the sequel, wlog, we will assume that $c_i \geq c_{i+1}$ for any $i \leq k-1$.

[Section 2, p. 5:] The dynamic process that results from running the Undecided-State Dynamics on the complete
graph can be represented by a finite-state Markov chain defined
over the space of all color configurations.

[Section 2.1, p. 6:] Considered any time $t$, the state of the process (i.e.
the Markov chain) is completely characterized
by the corresponding color configuration, namely by
\[ \mathbf{c}^{(t)}=\langle c_{1}^{(t)},c_{2}^{(t)}, \ldots,c_{k}^{(t)},q^{(t)}\rangle \]
The set of all possible color configurations will be denoted by $\mathcal{S}$.
In the initial state we always have $q^{(0)} = 0$.
'''
notes = '''
The update rule is Table 1 of Section 2 (preliminaries.tex). The model text says "chooses a neighbor v uniformly at random" on the complete graph; whether v may be u itself is not stated. Macros replaced: \threestate -> the text "Undecided-State Dynamics" (paper: $\textrm{Undecided-State Dynamics}$), \gossip -> $\mathcal{GOSSIP}$, \genc -> \mathbf{c}, \cconf{t} -> \langle c_1^{(t)},\dots,c_k^{(t)}, q^{(t)}\rangle, \m -> 1, \sS -> \mathcal{S}. The paper redefines \le, \leq, \ge, \geq as \leqslant, \geqslant; they are kept as written. The \cite commands are replaced by the printed numbers. v1 and v2 have the same text here.
'''

