In the sequel, wlog, we will assume that $c_i \geq c_{i+1}$ for any $i \leq k-1$.

[Section 2.1, p. 6:] Given any color configuration $\mathbf{c}\langle c_1,c_2,\ldots,c_k, q\rangle$,
consider the following ratio
\[ R(\mathbf{c}) \ = \ \sum_{i=1}^{k} \frac {c_i}{c_{1}} \]
[...]

[Section 2.1, p. 7:] Let us now consider the equivalence class $\mathcal M$ of the ($k$) possible \emph{monochromatic} color configurations
and recall the definition of \emph{monochromatic distance} (given in the introduction),
\[ \mathsf{md}(\mathbf{c}) \ = \ \sum_{i=1}^k \, \left(\frac{c_i}{c_{1}}\right)^2 \]
[...]
For every $\mathbf{c}$, it holds that
\begin{equation}
1 \ \leq \ R (\mathbf{c}), \mathsf{md}(\mathbf{c}) \ \leq \ k \tag{1}
\end{equation}
'''
notes = '''
Section 2.1 (preliminaries.tex), label le:ratio1; the numbers (1) and (2) are shown with \tag. Macros replaced: \rratio -> \Lambda, \genc -> \mathbf{c}, \m -> 1, \mdist -> \mathsf{md} (paper: \textnormal{\textsf{md}}), \cconf{t} as in the thm:pmodel entries. "Cauchy-Schwartz" as printed. The paper renders \le, \leq as \leqslant. The item also states md <= R and md <= Lambda, which the paper does not state as numbered results. v1 and v2 have the same text here.
'''

