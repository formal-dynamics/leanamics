statement = '''
\textbf{Theorem 29} ([BCN$^+$16]). let $k = k(n)$ be any function such that $k = O((n/\log n)^{1/3})$, and
consider any initial configuration $\bar{\mathbf{c}} \in \mathcal{S}$ such that $\bar{c}_1 \geqslant (1 + \alpha)\bar{c}_2$ where $\alpha > 0$ is any arbitrarily-small constant$^{23}$. Then, the following claims hold.
\begin{itemize}
\item Convergence towards plurality. The \textsc{Undecided-State} dynamics converges within
$O(\mathsf{md}(\bar{\mathbf{c}}) \log n)$ rounds towards the plurality color, w.h.p.
\item Tightness. This result is almost-tight in a strong sense. In particular, for $k = O((n/\log n)^{1/6})$
and for any initial $k$-colors configurations $\bar{\mathbf{c}}$, the convergence time of the
\textsc{Undecided-State} dynamics is linear in the monochromatic distance $\mathsf{md}(\bar{\mathbf{c}})$ w.h.p.
\end{itemize}
'''
context = '''
[Section 6.4, p. 30, footnote 23:] in the multi-color case this is a weak-bias condition that ensures the convergence of the process towards the
plurality color.

[Section 2.3, p. 9:] We consider a distributed system of $n$ nodes/agents, interacting over an underlying graph
$G = (V, E)$ according to one of the communication models described in Subsection 2.1. In each
round, every node supports a color, i.e. an element $i \in \Sigma = \{1, 2, \ldots, k\}$ (with $2 \leqslant k \leqslant n$).
A configuration of the system is thus a function $c : V \to \Sigma$. When $G$ is the complete graph
and nodes are anonymous, the state of the system at any round is completely specified by a
\emph{color configuration} $\mathbf{c} = \langle c_1, \ldots, c_k\rangle$ (where $c_i$ denotes the number of agents supporting color
$i \in [k]$). There can be an initial \emph{plurality} $c_1$ of agents supporting some \emph{plurality color} (wlog, we
can assume that color communities are ordered, so that $c_i \geqslant c_{i+1}$ for any $i \leqslant k - 1$).

[Section 2.3, p. 9, footnote 9:] According to the standard definition, we say that a sequence of events $\mathcal{E}_n$, $n = 1, 2, \ldots$ holds \emph{with high
probability} if $\mathbf{P}\left(\mathcal{E}_n\right) = 1 - \mathcal{O}(1/n^{\lambda})$ for some positive constant $\lambda > 0$.

[Section 2.1, p. 6:] In the parallel, synchronous model, called (uniform) $\mathcal{GOSSIP}$ nodes share a discrete-time
global clock. In each round, one edge is selected for every node, independently and uniformly at
random. [...] We mostly consider the first variant, also known as the $\mathcal{PULL}$
model.

[Section 6, p. 23:] \textbf{Updating rule of the \textsc{Undecided-State} dynamics.} Let us assume that the set of possible
colors a node can support is $[k]$ and assume that, at a given round, the generic node $u$ samples
a random node $v$. Then if the color of $v$ differs from that of $u$, the latter enters the \emph{undecided}
state, an extra state that an agent can support. When an agent is in the undecided state and
pulls a color, it gets that color. Finally, an agent that pulls either the undecided color or its own
color remains in its current state (see Table 1).

[Section 6.4, p. 29:] In [BCN$^+$16], Becchetti et Al provide an analysis of the \textsc{Undecided-State} dynamics for
the multi-color case on the complete graph by assuming a certain initial bias toward a plurality
color. [...]
As a first step, Becchetti et al introduce a suitable \emph{distance} $\mathsf{d}(\cdot, \cdot)$ on the set $\mathcal{C}$ of all color
configurations. It naturally induces a function $\mathsf{md}(\cdot)$, called the \emph{monochromatic distance}, which
equals the \emph{distance} between any configuration $\mathbf{c}$ and the target configuration:
\[
\mathsf{md}(\mathbf{c}) \ = \ \sum_{i=1}^{k} \left(\frac{c_i}{c_1}\right)^2
\]
