\textbf{Theorem 28} (Parallel \textsc{Undecided-State} Dynamics [CGPS17, CGG$^+$17]). Let the \textsc{Undecided-State} dynamics start from any configuration $\mathbf{c} \in \mathcal{C}$. Then, the following claims hold.
\begin{itemize}
\item Convergence Time. The process converges to a (valid) monochromatic configuration within
$\mathcal{O}(\log n)$ rounds, w.h.p. Furthermore, if the initial configuration has at least one colored
node (i.e. $q \leqslant n - 1$), then the process converges to a valid monochromatic configuration
$\bar{\mathbf{c}} \neq (0, 0, n)$, w.h.p.
\item Plurality-Preserving Property. If the initial configuration $\mathbf{c}$ has bias $s = \Omega(\sqrt{n \log n})$,
then the process converges to the plurality color, w.h.p. Furthermore, the result is almost
tight in a twofold sense: (i) An initial configuration exists, with $s = \Omega(\sqrt{n \log n})$, such
that the process requires $\Omega(\log n)$ rounds to converge w.h.p., and (ii) there is an initial
configuration with $s = \Theta(\sqrt{n})$ such that the process converges to the minority color with
constant probability.
\end{itemize}
'''
