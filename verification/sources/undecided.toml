Transcribed from the PDF (pages are PDF pages; the printed page numbers are one less). PROVENANCE.md cites "the survey, Section 6" for the basic laws of the dynamics; the absorption statement of the survey is in Section 6.1, about the sequential model, and Section 6.3 (in the context) is about the parallel PULL model of the library. The survey's Section 6 gives the update rule but no formula for the one-round expectations, so undecided:thm:expect has no survey entry. The footnote mark after "sequential model" (footnote 16, on the Population-Protocols model) is omitted. "shows" as printed. The survey typesets the dynamics' name in small capitals (\textsc). The published SIGACT News version was not retrieved.
'''

