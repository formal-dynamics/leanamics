[[source]]
item = "undecided:def:usd"
paper = "A. Clementi, M. Ghaffari, L. Gualà, E. Natale, F. Pasquale, G. Scornavacca. A tight analysis of the parallel undecided-state dynamics with two colors"
venue = "MFCS 2018"
version = "arXiv:1707.05135v3"
result = "Section 2, U-Dynamics with two colors (Table 1)"
page = 6
url = "https://arxiv.org/abs/1707.05135v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
We analyze the parallel version of the dynamics called U-Dynamics in the
(uniform) $\mathcal{PULL}$ model on the complete graph:
Starting from an initial configuration where every node supports a color, i.e.
a value from a set $\Sigma$ of $k$ possible colors, at every round, each node $u$
pulls the color of a randomly-selected neighbor $v$. If the color of node $v$
differs from its own color, then node $u$ enters in an \textit{undecided}
state (an extra state with no color).
When a node is in the undecided state and pulls a color, it gets that color.
Finally, a node that pulls either an undecided node or a node with its
own color remains in its current state.

\begin{tabular}{|c||c|c|c|}
\hline
$u\big\backslash v$ & undecided & color $i$ & color $j$\tabularnewline
\hline
\hline
undecided & undecided & $i$ & $j$\tabularnewline
\hline
$i$ & $i$ & $i$ & undecided\tabularnewline
\hline
$j$ & $j$ & undecided & $j$\tabularnewline
\hline
\end{tabular}

Table 1: The update rule of the U-Dynamics where $i,j\in\left[k\right]$ and $i\neq j$.

In this paper we consider the case in which there are two possible colors (say
color \texttt{Alpha} and color \texttt{Beta}). Let us name $\mathcal{C}$ the space of all
possible configurations and observe that, since the graph is complete,
a configuration $\textbf{x} \in \mathcal{C}$ is uniquely determined by fixing the
number of \texttt{Alpha}-colored nodes and the number of \texttt{Beta}-colored ones,
say $a(\textbf{x})$ and $b(\textbf{x})$, respectively.

It is convenient to give names also to two other quantities that will appear
often in the analysis: The number $q(\textbf{x}) = n - a(\textbf{x}) - b(\textbf{x})$ of undecided
nodes and the difference $s(\textbf{x}) = a(\textbf{x}) - b(\textbf{x})$ called the \textit{bias} of $\textbf{x}$.
'''
context = '''
[Section 1, p. 2:] We study the consensus problem in the \emph{$\mathcal{PULL}$ communication model}
[13, 17, 23] where, at every round, each active node of a
communication network contacts one neighbor uniformly at random to pull
information.

[Section 2, p. 6, footnote 6:] W.l.o.g. we can define $\Sigma = [k]$ where $[k] = \{1,2,\cdots,k\}$

[Section 2, p. 6:] Observe that the U-Dynamics defines a finite-state Markov chain
$\{\textbf{X}_t \}_{t \geq 0}$ with state space $\mathcal{C}$ and three absorbing states,
namely, $q = n$, $a = n$, and $b = n$. We call \emph{U-Process} the random
process obtained by applying the U-Dynamics starting at a given state.
'''
notes = '''
Section 2 (preliminaries.tex), first paragraphs and Table 1. The library's binary model (opinions a, b and the undecided state, every node sampling one node uniformly) is this U-Dynamics with Alpha, Beta written a, b; whether the sampled neighbor may be u itself is not stated. Macros replaced: \threestate -> the text "U-Dynamics" (paper: $\textrm{U-Dynamics}$), \threestateprocess -> the text "U-Process", \pull -> $\mathcal{PULL}$, \colA -> \texttt{Alpha}, \colB -> \texttt{Beta}, \x -> \textbf{x}, \X -> \textbf{X}; the footnote mark after "colors" removed (footnote 6 is in the context); citations replaced by the printed numbers. The paper renders \geq as \geqslant.
'''

[[source]]
item = "undecided:thm:expect"
paper = "A. Clementi, M. Ghaffari, L. Gualà, E. Natale, F. Pasquale, G. Scornavacca. A tight analysis of the parallel undecided-state dynamics with two colors"
venue = "MFCS 2018"
version = "arXiv:1707.05135v3"
result = "Equations (1) to (3) (Section 2)"
page = 6
url = "https://arxiv.org/abs/1707.05135v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
From the definition of U-Dynamics it is easy to calculate the following
expected values (see also Section~3 in [5]):
\begin{align}
