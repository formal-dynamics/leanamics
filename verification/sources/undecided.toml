item = "undecided:lem:lb-descent"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri. Plurality consensus in the gossip model"
venue = "SODA 2015"
version = "arXiv:1407.2565v2"
result = "Lemma 6"
page = 14
url = "https://arxiv.org/abs/1407.2565v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
Let $k \leqslant \varepsilon \cdot (n/\log n)^{1/6}$ be the initial number of colors, where $\varepsilon > 0$ is a sufficiently small positive constant.
Let $\bar{\mathbf{c}}$ be the initial color configuration and let $\mathbf{c}^{(1)}$ be the color configuration after the first round. If it holds that:
\begin{equation*}
	\frac{1}{2} \, \frac{n}{ R(\bar{\mathbf{c}})^2} \, \leq c_{1}^{(1)} \leq \, 2 \, \frac{n}{R(\bar{\mathbf{c}})^2}
	\quad \mbox{ and } \quad
	n \left(1 - \frac{2 } { \Lambda(\bar{\mathbf{c}})}\right)
	\, \leq q^{(1)} \leq \, n \left(1 - \frac{ 1 } { 2 \Lambda(\bar{\mathbf{c}})}\right)
\end{equation*}
within the next $O(\log n)$ rounds there will be a round $\bar{t}$ such that
$$
C^{(\bar{t})}_{1} \leqslant \gamma \frac n{\mathsf{md}(\bar{c})} \ \mbox{and } \ \left| Q^{(\bar{t})} - \frac{n}{2} \right| \, \leq \, 2 \frac{\gamma^2}{\mathsf{md}(\bar{\mathbf{c}})}
$$
w.h.p., where $\gamma > 0$ is a sufficiently large constant.
'''
context = '''
[Section 1, p. 2, footnote 1:] As usual, we say that an event $\mathcal{E}_n$ holds
w.h.p. if $\mathbf{P}\left(\mathcal{E}_n\right)\ge 1 - n^{-\Theta(1)}$.

[Section 2, p. 5:] Let us consider a complete graph of $n$ anonymous nodes (\emph{agents}): each of them is initially
colored with one out of $k$ possible colors, where $k = k(n) \in [n]$. It is assumed that
there is an initial \emph{plurality} $c_{1} > n/k$ of agents colored with the \emph{plurality color} $1$. [...]
Accordingly, at each round $t$, the global state
of the system can be represented by a \emph{color configuration} $\mathbf{c}^{(t)}=\langle c_1^{(t)},\dots,c_k^{(t)}, q^{(t)}\rangle$ where $c_{i}^{(t)}$ is the number of $i$-colored agents, and $q^{(t)}$ is the number of undecided agents.
In the sequel, wlog, we will assume that $c_i \geq c_{i+1}$ for any $i \leq k-1$.

The Undecided-State Dynamics works as follows.
According to the (uniform) gossip model,
at every round $t \geqslant 0$, each agent $u$ chooses a neighbor $v$ uniformly at random and
decides to get a new color/state according to the rules in Table 1, [Table 1: an undecided agent that chooses an agent of color $i$ gets color $i$; an agent of color $i$ that chooses an agent of color $j \neq i$ becomes undecided; in all other cases the agent keeps its state.]

[Section 2.1, p. 6:] In the initial state we always have $q^{(0)} = 0$.
For any time $t \geqslant 0$,
the execution of one round of the dynamics rule (uniquely) determines the probability distribution of
the (vectorial) random variable representing the random state at time $t$:
\[ \mathbf{C}^{(t)}=\langle C_{1}^{(t)},C_{2}^{(t)}, \ldots,C_{k}^{(t)},Q^{(t)}\rangle \]
[...]
Thus, $Q^{(t)}$ and $C_i^{\left( t \right)}$ denote
the r.v.s counting the number of nodes that, respectively, are undecided and that have color $i$ at time $t$.

[Section 2.1, p. 6:] Given any color configuration $\mathbf{c}\langle c_1,c_2,\ldots,c_k, q\rangle$,
consider the following ratio
\[ R(\mathbf{c}) \ = \ \sum_{i=1}^{k} \frac {c_i}{c_{1}} \]
[...]

[Section 2.1, p. 7:] [...] recall the definition of \emph{monochromatic distance} (given in the introduction),
\[ \mathsf{md}(\mathbf{c}) \ = \ \sum_{i=1}^k \, \left(\frac{c_i}{c_{1}}\right)^2 \]
[...]
Finally, let us define the following ratio
\[
	\Lambda(\mathbf{c}) \ := \ \frac{ R(\mathbf{c} )^2 }{ \mathsf{md}(\mathbf{c}) }
\]
'''
notes = '''
Section 3.4 (afterbigbang.tex), label lem:lb_phase2; Lemma 6 in v1 and v2. As printed, the bound on C_1 uses md(\bar{c}) (LaTeX \mdist(\bar{c}), where the rest of the paper has \bar{\genc}), and the window on Q is printed as 2\gamma^2/md(\bar{\mathbf{c}}), without a factor n; the proof of the lemma works with the interval [n/2 - 2\gamma^2 n/md, n/2 + 2\gamma^2 n/md] (see the entry for (17)). Macros replaced: \genc -> \mathbf{c}, \ratio -> R, \rratio -> \Lambda, \m -> 1, \mdist -> \mathsf{md}, \genC -> \mathbf{C}. The bracketed summary of Table 1 in the context is not a quotation.
'''

