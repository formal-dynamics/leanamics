from a simple application of the Cauchy-Schwartz
inequality to $R(\mathbf{c})$, we get
\begin{equation}
	\Lambda(\mathbf{c}) \ \le \ k \tag{2}
\end{equation}
for every configuration $\mathbf{c}$.
'''
context = '''
