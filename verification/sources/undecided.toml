[[source]]
item = "undecided:def:seq"
paper = "D. Angluin, J. Aspnes, D. Eisenstat. A simple population protocol for fast robust approximate majority"
venue = "Distributed Computing 21(2):87-102, 2008"
version = "journal version (authors' PDF)"
result = "Sections 2 and 3, the 3-state protocol"
page = 3
url = "https://cs.yale.edu/homes/aspnes/papers/approximate-majority-journal.pdf"
status = "transcribed by an AI agent from the authors' PDF of the journal version (no LaTeX source available); not yet checked by a person"
statement = '''
We analyze the behavior of the following population protocol with states $Q = \{b, x, y\}$. The state $b$ is the \textbf{blank}
state. Row labels give the initiator's state and column
labels the responder's state.
\[
\begin{array}{cccc}
  & x & b & y \\
x & (x, x) & (x, x) & (x, b) \\
b & (b, x) & (b, b) & (b, y) \\
y & (y, b) & (y, y) & (y, y)
\end{array}
\]
Note that this protocol is \textbf{one-way}: every interaction
changes at most the responder's state; thus it can be implemented with one-way communication. Only the interactions $xb$, $yb$, $xy$, and $yx$ change the responder's state;
we may think of these as the only interactions that consume energy. The \textbf{blank configuration} of all $b$'s is stable, but cannot be reached from any non-blank configuration because no interaction can eliminate the last $x$ or
$y$. The configurations of all $x$'s and all $y$'s are stable, and
every non-blank configuration can reach at least one of
them.
'''
context = '''
[Section 2, p. 2:] A \textbf{population protocol} consists of a finite set of states
$Q$, a finite set of input symbols $X \subseteq Q$, a finite set
of output symbols $Y$, an output function $\gamma : Q \to Y$,
and a \textbf{joint transition function} $\delta : Q \times Q \to Q \times Q$. A population protocol is executed by a fixed finite
\textbf{population} of agents with states in $Q$. For convenience,
we assume that each agent has an identity $v \in V$, but
agents do not know their own identities or others'.
Initially, each agent is assigned a state according to
an \textbf{input} $x : V \to X$ that maps agent identities to input
symbols. In the general population protocol model, there
is an \textbf{interaction graph}, a directed graph $G = (V, A)$
without self-loops, whose arcs indicate the possible agent
interactions that may take place. ($G$ is directed because
we assume that interacting agents are able to break symmetry.) In this paper, $G$ will always be a complete graph.
During each execution step, an arc $(v, w)$ is chosen
uniformly at random from $A$. The ``source'' agent $v$ is
the \textbf{initiator}, and the ``sink'' agent $w$ is the \textbf{responder}.
These agents update their states jointly according to $\delta$:
if $v$ is in state $q_v$ and $w$ is in state $q_w$, the state of $v$
becomes $\delta_1(q_v, q_w)$, the state of $w$ becomes $\delta_2(q_v, q_w)$,
where $\delta_i$ gives the $i^{th}$ coordinate of the output of $\delta$. The
states of all other agents are unchanged.

[Section 3, p. 3:] An intuitive description of the process is that agents
in state $b$ are undecided, while initiators in states $x$ and $y$
are attempting to convert responders that they meet to
adopt their respective states. Such an initiator immediately converts an undecided responder, but only succeeds
in reducing an opposing responder to undecided status.
'''
notes = '''
Version: the authors' PDF of the journal version (a "Distributed Computing manuscript"), linked from J. Aspnes's publication page. Transcribed from the PDF (two-column layout, read from the rendered pages). The protocol table is typeset in the PDF as a plain array (no rules); entry (row r, column c) is the pair (new initiator state, new responder state) when the initiator is in state r and the responder in state c. The library writes x, y and the blank b as a, b and u. The PDF is the authors' "Distributed Computing manuscript" of the journal version; the numbering of Sections 2 to 5 and Theorems 1 and 2 is the one cited by the library.
'''

