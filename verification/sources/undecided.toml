& = \frac{1}{n} \left(2 \delta^2 - \sum_{j=1}^k \left(c_j\right)^2 \right) \tag{19}\\
\mu_{i} & =
\left( 1 + \frac{2 \delta + c_i}{n} \right) c_i \tag{20}
\end{align}
'''
