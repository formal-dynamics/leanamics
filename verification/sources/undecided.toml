status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available); not yet checked by a person"
statement = '''
It is easy to verify that the process yielded by \textsc{Undecided-State} dynamics is a reversible
finite Markov chain which admits 3 absorbing monochromatic states: $(n, 0, 0), (0, n, 0), (0, 0, n)$.
Then, standard arguments on Markov chains shows that, starting from any configuration, with
probability 1, the system converges to one of these absorbing states in finite time.
'''
context = '''
[Section 6, p. 23:] \textbf{Updating rule of the \textsc{Undecided-State} dynamics.} Let us assume that the set of possible
colors a node can support is $[k]$ and assume that, at a given round, the generic node $u$ samples
a random node $v$. Then if the color of $v$ differs from that of $u$, the latter enters the \emph{undecided}
state, an extra state that an agent can support. When an agent is in the undecided state and
pulls a color, it gets that color. Finally, an agent that pulls either the undecided color or its own
color remains in its current state (see Table 1).

\begin{tabular}{|c||c|c|c|}
\hline
$u\backslash v$ & undecided & color $i$ & color $j$\\
\hline
undecided & undecided & $i$ & $j$\\
\hline
$i$ & $i$ & $i$ & undecided\\
\hline
$j$ & $j$ & undecided & $j$\\
\hline
\end{tabular}

Table 1: The update rule of the \textsc{Undecided-State} dynamics where $i, j \in [k]$ and $i \neq j$ are the
colors a node can support.

[Section 6.1, p. 23:] In [AAE08], Angluin et al study the \textsc{Undecided-State} dynamics on the complete graph of $n$
nodes by adopting the asynchronous, sequential model where, at every round, one oriented
edge $(u, v)$ is chosen uniformly at random and then node $u$ applies the local rule of the dynamics
by pulling the state of $v$ (according to Table 1).
The authors provide an unconditional analysis for the binary case (i.e. $|\Sigma| = 2$) when the
process starts from any possible color configuration, also including undecided nodes. Since
the system is anonymous and the graph is complete, the configuration (or global state) of the
process can be represented by a triple $(c_0, c_1, q)$ where $c_i$ is the number of nodes supporting
color $i$ ($i = 0, 1$) and $q$ is the number of undecided nodes. We call $\mathcal{C}$ the set of all possible
configurations.

[Section 6.3, p. 27:] If we run the \textsc{Undecided-State} dynamics on the parallel $\mathcal{PULL}$ model, then at every round all
nodes update their own state. Even though it is easy to verify that the dynamics still achieves
consensus (with high probability), the evolution of the parallel process significantly departs from
the sequential one described in the previous subsection.
'''
