item = "undecided:thm:pmodel"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri. Plurality consensus in the gossip model"
venue = "SODA 2015"
version = "arXiv:1407.2565v2"
result = "Equations (3) and (4)"
page = 8
url = "https://arxiv.org/abs/1407.2565v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
If $\mathbf{c} = \langle c_1,\dots,c_k, q\rangle$ is the current color configuration (i.e. state)
of the Markov chain, then we can easily derive the ``expectation'' of the
next color configuration
\begin{align}
	\mu_{i} & = \mathbf{E}\left[\left. C_{i}' \;\right| \bar{\mathbf{c}} \right] = c_{i} \cdot \frac{c_{i}+2q}{n} \quad (i \in \left[ k \right]) \tag{3}\\
	\mu_{q} & = \mathbf{E}\left[\left. Q' \;\right| \bar{\mathbf{c}} \right] = \frac{q^{2}+\sum_{i\neq j}c_{i}\cdot c_{j}}{n}=\frac{q^{2}+\left(n-q\right)^{2}-\sum_{i} c_{i}^{2}}{n} \tag{4}
\end{align}
'''
context = '''
[Section 2, p. 5:] Let us consider a complete graph of $n$ anonymous nodes (\emph{agents}): each of them is initially
colored with one out of $k$ possible colors, where $k = k(n) \in [n]$. [...]
Accordingly, at each round $t$, the global state
of the system can be represented by a \emph{color configuration} $\mathbf{c}^{(t)}=\langle c_1^{(t)},\dots,c_k^{(t)}, q^{(t)}\rangle$ where $c_{i}^{(t)}$ is the number of $i$-colored agents, and $q^{(t)}$ is the number of undecided agents.

The Undecided-State Dynamics works as follows.
According to the (uniform) gossip model,
at every round $t \geqslant 0$, each agent $u$ chooses a neighbor $v$ uniformly at random and
decides to get a new color/state according to the rules in Table 1,

\begin{tabular}{|c||c|c|c|}
\hline
$u\big\backslash v$ & undecided & color $i$ & color $j$\tabularnewline
\hline
\hline
undecided & undecided & $i$ & $j$\tabularnewline
\hline
color $i$ & $i$ & $i$ & undecided\tabularnewline
\hline
color $j$ & $j$ & undecided & $j$\tabularnewline
\hline
\end{tabular}

Table 1: The update rule of the Undecided-State Dynamics where $i,j\in\left[k\right]$ and $i\neq j$.

[Section 2.1, p. 6:] If we condition the system to be in a fixed state $\mathbf{c}$ at a generic round,
the random sizes of the $i$-color communities and that of the undecided community at the next round will
be denoted as $C_{i}'$ and $Q'$, respectively.

For brevity' sake, we define
\begin{align*}
	\mu_{i} := \mathbf{E}\left[\left. C_{i}' \;\right| \mathbf{c} \right] \,\,\, (i \in [ k ]),
	\quad
	\mu := \mathbf{E}\left[\left. \sum_iC_i' \;\right| \mathbf{c} \right]
	\quad \mbox{ and }
	\quad
	\mu_{q} := \mathbf{E}\left[\left. Q' \;\right| \mathbf{c} \right]
\end{align*}
'''
notes = '''
Section 3.2, General bounds (generalbounds.tex), labels eq:average_of_c and eq:average_of_q; the numbers (3) and (4) are shown with \tag. As printed, the conditioning in (3) and (4) is on \bar{\mathbf{c}} while the sentence before names the current configuration \mathbf{c}. Macros replaced: \medi -> \mu_{i}, \medq -> \mu_{q}, \Med -> \mu, \expec{X}{Y} -> \mathbf{E}\left[\left. X \;\right| Y \right], \genc -> \mathbf{c}, \ccgen -> \langle c_1,\dots,c_k, q\rangle, \cconf{t} as in the model entry. v1 and v2 have the same text here.
'''

