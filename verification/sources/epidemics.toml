'''
context = '''
[Definition 12 (lower exponential shrinking conditions), p. 31:] Let $\rho_n$ be bounded between two positive constants.
	Let $0 < g < 1$ and $a, c \in \mathbb{R}_{\ge0}$.
	We say that a homogeneous epidemic protocol satisfies \emph{the lower exponential shrinking conditions} if for any $n \in \mathbb{N}$ big enough, the following properties are satisfied, for all $u \le gn$ (resp. $k \in [n-\lfloor gn \rfloor, n]$).
	(i) $1 - p_k = 1-p_{n-u} \ge e^{-{\rho_n}} - a\frac{u}{n}$;
	(ii) $c_k = c_{n-u} \le \frac{c}{u}$.
[Definition 6, p. 16:] Whenever a round starts with $k$ nodes being informed, then the probability for each uninformed node to become informed is some number $p_k$, which only depends on the number $k$ of the informed nodes at the beginning of the round.
[Definition 7, p. 16:] [...] let $c_k$ be the smallest number such that whenever a round starts with $k$ informed nodes and for any two uninformed nodes $x_1, x_2$, the indicator random variables $X_1, X_2$ for the events that these nodes become informed in this round satisfy \[\operatorname{Cov}[X_1,X_2] \le c_k.\]
[Definition 8, p. 17:] For all $t = 0, 1, \dots$ denote by $I_t$ the number of informed nodes at the end of the $t$-th round ($I_0 := 1$). Let $k \le m \le n$. By $T(k,m)$ we denote the time it takes to increase the number of informed nodes from $k$ to $m$ or more, that is,
    \[
        T(k,m) = \min\{ t-s | I_s = k \operatorname{ and } I_t \ge m \}.
    \]
'''
notes = "Theorem title: 'lower bound of spreading time'. The expectation bound is printed '>= (1/rho_n) ln n + O(1)'. Macros replaced: \\Expect -> \\mathbb{E}, \\Pr -> \\mathbb{P}, \\N -> \\mathbb{N}, \\R -> \\mathbb{R}, \\Cov -> \\operatorname{Cov}; enumerate of Definition 12 flattened. The library does not formalize Theorem 38 in general: for push (doc comment 'Theorem 38 for push') it bounds the final phase from any number u of uninformed nodes by a lower envelope along explicit targets, which the blueprint says replace the recursive targets u_{j+1} = E_0(u_j) of Lemma 40 (p. 32)."

