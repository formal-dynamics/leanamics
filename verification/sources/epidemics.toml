statement = '''
[Appendix C, p. 39:] We stick to the usual convention that for rumor spreading in complete graphs we allow that nodes call themselves, that is, the random communication partner is chosen uniformly at random from all nodes.
[Appendix C.1, p. 39:] In the push protocol, in each round each node knowing the rumor calls a random neighbor and gossips the rumor to it.
[Appendix C.2, p. 40:] The pull protocol is dual to the push protocol in the sense that now in each round, each uninformed node calls a random neighbor and becomes informed if the latter was informed.
