and $C_{t+1}$ is defined as follows. Let $C_t$ be the vertices chosen at round $t$ (not necessarily for the first time).
Each vertex $v \in C_t$ independently chooses $k$ neighbours uniformly at random with replacement and all the chosen vertices belong to $C_{t+1}$.
[Section 1, p. 3:] \textbf{Biased Infection with Persistent Source (BIPS):} [...] Given $A_t$ each vertex $u \in V$, other than $v$,  independently and uniformly with replacement selects $k$ neighbours and becomes a member of $A_{t+1}$ if and only if at least one of the selected neighbours is in $A_t$. Additionally, $v \in A_t$ for all $t \geq 0$.
