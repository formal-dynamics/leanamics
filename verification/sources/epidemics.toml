item = "epidemics:thm:crr-phases"
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Lemmas 2, 3 and 4"
page = 8
url = "https://arxiv.org/abs/1602.05768v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person"
statement = '''
Lemma 2. Let $G$ be a connected $r$-regular graph on $n$ vertices,
with $\lambda=\lambda(n) < 1$, and let $m \leq n/2$.
Then with probability at least $1-\mathcal{O}(1/n^C)$, we have that $A_t > m$
for some $t \le T$, where
$T = 13m/(1-\lambda) + 24C\log(n)/(1-\lambda)^2$.

Lemma 3. Let $G$ be a connected $n$-vertex $r$-regular graph with $\lambda<1$. Suppose that $|A_t| \geq K \log(n)/(1-\lambda)^2$, with $K = 4000$. Then the BIPS process infects at least $9/10$ of the whole graph in $\mathcal{O}(\log(n)/(1-\lambda))$ extra rounds with probability at least $1-\mathcal{O}(1/n^3)$.

Lemma 4. Let $G$ be a connected $n$-vertex $r$-regular graph with $1-\lambda \gg \sqrt{\log(n)/n}$.
With probability at least $1-n^{-5}$, after
 $T \le 8\log(n)/(1-\lambda)$ rounds the BIPS process infects the whole graph.
'''
context = '''
[Section 4, p. 7:] Consider a BIPS process $A_t$ with source $v$ on a graph $G$. Thus at $t=0$, $A_0=\{v\}$.
[Section 5, p. 10:] In this section we analyze the growth of $A_t$ in the BIPS process
from $A_{t'}= \Theta(\log n/(1-\lambda)^2)$ up to $A_{t''}=n$.
We start by applying Lemma 2
with $m=K \log(n)/(1-\lambda)^2$, for some (large) constant $K$, to have w.h.p.
$A_t \ge K \log n/(1-\lambda)^2$ for some $t=\mathcal{O}(\log n /(1-\lambda)^3)$.
Lemma 3 shows that from this point additional
$\mathcal{O}(\log(n)/(1-\lambda))$ rounds bring the infection size $A_t$ up to at least $(9/10)n$ w.h.p.
Lemma 4 shows that when $A_t$ becomes $\ge (9/10)n$, then
w.h.p. the whole graph becomes infected at some point within the subsequent
$\mathcal{O}(\log(n)/(1-\lambda))$ rounds.
[Section 1, p. 2, footnote:] ``With high probability,'' which means in this paper probability at most $n^{-c}$,
for some positive constant $c$.
[Section 1, p. 3:] \textbf{Biased Infection with Persistent Source (BIPS):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Consider a vertex $v$ which is the source of an infection. We consider the process $A_t$ defined by $A_0 = \{v\}$. Given $A_t$ each vertex $u \in V$, other than $v$,  independently and uniformly with replacement selects $k$ neighbours and becomes a member of $A_{t+1}$ if and only if at least one of the selected neighbours is in $A_t$. Additionally, $v \in A_t$ for all $t \geq 0$.
[Section 1, p. 3:] Let
$\lambda=\lambda_{\max}=\max_{i=2,...,n} |\lambda_i|$ be the second largest eigenvalue (in absolute value).
[Section 1, p. 3, footnote of Theorem 1:] $(1-\lambda) \ge  C\sqrt{(\log n)/n}$ for some suitably large constant $C$.
'''
notes = "Three lemmas in one entry; labels added. Lemma 2 is on p. 8, Lemmas 3 and 4 on p. 10. Lemma 4's statement does not repeat the hypothesis |A_t| >= (9/10)n, which is in the Section 5 introduction (context) and in its proof (A_0 >= qn, q = 9/10); a commented-out line of the source has it. The w.h.p. footnote reads 'probability at most n^{-c}', as printed. Lemma 1 (the expected growth) is used with k = 2. In Lemma 2, C is a free constant of the statement. Macros replaced: \\BIPS -> BIPS, \\bigO -> \\mathcal{O}, \\whp -> w.h.p., \\l -> \\lambda. The library proves the three lemmas for an abstract growth process with rate c (BIPS with c = 1 - lambda), with some constants differing in the proofs of Lemmas 3 and 4 (FORMALIZATION_DIFFERENCES.md)."

