statement = '''
Let $G$ be a connected $n$-vertex $r$-regular graph with adjacency matrix $A(G)$
and random-walk transition matrix $P=A(G)/r$. Let $\lambda_1, \lambda_2,...,\lambda_n$
be the eigenvalues of the transition matrix ordered in a non-increasing sequence.
Thus $\lambda_1=1$, $\lambda_n \ge -1$. Let
$\lambda=\lambda_{\max}=\max_{i=2,...,n} |\lambda_i|$ be the second largest eigenvalue (in absolute value).
If the graph $G$ is not bipartite, then $\lambda <1$.
'''
notes = "Macro \\l replaced by \\lambda. The library defines lambda = max(lambda_2, |lambda_n|) for the sorted eigenvalues of P, and 0 if n < 2."

