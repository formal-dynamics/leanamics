item = "epidemics:thm:layers"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Appendix A.2, text before Theorem A.3"
page = 18
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
If we consider the set $I_t$ of nodes that are infectious at time $t$ in a graph
$G=(V,E)$ according to the IC protocol with transmission
probabilities $\{ p(e) \}_{e\in E} $ and with initiator set $I_0$, we see that
such a set has precisely the same distribution as the set of nodes at distance
$t$ from $I_0$ in the percolation graph $G_p$ generated by the bond percolation process with  probabilities $\{ p(e)
\}_{e\in E}$ (see Definition A.1). Furthermore, the set of recovered nodes $R_t$ is distributed
precisely like the set of nodes at distance $< t$ from $I_0$ in $G_p$.
'''
context = '''
[Definition A.1, p. 17:] Given a graph $G = (V,E)$, and given, for every edge $e \in E$, a
\emph{percolation probability} $p(e) \in [0,1]$, the \emph{bond percolation}  process consists to
\emph{remove} each edge $e \in E$, independently, with probability $1-p(e)$.
The random subgraph, called the \emph{percolation graph} $G_p=(V,E_p)$, is
defined by the edges that are not removed [...].
[Definition A.2, p. 18:] [...] the {\em Independent Cascade} (for short, $\mathrm{IC}$) protocol defines the
stochastic process $\{S_t,I_t,R_t\}_{t\geq 0}$ on $G$ [...]
\begin{itemize}
     \item At time $t=0$ we have $R_0 = \emptyset$ and $S_0 = V-I_0$.
     \item At time $t\geq 1$:
     \begin{itemize}
         \item $R_t = R_{t-1} \cup I_{t-1}$, that is, the nodes that were
         infected at the previous step become recovered.
         \item Independently for each edge $e = \{ u,v\}$ such that $u \in
         I_{t-1}$ and $v\in S_{t-1}$, with probability $p(e)$ the event that
         ``$u$ transmits the infection (i.e. a copy of the source message) to $v$ at time $t$'' takes place. The
         set $I_t$ is the set of all vertices $v\in S_{t-1}$ such that for at
         least one neighbor $u \in I_{t-1}$ the event that $u$ transmits the
         infection to $v$ takes place as described above.
         \item $S_t = S_{t-1} - I_t$
     \end{itemize}
 \end{itemize}
[...] The Reed-Frost SIR protocol (for
short, \emph{RF Protocol}) is the special case of the $\mathrm{IC}$ protocol in which all transmission probabilities
are the same.
[Appendix A.1, p. 17:] The distance $d_{G}(S,v)$ from the set $S$ to the
node $v$ is the length of the shortest path among all paths from any node in
$S$ to $v$ in $G$, if no such path exists $d_{G}(S,v) = + \infty$, if $v \in
S$, $d_{G}(S,v) = 0$.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Unnumbered claim of the text, stated as a distributional equivalence; the paper formalizes it as Theorem A.3 (see the thm:perc entry of verification/sources.toml). The \\ref to the bond percolation definition is rendered as 'Definition A.1'. Similar statement in the introduction (p. 2): 'the set of nodes infected in the first t steps (that is, the union of infectious and recovered nodes at time t) has the same distribution as the set of nodes reachable in the percolation graph G_p from I_0 in at most t steps'."

