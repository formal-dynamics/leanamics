notes = "Untitled theorem. The display ends with a comma, as printed. Macros replaced: \\Expect -> \\mathbb{E}, \\Pr -> \\mathbb{P}, \\R -> \\mathbb{R}, \\Cov -> \\operatorname{Cov}; enumerate of Definition 14 flattened. The library proves the final phases of pull and push-pull with l = 2 (doc comments 'Theorem 48 for pull / push-pull') by a lower envelope along the targets eps_{j+1} = E(eps_j)/2, with the exponent -1/2 in place of -1 + 2 alpha l (blueprint)."

[[source]]
item = "epidemics:lem:rumor-lower-generic"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Lemmas 42 and 50"
page = 33
url = "https://arxiv.org/abs/2303.11150v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person"
statement = '''
Lemma 42. If the process is in phase $j < J-1$, then the probability that it "leapfrogs" phase $j+1$ (i.e., proceeds to phase $j+2$ or further in current round) is at most $q(u_j)$.

Lemma 50. If the process starts in phase $j$, $j < J$, then the probability that after one round it is in phase $j+2$ or higher is at most $q$.
'''
context = '''
[Appendix B.3.4, p. 32, exponential shrinking, lower bound:] Let $Y(u)$ be the number of uninformed nodes at the end of the round with $u$ uninformed ones.
From the exponential shrinking conditions it follows that
\begin{equation}
	\mathbb{E}[Y(u)] \ge E(u) := u \left(e^{-{\rho_n}} - a\tfrac{u}{n}\right) \notag.
\end{equation}
We define the \emph{target value} in the same way as for the upper bound.
\begin{equation}
	E_0(u) := E(u) - Au^{1-B},
\end{equation}
where $A>0$ and $B \in ]0,1/2[$ are some constants chosen uniformly for all values of $u$ and $n$.
[Lemma 39, p. 32:] For any $u > gn$ and $u \in \mathbb{N}$,
	\begin{equation}
		\mathbb{P}[Y(u) \le E_0(u)] \le q(u) := \tfrac{e^{-{\rho_n}}+c}{A^2} \cdot \tfrac1{u^{1-2B}} \notag.
	\end{equation}
[Appendix B.3.5, p. 32:] We define the sequence $u_j$ recursively by
\begin{equation}
	u_0 := gn, \qquad u_{j+1} := E_0(u_j) \notag.
\end{equation}
[Corollary 41, p. 33:] There exists $J = \tfrac1{\rho_n} \ln n + O(1)$ such that $u_J > 1$ for any $n$ big enough.
[p. 33:] By definition, the $u_j$ form a non-decreasing sequence.
We say that the rumor spreading process is in phase $j$, $j \in \{0,\ldots,J-1\}$, if the number of informed nodes is in $[u_{j+1}, u_j[$.
[Appendix B.5.2, p. 37, double exponential shrinking, lower bound:] Let again $y(\varepsilon)$ denote the fraction of uninformed nodes at the end of a round started with $\varepsilon n$ uninformed ones.
The double exponential shrinking conditions state that
\begin{equation}
    \mathbb{E}[y(\varepsilon)] \ge E(\varepsilon) := a\varepsilon^\ell \notag.
\end{equation}
[Lemma 49, p. 37:] For any fraction of uninformed nodes $\varepsilon \in [n^{-\alpha}, g]$,
    \begin{equation}
        \mathbb{P}\left[y(\varepsilon) \le \tfrac12E(\varepsilon)\right] \le \tfrac{4+4c}{a^2 \varepsilon^2 n} \le q := \tfrac{4+4c}{a^2}n^{2\alpha\ell-1} \notag.
    \end{equation}
[Appendix B.5.3, p. 37:] Let us define the sequence $\varepsilon_j$ recursively by
\begin{equation}
    \varepsilon_0 := g, \quad \varepsilon_{j+1} := \tfrac12E(\varepsilon_j) \notag.
\end{equation}
[p. 38:] There exists $J = \log_\ell \ln n + O(1)$ such that $\varepsilon_J > n^{-\alpha}$.
As before, we say that the process is in phase $j$ if the fraction $\varepsilon$ of uninformed nodes is in $]\varepsilon_{j+1}, \varepsilon_j]$.
'''
notes = "Two lemmas in one entry; labels added. Lemma 42 (p. 33) is untitled and unlabelled in the source; Lemma 50 is on p. 38. 'the number of informed nodes is in [u_{j+1}, u_j[' (the u_j count uninformed nodes) and 'non-decreasing' are as printed; Lemma 39 reads 'For any u > gn', as printed. The observation giving J for the double exponential phases is unnumbered. Macros replaced: \\Pr -> \\mathbb{P}, \\Expect -> \\mathbb{E}, \\N -> \\mathbb{N}, \\eps -> \\varepsilon. The library item is a round-by-round lower envelope for any observable of a Markov kernel (the 'round-by-round form' of these lemmas), plus two joining tools that have no counterpart here."

