[Lemma 1, p. 6:] Let $G$ be a connected $r$-regular graph on $n$ vertices,
with $\lambda < 1 $ where $\lambda$ is the absolute second eigenvalue of the random-walk  transition matrix.
Let $A_t$ be the size of the infected set after step $t$ of the BIPS process with $k=2$, then
