# ---------------------------------------------------------------------------------------------
# Kempe, Kleinberg, Tardos, KDD 2003: Reed-Frost (Independent Cascade) and the live-edge graph.

[[source]]
item = "epidemics:def:reedfrost"
paper = "D. Kempe, J. Kleinberg, É. Tardos. Maximizing the spread of influence through a social network"
venue = "KDD 2003"
version = "KDD 2003 (authors' PDF)"
result = "Section 1, Independent Cascade Model"
page = 2
url = "https://www.cs.cornell.edu/home/kleinber/kdd03-inf.pdf"
status = "AI agent: typed from the KDD 2003 PDF; not checked by a person"
statement = '''
The conceptually simplest model of this type
is what one could call the Independent Cascade Model, investigated recently in the context of marketing by Goldenberg, Libai,
and Muller [13, 14]. We again start with an initial set of active
nodes $A_0$, and the process unfolds in discrete steps according to
the following randomized rule. When node $v$ first becomes active
in step $t$, it is given a single chance to activate each currently inactive neighbor $w$; it succeeds with a probability $p_{v,w}$ --- a parameter
of the system --- independently of the history thus far. (If $w$ has
multiple newly activated neighbors, their attempts are sequenced in
an arbitrary order.) If $v$ succeeds, then $w$ will become active in step
$t + 1$; but whether or not $v$ succeeds, it cannot make any further attempts to activate $w$ in subsequent rounds. Again, the process runs
until no more activations are possible.
'''
notes = "No LaTeX source is available; typed from the PDF. Citations [13, 14] are the paper's numbering (Goldenberg, Libai, Muller). The Reed-Frost process is the case of equal probabilities p_{v,w} = p (see the Definition A.2 entry of arXiv:2103.16398 for this item). The library cites the KDD 2003 version; the journal version is Theory of Computing 11 (2015)."

[[source]]
items = ["epidemics:cor:final", "epidemics:thm:perc"]
paper = "D. Kempe, J. Kleinberg, É. Tardos. Maximizing the spread of influence through a social network"
venue = "KDD 2003"
version = "KDD 2003 (authors' PDF)"
result = "Claim 2.3"
page = 4
url = "https://www.cs.cornell.edu/home/kleinber/kdd03-inf.pdf"
status = "AI agent: typed from the KDD 2003 PDF; not checked by a person"
statement = '''
A node $x$ ends up active if and only if there is a
path from some node in $A$ to $x$ consisting entirely of live edges.
(We will call such a path a live-edge path.)
'''
context = '''
[Section 1, p. 2:] We again start with an initial set of active
nodes $A_0$, and the process unfolds in discrete steps according to
the following randomized rule. When node $v$ first becomes active
in step $t$, it is given a single chance to activate each currently inactive neighbor $w$; it succeeds with a probability $p_{v,w}$ --- a parameter
of the system --- independently of the history thus far. [...] If $v$ succeeds, then $w$ will become active in step
$t + 1$; but whether or not $v$ succeeds, it cannot make any further attempts to activate $w$ in subsequent rounds. Again, the process runs
until no more activations are possible.
[Section 2, p. 4:] Continuing this reasoning, we can in fact assume that for each pair of neighbors $(v, w)$ in the graph, a coin of
bias $p_{v,w}$ is flipped at the very beginning of the process (independently of the coins for all other pairs of neighbors), and the result is
stored so that it can be later checked in the event that $v$ is activated
while $w$ is still inactive.
With all the coins flipped in advance, the process can be viewed
as follows. The edges in $G$ for which the coin flip indicated an
activation will be successful are declared to be live; the remaining
edges are declared to be blocked. If we fix the outcomes of the coin
flips and then initially activate a set $A$, it is clear how to determine
the full set of active nodes at the end of the cascade process:
'''
notes = "No LaTeX source is available; typed from the PDF. Claim 2.3 is stated for fixed coin outcomes (pathwise), in the Independent Cascade Model. For thm:perc the distributional consequence is used: with random coins, the probability that x ends up active is the probability of a live-edge path from A (the paper uses it through sigma(A) = sum_X Prob[X] sigma_X(A))."

# ---------------------------------------------------------------------------------------------
# Becchetti, Clementi, Denni, Pasquale, Trevisan, Ziccardi, arXiv:2103.16398v3.

[[source]]
item = "epidemics:def:reedfrost"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Definitions A.1 and A.2"
page = 17
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
Definition A.1 (The Bond Percolation process). Given a graph $G = (V,E)$, and given, for every edge $e \in E$, a
\emph{percolation probability} $p(e) \in [0,1]$, the \emph{bond percolation}  process consists to
\emph{remove} each edge $e \in E$, independently, with probability $1-p(e)$.
The random subgraph, called the \emph{percolation graph} $G_p=(V,E_p)$, is
defined by the edges that are not removed (i.e. they are activated), i.e., $E_p = \{ e \in E \, : \,
\mbox{edge $e$ is not removed} \}$. Given an initial subset $A_0 \subseteq V$ of
\emph{active} nodes, for every integer $t \leq n-1$, we define the random
subset $A_{t}$ of  $t$-active nodes as the subset of nodes that are at distance
$t$ from $A_{0}$ in the percolation graph $G_p=(V,E_p)$, i.e., $A_{t} =
N_{G_{p}}^{t}(A_{0})$. Finally, the subset of all active nodes from $A_{0}$ is
the subset $N^*_{G_p}(A_0)$.

Definition A.2 ($\mathrm{IC}$ and RF protocols). Given a graph $G = (V,E)$, an assignment of \emph{transmission probabilities} $\{
p(e) \}_{e\in E}$ to the edges of $G$, and a non-empty set $I_0 \subseteq V$ of
initially infectious nodes (that will also be called {\em initiators} or
{\em sources} since they have the information/virus since the very beginning), the {\em Independent Cascade} (for short, $\mathrm{IC}$) protocol defines the
stochastic process $\{S_t,I_t,R_t\}_{t\geq 0}$ on $G$, where $S_t,I_t,R_t$ are three
sets of vertices, respectively called \emph{susceptible}, \emph{infectious}, and \emph{recovered},
which form a partition of $V$ and that are defined as follows.
\begin{itemize}
     \item At time $t=0$ we have $R_0 = \emptyset$ and $S_0 = V-I_0$.
     \item At time $t\geq 1$:
     \begin{itemize}
         \item $R_t = R_{t-1} \cup I_{t-1}$, that is, the nodes that were
         infected at the previous step become recovered.
         \item Independently for each edge $e = \{ u,v\}$ such that $u \in
         I_{t-1}$ and $v\in S_{t-1}$, with probability $p(e)$ the event that
         ``$u$ transmits the infection (i.e. a copy of the source message) to $v$ at time $t$'' takes place. The
         set $I_t$ is the set of all vertices $v\in S_{t-1}$ such that for at
         least one neighbor $u \in I_{t-1}$ the event that $u$ transmits the
         infection to $v$ takes place as described above.
         \item $S_t = S_{t-1} - I_t$
     \end{itemize}
 \end{itemize}
The process stabilizes when $I_t = \emptyset$.\\ The Reed-Frost SIR protocol (for
short, \emph{RF Protocol}) is the special case of the $\mathrm{IC}$ protocol in which all transmission probabilities
are the same.
'''
context = '''
[Appendix A.1, p. 17:] Given a symmetric graph $G = (V,E)$, we define $|V| = n$ and, for
any node $v \in V$, we denote $N(v)$ as its neighborhood in $G$ and $d(v) =
|N(v)| $ as  its degree.  The distance $d_{G}(S,v)$ from the set $S$ to the
node $v$ is the length of the shortest path among all paths from any node in
$S$ to $v$ in $G$, if no such path exists $d_{G}(S,v) = + \infty$, if $v \in
S$, $d_{G}(S,v) = 0$. [...]
Given a  graph $G = (V, E)$, for any subset $S \subseteq V$ and node $v \in V$,
and for any integer $i \leq n-1$, we  let $N^{(i)}_{G}(S)$ be the subset of
nodes that are at distance $i$ from $S$, i.e. $N^{(i)}_{G}(S) = \{v \in V \mid
d_{G}(S,v) = i\}$. Moreover, the set of nodes that are  within finite distance
from $S$, i.e. that are reachable from $S$, will be denoted as $N^*_{G}(S)$.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Definition A.1 is on p. 17, Definition A.2 on p. 18. Labels 'Definition A.1 (...)' and 'Definition A.2 (...)' added to separate the two. Macros replaced: \\IC -> $\\mathrm{IC}$, \\SIR -> SIR. The footnote after 'initially infectious' is omitted: 'we use here the term infectious for two reasons: to emphasize that the node is both informed and active and, moreover, to be consistent with the literature in mathematical epidemiology.' Definition A.1 writes N^{t}_{G_p} where the notation paragraph writes N^{(i)}_G, as printed."

