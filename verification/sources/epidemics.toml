[[source]]
items = ["epidemics:def:choices", "epidemics:def:cobra"]
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Section 1, COBRA and BIPS"
page = 2
url = "https://arxiv.org/abs/1602.05768v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person"
statement = '''
\textbf{Coalescing Branching Random Walk (COBRA):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Let $C \subseteq V$ and consider the set process $(C_t)_{t \geq 0}$ with $C_0 = C$
and $C_{t+1}$ is defined as follows. Let $C_t$ be the vertices chosen at round $t$ (not necessarily for the first time).
Each vertex $v \in C_t$ independently chooses $k$ neighbours uniformly at random with replacement and all the chosen vertices belong to $C_{t+1}$.

\textbf{Biased Infection with Persistent Source (BIPS):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Consider a vertex $v$ which is the source of an infection. We consider the process $A_t$ defined by $A_0 = \{v\}$. Given $A_t$ each vertex $u \in V$, other than $v$,  independently and uniformly with replacement selects $k$ neighbours and becomes a member of $A_{t+1}$ if and only if at least one of the selected neighbours is in $A_t$. Additionally, $v \in A_t$ for all $t \geq 0$.
We call $A_t$ the infected set at time $t$. Observe the source $v$ is always infected.
Finally, if $A_0 = \{v\}$ then it is clear that $v$ is the source of the infection process.
'''
context = '''
[Section 1, p. 2:] At the start of a round each vertex containing information ``pushes'' this information to
$k$ randomly selected neighbours, then it stops passing the information until it receives the information again.
At the end of a round if a vertex receives information from two or more vertices,
then the information coalesces into one.
'''
notes = "The COBRA definition is on p. 2, the BIPS definition on p. 3. No paper macros in the statement. The duality (Theorem 4) runs BIPS from other initial sets A_0 with the same source v; the library's BIPS starts from any A_0 and keeps v infected, and its rounds give every vertex k samples."

