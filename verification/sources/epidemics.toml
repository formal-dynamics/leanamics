# Krivelevich, Sudakov, arXiv:1201.6529v4.

[[source]]
item = "epidemics:lem:ks1"
paper = "M. Krivelevich, B. Sudakov. The phase transition in random graphs: a simple proof"
venue = "Random Structures & Algorithms 43 (2013)"
version = "arXiv:1201.6529v4"
result = "Lemma 1 (2)"
page = 3
url = "https://arxiv.org/abs/1201.6529v4"
status = "AI agent: from v4 LaTeX, compared with v4 PDF; not checked by a person"
statement = '''
Let $\epsilon>0$ be a small enough constant. Consider the sequence
$\bar{X}=(X_i)_{i=1}^N$ of i.i.d. Bernoulli random variables with
parameter $p$.
\begin{enumerate}
\item Let $p=\frac{1-\epsilon}{n}$.  Let $k=\frac{7}{\epsilon^2}\ln
n$. Then \textbf{whp} there is no interval of length $kn$ in $[N]$, in which
at least $k$ of the random variables $X_i$ take value 1.
\item Let $p=\frac{1+\epsilon}{n}$. Let $N_0=\frac{\epsilon
n^2}{2}$. Then \textbf{whp} $\left|\sum_{i=1}^{N_0} X_i
-\frac{\epsilon(1+\epsilon)n}{2}\right|\le n^{2/3}$.
\end{enumerate}
'''
context = '''
[Section 1, p. 1, footnote:] We say that an event  $\mathcal{E}_n$ occurs with high
probability, or \textbf{whp} for brevity, in the probability space $G(n,p)$
if $\lim_{n\rightarrow\infty}Pr[G\sim G(n,p)\in \mathcal{E}_n]=1$.
[Section 1, p. 2:] Our notation is fairly standard. We set $N=\binom{n}{2}$. Floor and
ceiling signs will be systematically omitted for the sake of clarity
of presentation.
'''
notes = "Full statement of Lemma 1; the item formalizes item 2 with Chernoff bounds instead of Chebyshev's inequality, as suggested in the paper's Discussion, item 1 ('using a Chernoff-type bound for the tales of the binomial random variable instead of the Chebyshev inequality would allow to claim in the second part of Lemma 1 that the sum ... is close to epsilon(1+epsilon)n/2 with probability exponentially close to 1'). Macro \\whp ({\\bf whp}) replaced by \\textbf{whp}, {\\cal E} by \\mathcal{E}."

[[source]]
item = "epidemics:def:dfs"
paper = "M. Krivelevich, B. Sudakov. The phase transition in random graphs: a simple proof"
venue = "Random Structures & Algorithms 43 (2013)"
version = "arXiv:1201.6529v4"
result = "Section 2, the DFS"
page = 2
url = "https://arxiv.org/abs/1201.6529v4"
status = "AI agent: from v4 LaTeX, compared with v4 PDF; not checked by a person"
statement = '''
Recall that the DFS (Depth First Search) is a graph search algorithm
that visits all vertices of a (directed or undirected) graph
$G=(V,E)$ as follows. It maintains three sets of vertices, letting
$S$ be the set of vertices whose exploration is complete, $T$ be the
set of unvisited vertices, and $U=V\setminus(S\cup T)$, where the
vertices of $U$ are kept in a stack (the last in, first out data
structure). It is also assumed that some order $\sigma$ on the
vertices of $G$ is fixed, and the algorithm prioritizes vertices
according to $\sigma$. The algorithm starts with $S=U=\emptyset$ and
$T=V$, and runs till $U\cup T=\emptyset$. At each round of the
algorithm, if the set $U$ is non-empty, the algorithm queries $T$
for neighbors of the last vertex $v$ that has been added to $U$,
scanning $T$ according to $\sigma$. If $v$ has a neighbor $u$  in
$T$, the algorithm deletes $u$ from $T$ and inserts it into $U$. If
$v$ does not have a neighbor in $T$, then $v$ is popped out of $U$
and is moved to $S$. If $U$ is empty, the algorithm chooses the
first vertex of $T$ according to $\sigma$, deletes it from $T$ and
pushes it into $U$. In order to complete the exploration of the
graph, whenever the sets $U$ and $T$ have both become empty (at this
stage the connected component structure of $G$ has already been
revealed), we make the algorithm query all remaining pairs of
vertices in $S=V$, not queried before.

Observe that the DFS algorithm starts revealing a connected
component $C$ of $G$ at the moment the first vertex of $C$ gets into
(empty beforehand) $U$ and completes discovering all of $C$ when $U$
becomes empty again. We call a period of time between two
consecutive emptyings of $U$ an {\em epoch}, each epoch corresponds
to one connected component of $G$.
'''
context = '''
[Section 2, p. 3:] We will run the DFS on a random input $G\sim G(n,p)$, fixing the
order $\sigma$ on $V(G)=[n]$ to be the identity permutation. When
the DFS algorithm is fed with a sequence of i.i.d. Bernoulli($p$)
random variables $\bar{X}=(X_i)_{i=1}^N$, so that is gets its $i$-th
query answered positively if $X_i=1$ and answered negatively
otherwise, the so obtained graph is clearly distributed according to
$G(n,p)$.
[Section 1, p. 2:] We set $N=\binom{n}{2}$.
'''
notes = "Definition in the text, pp. 2 to 3 (two paragraphs). 'so that is gets' (context) is as printed. No paper macros in the statement."

[[source]]
item = "epidemics:lem:dfs"
paper = "M. Krivelevich, B. Sudakov. The phase transition in random graphs: a simple proof"
venue = "Random Structures & Algorithms 43 (2013)"
version = "arXiv:1201.6529v4"
result = "Section 2, properties of the DFS"
page = 3
url = "https://arxiv.org/abs/1201.6529v4"
status = "AI agent: from v4 LaTeX, compared with v4 PDF; not checked by a person"
statement = '''
The following properties of the DFS algorithm will be relevant to
us:
\begin{itemize}
\item at each round of the algorithm one vertex moves, either from
$T$ to $U$, or from $U$ to $S$;
\item at any stage of the algorithm, it has been revealed already
that the graph $G$ has no edges between the current set $S$ and the
current set $T$;
\item the set $U$ always spans a path (indeed, when a vertex $u$ is
added to $U$, it happens because $u$ is a neighbor of the last
vertex $v$ in $U$; thus, $u$ augments the path spanned by $U$, of
which $v$ is the last vertex).
\end{itemize}
[...] In particular, observe crucially that as long as $T\ne\emptyset$,
every positive answer to a query results in a vertex being moved
from $T$ to $U$, and thus after $t$ queries and assuming
$T\ne\emptyset$ still, we have $|S\cup U|\ge \sum_{i=1}^t X_i$. (The
last inequality is strict in fact as the first vertex of each
connected component is moved from $T$ to $U$ ``for free", i.e.,
without need to get a positive answer to a query.) On the other
hand, since the addition of every vertex, but the first one in a
connected component, to $U$ is caused by a positive answer to a
query, we have at time $t$: $|U|\le 1+\sum_{i=1}^t X_i$.
'''
context = '''
