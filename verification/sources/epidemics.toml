item = "epidemics:def:rumor-process"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Definitions 6, 7 and 8"
page = 16
url = "https://arxiv.org/abs/2303.11150v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person"
statement = '''
Definition 6 (Homogeneous rumor spreading process).
  We always assume that we have $n$ nodes. Each node can be either \emph{informed} or \emph{uninformed}. We assume that the process starts with exactly one node being informed. Uninformed nodes may become informed, but an informed node never can become uninformed. We consider a discrete time process, so the process can be partitioned into \emph{rounds}. In each round each uninformed node can become informed. Whenever a round starts with $k$ nodes being informed, then the probability for each uninformed node to become informed is some number $p_k$, which only depends on the number $k$ of the informed nodes at the beginning of the round.

Definition 7 (Covariance numbers).
For a given homogeneous rumor spreading process and $k \in [1..n-1]$ let $c_k$ be the smallest number such that whenever a round starts with $k$ informed nodes and for any two uninformed nodes $x_1, x_2$, the indicator random variables $X_1, X_2$ for the events that these nodes become informed in this round satisfy \[\operatorname{Cov}[X_1,X_2] \le c_k.\]

Definition 8 (Rumor spreading times).
  Consider a homogeneous rumor spreading process. For all $t = 0, 1, \dots$ denote by $I_t$ the number of informed nodes at the end of the $t$-th round ($I_0 := 1$). Let $k \le m \le n$. By $T(k,m)$ we denote the time it takes to increase the number of informed nodes from $k$ to $m$ or more, that is,
    \[
        T(k,m) = \min\{ t-s | I_s = k \operatorname{ and } I_t \ge m \}.
    \]
    We call $T(1,n)$ the rumor spreading time of the process.
'''
context = '''
[Appendix B.1, p. 16:] The above definition is relatively abstract and, in principle, could be simply phrased as a Markov process on the number $k \in [1..n]$ of informed nodes. [...] the definition covers all processes regarded in the literature as long as they are memoryless (the events in the current round depend only on which nodes are informed) and symmetric (only the numbers of informed and uninformed nodes is relevant, but not which nodes these are).
The main insight of this work is that we can mostly ignore the particular structure of a rumor spreading process and only work with the \emph{success probabilities} $p_k$ and the \emph{covariance numbers} $c_k$ defines as follows.
'''
notes = "Three definitions in one entry; labels added, titles are the paper's. Definitions 6 and 7 are on p. 16, Definition 8 on p. 17. Macros replaced: \\Cov -> \\operatorname{Cov}. Section 3 (p. 8) has the same text as Definitions 1 and 2. 'defines as follows' (context) is as printed."

