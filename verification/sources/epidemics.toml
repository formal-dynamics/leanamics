item = "epidemics:def:swg"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Definitions 1.1 and 1.2"
page = 3
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
Definition 1.1 ($1$-Dimensional Small-World Graphs - $\mathcal{SWG}(n,q)$).
For every  $n \geq 3$ and $0 \leq q \leq 1$, the distribution $\mathcal{SWG}(n,q)$ is sampled
by generating a one-dimensional small-world graph $G=(V,E)$, where $|V|=n$, $E
= E_1 \cup E_2$, $(V,E_1)$ is a cycle, and $E_2$ is the set of random edges, called \emph{bridges}, of
an Erd\H{o}s-R\'enyi random graph ${\mathcal G}_{n,q}$.

Definition 1.2 ($3$-regular $1$-Dimensional  Small-World Graphs - 3-$\mathcal{SWG}(n)$).
For every  even $n \geq 4$, the distribution  3-$\mathcal{SWG}(n)$ is sampled by generating
a one-dimensional small-world graph  $G=(V, E)$, where $|V|=n$, $E = E_1 \cup
E_2$, $(V,E_1)$ is a cycle, and $E_2$ is the set of edges, called \emph{bridges},  of a uniformly chosen
perfect matching on $V$.
'''
context = '''
[Section 1, p. 3:] the distribution of \emph{one-dimensional small-world graphs} with parameter $q$ on $n$ vertices is just the union of a cycle with $n$ vertices with an Erd\H{o}s-R\'enyi random graph $\mathcal{G}_{n,q}$, in which edges are sampled independently and each pair of nodes has probability $q$ of being an edge.
[Section 1, p. 4:] In the definition of 3-$\mathcal{SWG}(n)$, we allow edges of the perfect matching to belong
to $E_1$. If this happens, only edges in $E_2-E_1$ are called bridges. The
graphs sampled from 3-$\mathcal{SWG}(n)$ have maximum degree 3, and every node has degree 3
or $2$.
[Theorem 2.1, p. 4, claim 2:] If  $p<\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon$,  w.h.p.  all the connected components of  $G_p$ have size $\mathcal{O}_{\varepsilon}(\log n)$.
[Section 2.1, p. 4:] We highlight  the sharp result
  on the $\mathcal{SWG}(n,c/n)$ model for the case $c = 1$:
similarly to the regular 3-$\mathcal{SWG}(n)$ model, each node here has one bridge
edge in average, and the obtained critical value for the percolation probability
$p$ turns out to be $\sqrt{2}-1$.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Labels 'Definition 1.1' and 'Definition 1.2' added; the titles are the paper's. Macros replaced: \\SWG -> $\\mathcal{SWG}(n,q)$, \\SWGm -> \\mathcal{SWG}, \\SWGreg -> 3-$\\mathcal{SWG}(n)$, \\Erdos -> Erd\\H{o}s-R\\'enyi, \\bigO -> \\mathcal{O}. Definition 1.1 is on p. 3, Definition 1.2 on p. 3 to 4. The paper defines no name for the threshold (sqrt(c^2+6c+1)-c-1)/(2c); it appears in Theorems 2.1 and 2.4 (excerpt in context). The library's p* and its characterization as the root of c p (1 + p) = 1 - p are the formalization's."

[[source]]
item = "epidemics:cor:swg3-sub"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Theorem 2.2 (claim 2)"
page = 4
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
Let $V$ be a set of $n$ vertices  and $p>0$ be a bond percolation  probability. Sample a graph $G=(V, E_1 \cup E_2)$ from the 3-$\mathcal{SWG}(n)$ distribution,  and consider the percolation graph $G_p$. For any constant $\varepsilon>0$:
\begin{enumerate}
\item If $p>1/2+\varepsilon$, w.h.p.  a subset of nodes of size $\Omega_\varepsilon(n)$ exists   that induces  a  connected  subgraph (i.e. a \emph{giant} connected component)  of $G_p$;
\item If $p<1/2-\varepsilon$, w.h.p. all the connected components of  $G_p$ have size $\mathcal{O}_{\varepsilon}(\log n)$.
\end{enumerate}
'''
context = '''
[Definition 1.2, p. 3:] For every  even $n \geq 4$, the distribution  3-$\mathcal{SWG}(n)$ is sampled by generating
a one-dimensional small-world graph  $G=(V, E)$, where $|V|=n$, $E = E_1 \cup
E_2$, $(V,E_1)$ is a cycle, and $E_2$ is the set of edges, called \emph{bridges},  of a uniformly chosen
perfect matching on $V$.
[Section 2.1, p. 4, footnote:] As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
[Section 2.1, p. 5:] Also in the above theorem, the probabilities are taken over the randomness of $G$ and  over the randomness of the percolation process process. The second claim is a special case of the following more general result of ours. [Theorem 2.3]
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Theorem title: 'Percolation on the 3-SWG(n) model'. The formalized part is claim 2 (item 2). Macros replaced: \\SWGreg -> 3-$\\mathcal{SWG}(n)$, \\bigO -> \\mathcal{O}, \\Prc -> \\mathbf{Pr}. 'percolation process process' is as printed. Theorem 2.3 is quoted in the epidemics:thm:subcritical entry of verification/sources.toml."

[[source]]
item = "epidemics:cor:swg-rf"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Theorems 2.4 and 2.5 (claim 2)"
page = 5
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
Theorem 2.4 (The RF process  on the $\mathcal{SWG}(n,q)$ model).
Let $V$ be a set of $n$ vertices, $I_0 \subseteq V$ be a set of source nodes, and $p>0$ a constant probability. For any constant
$c>0$,  sample a graph $G=(V, E_1 \cup E_2)$ from the $\mathcal{SWG}(n,c/n)$ distribution, and run the RF process with transmission probability $p$ over $G$ from $I_0$. For every $\varepsilon>0$, we have the following:
\begin{enumerate}
\item  If $p > \frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} + \varepsilon$, with
probability $\Omega_\varepsilon(1)$ a subset of  $\Omega_\varepsilon(n)$ nodes  will be infectious within time $\mathcal{O}_\varepsilon(\log n)$, even if $|I_0| = 1$. Moreover, if
$|I_0|\geq\beta_\varepsilon\log n$ for a sufficiently large constant
$\beta_\varepsilon$ (that depends only on $\varepsilon$),
then the above event occurs  \emph{w.h.p.};
\item If $p<\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon$,  w.h.p. the process will stop within $\mathcal{O}_\varepsilon(\log n)$ time steps, and the number of recovered nodes at the end of the process will be
$\mathcal{O}_\varepsilon(|I_0|\log n)$.
\end{enumerate}

Theorem 2.5 (The RF process on the   3-$\mathcal{SWG}(n)$ model).
Let $V$ be a set of $n$ vertices, $I_0 \subseteq V$ be a set of source nodes, and $p>0$ be a bond percolation  probability. Sample a graph $G=(V, E_1 \cup E_2)$ from the 3-$\mathcal{SWG}(n)$ distribution,  and run the RF protocol with transmission-probability $p$ over $G$ from $I_0$. For every $\varepsilon>0$, we have the following:
\begin{enumerate}
\item If $p>1/2+\varepsilon$, with probability $\Omega_{\varepsilon}(1)$, a subset of  $\Omega_\varepsilon(n)$ nodes  will be infectious within time $\mathcal{O}_\varepsilon( n)$, even if $|I_0| = 1$. Moreover, if
$|I_0|\geq\beta_\varepsilon\log n$ for a sufficiently large constant
$\beta_\varepsilon$ (that depends on $\varepsilon$ but not on $n$),
then the above event occurs  \emph{w.h.p.};
\item If $p<\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon$, then, w.h.p.,
  the process will stop within $O_\varepsilon(\log n)$ time steps, and the number of recovered nodes at the end of the process will be  $O_\varepsilon(|I_0|\log n)$.
\end{enumerate}
'''
context = '''
[Section 1, p. 2:] In a network SIR model, we represent people as nodes of a graph, and contacts between people as edges, and we have a probability $p$ that each contact between an infectious person and a susceptible one transmits the infection. The Reed-Frost process, which is the simplest SIR network model,   proceeds through synchronous time steps, the infectious state lasts for only one time step, and the graph does not change with time.
[Definition A.2, p. 18:] [...] The Reed-Frost SIR protocol (for
short, \emph{RF Protocol}) is the special case of the $\mathrm{IC}$ protocol in which all transmission probabilities
are the same.
[Definition 1.1, p. 3:] For every  $n \geq 3$ and $0 \leq q \leq 1$, the distribution $\mathcal{SWG}(n,q)$ is sampled
by generating a one-dimensional small-world graph $G=(V,E)$, where $|V|=n$, $E
= E_1 \cup E_2$, $(V,E_1)$ is a cycle, and $E_2$ is the set of random edges, called \emph{bridges}, of
an Erd\H{o}s-R\'enyi random graph ${\mathcal G}_{n,q}$.
[Definition 1.2, p. 3:] For every  even $n \geq 4$, the distribution  3-$\mathcal{SWG}(n)$ is sampled by generating
a one-dimensional small-world graph  $G=(V, E)$, where $|V|=n$, $E = E_1 \cup
E_2$, $(V,E_1)$ is a cycle, and $E_2$ is the set of edges, called \emph{bridges},  of a uniformly chosen
perfect matching on $V$.
[Section 2.1, p. 4, footnote:] As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
[Section 2.2, p. 6:] On the other hand, the second claims of the above two theorems are   simple consequences of   the corresponding  claims  of Theorems 2.1 and 2.2.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Two theorems in one entry; the labels 'Theorem 2.4' and 'Theorem 2.5' are added, the titles are the paper's. The formalized parts are the two claims 2. Claim 2 of Theorem 2.5 is printed with the SWG(n,c/n) threshold (sqrt(c^2+6c+1)-c-1)/(2c), while claim 2 of Theorem 2.2, of which it is said to be a consequence, has 1/2; the library uses 1/2 - epsilon (see FORMALIZATION_DIFFERENCES.md). Both theorems are on p. 5. Macros replaced: \\SWGm -> \\mathcal{SWG}, \\SWG -> $\\mathcal{SWG}(n,q)$, \\SWGreg -> 3-$\\mathcal{SWG}(n)$, \\bigO -> \\mathcal{O}, \\Prc -> \\mathbf{Pr}; Theorem 2.5 writes O_epsilon (plain O) in claim 2, as printed."

