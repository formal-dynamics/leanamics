'''
notes = "Definitions in the text, not numbered. The paper adds: 'By replacing all (1-1/n) terms with (1-1/(n-1)), the elementary proofs below can easily be transformed to the setting where nodes only call random neighbors in the complete graph.' The library defines one round of calls for all nodes and the three update rules on it."

