# Karp, Schindelhauer, Shenker, Vöcking, FOCS 2000 (PULL and PUSH-PULL, library RumorSpread).

[[source]]
item = "epidemics:def:pull"
paper = "R. Karp, C. Schindelhauer, S. Shenker, B. Vöcking. Randomized rumor spreading"
venue = "FOCS 2000"
version = "FOCS 2000 (coauthor's PDF)"
result = "Sections 1.2 and 2"
page = 2
url = "https://archive.cone.informatik.uni-freiburg.de/pubs/rumor.pdf"
status = "AI agent: typed from the FOCS 2000 PDF; not checked by a person"
statement = '''
[Section 1.2, p. 2:] Let $V$ denote the set of players. The communication
graph $G_t = (V, E_t \subseteq V \times V)$ of round $t \geq 1$ is obtained
by a distributed, randomized process. In each round, each
player $u$ chooses a communication partner $v$ from $V$ at random and $u$ \emph{calls} $v$. Unless otherwise stated, we assume that
all players choose their communication partners independently and uniformly at random from $V$.
[...]
In round $t$, the rumor and other information can be exchanged in both directions along the edges of $G_t$. Whenever a connection is established between two players, each
one of them (if holding the rumor) has to decide whether
to transmit the rumor to the other player, typically without knowing whether this player has received the rumor already. Regarding the flow of information, we distinguish
between push and pull transmissions. Assume player $u$ calls
player $v$.
\begin{itemize}
\item The rumor is \emph{pushed} If $u$ tells $v$ the rumor.
\item The rumor is \emph{pulled} if $v$ tells $u$ the rumor.
\end{itemize}
[Section 2, p. 4:] Now consider a \emph{pull scheme} in which only called players send the rumor towards the calling players.
[...] In order to combine the predictability of the push scheme
with the quadratic-shrinking property of the pull scheme,
we simply send the rumor in both directions whenever possible. In detail, our \emph{push\&pull scheme} works as follows.
