item = "epidemics:lem:rumor-protocol-conditions"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Section 4, the basic protocols"
page = 10
url = "https://arxiv.org/abs/2303.11150v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person"
statement = '''
For the \emph{basic push, pull, and push-pull protocols}, we easily observe that all covariances to be regarded are negative or zero: Knowing that one uninformed node $x_1$ becomes informed in the current round has no influence on the pull call of another uninformed node $x_2$. When the protocol has push calls and $x_1$ was informed via a push call, then this event makes it slightly less likely that $x_2$ becomes informed via a push call, simply because at least one informed node is occupied with calling $x_1$.

The success probabilities $p_k$ are easy to compute right from the protocol definition. When $k$ nodes are informed, then the probabilities that an uninformed node becomes informed are
\begin{equation*}
p_k =
\begin{cases}
1 - (1-1/n)^k\, &\mbox{ for the push protocol,}\\
k/n\, &\mbox{ for the pull protocol,}\\
p_k = 1 - (1-1/n)^k \frac{n-k}n\, &\mbox{ for the push-pull protocol.}
\end{cases}
\end{equation*}
Using elementary estimates like $1 - k/n \le (1-1/n)^k \le 1 - k/n + k^2/2n^2$, we see that the push and pull protocols satisfy the exponential growth conditions with $\gamma_n = 1$, whereas the push-pull protocol does the same with $\gamma_n = 2$. The push protocol satisfies the exponential shrinking conditions with $\rho_n=1$. The pull and push-pull protocols satisfy the double exponential shrinking conditions with $\ell = 2$. All growth conditions are satisfied at least up to $k = n/2$ informed nodes and all shrinking conditions are satisfied at least for $u \le n/2$ uninformed nodes, so we do not need the intermediate lemmas.
'''
context = '''
[Section 4, p. 10:] Since it does not make a difference, to ease the notation we always assume that nodes call random nodes, that is, including themselves.
[Definition 7, p. 16:] For a given homogeneous rumor spreading process and $k \in [1..n-1]$ let $c_k$ be the smallest number such that whenever a round starts with $k$ informed nodes and for any two uninformed nodes $x_1, x_2$, the indicator random variables $X_1, X_2$ for the events that these nodes become informed in this round satisfy \[\operatorname{Cov}[X_1,X_2] \le c_k.\]
[Definition 9, p. 19:] [...] (i) $p_k \ge \gamma_n \tfrac{k}{n} \cdot \left(1- a\tfrac{k}{n} - \tfrac{b}{\ln n}\right)$. (ii) $c_k \le c\tfrac{k}{n^2}$.
[Definition 11, p. 27:] [...] for all $u = n-k \le gn$. (i) $1-p_k = 1-p_{n-u} \le e^{-{\rho_n}} + a\frac{u}{n}$; (ii) $c_k = c_{n-u} \le \frac{c}{u}$.
[Definition 13, p. 34:] [...] for all $u \in [n^{1-\alpha}, gn]$. (i) $1-p_{n-u} \le a\left(\tfrac{u}{n}\right)^{\ell-1}$. (ii) $c_{n-u} \le c \tfrac{n}{u^2}$.
'''
notes = "Section 4 paragraphs (pp. 10 to 11); 'p_k =' inside the third case of the display is as printed. The proofs of Theorems 51 to 53 (Appendix C) give the parameters used there: push with gamma_n = 1, f = 1, b = c = 0, a = 1 (upper growth) and 1/e <= 1 - p_{n-u} <= 1/e + (2/e)(u/n) (shrinking from gn = n/2); pull with p_k = k/n, gamma_n = 1, f = 1, a = b = c = 0, and l = 2, g = 1, alpha = 0, a = 1, c = 0. The library's parameters are listed in the blueprint item and FORMALIZATION_DIFFERENCES.md."

