[[source]]
item = "epidemics:lem:rumor-lower-round"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Lemmas 39 and 49"
page = 32
url = "https://arxiv.org/abs/2303.11150v1"
status = "AI agent: from v1 LaTeX, compared with v1 PDF; not checked by a person"
statement = '''
Lemma 39. For any $u > gn$ and $u \in \mathbb{N}$,
	\begin{equation}
		\mathbb{P}[Y(u) \le E_0(u)] \le q(u) := \tfrac{e^{-{\rho_n}}+c}{A^2} \cdot \tfrac1{u^{1-2B}} \notag.
	\end{equation}

Lemma 49. For any fraction of uninformed nodes $\varepsilon \in [n^{-\alpha}, g]$,
    \begin{equation}
        \mathbb{P}\left[y(\varepsilon) \le \tfrac12E(\varepsilon)\right] \le \tfrac{4+4c}{a^2 \varepsilon^2 n} \le q := \tfrac{4+4c}{a^2}n^{2\alpha\ell-1} \notag.
    \end{equation}
'''
context = '''
[Definition 12 (lower exponential shrinking conditions), p. 31:] Let $\rho_n$ be bounded between two positive constants.
	Let $0 < g < 1$ and $a, c \in \mathbb{R}_{\ge0}$.
	We say that a homogeneous epidemic protocol satisfies \emph{the lower exponential shrinking conditions} if for any $n \in \mathbb{N}$ big enough, the following properties are satisfied, for all $u \le gn$ (resp. $k \in [n-\lfloor gn \rfloor, n]$).
	(i) $1 - p_k = 1-p_{n-u} \ge e^{-{\rho_n}} - a\frac{u}{n}$;
	(ii) $c_k = c_{n-u} \le \frac{c}{u}$.
[Appendix B.3.4, p. 32:] Let $Y(u)$ be the number of uninformed nodes at the end of the round with $u$ uninformed ones.
From the exponential shrinking conditions it follows that
\begin{equation}
	\mathbb{E}[Y(u)] \ge E(u) := u \left(e^{-{\rho_n}} - a\tfrac{u}{n}\right) \notag.
\end{equation}
We define the \emph{target value} in the same way as for the upper bound.
\begin{equation}
	E_0(u) := E(u) - Au^{1-B},
\end{equation}
where $A>0$ and $B \in ]0,1/2[$ are some constants chosen uniformly for all values of $u$ and $n$.
[Definition 14 (lower double exponential shrinking conditions), p. 37:] Let $g, \alpha \in ]0,1]$ and $\ell > 1$.
	Let $a, c \in \mathbb{R}_{\ge0}$.
	We say that a homogeneous epidemic protocol satisfies \emph{the lower double exponential shrinking conditions} if for any $n$ big enough, the following properties are satisfied for all $u \in [n^{1-\alpha},gn]$.
	(i) $1-p_{n-u} \ge a\left(\tfrac{u}{n}\right)^{\ell-1}$.
	(ii) $c_{n-u} \le c\tfrac{n}{u^2}$.
[Appendix B.5.2, p. 37:] Let again $y(\varepsilon)$ denote the fraction of uninformed nodes at the end of a round started with $\varepsilon n$ uninformed ones.
The double exponential shrinking conditions state that
\begin{equation}
    \mathbb{E}[y(\varepsilon)] \ge E(\varepsilon) := a\varepsilon^\ell \notag.
\end{equation}
The next lemma gives that with good probability, $y(\varepsilon)$ is at least the \emph{target} value $E(\varepsilon)/2$.
[Appendix B.5.2, p. 37, after Lemma 49:] We also assume that $\alpha< \tfrac1{2\ell}$ so that $q=n^{-\Theta(1)}$.
'''
notes = "Two lemmas in one entry; labels added. Lemma 39 is on p. 32 (exponential shrinking, lower bound), Lemma 49 on p. 37 (double exponential shrinking, lower bound). Lemma 39 reads 'For any u > gn', as printed. The equation number of E_0(u) (label eq:def-E0-lower-expshr) is not shown here. Macros replaced: \\Pr -> \\mathbb{P}, \\Expect -> \\mathbb{E}, \\N -> \\mathbb{N}, \\R -> \\mathbb{R}, \\eps -> \\varepsilon. The doc comments cite 'Lemma 39 for push' and 'Lemma 49 for pull / push-pull'; the library's one-round bounds are explicit versions for the instances."

