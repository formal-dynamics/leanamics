'''
notes = "Two definitions in one entry; labels added, titles are the paper's. Definition 9 is on p. 19, Definition 11 on p. 27. Macros replaced: \\Pk -> p_k, \\Ck -> c_k, \\N -> \\mathbb{N}, \\R -> \\mathbb{R}, \\Cov -> \\operatorname{Cov}; the enumerate labels (i), (ii) are written explicitly. 'Homogeneous epidemic protocol' is the paper's term here for a homogeneous rumor spreading process (Definition 6). The Section 3 versions (Definitions 3 and 4, pp. 8 to 9) state upper and lower conditions together."

