# Kurtz's law of large numbers: Wormald 1999, Theorem 5.1; Kurtz 1970; Hoeffding 1963.

[[source]]
item = "epidemics:thm:kurtz"
paper = "N. C. Wormald. The differential equation method for random graph processes and greedy algorithms"
venue = "Lectures on Approximation and Randomized Algorithms (M. Karoński, H. J. Prömel, eds.), PWN, Warsaw, 1999, pp. 73-155"
version = "lecture notes, author's PDF"
result = "Theorem 5.1"
page = 35
url = "https://users.monash.edu.au/~nwormald/papers/de.pdf"
status = "AI agent: typed from the notes' PDF; not checked by a person"
statement = '''
For $1 \le l \le a$, where $a$ is fixed, let $y_l : S^{(n)+} \to \mathbb{R}$ and $f_l : \mathbb{R}^{a+1} \to \mathbb{R}$, such
that for some constant $C_0$ and all $l$, $|y_l(h_t)| < C_0 n$ for all $h_t \in S^{(n)+}$ for all $n$. Let $Y_l(t)$
denote the random counterpart of $y_l(h_t)$. Assume the following three conditions hold, where
in (ii) and (iii) $D$ is some bounded connected open set containing the closure of
\[
\{(0, z_1, \ldots, z_a) : \mathbf{P}(Y_l(0) = z_l n, 1 \le l \le a) \neq 0 \text{ for some } n\} .
\]
\begin{itemize}
\item[(i)] (Boundedness hypothesis.) For some functions $\beta = \beta(n) \ge 1$ and $\gamma = \gamma(n)$, the probability that
\[ \max_{1 \le l \le a} |Y_l(t + 1) - Y_l(t)| \le \beta, \]
conditional upon $H_t$, is at least $1 - \gamma$ for $t < T_D$.
\item[(ii)] (Trend hypothesis.) For some function $\lambda_1 = \lambda_1(n) = o(1)$, for all $l \le a$
\[ | \mathbf{E}(Y_l(t + 1) - Y_l(t) \mid H_t) - f_l(t/n, Y_1(t)/n, \ldots, Y_a(t)/n) | \le \lambda_1 \]
for $t < T_D$.
\item[(iii)] (Lipschitz hypothesis.) Each function $f_l$ is continuous, and satisfies a Lipschitz condition, on
\[ D \cap \{(t, z_1, \ldots, z_a) : t \ge 0\}, \]
with the same Lipschitz constant for each $l$.
\end{itemize}
Then the following are true.
\begin{itemize}
\item[(a)] For $(0, \hat z_1, \ldots, \hat z_a) \in D$ the system of differential equations
\[ \frac{dz_l}{dx} = f_l(x, z_1, \ldots, z_a), \qquad l = 1, \ldots, a \]
has a unique solution in $D$ for $z_l : \mathbb{R} \to \mathbb{R}$ passing through
\[ z_l(0) = \hat z_l, \]
$1 \le l \le a$, and which extends to points arbitrarily close to the boundary of $D$;
\item[(b)] Let $\lambda > \lambda_1 + C_0 n\gamma$ with $\lambda = o(1)$. For a sufficiently large constant $C$, with probability
$1 - O(n\gamma + \frac{\beta}{\lambda} \exp(-\frac{n\lambda^3}{\beta^3}))$,
\begin{equation}
Y_l(t) = nz_l(t/n) + O(\lambda n) \tag{5.1}
\end{equation}
uniformly for $0 \le t \le \sigma n$ and for each $l$, where $z_l(x)$ is the solution in (a) with $\hat z_l =
\frac{1}{n} Y_l(0)$, and $\sigma = \sigma(n)$ is the supremum of those $x$ to which the solution can be extended
before reaching within $\ell^\infty$-distance $C\lambda$ of the boundary of $D$.
\end{itemize}
'''
context = '''
[Section 5.1, p. 34:] The random processes are any discrete
time random processes. Such a process is a probability space which can be conveniently
denoted by $(Q_0, Q_1, \ldots)$ where each $Q_i$ takes values in some set $S$. The elements of the space
are sequences $(q_0, q_1, \ldots)$ where each $q_i \in S$. We use $h_t$ to denote $(q_0, q_1, \ldots, q_t)$, the history
of the process up to time $t$.
Consider a sequence of random processes indexed by $n$, $n = 1, 2, \ldots$. Thus $q_t = q_t^{(n)}$
and $S = S^{(n)}$, but for simplicity the dependence on $n$ is usually dropped from the notation.
Asymptotics, denoted by the notations $o$ and $O$, are for $n \to \infty$ but uniform over all other
variables. $S^{(n)+}$ denotes the set of all $h_t = (q_0, \ldots, q_t)$ where each $q_i \in S^{(n)}$, $t = 0, 1, \ldots$.
We say that a function $f(u_1, \ldots, u_j)$ satisfies a Lipschitz condition on $D \subseteq \mathbb{R}^j$ if a constant
$L > 0$ exists with the property that
\[ |f(u_1, \ldots, u_j) - f(v_1, \ldots, v_j)| \le L \max_{1 \le i \le j} |u_i - v_i| \]
for all $(u_1, \ldots, u_j)$ and $(v_1, \ldots, v_j)$ in $D$. We call $L$ a Lipschitz constant for $f$, and note that
$\max_{1 \le i \le j} |u_i - v_i|$ is the distance between $(u_1, \ldots, u_j)$ and $(v_1, \ldots, v_j)$ in the $\ell^\infty$ metric. [...]
For variables $Y_1, \ldots, Y_a$ defined on the components of the process, and $D \subseteq \mathbb{R}^{a+1}$, define
the stopping time $T_D(Y_1, \ldots, Y_a)$ to be the minimum $t$ such that $(t/n, Y_1(t)/n, \ldots, Y_a(t)/n) \notin D$. This is written as $T_D$ when $Y_1, \ldots, Y_a$ are understood from the context.
[Section 5.1, p. 35:] In the statement of the theorem, ``uniformly'' refers to the convergence implicit in the $o()$
terms.
[Section 1.3.2, p. 6:] We use the notation $\mathbf{P}$ (probability), $\mathbf{E}$ (expectation), $\mathrm{Var}$ (variance) and u.a.r. (uniformly at
random).
'''
notes = "No LaTeX source is available; typed from the page images of the PDF. Version: the lecture notes on the author's web page ('Notes on lectures given at the Summer School on Randomized Algorithms at Antonin, Poland in 1997', 72 pages), not compared with the 1999 book printing; page numbers are those of this PDF. Typeset from the PDF: the hypotheses (i) to (iii) and conclusions (a), (b) are rendered with \\item[...], \\mathbb{R} stands for the PDF's double-struck R, the equation number (5.1) is shown with \\tag. H_t, the random history up to time t, is used without a separate definition in this excerpt. The library states its own law of large numbers for the uniformized SIR chain (discrete time, an explicit exponential bound), whose statements were reviewed against this theorem (README); see FORMALIZATION_DIFFERENCES.md. The theorem is followed by a Note on a version with a number of variables depending on n."

