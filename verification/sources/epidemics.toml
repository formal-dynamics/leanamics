item = "epidemics:thm:subcritical"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Theorem E.1"
page = 41
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
Let $G = (V,E)$ be a graph of maximum degree $d$ and let $s$ be a vertex in
$V$.  If $p = (1-\varepsilon)/(d-1)$ for some $\varepsilon$ such that $1 > \varepsilon > 0$, then the
probability that the connected component of $s$ in the percolation graph $G_p$
of $G$ has size $> t$ is at most $\exp(-\Omega(\varepsilon^2 t))$. Furthermore,
w.h.p., all connected components of $G_p$ have size $\mathcal{O}(\varepsilon^{-2}
\log n)$.
'''
context = '''
[Section 2.1, p. 4, footnote:] As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
[Section 1, p. 2:] Given a graph $G=(V,E)$ and a bond percolation probability $p$, the bond percolation process is to subsample a random graph $G_p= (V,E_p)$ by independently choosing each edge of $G$ to be included in $E_p$ with probability $p$ and to be omitted with probability $1-p$. We will call $G_p$ the {\em percolation graph} of $G$.
[Appendix E, p. 41:] In this section, we analyze the percolation process in regular graphs and prove Theorem 2.3.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. Untitled theorem in the paper (Appendix E, 'Regular Graphs Below the Threshold'). Macros replaced: \\bigO -> \\mathcal{O}, \\Prc{.} -> \\mathbf{Pr} \\left( . \\right). The proof states the tail as exp(-epsilon^2 t/3) ('By Chernoff bounds this happens with probability exp(-epsilon^2 t/3)'). The paper's statement assumes p = (1-epsilon)/(d-1). The other numbered result of this item, Theorem 2.3, is in verification/sources.toml."

[[source]]
item = "epidemics:cor:subcritical"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Section 2.2, remark after Theorem 2.5"
page = 6
url = "https://arxiv.org/abs/2103.16398v3"
status = "AI agent: from v3 LaTeX, compared with v3 PDF; not checked by a person"
statement = '''
On the other hand, the second claims of the above two theorems are   simple consequences of   the corresponding  claims  of Theorems 2.1 and 2.2.
As for general bounded-degree graphs, from Theorem 2.3, we can recover an  upper bound on the critical value of $p$ for the RF process
equivalent to that of Claim 2 of  Theorem 2.3  (we omit here the formal statement).
'''
context = '''
[Theorem 2.3, p. 5:] Let $G=(V,E)$ be a graph of maximum degree $d$, $\varepsilon >0$ be an
arbitrary positive number, $p < (1-\varepsilon)/(d-1)$  be a bond percolation  probability, and $I_0$ be a subset of $V$.
  Consider the percolation graph $G_p$.  Then,
w.h.p.,  all the connected components of $G_p$ have size $\mathcal{O}_{\varepsilon}(\log n)$.
[Theorem 2.4, claim 2, p. 5:] If $p<\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon$,  w.h.p. the process will stop within $\mathcal{O}_\varepsilon(\log n)$ time steps, and the number of recovered nodes at the end of the process will be
$\mathcal{O}_\varepsilon(|I_0|\log n)$.
[Section 2.1, p. 4, footnote:] As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
[Section 2.2, p. 5:] As remarked in Section 1, bond percolation with percolation probability   $p$ is equivalent to the   Reed-Frost   process (for short, RF process) with transmission probability $p$.
'''
notes = "The paper redefines \\le, \\leq as \\leqslant and \\ge, \\geq as \\geqslant (printed slanted); they are kept as \\le, \\leq, \\ge, \\geq. The 'above two theorems' are Theorems 2.4 and 2.5 (the RF process on SWG(n,c/n) and on 3-SWG(n)). The \\ref's are rendered by their numbers. 'Claim 2 of Theorem 2.3' is as printed (Theorem 2.3 has a single claim). Macros: \\bigO -> \\mathcal{O}, \\Prc -> \\mathbf{Pr}. The paper gives no formal statement here; the library's Lean statement (and the Erdos-Renyi part, Theorem 2.3 applied to K_n) is the formalization's own. Theorem 2.3 itself is the verification/sources.toml entry of this item."

