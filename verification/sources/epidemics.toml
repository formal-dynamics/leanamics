[Section 1, p. 4:] For a connected graph $G=(V,E)$, denote $\mathrm{Hit}_C(v) = \min\{t: v \in C_t, C_0=C\}$ the hitting time of vertex $v$ for a COBRA process starting from $C$.
[Section 1, p. 2:] \textbf{Coalescing Branching Random Walk (COBRA):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Let $C \subseteq V$ and consider the set process $(C_t)_{t \geq 0}$ with $C_0 = C$
and $C_{t+1}$ is defined as follows. Let $C_t$ be the vertices chosen at round $t$ (not necessarily for the first time).
Each vertex $v \in C_t$ independently chooses $k$ neighbours uniformly at random with replacement and all the chosen vertices belong to $C_{t+1}$.
[Section 1, p. 3:] \textbf{Biased Infection with Persistent Source (BIPS):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Consider a vertex $v$ which is the source of an infection. We consider the process $A_t$ defined by $A_0 = \{v\}$. Given $A_t$ each vertex $u \in V$, other than $v$,  independently and uniformly with replacement selects $k$ neighbours and becomes a member of $A_{t+1}$ if and only if at least one of the selected neighbours is in $A_t$. Additionally, $v \in A_t$ for all $t \geq 0$.
[Section 2, p. 5:] To avoid confusion, we use the notation $\mathbf{P}( \cdot)$ for probabilities in the BIPS process, and
$\widehat{\mathbf{P}}(\cdot)$ in the COBRA process.
To simplify notation, we will write ``$A_0 = v$'' for the frequently appearing condition ``$A_0 = \{ v \}$.''
'''
notes = "Same statement as the epidemics:thm:duality entry of verification/sources.toml. thm:duality-kernels states it as a duality of the one-round kernels (COBRA stopped at v, BIPS with source v); thm:crr-coin states it for the processes with branching factor 1 + p/q, for which the paper has no separate duality statement (it says that the proof of Theorem 3 follows from the proof of Theorem 1). Macros replaced: \\Prob -> \\mathbf{P}, \\wh -> \\widehat, \\Hit -> \\mathrm{Hit}, \\COBRA/\\BIPS -> COBRA/BIPS."

