Definition 9 (upper exponential growth conditions).
    Let $\gamma_n$ be bounded between two positive constants.
    Let $a, b, c \ge 0$ and $0 < f < 1$ with $af<1$.
    We say that a homogeneous epidemic protocol satisfies the \emph{upper exponential growth conditions} in $[1,fn[$ if for any $n \in \mathbb{N}$ big enough the following properties are satisfied for any $k < fn$.
    \begin{enumerate}
        \item[(i)] $p_k \ge \gamma_n \tfrac{k}{n} \cdot \left(1- a\tfrac{k}{n} - \tfrac{b}{\ln n}\right)$.
        \item[(ii)] $c_k \le c\tfrac{k}{n^2}$.
    \end{enumerate}

Definition 11 (upper exponential shrinking conditions).
    Let $\rho_n$ be bounded between two positive constants.
	Let $0 < g < 1$ and $a, c \in \mathbb{R}_{\ge0}$ such that $e^{-{\rho_n}} + ag < 1$.
	We say that a homogeneous epidemic protocol satisfies \emph{the upper exponential shrinking conditions} if for any $n \in \mathbb{N}$ big enough, the following properties are satisfied, for all $u = n-k \le gn$.
	\begin{enumerate}
		\item[(i)]
			$1-p_k = 1-p_{n-u} \le e^{-{\rho_n}} + a\frac{u}{n}$;
		\item[(ii)]
			$c_k = c_{n-u} \le \frac{c}{u}$.
	\end{enumerate}
'''
context = '''
[Definition 6, p. 16:] Whenever a round starts with $k$ nodes being informed, then the probability for each uninformed node to become informed is some number $p_k$, which only depends on the number $k$ of the informed nodes at the beginning of the round.
