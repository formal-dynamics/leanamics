[[source]]
item = "epidemics:thm:crr-coin"
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Theorem 3"
page = 4
url = "https://arxiv.org/abs/1602.05768v2"
status = "AI agent: from v2 LaTeX, compared with v2 PDF; not checked by a person"
statement = '''
Let $G$ be a connected $n$-vertex $r$-regular graph with $\lambda<1$ constant and let $v \in V(G)$. Provided  $\rho > 0$ constant, for all $v \in V$, the cover time of $G$ by the COBRA process with branching factor $1+\rho$ and $C_0 = \{v\}$ is $\mathbf{cov}(v)=\mathcal{O}(\log(n))$ rounds in expectation and with high probability.
'''
context = '''
[Section 1, p. 4:] Suppose that at the start of each step, each particle divides in two with probability $\rho$.
This gives an expected branching factor of $1+\rho$. The following result shows that any constant $\rho>0$ will do. The proof of Theorem 3 follows from the
proof of Theorem 1, by using Corollary 1 of Lemma 1 in Section 3.
[Section 1, p. 2:] \textbf{Coalescing Branching Random Walk (COBRA):} Consider a graph $G = (V,E)$ and an integer $k \geq 1$. Let $C \subseteq V$ and consider the set process $(C_t)_{t \geq 0}$ with $C_0 = C$
and $C_{t+1}$ is defined as follows. Let $C_t$ be the vertices chosen at round $t$ (not necessarily for the first time).
Each vertex $v \in C_t$ independently chooses $k$ neighbours uniformly at random with replacement and all the chosen vertices belong to $C_{t+1}$.
For $C_0 = \{ u \}$, let $\mathbf{cov}(u) = \min\{ T: \bigcup_{t=1}^{T} C_t = V\}$
be the number of steps needed for the COBRA process
to visit all vertices of the graph $G$ starting from vertex $u$; and let $\mathrm{COV}(u) = \mathbf{E}(\mathbf{cov}(u))$.
[Section 1, p. 3:] Let
$\lambda=\lambda_{\max}=\max_{i=2,...,n} |\lambda_i|$ be the second largest eigenvalue (in absolute value).
[Section 1, p. 2, footnote:] ``With high probability,'' which means in this paper probability at most $n^{-c}$,
for some positive constant $c$.
'''
notes = "Macros replaced: \\r -> \\rho, \\cov -> \\mathbf{cov}, \\COV -> \\mathrm{COV}, \\COBRA -> COBRA, \\bigO -> \\mathcal{O}, \\E -> \\mathbf{E}, \\l -> \\lambda; the \\ref's are rendered by their numbers. 'let v in V(G)' and 'for all v in V' both appear, as printed. The w.h.p. footnote reads 'probability at most n^{-c}', as printed. The library states the bound for n >= N with lambda <= lambda_0 < 1 and rho in [rho_0, 1]."

