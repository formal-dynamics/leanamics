[[source]]
item = "crn:def:am-graph"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Section 2.1, eq. (1)"
page = 4
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
Angluin et al.~[2] proposed a population protocol for computing majority with high probability (whp) in the case where the interaction graph is a clique. Their protocol uses just 3 types $Q = \{b, g, r\}$. For convenience, we will sometimes refer to these types as the \emph{blank, green} and \emph{red} type respectively. The joint transition function $\delta$ is given by:
\begin{equation}
\delta(x, y) = \left\{
\begin{array}{ll}
	(x, x), & \quad \textrm{if $x=y$ or $y = b$} \\
	(x, b), & \quad \textrm{if $(x, y) \in \{(g, r), (r, g)\}$}.
\end{array}
\right. \tag{1}
\end{equation}
'''
context = '''
[Section 2, p. 4:] In this paper, we consider a special case of a fair scheduler, namely the \emph{probabilistic scheduler}, which is defined on directed graphs as follows. During each execution step, a directed edge $(v, u) \in E$ is chosen uniformly at random from $E$, where $v$ (i.e.~the tail of $(v, u)$) is called the \emph{initiator} and $u$ (i.e.~the head of $(v, u)$) is called the \emph{responder} of the interaction. Then, agents $v$ and $u$ update their types jointly according to $\delta$. In particular, if $v$ is of type $q_v$ and $u$ is of type $q_u$, the type of $v$ (respectively $u$) becomes $q_v'$ (respectively $q_u'$), where $(q_v', q_u') = \delta(q_v, q_u)$. The types of all other agents remain unchanged. The probabilistic scheduler is defined on undirected graphs similarly, by replacing every undirected edge $\{v, u\}$ by the two directed edges $(v, u)$ and $(u, v)$. That is, in an undirected graph $G$, the probabilistic scheduler selects first an undirected edge uniformly at random and then it selects equiprobably one of its endpoint as the initiator.
'''
notes = '''[2] is the paper's numbering of Angluin, Aspnes, Eisenstat, "A simple population protocol for fast robust approximate majority", Distributed Computing 21 (2008) (the crn:def:am entry quotes its table). The equation number (1) was added as \tag{1} as in the PDF. Eq. (1) as printed does not list the pairs with x = b and y not b; in the table of AAE08 these interactions change nothing, and so does the library's rule. The library's species X, Y, B correspond to r (or g), g (or r) and b; in its Theorem 4 statement the majority is Y, the paper's g (FORMALIZATION_DIFFERENCES.md, CRN-4).'''

