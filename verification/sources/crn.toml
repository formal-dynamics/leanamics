item = "crn:def:em-absolute"
paper = "L. Gąsieniec, D. Hamilton, R. Martin, P. G. Spirakis, G. Stachowiak. Deterministic population protocols for exact majority and plurality"
venue = "OPODIS 2016, LIPIcs 70, 14:1-14:14"
version = "LIPIcs.OPODIS.2016.14"
result = "Section 4, Algorithm Absolute-Majority"
page = 8
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction); no LaTeX source available; not yet checked by a person"
statement = '''
[Section 4, p. 8:] In the remaining part of the paper we work under the assumption that the population is coloured with an arbitrary number $C$ of colours, where $2^{k-1} < C \le 2^k$, for some integer $k \ge 1$ that is known to all entities. Each colour is denoted by a $k$-bit label $l[0..k-1]$, and single labels are attributed to entities with the relevant colours. As in previous sections, we interpret the individual bits $l[i]$ in this label as $-1$ or $1$, rather than more standard 0 or 1. [...]

\textbf{Memory organisation.} Each entity uses $O(k)$ bits of memory to accommodate:
\begin{enumerate}
\item The $k$-bit label $l[0..k-1]$ representing the original colour of the entity,
\item An array $s[0..k-1]$ representing $k$ independent instances of protocol $P_1$, and
\item An instance of protocol $P_2$ with the external force based on $k$ instances of $P_1$.
\end{enumerate}
For the purpose of our algorithm we define $k$ independent instances of static majority protocols $P_1(i)$, for $i = 0, \ldots, k-1$, such that colours competing in $P_1(i)$ refer to the bits $l[i]$ drawn from each entity in the population. [...]

[Section 4.1, p. 9:] \textbf{Algorithm Absolute-Majority}

\emph{Initialisation Stage}
\begin{enumerate}
\item Before execution of the algorithm, each entity $a \in A$ sets for itself $s[i] = [1]$ if $l[i] = 1$ and $[-1]$ otherwise, for all $i = 0, .., k-1$. This choice refers to the belief that its original colour $c_a$ is in majority. And, indeed, each entity initially adopts an extra colour 1 (denoting membership in the majority) for the purpose of protocol $P_2$.
\item Later, during pairwise interactions between entities, the current states in $s[i]$ get updated by the relevant majority protocols $P_1(i)$, for each $i = 0, \ldots, k-1$ independently. And if at any time the contents of $s[i]$ and $l[i]$ do not reflect its initial setting, the belief of the entity changes to $-1$. However, this belief becomes 1 again as soon as the consistency between bits in $s[0..k-1]$ and $l[0..k-1]$ is restored. This consistency measure determines actions of the external force in protocol $P_2$.
\end{enumerate}
\emph{Stabilisation Stage}
\begin{enumerate}
\item At first, the majority algorithm stabilises on all protocols $P_1(i)$, for $i = 0, \ldots, k-1$, which allows each entity to establish the final relationship between the corresponding bits in $s[0..k-1]$ and $l[0..k-1]$. This, in turn, determines the extra colour (1 or $-1$) of the entity adopted for the purpose of protocol $P_2$.
\item When eventually protocol $P_2$ also terminates and concludes with colour 1 in majority, all entities receive confirmation that the final states in $s[0..k-1]$ refer to the absolute majority colour $l^*[0..k-1]$. Otherwise, the entities learn that none of the colours is in the absolute majority.
\end{enumerate}
'''
context = '''
[Section 4, p. 8:] In this section we present an asymptotically optimal $O(k)$-bit population protocol computing absolute majority, i.e., answering whether there exists a colour which dominates all the remaining colours in the population taken together.
[Section 4, pp. 8-9:] Assume $l^*[0..k-1]$ is a $k$-bit label of the colour of the absolute majority in the population. One can observe that when the majority protocols stabilise, for all $i = 0, \ldots, k-1$, each bit $l^*[i]$ must be in majority reported by $P_1(i)$ via entry $s[i]$.
'''
notes = '''[...] marks omitted text. "for all i = 0, .., k - 1" as printed. The library reads "the contents of s[i] and l[i] do not reflect its initial setting" as: the colour for P_2 is 1 iff every copy P_1(i) currently reports the agent's own bit l[i], a reported tie counting as inconsistent; its output is the reported label if P_2 reports 1 and none otherwise (FORMALIZATION_DIFFERENCES.md, CRN-5, item 4).'''

