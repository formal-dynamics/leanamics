item = "crn:thm:boolean"
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
version = "manuscript of 2005-10-17"
result = "Lemma 6 (Lemma 3 in the article)"
page = 7
url = "https://cs.yale.edu/homes/aspnes/papers/podc04passive-dc.pdf"
status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction); not yet checked by a person"
statement = '''
\textbf{Lemma 6} Let $X$ be an input set, and let $E_I$ be an input encoding convention over domain $D_I$. Let $F$ and $G$ be predicates over $D_I$ that are stably computable by population protocols over $X$. Let $\xi$ be any 2-place Boolean function. Then the predicate $\xi(F, G)$ is stably computable by a population protocol with input set $X$.
'''
context = '''
[Section 3.4, p. 4:] In order to use population protocols to compute on other domains, we need suitable input and output encoding conventions. An \textbf{input encoding convention} for domain $D_I$ is a function $E_I : \mathcal{X} \to D_I$, and an \textbf{output encoding convention} for $D_O$ is a function $E_O : \mathcal{Y} \to D_O$.
[Section 3.4, p. 6:] Let $E_I$ be an input encoding convention over $D_I$, and let $E_O$ be the all-agents predicate output convention. We say that protocol $\mathcal{A}$ \textbf{stably computes a predicate} on $D_I$ if $\mathcal{A}$ stably computes a total function $G_{\mathcal{A}} : D_I \to D_O$ and $G_{\mathcal{A}}(u) \ne \bot$ for any $u \in D_I$. Thus, every computation of $\mathcal{A}$ converges to an output in which all agents have the same output value 0 or 1.
'''
notes = '''The library cites the published article's numbering (Lemma 3, Section 4.1); the open copy read is the authors' journal manuscript of October 17, 2005, where the same statement is Lemma 6 of Section 4.1 "Boolean closure of population predicates". The correspondence is by content (the published article was not available to compare). Script letters rendered \mathcal. The definitions of stable computation are quoted in the crn:def:stable entry.'''

