item = "crn:thm:transfer"
paper = "H.-L. Chen, D. Doty, D. Soloveichik. Deterministic function computation with chemical reaction networks"
venue = "Natural Computing 13(4):517-534, 2014"
version = "arXiv:1204.4176v3"
result = "Theorem 2.1"
page = 9
url = "https://arxiv.org/abs/1204.4176v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
\textbf{Theorem 2.1} ([3]). A set $A \subseteq \mathbb{N}^k$ is stably decidable by a CRD if and only if it is semilinear.
'''
context = '''
[Section 2, p. 5:] A set $A \subseteq \mathbb{N}^k$ is \emph{linear} if there exist vectors $\vec{b},\vec{u}_1,\ldots,\vec{u}_p \in\mathbb{N}^k$ such that
\[ A=\left\{\ \left. \vec{b} + n_1 \vec{u}_1 + \ldots + n_p \vec{u}_p \ \right|\ n_1,\ldots,n_p\in\mathbb{N} \ \right\}. \]
$A$ is \emph{semilinear} if it is a finite union of linear sets.
[Section 2.2, p. 8:] We say a CRD $\mathcal{D}$ \emph{stably decides} the predicate $\psi:\mathbb{N}^\Sigma \to \{0,1\}$ if, for any valid initial configuration $\vec{i} \in \mathbb{N}^\Lambda$ with $\vec{i} \upharpoonright \Sigma = \vec{i}_0$, for all configurations $\vec{c}\in\mathbb{N}^\Lambda$, $\vec{i} \to^* \vec{c}$ implies $\vec{c}\to^*\vec{c}'$ such that $\vec{c}'$ is output stable and $\Phi(\vec{c}') = \psi(\vec{i}_0)$. [...] We say that $\mathcal{D}$ \emph{stably decides} a set $A\in\mathbb{N}^k$ if it stably decides its indicator function.
[Section 2.2, p. 9:] The model they use is defined in a slightly different way. They study \emph{population protocols}, a distributed computing model in which a fixed-size set of agents, each having a state from a finite set, undergo successive pairwise interactions, the two agents updating their states upon interacting. This is equivalent to chemical reaction networks in which all reactions have exactly two reactants and two products.
'''
notes = '''The library cites the "if" direction (every semilinear set is stably decidable) together with Theorem 5 of AADFP06 (StableCrn.lean) for its theorem that every stably computable predicate, and every Boolean combination of threshold and remainder predicates, is stably decided by a count-conserving bimolecular CRN; the last context sentence is the paper's statement that population protocols are CRNs with two reactants and two products. [3] is the paper's numbering of Angluin, Aspnes, Eisenstat, "Stably computable predicates are semilinear", PODC 2006. The full definition of a CRD and of its output is in the first crn:def:crn-stable entry. Macros replaced as there, and \setl{a}{b} -> \left\{\ \left. a \ \right|\ b \ \right\}. "a set A \in N^k" as printed.'''

