item = "crn:def:em-static"
paper = "L. Gąsieniec, D. Hamilton, R. Martin, P. G. Spirakis, G. Stachowiak. Deterministic population protocols for exact majority and plurality"
venue = "OPODIS 2016, LIPIcs 70, 14:1-14:14"
version = "LIPIcs.OPODIS.2016.14"
result = "Section 2, Figs. 1 and 2"
page = 4
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction, Figures 1 and 2 read from the rendered page); no LaTeX source available; not yet checked by a person"
statement = '''
[Section 2, p. 4:] Initially each entity $a \in A$ obtains its original colour $c_a$, being one of the three available denoted by integers $-1$, $0$, and $1$. Thus, the main goal in our reformulation of majority protocols is to determine whether there are more 1's than $(-1)$'s (green domination), more $(-1)$'s than 1's (red domination), or whether there is a tie between the two. In other words, our majority protocols aim at determining the sign of the expression:
\[ \sum_{a \in A} c_a . \]
[p. 5:] If this sign is positive, there are more 1's, if negative, there are more $(-1)$'s, and if the sum is 0, we report equivalence between the two competing colours. During the communication process each entity $a \in A$ has an attributed \emph{state} $s_a$. [...]
Throughout the computation process the entities can be in one of the three \emph{strong states} $[-1], [0]$, and $[1]$ or the three weak states $\langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle$. In the begining, each entity $a \in A$ with attributed colour $c_a = x$ is in state $[x]$. With each state $s$ we associate a weight $w(s)$ such that $w([x]) = x$ and $w(\langle x \rangle) = 0$. This association is illustrated by the table in Fig. 1.
In due course, when two entities $a, b \in A$ interact the shared \emph{transition function} determines their resulting states. And, in particular, if an entity in a strong state $[x]$ meets another in a weak state $\langle y \rangle$, the weak state becomes $\langle x \rangle$ and the strong state remains unchanged. If during a meeting a strong state $[x]$, for $x \ne 0$, meets $[0]$ then only state $[0]$ is changed to $\langle x \rangle$. Finally, if $[1]$ interacts with $[-1]$ both states are changed to $[0]$. Other type of encounters does not change the states of entities. The respective shared transition function is illustrated by the table in Fig. 2.

Figure 1 (The states and their weights):
\[
\begin{array}{|l|c|} \hline
\text{state } s & \text{weight } w(s) \\ \hline
[-1] & -1 \\
{[0]}, \langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle & 0 \\
{[1]} & 1 \\ \hline
\end{array}
\]
Figure 2 (The transition table for static majority protocol with ties):
\[
\begin{array}{|c|cccccc|} \hline
s_a \backslash s_b & [-1] & [0] & [1] & \langle -1 \rangle & \langle 0 \rangle & \langle 1 \rangle \\ \hline
[-1] & ([-1],[-1]) & ([-1],\langle -1 \rangle) & ([0],[0]) & ([-1],\langle -1 \rangle) & ([-1],\langle -1 \rangle) & ([-1],\langle -1 \rangle) \\
{[0]} & (\langle -1 \rangle,[-1]) & ([0],[0]) & (\langle 1 \rangle,[1]) & ([0],\langle 0 \rangle) & ([0],\langle 0 \rangle) & ([0],\langle 0 \rangle) \\
{[1]} & ([0],[0]) & ([1],\langle 1 \rangle) & ([1],[1]) & ([1],\langle 1 \rangle) & ([1],\langle 1 \rangle) & ([1],\langle 1 \rangle) \\
\langle -1 \rangle & (\langle -1 \rangle,[-1]) & (\langle 0 \rangle,[0]) & (\langle 1 \rangle,[1]) & (\langle -1 \rangle,\langle -1 \rangle) & (\langle -1 \rangle,\langle 0 \rangle) & (\langle -1 \rangle,\langle 1 \rangle) \\
\langle 0 \rangle & (\langle -1 \rangle,[-1]) & (\langle 0 \rangle,[0]) & (\langle 1 \rangle,[1]) & (\langle 0 \rangle,\langle -1 \rangle) & (\langle 0 \rangle,\langle 0 \rangle) & (\langle 0 \rangle,\langle 1 \rangle) \\
\langle 1 \rangle & (\langle -1 \rangle,[-1]) & (\langle 0 \rangle,[0]) & (\langle 1 \rangle,[1]) & (\langle 1 \rangle,\langle -1 \rangle) & (\langle 1 \rangle,\langle 0 \rangle) & (\langle 1 \rangle,\langle 1 \rangle) \\ \hline
\end{array}
\]
'''
context = '''
[Section 2, p. 4:] This section reformulates the algorithm for majority presented in [5].
'''
notes = '''The prose rules and the tables are on pp. 4-5 (the tables at the top of p. 5). Angle brackets are rendered \langle x \rangle; "begining" as printed. [...] marks an omitted sentence on the knowledge of entities. Braces {[0]} only protect the brackets in LaTeX arrays. The tables were transcribed from the rendered page and cross-checked against the column-by-column text extraction; the library's notes record that the table of Fig. 2 agrees with the rules of the text in all entries. [5] is the paper's reference to Angluin, Aspnes, Diamadi, Fischer, Peralta.'''

