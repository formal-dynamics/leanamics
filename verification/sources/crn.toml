item = "crn:def:em-marks"
paper = "L. Gąsieniec, D. Hamilton, R. Martin, P. G. Spirakis, G. Stachowiak. Deterministic population protocols for exact majority and plurality"
venue = "OPODIS 2016, LIPIcs 70, 14:1-14:14"
version = "LIPIcs.OPODIS.2016.14"
result = "Section 1, the model"
page = 2
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction); no LaTeX source available; not yet checked by a person"
statement = '''
When two entities engage in interaction they mutually access their local states and, on the conclusion of the encounter, their states get updated according to the global (shared) transition function. In the asynchronous model, also adopted in this paper, the order of interactions in consecutive rounds is unpredictable but fair, i.e., none of the pairs of entities can be starved from interaction. [...] A population protocol terminates if all participating entities eventually agree on some value represented by dedicated states, independently of the order of interactions. This value can reflect the colour or the size of selected majority [6, 7, 9, 23], the identity of the leader [2, 1, 19], but also completion of more complex tasks such as network formation [25], counting [26], and others.
'''
context = '''
[Section 1, p. 1:] The model of population protocols adopted in this paper was proposed first in the seminal paper by Angluin et al. [5] and popularised later in [7]. Their model provides a suitable theoretical framework for studying pairwise interactions within a large collection of anonymous (indistinguishable) entities, also referred to as agents, equipped with little computational power. The entities are modelled as finite state machines.
[Section 5, p. 10:] At first we describe a protocol for the relative majority which only finds the winner $l^*[0..k-1]$. This is done by marking all entities possessing this colour with the winning label.
'''
notes = '''The paper has no formal definition of stable computation; these are its sentences on the model (Section 1 runs over pp. 1-2; the statement is on p. 2). [...] marks an omitted sentence on the probabilistic model. [5] is the paper's reference to Angluin, Aspnes, Diamadi, Fischer, Peralta (Distributed Computing 2006). The library uses the reachability form of stable computation of CRN-3 with outputs in any type, possibly depending on the agent's own input ("stably marks"), to cover Theorems 3, 6 and 7 (FORMALIZATION_DIFFERENCES.md, CRN-5, item 1).'''

