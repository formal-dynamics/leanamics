status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction); not yet checked by a person"
statement = '''
\textbf{Lemma 11} Let $X = \{\sigma_1, \ldots, \sigma_k\}$ be an arbitrary input alphabet. Let $a_i$, $c$, and $m$ be integer constants with $m \ge 2$. Then the following predicates on non-negative integers $x_1, \ldots, x_k$ are stably computable in the family of standard populations under the symbol-count input convention:
\begin{enumerate}
\item $\sum_i a_i x_i < c$.
\item $\sum_i a_i x_i \equiv c \pmod{m}$.
\end{enumerate}
'''
context = '''
[Section 3.3, p. 4:] Let $\mathcal{P}_n$ be the population of size $n$ consisting of the complete interaction graph on the specific agent set $A_n = \{1, \ldots, n\}$. We call $A_n$ the \textbf{standard agent set} and $\mathcal{P}_n$ the \textbf{standard population} of size $n$.
[Section 3.4, p. 5:] The \textbf{symbol-count input convention} assumes an arbitrary input alphabet $X = \{\sigma_1, \ldots, \sigma_k\}$ and $D_I = \mathbb{N}^k$. The $k$-tuple represented by an assignment $x \in \mathcal{X}$ is $E_I(x) = (n_1, \ldots, n_k)$, where $n_i$ is the number of agents to which $x$ assigns $\sigma_i$. Note that the $k$-tuple $(n_1, \ldots, n_k)$ is only representable in a population of size $n = \sum_i n_i$.
[Section 3.4, p. 6:] We say that protocol $\mathcal{A}$ \textbf{stably computes a predicate} on $D_I$ if $\mathcal{A}$ stably computes a total function $G_{\mathcal{A}} : D_I \to D_O$ and $G_{\mathcal{A}}(u) \ne \bot$ for any $u \in D_I$. Thus, every computation of $\mathcal{A}$ converges to an output in which all agents have the same output value 0 or 1.
'''
notes = '''Item 1 is crn:thm:threshold, item 2 is crn:thm:remainder. The library cites the published article's numbering, Lemma 5 (and notes that it is Lemma 11 in the authors' 2005 journal manuscript, the open copy read here). In the manuscript the lemma is in Section 4.3. The protocols of the proof start every agent with output bit 0 (input map sigma_i -> (1, 0, a_i)); see FORMALIZATION_DIFFERENCES.md, CRN-3, items 2, 4 and 5, for the population of one agent, the form >= c and the modulus.'''

