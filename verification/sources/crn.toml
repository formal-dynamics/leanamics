[[source]]
item = "crn:def:jump"
paper = "D. Doty. Timing in chemical reaction networks"
venue = "SODA 2014"
version = "arXiv:1304.0872v1"
result = "Section 2.2, the next reaction"
page = 6
url = "https://arxiv.org/abs/1304.0872v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
The propensity function determines the evolution of the system as follows.
The time until the next reaction occurs is an exponential random variable with rate $\rho(\vec{c}) = \sum_{\beta \in R} \rho(\vec{c}, \beta)$.
The probability that next reaction will be a particular $\beta_{\text{next}}$ is $\frac{\rho(\vec{c},\beta_{\text{next}})}{\rho(\vec{c})}$.
'''
context = '''
[Section 2.1, p. 5:] A \emph{(finite) chemical reaction network (CRN)} is a pair $\mathcal{C}=(\Lambda,R)$, where $\Lambda$ is a finite set of chemical \emph{species}, and $R$ is a finite set of reactions over $\Lambda$.
A \emph{configuration} of a CRN $\mathcal{C}=(\Lambda,R)$ is a vector $\vec{c} \in \mathbb{N}^\Lambda$.
[Section 2.1, p. 5:] Given a configuration $\vec{c}$ and reaction $\beta=(\vec{r},\vec{p},k)$, we say that $\beta$ is \emph{applicable} to $\vec{c}$ if $\mathbf{r} \leq \vec{c}$ (i.e., $\vec{c}$ contains enough of each of the reactants for the reaction to occur).
If $\beta$ is applicable to $\vec{c}$, then write $\beta(\vec{c})$ to denote the configuration $\vec{c} + \mathbf{p} - \mathbf{r}$ (i.e., the configuration that results from applying reaction $\beta$ to $\vec{c}$).
[Section 2.2, p. 6:] The kinetic behavior of a CRN is described by a continuous-time Markov process, whose states are configurations of the CRN, as follows.
Given a fixed volume $v > 0$ and current configuration $\vec{c}$, the \emph{propensity} of a unimolecular reaction $\beta : X \overset{k}{\to} \ldots$ in configuration $\vec{c}$ is $\rho(\vec{c}, \beta) = k \vec{c}(X)$.
The propensity of a bimolecular reaction $\beta : X + Y \overset{k}{\to} \ldots$, where $X \neq Y$, is $\rho(\vec{c}, \beta) = \frac{k}{v} \vec{c}(X) \vec{c}(Y)$.
The propensity of a bimolecular reaction $\beta : X + X \overset{k}{\to} \ldots$ is $\rho(\vec{c}, \beta) = \frac{k}{v} \frac{\vec{c}(X) (\vec{c}(X) - 1)}{2}$.
'''
notes = '''Macros replaced: \vc -> \vec{c}, \vr -> \vec{r}, \vp -> \vec{p}, \bfr -> \mathbf{r}, \bfp -> \mathbf{p}, \N -> \mathbb{N}, \calC -> \mathcal{C}. "The probability that next reaction" as printed. The paper does not say what happens when rho(c) = 0 (no applicable reaction); the library makes such configurations absorbing (FORMALIZATION_DIFFERENCES.md, CRN-1, item 6).'''

[[source]]
item = "crn:def:jump"
paper = "D. F. Anderson, T. G. Kurtz. Continuous time Markov chain models for chemical reaction networks"
venue = "Design and Analysis of Biomolecular Circuits (H. Koeppl et al., eds.), Springer, 2011"
version = "author preprint"
result = "Section 2.4, eq. (2.10), embedded chain"
page = 12
url = "https://people.math.wisc.edu/~dfanderson/papers/SURVEY_AndKurtz.pdf"
status = "transcribed by an AI agent from the PDF of the author preprint (text extraction, formulas checked against the layout of the page); no LaTeX source available; not yet checked by a person"
statement = '''
Specializing to continuous-time Markov chains and defining
\[
\lambda_0(x) = \sum_l \lambda_l(x), \qquad q_l(x) = \sum_{i=1}^{l} \lambda_i(x)/\lambda_0(x),
\]
the equations become
\begin{align*}
R_0(t) &= Y\Big(\int_0^t \lambda_0(X(s))\,ds\Big) \qquad (2.10)\\
X(t) &= X(0) + \sum_l \zeta_l \int_0^t \mathbf{1}_{(q_{l-1}(X(s-)),\, q_l(X(s-))]}(\xi_{R_0(s-)})\,dR_0(s).
\end{align*}
This representation is commonly used for simulation, see section 2.6.
'''
context = '''
[Section 2.2, p. 7:] More generally, a continuous time Markov chain $X$ taking values in $\mathbb{Z}^d$ is specified by giving its transition intensities (propensities in much of the chemical physics literature) $\lambda_l$ that determine
\[
P\{X(t+\Delta t) - X(t) = \zeta_l \mid \mathcal{F}^X_t\} \approx \lambda_l(X(t))\Delta t, \qquad (2.5)
\]
for the different possible jumps $\zeta_l \in \mathbb{Z}^d$, where $\mathcal{F}^X_t$ is the $\sigma$-algebra generated by $X$ (all the information available from the observation of the process up to time $t$).
[Section 2.2, p. 8:] [...] we write
\[
X(t) = X(0) + \sum_l \zeta_l Y_l\Big(\int_0^t \lambda_l(X(s))\,ds\Big), \qquad (2.6)
\]
where the $Y_l$ are independent unit Poisson processes.
[Section 2.4, p. 11:] Let $Y$ be a unit Poisson process and $\xi_0, \xi_1, \ldots$ be independent, uniform $[0,1]$ random variables that are independent of $Y$, and set $q_0 = 0$ [...].
[Section 2.6, p. 14:] The stochastic equations (2.6) and (2.10) suggest methods of simulating continuous-time Markov chains, and these methods are, in fact, well known. Equation (2.6) corresponds to the next reaction (next jump) method as defined by Gibson and Bruck [19].
The algorithm obtained by simulating (2.10) is known variously as the embedded chain method or Gillespie's [20, 21] direct method or the stochastic simulation algorithm (SSA).
[Section 3, p. 16:] To simplify notation, we will write $\zeta_k = \nu'_k - \nu_k$.
'''
notes = '''Page numbers are those of the author preprint (44 pages). In (2.10), the jump of the chain at a jump of R_0 is zeta_l with probability q_l - q_{l-1} = lambda_l(x)/lambda_0(x): this is the jump chain the library formalizes (Protocol.lean cites Anderson and Kurtz 2011 for it). [...] marks omitted text. The equation number (2.10) is printed at the first line of the display. Section 2.4 is titled "Thinning of counting processes".'''

[[source]]
item = "crn:thm:crn1"
paper = "D. Doty. Timing in chemical reaction networks"
venue = "SODA 2014"
version = "arXiv:1304.0872v1"
result = "Section 1.2, protocols and kinetics"
page = 2
url = "https://arxiv.org/abs/1304.0872v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
Multiple semantic models may be overlaid on this syntactic definition, but the randomized model studied by Angluin, Aspnes, and Eisenstat [3], in which the next two agents to interact are selected uniformly at random, coincides precisely with the model of stochastic chemical kinetics, so long as the CRN's reactions each have two reactants and two products, i.e., $q_1 + q_2 \to r_1 + r_2$.
'''
context = '''
[Section 1.2, p. 2:] A population protocol consists of a set of $n$ agents with finite state set $\Lambda$ (where we imagine $n \gg |\Lambda|$), together with a transition function $\delta:\Lambda^2\to\Lambda^2$, with $(r_1,r_2)=\delta(q_1,q_2)$ indicating that if two agents in states $q_1$ and $q_2$ interact, then they change to states $r_1$ and $r_2$, respectively.
[Section 2.1, p. 5:] Given a finite set of chemical species $\Lambda$, a \emph{reaction} over $\Lambda$ is a triple $\beta = ( \vec{r},\vec{p},k ) \in \mathbb{N}^\Lambda \times \mathbb{N}^\Lambda \times \mathbb{R}^+$, specifying the stoichiometry of the reactants and products, respectively, and the \emph{rate constant} $k$.
A \emph{(finite) chemical reaction network (CRN)} is a pair $\mathcal{C}=(\Lambda,R)$, where $\Lambda$ is a finite set of chemical \emph{species}, and $R$ is a finite set of reactions over $\Lambda$.
A \emph{configuration} of a CRN $\mathcal{C}=(\Lambda,R)$ is a vector $\vec{c} \in \mathbb{N}^\Lambda$.
[Section 2.2, p. 6:] Given a fixed volume $v > 0$ and current configuration $\vec{c}$, [...]
The propensity of a bimolecular reaction $\beta : X + Y \overset{k}{\to} \ldots$, where $X \neq Y$, is $\rho(\vec{c}, \beta) = \frac{k}{v} \vec{c}(X) \vec{c}(Y)$.
The propensity of a bimolecular reaction $\beta : X + X \overset{k}{\to} \ldots$ is $\rho(\vec{c}, \beta) = \frac{k}{v} \frac{\vec{c}(X) (\vec{c}(X) - 1)}{2}$.
[...]
The time until the next reaction occurs is an exponential random variable with rate $\rho(\vec{c}) = \sum_{\beta \in R} \rho(\vec{c}, \beta)$.
The probability that next reaction will be a particular $\beta_{\text{next}}$ is $\frac{\rho(\vec{c},\beta_{\text{next}})}{\rho(\vec{c})}$.
'''
notes = '''No numbered result: the theorem formalizes the correspondence that this sentence states informally (the library's PROVENANCE row cites Anderson and Kurtz 2011 for CRNs as Markov chains and Gillespie 1977 and Doty, SODA 2014, Section 2, for the propensity; this sentence of Section 1.2 is the statement of the correspondence in those sources). [3] is the paper's numbering of Angluin, Aspnes, Eisenstat, "Fast computation by population protocols with a leader", Distributed Computing 21(3), 2008. A footnote after "two products" is omitted ("This turns out not to be a significant restriction on CRNs; see the introduction of [CDS12] for a discussion of the issue.", with CDS12 the paper's reference to Chen, Doty, Soloveichik). The paper does not fix how a reaction with given reactants is chosen when several reactions share them; the library draws a uniformly random reaction (FORMALIZATION_DIFFERENCES.md, CRN-1, item 3). Macros replaced as in the crn:def:jump entry.'''

[[source]]
item = "crn:def:am"
paper = "D. Angluin, J. Aspnes, D. Eisenstat. A simple population protocol for fast robust approximate majority"
venue = "Distributed Computing 21(2):87-102, 2008"
version = "author manuscript"
result = "Section 3, the 3-state protocol"
page = 3
url = "https://cs.yale.edu/homes/aspnes/papers/approximate-majority-journal.pdf"
status = "transcribed by an AI agent from the PDF of the authors' Distributed Computing manuscript (text extraction); no LaTeX source available; not yet checked by a person"
statement = '''
We analyze the behavior of the following population protocol with states $Q = \{b, x, y\}$. The state $b$ is the blank state. Row labels give the initiator's state and column labels the responder's state.
\[
\begin{array}{c|ccc}
 & x & b & y \\ \hline
x & (x, x) & (x, x) & (x, b) \\
b & (b, x) & (b, b) & (b, y) \\
y & (y, b) & (y, y) & (y, y)
\end{array}
\]
Note that this protocol is one-way: every interaction changes at most the responder's state; thus it can be implemented with one-way communication. Only the interactions $xb$, $yb$, $xy$, and $yx$ change the responder's state; we may think of these as the only interactions that consume energy.
'''
context = '''
[Section 2, p. 2:] A population protocol consists of a finite set of states $Q$, a finite set of input symbols $X \subseteq Q$, a finite set of output symbols $Y$, an output function $\gamma : Q \to Y$, and a joint transition function $\delta : Q \times Q \to Q \times Q$. [...]
During each execution step, an arc $(v, w)$ is chosen uniformly at random from $A$. The ``source'' agent $v$ is the initiator, and the ``sink'' agent $w$ is the responder. These agents update their states jointly according to $\delta$: if $v$ is in state $q_v$ and $w$ is in state $q_w$, the state of $v$ becomes $\delta_1(q_v, q_w)$, the state of $w$ becomes $\delta_2(q_v, q_w)$, where $\delta_i$ gives the $i$th coordinate of the output of $\delta$. The states of all other agents are unchanged.
'''
notes = '''The copy read is the authors' manuscript of the Distributed Computing article ("Distributed Computing manuscript No."), from J. Aspnes's homepage; it was not compared with the published article. The table is transcribed from the text extraction of the PDF (rows and columns in the printed order x, b, y). In the context, A is the arc set of the interaction graph, which in this paper "will always be a complete graph". The library's network writes the four state-changing interactions as the reactions X + Y -> X + B, X + Y -> Y + B, B + X -> X + X, B + Y -> Y + Y (unordered reactants), with X, Y, B for x, y, b.'''

[[source]]
item = "crn:def:am"
paper = "L. Cardelli, A. Csikász-Nagy. The cell cycle switch computes approximate majority"
venue = "Scientific Reports 2:656, 2012"
version = "Sci. Rep. 2:656"
result = "Eq. (1), the AM network"
page = 3
url = "https://www.nature.com/articles/srep00656"
status = "transcribed by an AI agent from the published PDF (open access; text extraction with the reaction symbols decoded); no LaTeX source available; not yet checked by a person"
statement = '''
The AM (Approximate Majority) network is depicted by an abbreviated graphical notation in figure 1B.1, which is explained in figure 1E,F. Namely, a pair of `pinched arrows' between a pair of species such as $x$,$y$ represents four reactions with a common intermediate species $b$ (specific to the pair $x$,$y$): the intermediate species is omitted. The AM network therefore consists of 4 reactions (of mass action kinetics):
\[
\begin{array}{lll}
x + y \to y + b & \text{catalytic in } y & \\
b + y \to y + y & \text{autocatalytic in } y & \qquad (1)\\
y + x \to x + b & \text{catalytic in } x & \\
b + x \to x + x & \text{autocatalytic in } x &
\end{array}
\]
for some intermediate $b$.
'''
context = '''
[Introduction, p. 1:] The AM algorithm computes the majority of two finite populations by converting the minority population into the majority population, so that a single population results; it uses a third `undecided' state of the population, from where autocatalysis can drive the individuals into either of the final states.
'''
notes = '''Published version (open access). In the text extraction "+" and "->" come out as "z" and "?"; they are rendered here as + and \to. The equation number (1) is printed at the middle of the four reactions. The library cites this paper for the approximate-majority network (ApproximateMajority.lean); its four reactions, written with unordered reactants, are the library's X + Y -> X + B, X + Y -> Y + B, B + X -> X + X, B + Y -> Y + Y.'''

