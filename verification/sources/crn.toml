statement = '''
Assume without loss of generality that the initial majority is of type $g$ (green), i.e.~$|G_0| \geq |R_0|$. The state space of the Markov chain $\mathcal{M}$ describing the evolution of the protocol will be the set $\mathcal{S} = \{(A, B): A, B \subseteq V, A\cap B = \emptyset\}$. In particular, when $\mathcal{M}$ is in state $(A, B)$ at time $t$, we will write that $(R_t, G_t) = (A, B)$, and this will mean that the subset of vertices $A$ (respectively $B$) is of type $r$ (respectively $g$). It is also evident that the set of vertices $V-(A\cup B)$ is of type $b$. It then follows that the majority protocol in [2] fails to correctly identify type $g$ as the initial majority if $\mathcal{M}$ eventually reaches state $(V, \emptyset)$; we will then say that the \emph{initial minority wins} (whereas in the opposite case we will say that the \emph{initial majority wins}). Since the initial placement of individuals on the vertices of the graph is random and the initial minority is of type $r$, we also have that
\[
\Pr\{\textrm{initial minority wins}\} = \sum_{S \subseteq V: |S| = |G_0|} \frac{1}{{n \choose |G_0|}} \Pr\{\textrm{$(V, \emptyset)$ reached} | (R_0, G_0) = (V-S, S)\}. \qquad (18)
\]
'''
context = '''
[Theorem 4, p. 10:] For any strongly connected directed graph $G$, if the initial assignment of individuals to the vertices of $G$ is random, then the majority protocol described in [2] correctly identifies the initial majority with probability at least $\frac{1}{2}$.
[Section 2.2, p. 4:] Specifically for the model of [2], we denote by $W_t$ (respectively $R_t$ and $G_t$) the set of agents in state $b$ (respectively $r$ and $g$) at time $t$.
'''
notes = '''Quoted from the proof of Theorem 4. Macros replaced: {\cal M} -> \mathcal{M}, {\cal S} -> \mathcal{S}; \cite{AAE08} rendered [2] (the paper's numbering). The equation number (18) is the PDF's. "the majority protocol in [2] fails to correctly identify type g as the initial majority if M eventually reaches state (V, emptyset)" as printed. The library defines win_t(s), the probability over a uniform m-subset S of agents of type Y (the paper's g) and over the scheduler that every agent is s at time t, and the convergence probability as its supremum over t; the paper's "(V, emptyset) reached" is its limit.'''

