statement = '''
Due to Lemma 5 the majority process stabilises in three possibile configurations with respect to $C_{\mathrm{fin}} \stackrel{\mathrm{def}}{=} \sum_{a \in A} c_a$ (where $c_a$ is referring to the final colour of the entity $a$, after any external forces have stopped changing the colours of entities). If on the conclusion $C_{\mathrm{fin}} > 0$, there must be some entities in states $[1]$ or $[2]$ which would earlier ensure that all weak states and the state $[0]$ are switched to $\langle 1 \rangle$. If $C_{\mathrm{fin}} < 0$, there must be some entities in states $[-1]$ or $[-2]$ which would earlier ensure that all weak states and the state $[0]$ are switched to $\langle -1 \rangle$. However, if on the conclusion $C_{\mathrm{fin}} = 0$, there are no entities in states $[x]$ with $x \ne 0$ and the last entity that reached state $[0]$ will have a chance to alter all weak states to $\langle 0 \rangle$.
'''
context = '''
[Section 3, p. 6:] In this section we consider a variant of population protocols in which the original colours (attributes) of entities could be altered by an external force for some unspecified, however limited, period of time. After this initial period, the relevant population protocol is expected to eventually stabilize.
[Section 3, p. 6:] The population protocol presented below determines whether there are more original 1's, more $(-1)$'s, or there is a tie after the last intervention of the external force. [...] On the conclusion all entities are in state
$[1]$, $[2]$ or $\langle 1 \rangle$ if there are more 1's than $(-1)$'s,
$[-1]$, $[-2]$ or $\langle -1 \rangle$ if there are less 1's than $(-1)$'s, and
$[0]$ or $\langle 0 \rangle$ when there is a tie.
[Lemma 5, p. 8:] The value of $R = \sum_a |w(s_a)|$ does not increase after the last intervention of the external force. Moreover the value of $R$ stabilises when eventually there are no two entities $a, b \in A$ such that $w(s_a) > 0$ and $w(s_b) < 0$.
'''
notes = '''No numbered result: the conclusion of Section 3 is this paragraph. "possibile" as printed. The definition symbol over "=" is printed "def" above the equals sign. The library's output of a state is the sign of its weight for strong states and x for <x>, and the theorem covers every finite interleaving of interactions and colour changes, and the protocol without the external force.'''

