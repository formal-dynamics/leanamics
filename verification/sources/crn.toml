[[source]]
item = "crn:def:graph-stable"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Section 2, stable computation on graphs"
page = 4
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
Given the probabilistic scheduler, a population protocol \emph{computes} a (possibly partial) function ${g: X^V \to Y}$ with error probability at most $\epsilon$, if for all $x \in g^{-1}(Y)$, the population eventually reaches a configuration $C$ that satisfies the following properties with probability at least $1-\epsilon$: (a) all agents agree on the correct output, i.e.~$g(x) = \gamma(C(v))$ for all $v \in V$ and (b) this is also true for every configuration reachable from $C$.
Furthermore, a population protocol \emph{stably computes} a (possibly partial) function $g: X^V \to Y$ if, for \emph{every} fair scheduler, the population eventually reaches a configuration $C$ that satisfies both the above properties (a) and (b).
'''
context = '''
[Section 2, p. 3:] A \emph{population protocol} consists of a finite set $Q$ of states/types, a finite set of input symbols $X$, an input function $\iota :X\rightarrow Q$, a finite set of output symbols $Y$, an output function $\gamma: Q \to Y$, and a joint transition function $\delta: Q \times Q \to Q \times Q$. If, for any pair of states $q_1, q_2 \in Q$, $\delta(q_a, q_b) = (q'_a, q'_b)$ implies that $\delta(q_b, q_a) = (q'_b, q'_a)$, then the population protocol is called \emph{symmetric}. A population protocol is executed by a fixed finite \emph{population} of agents with types in $Q$. We assume that each agent has an identity $v \in V$, but agents are oblivious to their own identity and to identities of agents they interact with.
[Section 2, p. 3:] Initially, each agent is assigned a type according to an \emph{input} $x: V \to X$ that maps agent identities to input symbols. In the general population protocol model, agents are identified with the vertices of an \emph{interaction graph}, whose edges indicate the possible agent interactions that may take place. Here, an interaction graph is a simple connected graph $G$ (i.e.~without loops or multiple edges), which can be directed or undirected. A function $C: V \to Q$ is called a \emph{configuration}. We will say that the population protocol reaches configuration $C$ at time $t$ if, for every agent $v$ in the population, the state of $v$ at time $t$ is $C(v)$.
[Section 2, p. 3:] In the original model, agents do not send messages or share memory; instead, an interaction between two agents updates both of their types according to a joint transition function (which can be also represented by a table). Interactions between agents are planned by a scheduler under a general ``fairness'' condition; the actual mechanism for choosing which agents interact is abstracted away. The fairness condition states that for any two configurations $C, C'$, if $C$ occurs infinitely often and $C'$ is reachable from $C$, then $C'$ also occurs infinitely often.
[Section 2, p. 4:] In this paper, we consider a special case of a fair scheduler, namely the \emph{probabilistic scheduler}, which is defined on directed graphs as follows. During each execution step, a directed edge $(v, u) \in E$ is chosen uniformly at random from $E$, where $v$ (i.e.~the tail of $(v, u)$) is called the \emph{initiator} and $u$ (i.e.~the head of $(v, u)$) is called the \emph{responder} of the interaction. Then, agents $v$ and $u$ update their types jointly according to $\delta$. [...] The probabilistic scheduler is defined on undirected graphs similarly, by replacing every undirected edge $\{v, u\}$ by the two directed edges $(v, u)$ and $(u, v)$.
[Section 2.2, p. 4:] For two configurations $C, C'$, we will say that $C'$ is \emph{directly reachable from $C$} (or reachable in one step from $C$) if there is $(v, u) \in E$, such that $(C'(v), C'(u)) = \delta(C(v), C(u))$ and $C'(w) = C(w)$, for all $w \in V \backslash \{v, u\}$.
'''
notes = '''Footnote 6 after "states/types" omitted ("In the original formulation of population protocols these are called states, but we chose to also use the term type in order to avoid confusion with the states in a Markov chain."). "for any pair of states q_1, q_2 ... delta(q_a, q_b)" as printed. [...] marks omitted text. The library states stable computation in reachability form (every configuration reachable from the initial one can reach an output-stable configuration with the right output), with a domain for partial functions, on undirected connected graphs (FORMALIZATION_DIFFERENCES.md, CRN-4).'''

[[source]]
item = "crn:def:majority"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Section 1, the majority problem"
page = 1
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
One of the most natural computational problems in many physical systems is to compute the \emph{majority}, i.e.~to determine accurately which type of an element of the system appears more frequently.
'''
context = '''
[Section 1.1, p. 2:] In this paper we study the majority problem in an \emph{arbitrary} underlying interaction graph $G$, where initially every vertex has two possible states (red and green).
[Section 4, p. 7:] In this section we introduce a symmetric population protocol with $4$ states (called the \emph{ambassador protocol}) which, given an \emph{arbitrary} undirected graph $G=(V,E)$ as the underlying interaction graph of the population, \emph{stably computes} the majority of the types of the vertices of $G$ (even if the majority differs only by one from the minority).
[Theorem 2, p. 8:] Given any (un)directed graph, if there exists initially a majority, then the $4$-state ambassador protocol stably computes the initial majority value.
'''
notes = '''The paper has no formal definition of the majority function; these are the sentences that define it. The library's majority is "red has more agents than green" with red the output true, on the domain of inputs without a tie ("if there exists initially a majority").'''

[[source]]
item = "crn:def:ambassador"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Section 4 and Figure 1, ambassador protocol"
page = 7
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
In this section we introduce a symmetric population protocol with $4$ states (called the \emph{ambassador protocol}) which, given an \emph{arbitrary} undirected graph $G=(V,E)$ as the underlying interaction graph of the population, \emph{stably computes} the majority of the types of the vertices of $G$ (even if the majority differs only by one from the minority). Assuming that the input symbols are $g$ (for green) and $r$ (for red), the set of states in the ambassador protocol is $Q=\{(g,0),(g,1),(r,0),(r,1)\}$. The input function $\iota $ is such that $\iota(g)=(g,1)$ and $\iota(r)=(r,1)$. The output function $\gamma$ is such that $\gamma((g,i))=g$ and $\gamma((r,i))=r$, where $i \in \{0,1\}$. Finally, for simplicity of the presentation, we present the transition function $\delta$ in the form of a table in Figure 1.
\[
\begin{array}{|c|c|c|c|c|}
\hline
u \backslash v & (g,0) & (g,1) & (r,0) & (r,1) \\ \hline
(g,0) & - & \left( (g,1),(g,0)\right) & - & \left((r,1),(r,0)\right) \\ \hline
(g,1) & \left( (g,0),(g,1)\right) & - & \left((g,0),(g,1)\right) & \left((g,0),(r,0)\right) \\ \hline
(r,0) & - & \left( (g,1),(g,0)\right) & - & \left( (r,1),(r,0)\right) \\ \hline
(r,1) & \left( (r,0),(r,1)\right) & \left( (r,0),(g,0)\right) & \left((r,0),(r,1)\right) & - \\ \hline
\end{array}
\]
Figure 1: The transition matrix of the ambassador model.

The transition matrix of Figure 1 can be interpreted as follows. Every row and every column is labeled by a state of $Q$. The cell that belongs to the row labeled with state $q_{1} \in Q$ and to the column labeled with state $q_{2}\in Q$ has either the symbol ``$-$'' or an ordered pair of states $(q'_1, q'_2) \in Q \times Q$. In the cases where this cell has the ordered pair $(q'_1, q'_2)$, then $\delta (q_1,q_2)=(q'_1, q'_2)$, otherwise $\delta (q_1, q_2) = (q_1, q_2)$. Note that the ambassador protocol is defined on undirected interaction graphs, i.e.~in every interaction there is no initiator or responder. That is, whenever $\delta (q_1, q_2)=(q'_1, q'_2)$ then $\delta (q_2, q_1)=(q'_2, q'_1)$.
'''
context = '''
[Section 4, p. 7:] The main idea of the ambassador protocol can be described as follows. The first component of the state of a vertex $u$ denotes the color of $u$. [...] Furthermore, if the second component of the state of $u$ is $1$ (resp. $0$), this is interpreted as ``$u$ has an ambassador'' (resp. ``$u$ has no ambassador''). [...]
\begin{itemize}
\item Assume that $u$ and $v$ have different colors. If both $u$ and $v$ have an ambassador, then they both keep their own colors in the next step, but both their ambassadors disappear (they die during their battle as they are equally ``strong''). If $u$ has an ambassador and $v$ has no ambassador, then $v$ takes the color of $u$ in the next step and the ambassador now moves from $u$ to $v$ (the ambassador wins the battle, as there is no opponent, and leaves vertex $u$ to conquer vertex $v$). If both $u$ and $v$ have no ambassador then their state remains the same at the next step (in this case no battle can take place).
\item Assume that both $u$ and $v$ have the same color; then they both maintain their color in the next step. If they both have (or if they both do not have) an ambassador, then their state remains the same at the next step (there is no battle whenever there is no ambassador, or between ambassadors of the same color). If one of them (say $u$) has an ambassador and the other one (say $v$) does not have one, then the ambassador moves from $u$ to $v$.
\end{itemize}
'''
notes = '''The table is the LaTeX array of the source with spacing commands removed; it was compared cell by cell with the PDF (Figure 1, p. 7). In the PDF the caption reads "Fig. 1. The transition matrix of the ambassador model." In the omitted sentence of the first context paragraph, "whenever u is at state (q,i) (resp. (r,i))" has (q,i) as printed. [...] marks omitted text. The library's states are pairs (color, ambassador bit) with red = true (FORMALIZATION_DIFFERENCES.md, CRN-4).'''

[[source]]
item = "crn:lem:amb-invariant"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Proof of Theorem 2, the invariant"
page = 8
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
One of the crucial invariants of the protocol is that, at any step during its execution the difference between the number of ambassadors of the majority and the minority equals the difference between the initial majority and the initial minority. Indeed, whenever ambassadors disappear, they disappear in pairs, i.e.~one from each color.
'''
context = '''
[Section 4, p. 7:] Assuming that the input symbols are $g$ (for green) and $r$ (for red), the set of states in the ambassador protocol is $Q=\{(g,0),(g,1),(r,0),(r,1)\}$. The input function $\iota $ is such that $\iota(g)=(g,1)$ and $\iota(r)=(r,1)$. The output function $\gamma$ is such that $\gamma((g,i))=g$ and $\gamma((r,i))=r$, where $i \in \{0,1\}$. Finally, for simplicity of the presentation, we present the transition function $\delta$ in the form of a table in Figure 1.
[Section 4, p. 7:] Furthermore, if the second component of the state of $u$ is $1$ (resp. $0$), this is interpreted as ``$u$ has an ambassador'' (resp. ``$u$ has no ambassador'').
'''
notes = '''Quoted from the proof of Theorem 2 (no separate lemma in the paper). Figure 1 is quoted in the crn:def:ambassador entry. The library states the invariant as: the number of ambassadors of each color starts at the input count (every agent starts with an ambassador, iota(c) = (c,1)) and never increases, and the difference red minus green never changes.'''

[[source]]
item = "crn:lem:amb-steps"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Proof of Theorem 2, the two steps"
page = 8
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
For any $k, \ell \geq 0$ denote by $\mathcal{C}_{k, \ell}$ the set of configurations of $G$ with $k$ red ambassadors and $\ell $ green ambassadors. [...]
Therefore, since $G$ is connected and $k,\ell \geq 1$ by assumption, for every configuration in $\mathcal{C}_{k,\ell }$ there exists a chain of transitions that lead to a configuration in $\mathcal{C}_{k-1,\ell -1}$. That is, every configuration in $\mathcal{C}_{k,\ell }$ \emph{can lead} to a configuration in $\mathcal{C}_{k-1,\ell -1}$.
[...]
Note now that, once $G$ has a configuration in $\mathcal{C}_{k-\ell ,0}$, it will stay for ever at a configuration in $\mathcal{C}_{k-\ell ,0}$, since no ambassador can disappear any more. Furthermore note by the definition of the ambassador protocol (cf. Figure~1) that for every configuration in $\mathcal{C}_{k,\ell }$ there exists a chain of transitions that lead to a configuration where all vertices are colored with the color of the initial majority (regardless of whether they have an ambassador or not).
'''
context = '''
[Proof of Theorem 2, p. 8:] First recall that, whenever a vertex $u$ with a red ambassador interacts with a vertex $v$ that has a green ambassador, both the number of red and green ambassadors decrease by one (cf. Figure 1). Furthermore recall that, whenever a vertex $u$ with an ambassador (of any color) interacts with a vertex $v$ that has no ambassador, the ambassador of $u$ is moved to vertex $v$ (and $v$ receives the color of $u$).
[Proof of Theorem 2, p. 8:] Assume that the interaction graph $G$ has $n$ vertices and that the initial majority has cardinality $k$ and the initial minority has cardinality $\ell $, where $k>\ell \geq 1$. Then, as we proved above, $G$ will be led to a configuration in $\mathcal{C}_{k-i,\ell -i}$, for every $i=1,2,\ldots ,\ell $. That is, $G$ will be led in finite steps to a configuration in $\mathcal{C}_{k-\ell ,0}$, i.e.~to a configuration where all $k-\ell \geq 1$ ambassadors are of the color of the initial majority.
'''
notes = '''Quoted from the proof of Theorem 2 (no separate lemma in the paper); [...] marks omitted text. In the last sentence of the statement the configurations are written C_{k,l} as printed, in the paragraph about configurations of C_{k-l,0} (all ambassadors of the majority color); the library's second step assumes that all ambassadors have the same color b and that there is one. LaTeX line breaks inside $\mathcal{C}_{...}$ (lines ending in %) were joined. Figure 1 is quoted in the crn:def:ambassador entry.'''

[[source]]
item = "crn:lem:graph-extend"
