[[source]]
item = "crn:def:crn"
paper = "D. F. Anderson, T. G. Kurtz. Continuous time Markov chain models for chemical reaction networks"
venue = "Design and Analysis of Biomolecular Circuits (H. Koeppl et al., eds.), Springer, 2011"
version = "author preprint"
result = "Section 3, reaction networks"
page = 15
url = "https://people.math.wisc.edu/~dfanderson/papers/SURVEY_AndKurtz.pdf"
status = "transcribed by an AI agent from the PDF of the author preprint (text extraction, formulas checked on the rendered page); no LaTeX source available; not yet checked by a person"
statement = '''
We consider a \emph{network} of $r_0$ chemical reactions involving $s_0$ chemical species, $S_1, \ldots, S_{s_0}$,
\[
\sum_{i=1}^{s_0} \nu_{ik} S_i \rightharpoonup \sum_{i=1}^{s_0} \nu'_{ik} S_i, \qquad k = 1, \ldots, r_0,
\]
where the $\nu_{ik}$ and $\nu'_{ik}$ are nonnegative integers. Let the components of $X(t)$ give the numbers of molecules of each species in the system at time $t$. Let $\nu_k$ be the vector whose $i$th component is $\nu_{ik}$, the number of molecules of the $i$th chemical species consumed in the $k$th reaction, and let $\nu'_k$ be the vector whose $i$th component is $\nu'_{ik}$, the number of molecules of the $i$th species produced by the $k$th reaction. Let $\lambda_k(x)$ be the rate at which the $k$th reaction occurs, that is, it gives the propensity/intensity of the $k$th reaction as a function of the numbers of molecules of the chemical species.
If the $k$th reaction occurs at time $t$, the new state becomes
\[
X(t) = X(t-) + \nu'_k - \nu_k .
\]
'''
notes = '''The copy read is the authors' preprint of the chapter (pp. 3-42 of the book), hosted on the first author's homepage; page numbers are those of this PDF (44 pages), not of the book. The reaction arrow is printed as a right harpoon, rendered \rightharpoonup. The library's reactions are the case of two reactants and two products (A + B -> C + D), see FORMALIZATION_DIFFERENCES.md.'''

[[source]]
items = ["crn:def:propensity", "crn:lem:propensity"]
paper = "D. Doty. Timing in chemical reaction networks"
venue = "SODA 2014"
version = "arXiv:1304.0872v1"
result = "Section 2.2, propensities"
page = 6
url = "https://arxiv.org/abs/1304.0872v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
The kinetic behavior of a CRN is described by a continuous-time Markov process, whose states are configurations of the CRN, as follows.
Given a fixed volume $v > 0$ and current configuration $\vec{c}$, the \emph{propensity} of a unimolecular reaction $\beta : X \overset{k}{\to} \ldots$ in configuration $\vec{c}$ is $\rho(\vec{c}, \beta) = k \vec{c}(X)$.
The propensity of a bimolecular reaction $\beta : X + Y \overset{k}{\to} \ldots$, where $X \neq Y$, is $\rho(\vec{c}, \beta) = \frac{k}{v} \vec{c}(X) \vec{c}(Y)$.
The propensity of a bimolecular reaction $\beta : X + X \overset{k}{\to} \ldots$ is $\rho(\vec{c}, \beta) = \frac{k}{v} \frac{\vec{c}(X) (\vec{c}(X) - 1)}{2}$.
'''
context = '''
[Section 2.1, p. 5:] Given a finite set of chemical species $\Lambda$, a \emph{reaction} over $\Lambda$ is a triple $\beta = ( \vec{r},\vec{p},k ) \in \mathbb{N}^\Lambda \times \mathbb{N}^\Lambda \times \mathbb{R}^+$, specifying the stoichiometry of the reactants and products, respectively, and the \emph{rate constant} $k$.
For instance, given $\Lambda=\{A,B,C\}$, the reaction $A+2B \overset{4.7}{\to} A+3C$ is the triple $((1,2,0),(1,0,3),4.7).$
A \emph{(finite) chemical reaction network (CRN)} is a pair $\mathcal{C}=(\Lambda,R)$, where $\Lambda$ is a finite set of chemical \emph{species}, and $R$ is a finite set of reactions over $\Lambda$.
A \emph{configuration} of a CRN $\mathcal{C}=(\Lambda,R)$ is a vector $\vec{c} \in \mathbb{N}^\Lambda$.
[Section 2.2, p. 6:] A reaction is \emph{unimolecular} if it has one reactant and \emph{bimolecular} if it has two reactants.
We assume no higher-order reactions occur.
'''
notes = '''arXiv v1 is the only arXiv version; the library cites the SODA 2014 paper, Section 2, and its section numbering matches. Macros replaced: \vc -> \vec{c}, \vr -> \vec{r}, \vp -> \vec{p}, \N -> \mathbb{N}, \R -> \mathbb{R}, \calC -> \mathcal{C}. The footnotes after "We assume no higher-order reactions occur." and after the X + X propensity are omitted (the second reads: "Intuitively, rho(c, beta) without the k and v terms counts the number of ways that reactants can collide in order to react (with unimolecular reactants "colliding" with only themselves)."). The library takes the volume v = 1 and writes the X + X propensity as k C(x_X, 2), which is the same quantity. The paper attributes the kinetic model to Gillespie 1977 (see the entry below).'''

