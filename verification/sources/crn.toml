item = "crn:def:semilinear"
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
version = "manuscript of 2005-10-17"
result = "Section 4.2 and proof of Theorem 12"
page = 8
url = "https://cs.yale.edu/homes/aspnes/papers/podc04passive-dc.pdf"
status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction); not yet checked by a person"
statement = '''
[Section 4.2, p. 8:] The predicates definable in Presburger arithmetic are closely related to the semilinear sets. A set $L \subseteq \mathbb{N}^k$ is \textbf{linear} if there are vectors $v_0, v_1, \ldots, v_m \in \mathbb{N}^k$ such that
\[ L = \{ v_0 + \kappa_1 v_1 + \ldots + \kappa_m v_m \mid \kappa_1, \ldots, \kappa_m \in \mathbb{N} \}. \]
A set is \textbf{semilinear} if it is the finite union of linear sets.

\textbf{Theorem 8 (Ginsburg and Spanier)} A subset of $\mathbb{N}^k$ is semilinear iff it is definable in Presburger arithmetic.

[Section 4.2, p. 8:] \textbf{Theorem 10 (Presburger)} Every definable predicate of Presburger arithmetic can be defined in the extended language by a quantifier-free formula.

[Proof of Theorem 12, p. 10:] Given a Presburger formula $\Phi$, apply Theorem 10 to convert it to a quantifier-free formula $\Phi'$ over the extended language described in Section 4.2. This formula $\Phi'$ will be a Boolean formula over predicates that can be written in one of the following three forms:
\begin{align*}
\sum a_i x_i + c_1 &< \sum b_i x_i + c_2 \qquad (1)\\
\sum a_i x_i + c_1 &= \sum b_i x_i + c_2 \qquad (2)\\
\sum a_i x_i + c_1 &\equiv_m \sum b_i x_i + c_2 \qquad (3)
\end{align*}
'''
context = '''
[Section 4.2, p. 7:] Presburger arithmetic is the first-order theory of the integers under addition and less than. [...] The usual definition of Presburger arithmetic considers a first-order logical language with one function symbol ``$+$'', constants ``0'' and ``1'', predicate symbols ``$=$'' and ``$<$'', the usual logical operators of ``$\wedge$'', ``$\vee$'', and ``$\neg$'', variables $x_1, x_2, \ldots$, and quantifiers ``$\forall$'' and ``$\exists$''. Formulas are interpreted with quantifiers ranging over the integers.
[Section 4.2, p. 8:] Let $m$ be a constant, and let $\equiv_m$ be the 2-place predicate such that $x \equiv_m y$ holds iff $x \equiv y \pmod{m}$. [...] Let \textbf{extended Presburger arithmetic} result from augmenting Presburger arithmetic with relation symbols $\equiv_m$ denoting equivalence modulo $m$, for $m \ge 2$.
'''
notes = '''No single definition in the source: the library defines its class as the Boolean combinations of threshold predicates sum a_i x_i < c and remainder predicates sum a_i x_i = c (mod m), following the proof of Theorem 5 of the published article (Theorem 12 of the manuscript read here), where the equalities (2) are written as conjunctions of two inequalities and (1), (3) are rewritten as sum d_i x_i < c and sum d_i x_i =_m c. Theorems 8 and 10 of the manuscript are Theorems 3 and 4 of the published article in the library's citations (StableSemilinear.lean); correspondence by content. That the class equals the semilinear predicates is not proved in the library (FORMALIZATION_DIFFERENCES.md, CRN-3, item 6). The excerpts are given in reading order, [...] marking omitted text.'''

[[source]]
item = "crn:thm:semilinear"
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
version = "manuscript of 2005-10-17"
result = "Theorem 12 (Theorem 5 in the article)"
page = 10
url = "https://cs.yale.edu/homes/aspnes/papers/podc04passive-dc.pdf"
status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction); not yet checked by a person"
statement = '''
\textbf{Theorem 12} Any Presburger-definable predicate on nonnegative integers is stably computable in the family of standard populations under the symbol-count input convention.
'''
context = '''
[Section 3.3, p. 4:] Let $\mathcal{P}_n$ be the population of size $n$ consisting of the complete interaction graph on the specific agent set $A_n = \{1, \ldots, n\}$. We call $A_n$ the \textbf{standard agent set} and $\mathcal{P}_n$ the \textbf{standard population} of size $n$.
[Section 3.4, p. 5:] The \textbf{symbol-count input convention} assumes an arbitrary input alphabet $X = \{\sigma_1, \ldots, \sigma_k\}$ and $D_I = \mathbb{N}^k$. The $k$-tuple represented by an assignment $x \in \mathcal{X}$ is $E_I(x) = (n_1, \ldots, n_k)$, where $n_i$ is the number of agents to which $x$ assigns $\sigma_i$.
[Section 4.2, p. 8:] A formula $\phi(x_1, \ldots, x_k)$ with free variables $x_1, \ldots, x_k$ defines a predicate $F_\phi : \mathbb{Z}^k \to \{0, 1\}$ as follows: For integers $u_1, \ldots, u_k$, $F_\phi(u_1, \ldots, u_k) = 1$ if $\phi(x_1, \ldots, x_k)$ evaluates to true when $x_1, \ldots, x_k$ are interpreted as $u_1, \ldots, u_k$, respectively, and $F_\phi(u_1, \ldots, u_k) = 0$ otherwise.
[Section 4.2, p. 8:] A set $L \subseteq \mathbb{N}^k$ is \textbf{linear} if there are vectors $v_0, v_1, \ldots, v_m \in \mathbb{N}^k$ such that $L = \{ v_0 + \kappa_1 v_1 + \ldots + \kappa_m v_m \mid \kappa_1, \ldots, \kappa_m \in \mathbb{N} \}$. A set is \textbf{semilinear} if it is the finite union of linear sets.
\textbf{Theorem 8 (Ginsburg and Spanier)} A subset of $\mathbb{N}^k$ is semilinear iff it is definable in Presburger arithmetic.
'''
notes = '''The library cites the published article's numbering (Theorem 5, with Lemmas 3 and 5); in the authors' journal manuscript of October 17, 2005 (the open copy read) it is Theorem 12 of Section 4.3, correspondence by content. The library proves the theorem for its class of Boolean combinations of threshold and remainder predicates and shows that their truth sets are semilinear (see crn:def:semilinear and FORMALIZATION_DIFFERENCES.md, CRN-3, item 6). The definition of stably computing a predicate is quoted in the crn:def:stable entry.'''

[[source]]
item = "crn:def:crn-stable"
paper = "H.-L. Chen, D. Doty, D. Soloveichik. Deterministic function computation with chemical reaction networks"
venue = "Natural Computing 13(4):517-534, 2014"
version = "arXiv:1204.4176v3"
result = "Section 2.2, chemical reaction deciders"
page = 8
url = "https://arxiv.org/abs/1204.4176v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
A \emph{chemical reaction decider} (CRD) is a tuple $\mathcal{D}=(\Lambda,R,\Sigma,\Upsilon,\phi,\sigma)$, where $(\Lambda,R)$ is a CRN, $\Sigma \subseteq \Lambda$ is the \emph{set of input species}, $\Upsilon \subseteq \Lambda$ is the set of \emph{voters}, $\phi:\Upsilon\to\{0,1\}$ is the \emph{(Boolean) output function}, and $\sigma \in \mathbb{N}^{\Lambda \setminus \Sigma}$ is the \emph{initial context}.
An input to $\mathcal{D}$ will be a vector $\vec{i}_0\in\mathbb{N}^\Sigma$ (equivalently, $\vec{i}_0\in\mathbb{N}^k$ if we write $\Sigma = \{X_1,\ldots,X_k\}$ and assign $X_i$ to represent the $i$'th coordinate).
Thus a CRD together with an input vector defines an initial configuration $\vec{i}$ defined by $\vec{i}(X) = \vec{i}_0(X)$ if $X \in \Sigma$, and $\vec{i}(X) = \sigma(X)$ otherwise.
We say that such a configuration is a \emph{valid initial configuration}, i.e., $\vec{i} \upharpoonright (\Lambda \setminus \Sigma) = \sigma$.

We extend $\phi$ to a partial function $\Phi:\mathbb{N}^\Lambda \dashrightarrow \{0,1\}$ as follows.
$\Phi(\vec{c})$ is undefined if either $\vec{c}(X) = 0$ for all $X \in \Upsilon$, or if there exist $X_0,X_1 \in \Upsilon$ such that $\vec{c}(X_0) > 0$, $\vec{c}(X_1) > 0$, $\phi(X_0)=0$ and $\phi(X_1)=1$.
Otherwise, there exists $b\in\{0,1\}$ such that $(\forall X \in \Upsilon) (\vec{c}(X)>0 \implies \phi(X)=b)$; in this case, the \emph{output} $\Phi(\vec{c})$ of configuration $\vec{c}$ is $b$.

A configuration $\vec{c}$ is \emph{output stable} if $\Phi(\vec{c})$ is defined and, for all $\vec{c}'$ such that $\vec{c} \to^* \vec{c}'$, $\Phi(\vec{c}') = \Phi(\vec{c})$.
We say a CRD $\mathcal{D}$ \emph{stably decides} the predicate $\psi:\mathbb{N}^\Sigma \to \{0,1\}$ if, for any valid initial configuration $\vec{i} \in \mathbb{N}^\Lambda$ with $\vec{i} \upharpoonright \Sigma = \vec{i}_0$, for all configurations $\vec{c}\in\mathbb{N}^\Lambda$, $\vec{i} \to^* \vec{c}$ implies $\vec{c}\to^*\vec{c}'$ such that $\vec{c}'$ is output stable and $\Phi(\vec{c}') = \psi(\vec{i}_0)$.
Note that this condition implies that no incorrect output stable configuration is reachable from $\vec{i}$.
We say that $\mathcal{D}$ \emph{stably decides} a set $A\in\mathbb{N}^k$ if it stably decides its indicator function.
'''
context = '''
[Section 2.1, p. 7:] A \emph{(finite) chemical reaction network (CRN)} is a pair $N=(\Lambda,R)$, where $\Lambda$ is a finite set of chemical \emph{species}, and $R$ is a finite set of reactions over $\Lambda$.
A \emph{configuration} of a CRN $N=(\Lambda,R)$ is a vector $\vec{c} \in \mathbb{N}^\Lambda$.
[Section 2.1, p. 7:] Given a configuration $\vec{c}$ and reaction $\alpha=\left\langle \mathbf{r}, \mathbf{p} \right\rangle$, we say that $\alpha$ is \emph{applicable} to $\vec{c}$ if $\mathbf{r} \leq \vec{c}$ (i.e., $\vec{c}$ contains enough of each of the reactants for the reaction to occur).
If $\alpha$ is applicable to $\vec{c}$, then write $\alpha(\vec{c})$ to denote the configuration $\vec{c} + \mathbf{p} - \mathbf{r}$ (i.e., the configuration that results from applying reaction $\alpha$ to $\vec{c}$).
If $\vec{c}'=\alpha(\vec{c})$ for some reaction $\alpha \in R$, we write $\vec{c} \to_N \vec{c}'$, or merely $\vec{c} \to \vec{c}'$ when $N$ is clear from context.
[...]
If a finite execution sequence starts with $\vec{c}$ and ends with $\vec{c}'$, we write $\vec{c} \to_N^* \vec{c}'$, or merely $\vec{c} \to^* \vec{c}'$ when the CRN $N$ is clear from context.
In this case, we say that $\vec{c}'$ is \emph{reachable} from $\vec{c}$.
'''
notes = '''arXiv v3 (January 2013) is the latest arXiv version; the library cites the Natural Computing article, Sections 2.1-2.2, and Theorem 2.1, which match the section and theorem numbers of v3 (the journal version was not compared). Macros replaced: \calD -> \mathcal{D}, \vi -> \vec{i}, \vc -> \vec{c}, \bfr -> \mathbf{r}, \bfp -> \mathbf{p}, \pair{a}{b} -> \left\langle a, b \right\rangle, \rest -> \upharpoonright, \N -> \mathbb{N}. "a set A \in N^k" as printed. Footnote 2, after "voters", is omitted; it reads: "The definitions of [3] assume that Upsilon = Lambda (i.e., every species votes). However, it is not hard to show that we may assume there are only two voting species, L^0 and L^1, [...]" ([3] = Angluin, Aspnes, Eisenstat, PODC 2006). The library uses the convention of [3]: every species votes, no initial context (leaderless), an injective input map, and the zero input excluded (FORMALIZATION_DIFFERENCES.md, CRN-3, item 9); see also the next entry.'''

[[source]]
item = "crn:def:crn-stable"
paper = "D. Angluin, J. Aspnes, D. Eisenstat. Stably computable predicates are semilinear"
venue = "PODC 2006, pp. 292-299"
version = "PODC 2006 proceedings"
result = "Sections 2.1-2.2, stable computation"
page = 3
url = "https://cs.yale.edu/homes/aspnes/papers/podc2006-proceedings.pdf"
status = "transcribed by an AI agent from the PDF of the proceedings version on J. Aspnes's homepage (text extraction); no LaTeX source available; not yet checked by a person"
statement = '''
[Section 2.2:] We now define what it means for a protocol to stably compute a predicate. For $j = 0, 1$ we define
\[ S_j := \{ c \in C \mid \text{if } c \to c' \text{ then } \gamma(c') = \{j\} \}. \]
Then $S := S_0 \cup S_1$ is the set of output stable configurations. Let $\psi$ be a predicate on $W$, that is, a mapping from $W$ to $\{0, 1\}$. The support of $\psi$ is $\psi^{-1}(1)$, that is, the set of inputs that $\psi$ maps to 1. The given protocol stably computes $\psi$ if for all $x \in W$ and for all $c \in C$, if $x \to c$ there exists $c' \in S_{\psi(x)}$ such that $c \to c'$. That is, if input $x$ reaches any configuration $c$, then there is a configuration $c'$ reachable from $c$ that is output stable and has output $\psi(x)$. This incorporates the notion of a fair computation[2]. A predicate $\psi$ is stably computable if there exists a protocol that stably computes $\psi$.
'''
context = '''
[Section 2.1, p. 3:] A \textbf{protocol} is a 4-tuple $(Q, -\to, -\Sigma, \gamma)$, with the following components. $Q$ is a finite set of \textbf{states}, which generalize both states and messages from previous models. A \textbf{configuration} is a nonempty multiset of states. We identify $C := \mathbb{N}^Q \setminus \{0\}$, the set of nonzero $|Q|$-tuples of nonnegative integers indexed by $Q$, with the set of all configurations. The usual inclusion ordering on $C$ is denoted $\le$.
The \textbf{reachability relation} $\to$ is an ordering on $C$. Specifically, we require that $\to$ be a reflexive, transitive relation that respects addition in $\mathbb{N}^Q$; that is $c \to c'$ implies $c + d \to c' + d$ for all $c, c' \in C$ and $d \in \mathbb{N}^Q$. Intuitively, that $\to$ respects addition implies that interactions can take place in the presence of other agents. Note that unlike in the standard population protocol model, a configuration may reach configurations with different cardinality.
$\Sigma \subseteq Q$ is a finite set of \textbf{input symbols}. An \textbf{input} is a nonempty multiset of input symbols. Analogously, we identify $W := \mathbb{N}^\Sigma \setminus \{0\}$ with the set of all inputs. Finally, $\gamma$ is an \textbf{output function}, mapping $Q$ to $\{0, 1\}$. We extend $\gamma$ to map $C$ to nonempty subsets of $\{0, 1\}$ in the obvious manner by defining
\[ \gamma(c) := \{ j \in \{0, 1\} \mid \exists q \in Q : \gamma(q) = j \text{ and } c[q] \ge 1 \}. \]
'''
notes = '''Proceedings version (8 pages) as hosted by the second author. The library cites this paper for the "every species votes" convention of its stable decision by a network (StableCrn.lean): an output-stable configuration is one in which every present state has the same output. Both sections are on p. 3. [2] is the paper's reference to Angluin, Aspnes, Diamadi, Fischer, Peralta (PODC 2004). "fair computation[2]" (no space) as printed. The 4-tuple is printed "(Q, - ->, -Sigma, gamma)", with a minus sign before the arrow and before Sigma; kept as printed. Bold defined terms rendered \textbf.'''

