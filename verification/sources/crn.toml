statement = '''
\textbf{Theorem 7.} Algorithm Relative-Majority computes relative majority on population with at most $2^k$ colours with the help of $O(k)$ memory bits in each entity.
'''
context = '''
[Section 5, p. 10:] As in Section 4, in this section we assume that the population is attributed with an arbitrary number $C$ of colours, where $2^{k-1} < C \le 2^k$, for some integer $k \ge 1$ that is known to all entities. Each colour is denoted by a $k$-bit label $l[0..k-1]$, where $l[i] \in \{-1, 1\}$.
[Section 5, p. 10:] The relative majority problem refers to the task of finding the most frequent colour in the population. Note that there can be more than one colour that is the most frequent. In such case the colour with the latest in the lexicographical order label $l^*[0..k-1]$ is declared as the winner.
[Section 5, p. 10:] At first we describe a protocol for the relative majority which only finds the winner $l^*[0..k-1]$. This is done by marking all entities possessing this colour with the winning label. In this setting, the colour in the relative majority always exists. The case in which the uniqueness of the majority colour is required is commented later in Section 5.2.
[Section 1.2, p. 4:] In Section 5 we propose a multistage $O(k)$-bit protocol for relative majority, where all most frequent colours eventually become aware of their dominance, and all nodes learn about the most frequent colour with the largest label.
'''
notes = '''The algorithm is quoted in the crn:def:em-relative entry. The library formalizes the theorem as the protocol of Section 5.1 computes it: eventually and forever every agent outputs whether its own colour is the winner (it marks the agents of the winning colour), with 2^k 8^k = 2^(4k) states; dissemination of the winner's label to all agents (Section 1.2) and the uniqueness mechanism of Section 5.2 are not formalized (FORMALIZATION_DIFFERENCES.md, CRN-5, item 6).'''
