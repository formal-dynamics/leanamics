items = ["crn:thm:threshold", "crn:thm:remainder"]
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
