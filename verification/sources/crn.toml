[[source]]
item = "crn:def:protocol"
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
version = "manuscript of 2005-10-17"
result = "Section 3.1, population protocols"
page = 3
url = "https://cs.yale.edu/homes/aspnes/papers/podc04passive-dc.pdf"
status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction, checked on the rendered page); not yet checked by a person"
statement = '''
A \textbf{population protocol} $\mathcal{A}$ consists of finite \textbf{input and output alphabets} $X$ and $Y$, a finite set of \textbf{states} $Q$, an \textbf{input function} $I : X \to Q$ mapping inputs to states, an \textbf{output function} $O : Q \to Y$ mapping states to outputs, and a \textbf{transition function} $\delta : Q \times Q \to Q \times Q$ on pairs of states. If $\delta(p,q) = (p',q')$, we call $(p,q) \mapsto (p',q')$ a \textbf{transition}, and we define $\delta_1(p,q) = p'$ and $\delta_2(p,q) = q'$.

A \textbf{population} $\mathcal{P}$ consists of a set $A$ of $n$ \textbf{agents} together with an irreflexive relation $E \subseteq A \times A$ that we interpret as the directed edges of an \textbf{interaction graph}. $E$ describes which agents may interact during the computation. Intuitively, an edge $(u,v) \in E$ means that $u$ and $v$ are able to interact, with $u$ playing the role of \textbf{initiator} and $v$ playing the role of \textbf{responder} in the interaction. [...] Though most of the present paper concerns the case in which $E$ consists of all ordered pairs of distinct elements from $A$, which is termed the \textbf{complete interaction graph}, we give definitions appropriate for general $E$.

A \textbf{population configuration} is a mapping $C : A \to Q$ specifying the state of each member of the population. Let $C$ and $C'$ be population configurations, and let $u, v$ be distinct agents. We say that $C$ goes to $C'$ via \textbf{encounter} $e = (u,v)$, denoted $C \xrightarrow{e} C'$, if
\begin{align*}
C'(u) &= \delta_1(C(u), C(v))\\
C'(v) &= \delta_2(C(u), C(v))\\
C'(w) &= C(w) \text{ for all } w \in A - \{u, v\}.
\end{align*}
We say that $C$ can go to $C'$ in one step, denoted $C \to C'$, if $C \xrightarrow{e} C'$ for some encounter $e \in E$, and we call $C \to C'$ a \textbf{transition}. We write $C \xrightarrow{*} C'$ if there is a sequence of configurations $C = C_0, C_1, \ldots, C_k = C'$, such that $C_i \to C_{i+1}$ for all $i$, $0 \le i < k$, in which case we say that $C'$ is \textbf{reachable} from $C$.
'''
notes = '''The library cites the published article (Distributed Computing 18, 2006), Section 3.1; the open copy read is the authors' journal manuscript of October 17, 2005, from J. Aspnes's homepage, whose Section 3 has the same section numbers as the library's citations (the published article was not available to compare). Script letters (the protocol and the population) are rendered \mathcal{A}, \mathcal{P}; bold defined terms as \textbf. Footnote 1 after "agents" is omitted ("Note that we distinguish typographically between a protocol \mathcal{A} and an agent set A."). [...] marks two omitted sentences on the asymmetry of the roles and a paragraph with an example. The library's standard populations use the complete interaction graph (Section 3.3, see crn:def:stable).'''

[[source]]
item = "crn:def:stable"
paper = "D. Angluin, J. Aspnes, Z. Diamadi, M. J. Fischer, R. Peralta. Computation in networks of passively mobile finite-state sensors"
venue = "Distributed Computing 18(4):235-253, 2006"
version = "manuscript of 2005-10-17"
result = "Sections 3.2-3.4, stable computation"
page = 4
url = "https://cs.yale.edu/homes/aspnes/papers/podc04passive-dc.pdf"
status = "transcribed by an AI agent from the PDF of the authors' journal manuscript dated October 17, 2005 (text extraction); not yet checked by a person"
statement = '''
[Section 3.2, p. 4:] A configuration $C$ is said to be \textbf{output-stable} if $y_{C'} = y_C$ for all $C'$ reachable from $C$. Note that we do not require that $C' = C$, only that the output be the same. An infinite computation \textbf{converges} if it contains an output-stable configuration $C$, in which case we say that it converges (or stabilizes) to output $y = y_C$. [...] We say a protocol $\mathcal{A}$ is \textbf{always-convergent} if every computation on every input $x$ converges. [...]
An always-convergent population protocol $\mathcal{A}$ running in a population $\mathcal{P}$ \textbf{stably computes} an input-output relation $R_{\mathcal{A}}$ as follows. For each $x \in \mathcal{X}$ and $y \in \mathcal{Y}$, $R_{\mathcal{A}}(x,y)$ holds iff there is a computation of $\mathcal{A}$ beginning in configuration $C_x$ that stabilizes to output $y$. In the special case that $R_{\mathcal{A}}$ is single-valued, we write $F_{\mathcal{A}}(x) = y$ for $R_{\mathcal{A}}(x,y)$ and say that $\mathcal{A}$ stably computes the function $F_{\mathcal{A}}$.

[Section 3.4, p. 6:] Let $E_I$ be an input encoding convention over $D_I$, and let $E_O$ be the all-agents predicate output convention. We say that protocol $\mathcal{A}$ \textbf{stably computes a predicate} on $D_I$ if $\mathcal{A}$ stably computes a total function $G_{\mathcal{A}} : D_I \to D_O$ and $G_{\mathcal{A}}(u) \ne \bot$ for any $u \in D_I$. Thus, every computation of $\mathcal{A}$ converges to an output in which all agents have the same output value 0 or 1.
'''
context = '''
[Section 3.1, p. 3:] An \textbf{execution} is a finite or infinite sequence of population configurations $C_0, C_1, C_2, \ldots$ such that for each $i$, $C_i \to C_{i+1}$. An infinite execution is \textbf{fair} if for every possible transition $C \to C'$, if $C$ occurs infinitely often in the execution, then $C'$ occurs infinitely often. A \textbf{computation} is an infinite fair execution.
[Section 3.2, p. 4:] Formally, an \textbf{input assignment} is a function $x : A \to X$, where $A$ is the set of agents in the population. We let $\mathcal{X} = X^A$ denote the set of all input assignments. The input assignment determines the initial configuration of the protocol. Namely, if $x \in \mathcal{X}$, then the protocol begins in configuration $C_x$, where $C_x(w) = I(x(w))$ for all agents $w$.
An \textbf{output assignment} is a function $y : A \to Y$. We let $\mathcal{Y} = Y^A$ denote the set of all output assignments. Each configuration $C$ determines an output assignment $y_C$, where $y_C(w) = O(C(w))$ for all agents $w$.
[Section 3.3, p. 4:] We now define a family of populations $\{\mathcal{P}_n\}_{n \in \mathbb{N}}$ of particular interest. Let $\mathcal{P}_n$ be the population of size $n$ consisting of the complete interaction graph on the specific agent set $A_n = \{1, \ldots, n\}$. We call $A_n$ the \textbf{standard agent set} and $\mathcal{P}_n$ the \textbf{standard population} of size $n$.
[Section 3.4, p. 4-5:] We say that $\mathcal{A}$ stably computes $S_{\mathcal{A}}$ if $\mathcal{A}$ is always-convergent and representative independent. [...]
The \textbf{symbol-count input convention} assumes an arbitrary input alphabet $X = \{\sigma_1, \ldots, \sigma_k\}$ and $D_I = \mathbb{N}^k$. The $k$-tuple represented by an assignment $x \in \mathcal{X}$ is $E_I(x) = (n_1, \ldots, n_k)$, where $n_i$ is the number of agents to which $x$ assigns $\sigma_i$. Note that the $k$-tuple $(n_1, \ldots, n_k)$ is only representable in a population of size $n = \sum_i n_i$.
[Section 3.4, p. 5:] \textbf{Predicates.} A predicate can be regarded as a function whose output is a truth value. The \textbf{all-agents predicate output convention} assumes $Y = \{0,1\}$ and requires every agent to agree on the output. Formally, let $\mathbf{0}(w) = 0$ and $\mathbf{1}(w) = 1$ be constant output assignments in $\mathcal{Y}$, and let $D_O = \{\mathrm{false}, \mathrm{true}, \bot\}$. We define
\[
E_O(y) = \begin{cases} \mathrm{false} & \text{if } y = \mathbf{0}\\ \mathrm{true} & \text{if } y = \mathbf{1}\\ \bot & \text{otherwise.}\end{cases}
\]
Thus, every output assignment in which the agents do not agree represents $\bot$.
'''
notes = '''Same copy as crn:def:protocol (journal manuscript of October 17, 2005; the library cites the published article, Sections 3.2-3.4, whose section numbers the manuscript shares). The statement is given by excerpts in reading order, [...] marking omitted text. Script letters rendered \mathcal; the bold 0 and 1 of the constant output assignments rendered \mathbf. Lemma 1 (Section 3.1) shows that the configurations occurring infinitely often in a computation form a final strongly connected component of the transition graph; the library uses the reachability form of stable computation instead (see the AAER07 and AAE06 entries and FORMALIZATION_DIFFERENCES.md, CRN-3, item 1).'''

[[source]]
item = "crn:def:stable"
paper = "D. Angluin, J. Aspnes, D. Eisenstat, E. Ruppert. The computational power of population protocols"
venue = "Distributed Computing 20(4):279-304, 2007"
version = "arXiv:cs/0608084v1"
result = "Section 4, stable computation"
page = 6
url = "https://arxiv.org/abs/cs/0608084v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
A configuration $c$ is \textbf{output stable with output} $b$ if $O(c) = b$ and for every $d$ such that $c \stackrel{*}{\rightarrow} d$, $O(d) = b$.
We define $\mathcal{S}_b$ to be the set of configurations that are output stable with output $b$, for $b \in \{0,1\}$, and define $\mathcal{S} = \mathcal{S}_0 \cup \mathcal{S}_1$ to be the set of all \textbf{output stable} configurations.
[...]
A fair execution $c_0,c_1,\ldots$ \textbf{converges with output $b$} if there exists an $m$ such that for all $j \ge m$, the function $O$ is defined on $c_j$ and $O(c_j) = b$.
In particular, a fair execution converges with output $b$ if and only if it reaches an output stable configuration with output $b$.
A protocol is \textbf{well-specified} if, for all initial configurations $c_0 \in I(\operatorname{Pop}(\Sigma))$, there exists a $b$ such that all fair executions $c_0,c_1,\ldots$ converge with output $b$.
In a well-specified protocol, every fair execution starting from an input configuration converges with an output that is determined by that input configuration.
A well-specified protocol induces a predicate $\psi : \operatorname{Pop}(\Sigma) \rightarrow \{0,1\}$.
We say that this protocol \textbf{stably computes} $\psi$.
'''
context = '''
[Section 1.1, p. 2:] Semilinearity is strongly tied to the notion of stable computation, in which a correct and stable output configuration must always be reachable at any step of the computation.
[Section 3, p. 5:] Next we define the set of \textbf{populations} on $E$:
\[ \operatorname{Pop}(E) := \mathbb{N}^E \setminus \{0\}. \]
[Section 4, p. 6:] In each of the models we consider, a \textbf{protocol} can be considered as determining five components: a countable set $\mathcal{C}$ of \textbf{configurations}; a set of \textbf{input symbols} $\Sigma$; a binary relation $\rightarrow$ on $\mathcal{C}$ that captures when the first configuration \textbf{can reach} the second in one step; a function $I:\operatorname{Pop}(\Sigma)\rightarrow\mathcal{C}$ that takes inputs to \textbf{initial} configurations; and a partial function $O:\mathcal{C}\rightarrow\{0,1\}$ that gives the \textbf{output} of each configuration on which it is defined.
We take $\stackrel{*}{\rightarrow}$ to be the reflexive-transitive closure of $\rightarrow$.
We say $c'$ is \textbf{reachable} from $c$ if $c \stackrel{*}{\rightarrow} c'$.
[Section 4, p. 6:] An \textbf{execution} is a (finite or infinite) sequence of configurations $c_0,c_1,\ldots$ such that for all $j$, we have $c_j \rightarrow c_{j+1}$.
An execution $c_0,c_1,\ldots$ is \textbf{fair} if for all $c' \in \mathcal{C}$, either there exist infinitely many $j$ such that $c_j = c'$ or there exists $j$ such that $c_j \not\stackrel{*}{\rightarrow} c'$.
[Section 5.1, p. 7:] $O(c) := b$ if for all $q\in Q$, $c(q) \ge 1 \Rightarrow o(q) = b$.
'''
notes = '''The library cites AAER07 for the reachability form of stable computation (StableBasic.lean, FORMALIZATION_DIFFERENCES.md CRN-3 item 1): the paper's definition is through fair executions (statement), and the reachability reading is the sentence of Section 1.1 quoted first in the context. Macros replaced: \concept{.} -> \textbf{.}, \globaloutputmap -> O, \localoutputmap -> o, \reaches -> \stackrel{*}{\rightarrow}, \stable -> \mathcal{S}, \configs -> \mathcal{C}, \inputsymbols -> \Sigma, \predicate -> \psi, \Population -> \operatorname{Pop}, \N -> \mathbb{N}; "c_j \not\reaches c'" rendered \not\stackrel{*}{\rightarrow}. [...] marks omitted text. The last context line is the output map of the two-way model (Section 5.1, "Two-way"; c is a multiset of states, o the individual output function). Section numbers are those of the PDF (the LaTeX source has unnumbered labels).'''

