item = "crn:def:em-relative"
paper = "L. Gąsieniec, D. Hamilton, R. Martin, P. G. Spirakis, G. Stachowiak. Deterministic population protocols for exact majority and plurality"
venue = "OPODIS 2016, LIPIcs 70, 14:1-14:14"
version = "LIPIcs.OPODIS.2016.14"
result = "Section 5, Algorithm Relative-Majority"
page = 10
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction); no LaTeX source available; not yet checked by a person"
statement = '''
[Section 5, p. 10:] The relative majority problem refers to the task of finding the most frequent colour in the population. Note that there can be more than one colour that is the most frequent. In such case the colour with the latest in the lexicographical order label $l^*[0..k-1]$ is declared as the winner. [...]
Stages are enumerated by descending numbers from the lowest stage $k-1$ to the highest 0. In stage $i$, for all $i = k-1, .., 0$, two colours are in the same group if their $k$-bit labels $l[0..k-1]$ share $i$-bit prefix $l[0..i-1]$ (in stage 0 all labels form one group). In this stage agents in one group aim at finding the majority colour label in each group.

\textbf{Memory organisation.} Each entity $a \in A$ uses $O(k)$ bits of memory to accommodate:
\begin{enumerate}
\item The $k$-bit label $l[0..k-1]$ representing the original colour of the entity. This colour is fixed (never changed) throughout the computation process.
\item The $k$-bit label $c[0..k-1]$ represents current colours $c[i]$ of the entity in each consecutive stage $i$, with the decreasing index $i = k-1, .., 0$. On the conclusion of stage $i$, if label $l[0..k-1]$ is declared as the winner in the group of labels with prefix $l[0..i]$, the value $c[i]$ equals to $\pm 1$, otherwise $c[i] = 0$. All entities with the winning colour $l[0..k-1]$ in its group in higher stage $i-1$ have the value $c[i]$ set to $l[i]$. Before the stabilisation of $P_2(i-1)$ the value $c[i]$ reflects the current belief of the entity about this value.
\item An array $s[0..k-1]$ representing states $s[i]$ in $k$ independent instances of protocol $P_2(i)$ associated with colours $c[i]$. The computations with respect to $P_2(i)$ are performed only if the two interacting entities have the same label prefix $l[0..i-1]$. Otherwise protocol $P_2(i)$ is not executed. We emphasise here that computations in $P_2(i)$ can change values $c[i-1]$ whose change in turn cause alteration of states $s[i-1]$. Also, changes in $c[i]$ can change $c[i-1]$.
\end{enumerate}

[Section 5.1, p. 11:] \textbf{Algorithm Relative-Majority}

\emph{Initialisation Stage}
Before execution of the algorithm, each entity sets $c[i] = l[i]$ and $s[i] = [1]$ if $c[i] = 1$ and $[-1]$ otherwise, for all $i = 0, .., k-1$.

\emph{Stabilisation Stage}
\begin{enumerate}
\item The algorithm stabilises first on protocol $P_1(k-1)$, as at the beginning of the pipeline there is no external force, and then subsequently on protocols $P_2(k-2), P_2(k-3), \ldots, P_2(0)$.
\item An entity believes that its colour wins on stage $i$ if, either $c[i] = -1$ and $s[i] \in \{[-1], [-2], \langle -1 \rangle\}$, or $c[i] = 1$ and $s[i] \in \{[0], [1], [2], \langle 0 \rangle, \langle 1 \rangle\}$. The states $[0], \langle 0 \rangle$ correspond to a tie and in this case the lexicographically larger label becomes the winner. If the entity believes its label $l[0..k-1]$ is the winner in stage $i$, it sets $c[i-1] = l[i-1]$ and adjusts $s[i-1]$ as specified in protocol $P_2(i-1)$ if $c[i-1]$ gets changed. If, to the contrary, the entity believes it did not win, it sets $c[i-1] = 0$ and also adjusts $s[i-1]$ should change occur in $c[i-1]$. Note, that in both cases changes in $c[i-1]$ are propagated to $c[i-2]$ and further on.
\item Eventually protocol $P_2(0)$ stabilizes. At that time entities that win in stage 0 hold the winning majority colour.
\end{enumerate}
'''
context = '''
[Section 5, p. 10:] As in Section 4, in this section we assume that the population is attributed with an arbitrary number $C$ of colours, where $2^{k-1} < C \le 2^k$, for some integer $k \ge 1$ that is known to all entities. Each colour is denoted by a $k$-bit label $l[0..k-1]$, where $l[i] \in \{-1, 1\}$.
[Section 5, p. 10:] At first we describe a protocol for the relative majority which only finds the winner $l^*[0..k-1]$. This is done by marking all entities possessing this colour with the winning label. In this setting, the colour in the relative majority always exists.
[Section 5, p. 10:] In each stage the winning colours perform pairwise duels via majority protocols to reduce the number of winners by half.
'''
notes = '''Memory organisation spans pp. 10-11. [...] marks omitted text. "i = k - 1, .., 0" as printed. The library derives the colours c[i] from the label and the states of the stages above i instead of storing them, uses P_2 with constant colours at stage k - 1 (the text writes P_1(k - 1) in Stabilisation Stage 1), and breaks ties in favour of the lexicographically largest label with l[0] the most significant bit (FORMALIZATION_DIFFERENCES.md, CRN-5, item 5).'''

[[source]]
item = "crn:lem:em-duel"
paper = "L. Gąsieniec, D. Hamilton, R. Martin, P. G. Spirakis, G. Stachowiak. Deterministic population protocols for exact majority and plurality"
venue = "OPODIS 2016, LIPIcs 70, 14:1-14:14"
version = "LIPIcs.OPODIS.2016.14"
result = "Proof of Theorem 7, the inductive step"
page = 11
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction, checked on the rendered page); no LaTeX source available; not yet checked by a person"
statement = '''
Now let $i > k-1$ be a stage number. By inductive hypothesis in some time $t_{i+1}$, protocols $P_2(i+1)$ stabilize and states $s[i+1]$ stop being changed. They indicate unique winning $k$-bit colours in groups corresponding to each prefix $l[0..i]$. So, since $t_{i+1}$ colours $c[i]$ are $\pm 1$ for these winners, 0 for others and do not change anymore. Thus, in some later time $t_i$, protocols $P_2(i)$ stabilize and states $s[i]$ cease being changed. From the formulation of the protocol these final states $s[i]$ determine the winning $k$-bit colours in groups corresponding to prefixes $l[0..i-1]$.
'''
context = '''
[Section 5.1, p. 11:] An entity believes that its colour wins on stage $i$ if, either $c[i] = -1$ and $s[i] \in \{[-1], [-2], \langle -1 \rangle\}$, or $c[i] = 1$ and $s[i] \in \{[0], [1], [2], \langle 0 \rangle, \langle 1 \rangle\}$. The states $[0], \langle 0 \rangle$ correspond to a tie and in this case the lexicographically larger label becomes the winner.
[Section 5, p. 10:] The relative majority problem refers to the task of finding the most frequent colour in the population. Note that there can be more than one colour that is the most frequent. In such case the colour with the latest in the lexicographical order label $l^*[0..k-1]$ is declared as the winner.
'''
notes = '''Quoted from the proof of Theorem 7. "let i > k - 1" as printed; the library reads it as i < k - 1 (FORMALIZATION_DIFFERENCES.md, CRN-5, "Details of the source"). The library's lemma is the combinatorial core of this step: once the stages above i have stabilized, the duel of stage i between the winners of the two groups extending a prefix p selects the winner of the group of p, and the winner of the whole population is the plurality colour. The algorithm is quoted in the crn:def:em-relative entry.'''

[[source]]
