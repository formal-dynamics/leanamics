statement = '''
During execution of the majority protocol we maintain two invariants:
\begin{enumerate}
\item $\sum_{a \in A} c_a = \sum_{a \in A} w(s_a)$, and
\item for each $a \in A$, $|w(s_a) - c_a| \le 1$.
\end{enumerate}
The two invariants are preserved thanks to carefully crafted state transition rules and counterparting alterations of an entity's state caused by changes of the original colour $c_a$ imposed by the external force.
'''
context = '''
[Section 3, p. 6:] We define five strong states: $[-2], [-1], [0], [1], [2]$, and three weak states $\langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle$. Before the protocol is initiated, if $c_a = x$ we set $s_a = [x]$. [...]
We define the weight function, $w(s)$, on a state $s$ as $w([x]) = x$ and $w(\langle x \rangle) = 0$, see the table in Fig. 3.
'''
notes = '''The library states the invariants group by group (for the groups of Section 5) and adds a third one, that every group contains a strong state, which the final argument of Section 3 uses in the tie case (FORMALIZATION_DIFFERENCES.md, CRN-5, "Details of the source").'''

