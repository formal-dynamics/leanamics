page = 6
url = "https://doi.org/10.4230/LIPIcs.OPODIS.2016.14"
status = "transcribed by an AI agent from the published PDF (open access, CC-BY; text extraction, Figures 3 and 4 read from the rendered page); no LaTeX source available; not yet checked by a person"
statement = '''
[Section 3, p. 6:] The population protocol presented below determines whether there are more original 1's, more $(-1)$'s, or there is a tie after the last intervention of the external force. For the purpose of our protocol each entity $a \in A$ must store its original colour $c_a \in \{-1, 0, 1\}$, and this stored colour can be altered only by the external force at any time. Besides the colour, the entity maintains a state $s_a$ governed by the shared transition function. More formally, an entity's knowledge refers to the pair $(c_a, s_a)$. We define five strong states: $[-2], [-1], [0], [1], [2]$, and three weak states $\langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle$. Before the protocol is initiated, if $c_a = x$ we set $s_a = [x]$. On the conclusion all entities are in state
\begin{itemize}
\item $[1]$, $[2]$ or $\langle 1 \rangle$ if there are more 1's than $(-1)$'s,
\item $[-1]$, $[-2]$ or $\langle -1 \rangle$ if there are less 1's than $(-1)$'s, and
\item $[0]$ or $\langle 0 \rangle$ when there is a tie.
\end{itemize}
We define the weight function, $w(s)$, on a state $s$ as $w([x]) = x$ and $w(\langle x \rangle) = 0$, see the table in Fig. 3.
[...] When the colour $c_a$ is changed to $c'_a = c_a + \delta$, the state is changed from $s_a$ to $s'_a = [w(s_a) + \delta]$. Note that this rule preserves both invariants 1 and 2. This is illustrated by the table to the right in Fig. 3 describing how states are changed when $c_a = 1$ is changed to $c'_a = -1$, or vice-versa. In this table we do not consider, for example, combinations of states $s_a = [-1], [-2]$ with colour $c_a = 1$ because of the invariant 2.

[Section 3, p. 7:] In what follows we describe what happens to the states when two entities $a, b \in A$ interact. If a strong state $[1]$ or $[2]$ meets a weak state $\langle y \rangle$ or $[0]$, then this second state becomes $\langle 1 \rangle$. If a strong state $[-1]$ or $[-2]$ meets a weak state $\langle y \rangle$ or $[0]$, then the latter state becomes $\langle -1 \rangle$. If a strong state $[0]$ meets a weak state, the weak state is changed to $\langle 0 \rangle$. If $[1]$ meets $[-1]$ or $[2]$ meets $[-2]$, they are both changed to $[0]$. If $[2]$ meets $[-1]$, they are changed to $[1]$ and $[0]$ respectively. If $[-2]$ meets $[1]$, they are changed to $[-1]$ and $[0]$ respectively. Other encounters do not result in state alteration. This is illustrated by the table in Fig. 4 which does not take into account encounters between entities where both are in weak states, because they do not result in state alteration.

Figure 3 (The weight function $w(s)$ and the state transition rules when recolouring occurs by an external force):
\[
\begin{array}{|c|c|} \hline
s & w(s) \\ \hline
[-2] & -2 \\
{[-1]} & -1 \\
{[0]}, \langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle & 0 \\
{[1]} & 1 \\
{[2]} & 2 \\ \hline
\end{array}
\qquad
\begin{array}{|c|c|} \hline
s_a,\ c_a = 1 \text{ changes to } c'_a = -1 & s'_a \\ \hline
[0], \langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle & [-2] \\
{[1]} & [-1] \\
{[2]} & [0] \\ \hline
s_a,\ c_a = -1 \text{ changes to } c'_a = 1 & s'_a \\ \hline
[0], \langle -1 \rangle, \langle 0 \rangle, \langle 1 \rangle & [2] \\
{[-1]} & [1] \\
{[-2]} & [0] \\ \hline
\end{array}
\]
Figure 4 (The state transition table for interacting entities for dynamic majority):
\[
\begin{array}{|c|ccccc|} \hline
s_a \backslash s_b & [-2] & [-1] & [0] & [1] & [2] \\ \hline
[-2] & ([-2],[-2]) & ([-2],[-1]) & ([-2],\langle -1 \rangle) & ([-1],\langle -1 \rangle) & ([0],[0]) \\
{[-1]} & ([-1],[-2]) & ([-1],[-1]) & ([-1],\langle -1 \rangle) & ([0],[0]) & (\langle 1 \rangle,[1]) \\
{[0]} & (\langle -1 \rangle,[-2]) & (\langle -1 \rangle,[-1]) & ([0],[0]) & (\langle 1 \rangle,[1]) & (\langle 1 \rangle,[2]) \\
{[1]} & (\langle -1 \rangle,[-1]) & ([0],[0]) & (\langle 1 \rangle,[1]) & ([1],[1]) & ([1],[2]) \\
{[2]} & ([0],[0]) & ([1],\langle 1 \rangle) & ([2],\langle 1 \rangle) & ([2],[1]) & ([2],[2]) \\
\text{weak} & (\langle -1 \rangle,[-2]) & (\langle -1 \rangle,[-1]) & (\langle 0 \rangle,[0]) & (\langle 1 \rangle,[1]) & (\langle 1 \rangle,[2]) \\ \hline
\end{array}
\]
'''
context = '''
[Section 3, p. 6:] In this section we consider a variant of population protocols in which the original colours (attributes) of entities could be altered by an external force for some unspecified, however limited, period of time. After this initial period, the relevant population protocol is expected to eventually stabilize.
[Section 3, p. 6:] We assume that an entity is aware when its original colour changes, and is able to modify its current state as a result, but such a change is again governed by common state transition rules for all entities. We also assume that it is not possible for the external force to alter the original colour of an entity while it is simultaneously interacting with another entity.
[Section 5, p. 11:] 3. An array $s[0..k-1]$ representing states $s[i]$ in $k$ independent instances of protocol $P_2(i)$ associated with colours $c[i]$. The computations with respect to $P_2(i)$ are performed only if the two interacting entities have the same label prefix $l[0..i-1]$. Otherwise protocol $P_2(i)$ is not executed.
'''
notes = '''[...] marks the omitted statement of the two invariants (quoted in the crn:def:em-dyninv entry). The tables were transcribed from the rendered page 7 and cross-checked against the column-by-column text extraction. As printed, the table of Fig. 4 and the rules of the text give different states in five entries: row [-2], column [1] and row [1], column [-2] (([-1], <-1>) and (<-1>, [-1]) against [-1] and [0] in the text), row [2], column [-1] and row [-1], column [2] (([1], <1>) and (<1>, [1]) against [1] and [0]), and row [1], column [0] ((<1>, [1]) against [1] meeting [0] turning the second state into <1>). The library follows the rules of the text, and lets the protocol run separately in groups for Section 5 (last context excerpt); FORMALIZATION_DIFFERENCES.md, CRN-5, "Details of the source", explains the choice.'''

