# Becchetti, Clementi, Natale, Consensus dynamics: an overview (HAL preprint)
# ---------------------------------------------------------------------------------------------

[[source]]
items = ["voter:thm:21", "voter:cor:22", "voter:thm:colors"]
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Theorem 4"
page = 11
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
[Proportionate Agreement [HP01]]
Let $i$ be any color and $e_i^{(0)}$ be the volume of the nodes that support color $i$ at $t = 0$; formally, $e_i^{(0)} = \{\sum_{u : c^{(0)}(u) = i} d_u\}$. Then, $\frac{e_i^{(0)}}{2m}$ is the probability that the \textsc{Voter} dynamics converges to the monochromatic configuration in which all nodes supports color $i$.
'''
context = '''
[Section 3, p. 9:] The Voter Model, which for consistency we call here \textsc{Voter} dynamics, is arguably the simplest \emph{nontrivial} dynamics: at each round, every node copies tha state of a neighbor sampled uniformly at random.
[Section 3, p. 10:] More formally, let $G(V,E)$ be a connected graph with node set $V$ (of cardinality $n$) and edge set $E$ (of cardinality $m$). Let $\Sigma$ be a palette of colors of size $n$. Let $d(u)$ be the number of neighbours of $u \in V$.
\textbf{Definition 3} (\textsc{Voter} dynamics). The Voter Model $\{X_t\}_t$ on $G$ is the discrete time Markov process where the state space is the set of color functions $c : V \mapsto \Sigma$ and its time evolution is determined by the following elementary dynamics (denoted as \textsc{Voter} dynamics):
\begin{itemize}
\item Each node initially supports a color in $\Sigma$;
\item In each round one node is selected uniformly at random and it adopts the color of a neighbour sampled uniformly at random.
\end{itemize}
The \emph{asynchronous} version of the \textsc{Voter} dynamics, in which at each round only one node chosen uniformly at random updates its state, has long been studied in statistical mechanics as a model for consensus formation in population of spinless individuals [KRBN10, Lig12, Ald13].
The study of the synchronous version of the model, in which all nodes update their state, has been first considered in Distributed Computing in [HP01] as a proportionate agreement protocol. The \emph{Proportionate Agreement} problem is defined as follows. Given a network of $n$ nodes, where each node is initially supporting a color out of a set of $k$ possibilities, we require the system to eventually reach a configuration in which every node is supporting the same color and, moreover, the final color should equal $i$ with a probability proportional to the volume of the initial set of nodes supporting $i$, for each $i \in [k]$.
[Footnote 10, p. 10:] The \emph{volume} of a set of nodes $S$ is defined as the sum of the degrees of nodes in $S$, in formulas $\mathrm{vol}(S) := \sum_{u \in S} d_u$. In the general case of weighted graphs, we further have that $d_u$ equals the sum of the weights of the edges incidents to $u$, namely $d_u := \sum_{v \sim u} w(u,v)$.
[Section 3.1, p. 10:] [HP01] answered this question by providing, via an elegant martingale argument, the guarantee for employing the \textsc{Voter} dynamics as a protocol for the \emph{Proportionate Agreement} problem, in which we want the system to reach consensus on color $i$ with probability proportional to the volume of the set of nodes initially supporting color $i$.
'''
notes = "Cited by ROADMAP.md (VOT-1: 'Hassin-Peleg 2001; Survey Thm 4'). The theorem is the uniform-neighbour case (stationary weights d_u/2m) of Hassin and Peleg's Theorem 2.1 and Corollary 2.2, for one color among several (their Section 2.3). Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint (Definition 3, Theorem 4, Definition 5, Theorems 6 to 8, all in Section 3) matches the numbers the library cites. Pages are PDF pages (printed page plus one). The theorem title is shown in brackets. The name of the dynamics is set in small caps in the PDF, rendered as \\textsc{Voter}; 'Voter Model' in Definition 3 is in plain italics. Kept as printed: the set braces around the sum defining e_i^{(0)}, 'nodes supports', 'tha state'. As printed, the second bullet of Definition 3 updates one node per round, and the following paragraph calls this the asynchronous version; Hassin and Peleg's process, cited in the next paragraph, is synchronous."

[[source]]
item = "voter:def:pairwalk"
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Definition 5 (Coalescing Random Walks)"
page = 11
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
The \emph{Coalescing Random Walks} process (for short CRW) on $G$ is a discrete time Markov process defined as follows:
\begin{itemize}
\item Each node initially holds one token.
\item In each round, each node sends all its tokens to a neighbor chosen uniformly at random.
\end{itemize}
'''
context = '''
[Section 3, p. 10:] More formally, let $G(V,E)$ be a connected graph with node set $V$ (of cardinality $n$) and edge set $E$ (of cardinality $m$). Let $\Sigma$ be a palette of colors of size $n$. Let $d(u)$ be the number of neighbours of $u \in V$.
[Section 3.1, p. 11, after Definition 5 and Figure 2:] The term \emph{coalescing} in the name of the CRW process refers to the fact that, as soon as too tokens happen to be located on the same node, they will move together in the following rounds. Hence, we can imagine that they have ``coalesced''.
It is easy to see that, by the process' definition, all tokens in the CRW process are eventually located on a single node. The first occurrence of the latter event is thus referred to as the \emph{coalescing time}.
'''
notes = "The library cites 'Survey Definition 5 with two tokens' in the docstring of Voter.pairWalk. Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint matches the numbers the library cites. Page is the PDF page (printed p. 10). Kept as printed: 'too tokens'. Figure 2 (a diagram) is not reproduced; its caption says that the CRW process read from left to right and the Voter dynamics read from right to left share the same random choices."

