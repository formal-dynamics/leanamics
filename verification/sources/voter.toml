[[source]]
items = ["voter:lem:sequential", "voter:thm:meeting-lazy"]
paper = "V. Kanade, F. Mallmann-Trenn, T. Sauerwald. On coalescence time in graphs: When is coalescing as fast as meeting?"
venue = "SODA 2019"
version = "arXiv:1611.02460v4"
result = "Proposition B.9"
page = 70
url = "https://arxiv.org/abs/1611.02460v4"
status = "transcribed by an AI agent from the arXiv LaTeX source of v4 and compared with the PDF of v4; not yet checked by a person"
statement = '''
For any graph $G=(V,E)$ and $u,v \in V$ we have
\[
 (\min_{u'\in V} t_{\operatorname{hit}}( \pi, u') + t_{\operatorname{hit}}(u,v)-t_{\operatorname{hit}}(\pi, v))/2 \leq t_{\operatorname{meet}}(u,v)
\leq 2(\max_{u'\in V} t_{\operatorname{hit}}(\pi, u')+t_{\operatorname{hit}}(u,v)-t_{\operatorname{hit}}(\pi, v) ).
\]
Consequently, for any graph we have $t_{\operatorname{meet}} \leq 4t_{\operatorname{hit}}$ and for any vertex transitive graph $G$ we have $t_{\operatorname{hit}}/2 \leq t_{\operatorname{meet}}\leq 2t_{\operatorname{hit}}$.
'''
context = '''
[Section 2, p. 12:] Throughout the paper, let $G = (V, E)$ denote an undirected, connected graph with $|V| = n$ and $|E| = m$. For a node $u \in V$, $\deg(u)$ denotes the degree of $u$ and $N(u)=\{ v \colon (u,v) \in E\}$ the \emph{neighborhood} of $u$. [...]
Unless stated otherwise, all random walks are assumed to be discrete-time (indexed by natural numbers) and lazy, \textit{i.e.,} if $P$ denotes the $n \times n$ transition matrix of the random walk, $p_{u,u} = 1/2$, $p_{u,v} = 1/(2\deg(u))$ for any edge $(u,v) \in E$ and $p_{u,v}= 0$ otherwise. [...]
By $\pi$ we denote the \emph{stationary distribution}, which satisfies $\pi(u)=\deg(u)/(2m)$ for all $u\in V$.
[...] We write $T_{\operatorname{hit}}(u,v)$ to denote the first time-step $t \geq 0$ at which a random walk starting at $u$ hits $v$. In particular, $T_{\operatorname{hit}}(u,u)=0$.
[p. 13:] The \emph{hitting time} $t_{\operatorname{hit}}(u,v)=\mathbb{E}\left[\,T_{\operatorname{hit}}(u,v)\,\right]$ of any pair of nodes $u,v\in V$ is the expected time required for a random walk starting at $u$ to hit $v$. Thus, $t_{\operatorname{hit}}(u,v)$ is the expectation of $T_{\operatorname{hit}}(u,v)$.
The hitting time of a graph $t_{\operatorname{hit}}=\max_{u,v} t_{\operatorname{hit}}(u,v)$ is the maximum over all such pairs.
For $A \subseteq V$, we use $t_{\operatorname{hit}}(u,A)$, to denote the expected time required for a random walk starting to $u$ to hit some node in the set $A$. Furthermore, we define $t_{\operatorname{hit}}(\pi,u)=\sum_{v\in V}t_{\operatorname{hit}}(v,u)\cdot \pi(v)$. [...]
Let $t_{\operatorname{meet}}(u,v)$ denote the expected time when two random walks starting at $u$ and $v$ first arrive at the same node at the same time, [...]. Finally, let $t_{\operatorname{meet}} = \max_{u,v} t_{\operatorname{meet}}(u,v)$ denoted the worst-case expected meeting time.
[Appendix B.2, p. 70:] In this section we prove the following proposition which can be seen as an analogous version of [AF02, Proposition 14.5] in discrete time.
'''
notes = "The library cites 'SODA 2019 (arXiv:1611.02460), Proposition B.9' (blueprint, voter/FORMALIZATION_DIFFERENCES.md, Section 4.1, docstring of Voter.iterate_outside_succ_le). The appendices are in the full version only (the source switches to 'of the full paper' in the extended abstract), so the numbering is that of the arXiv version; v4 (1 November 2018, the latest) is used, and its numbering matches; v1 to v3 were not checked. voter:lem:sequential formalizes the sequential random walks that the proof of Proposition B.9 introduces (p. 70: X_t moves w.p. 1/(2|N(X_t)|) to each neighbour when t is even and stays otherwise, Y_t likewise when t is odd), not the proposition itself. Macros replaced: \\thit -> t_{\\operatorname{hit}}, \\tmeet -> t_{\\operatorname{meet}}, \\hit -> T_{\\operatorname{hit}}, \\E{x} -> \\mathbb{E}\\left[\\,x\\,\\right], \\ifrac{a}{b} -> a/b, \\ie -> \\textit{i.e.,}. The citation key AF14 is printed as [AF02]. Kept as printed: 'starting to u', 'denoted the worst-case'."

