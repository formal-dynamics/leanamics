statement = '''
[\textsc{Voter} dynamics vs CWR]
Let $\tau$ be the first round such that the \textsc{Voter} dynamics reaches consensus and let $\tau'$ be the first round such that all the tokens of the CWR process are on the same node. A coupling between the \textsc{Voter} dynamics and the CWR process exists such that $\tau = \tau'$.
'''
context = '''
[Section 3, p. 9:] The Voter Model, which for consistency we call here \textsc{Voter} dynamics, is arguably the simplest \emph{nontrivial} dynamics: at each round, every node copies tha state of a neighbor sampled uniformly at random.
[Section 3, p. 10:] More formally, let $G(V,E)$ be a connected graph with node set $V$ (of cardinality $n$) and edge set $E$ (of cardinality $m$). Let $\Sigma$ be a palette of colors of size $n$. Let $d(u)$ be the number of neighbours of $u \in V$.
\textbf{Definition 3} (\textsc{Voter} dynamics). The Voter Model $\{X_t\}_t$ on $G$ is the discrete time Markov process where the state space is the set of color functions $c : V \mapsto \Sigma$ and its time evolution is determined by the following elementary dynamics (denoted as \textsc{Voter} dynamics):
\begin{itemize}
\item Each node initially supports a color in $\Sigma$;
\item In each round one node is selected uniformly at random and it adopts the color of a neighbour sampled uniformly at random.
\end{itemize}
The \emph{asynchronous} version of the \textsc{Voter} dynamics, in which at each round only one node chosen uniformly at random updates its state, has long been studied in statistical mechanics as a model for consensus formation in population of spinless individuals [KRBN10, Lig12, Ald13].
The study of the synchronous version of the model, in which all nodes update their state, has been first considered in Distributed Computing in [HP01] as a proportionate agreement protocol. [...]
As usual, when the system reaches a configuration in which every node is supporting the same color, we say that the system has reached \emph{Consensus}.
[Section 3.1, p. 11:] \textbf{Definition 5.} The \emph{Coalescing Random Walks} process (for short CRW) on $G$ is a discrete time Markov process defined as follows:
\begin{itemize}
\item Each node initially holds one token.
\item In each round, each node sends all its tokens to a neighbor chosen uniformly at random.
\end{itemize}
[...] The term \emph{coalescing} in the name of the CRW process refers to the fact that, as soon as too tokens happen to be located on the same node, they will move together in the following rounds. Hence, we can imagine that they have ``coalesced''.
It is easy to see that, by the process' definition, all tokens in the CRW process are eventually located on a single node. The first occurrence of the latter event is thus referred to as the \emph{coalescing time}. In fact, the following theorem draws a direct correspondence between the convergence time of the \textsc{Voter} dynamics and the coalescing time of the CRW process, allowing to study either of them by investigating the other (for a proof see e.g. Lemma 4 in [BCE+17]).
'''
notes = "Cited by ROADMAP.md (VOT-3: 'Survey Thms 6-7; Hassin-Peleg Section 2.4') and by the docstring of Voter.iterate_disagreement_le_pairWalk ('Survey Theorem 6'). Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint matches the numbers the library cites. Page is the PDF page (printed p. 11). The theorem title is shown in brackets. Kept as printed: both 'CRW' and 'CWR' for the coalescing process, 'too tokens', 'tha state'. As printed, the second bullet of Definition 3 updates one node per round, and the following paragraph calls this the asynchronous version."

[[source]]
item = "voter:thm:consensus-time"
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Theorem 7"
page = 12
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
[Color evolution on the complete graph]
Let $G$ be the complete graph, where each node has also a self-loop. Starting from an arbitrary initial configuration $\mathbf{c}$ on $G$, the \textsc{Voter} dynamics reaches a configuration $c'$ having at most $k$ remaining colors w.h.p. in $\mathcal{O}(\frac{n}{k}\log n)$ rounds.
'''
context = '''
[Section 2.3, p. 9:] We consider a distributed system of $n$ nodes/agents, interacting over an underlying graph $G = (V,E)$ according to one of the communication models described in Subsection 2.1. In each round, every node supports a color, i.e. an element $i \in \Sigma = \{1, 2, \ldots, k\}$ (with $2 \leqslant k \leqslant n$). A configuration of the system is thus a function $c : V \to \Sigma$. When $G$ is the complete graph and nodes are anonymous, the state of the system at any round is completely specified by a \emph{color configuration} $\mathbf{c} = \langle c_1, \ldots, c_k \rangle$ (where $c_i$ denotes the number of agents supporting color $i \in [k]$).
[Footnote 9, p. 9:] According to the standard definition, we say that a sequence of events $\mathcal{E}_n$, $n = 1, 2, \ldots$ holds \emph{with high probability} if $\mathbf{P}(\mathcal{E}_n) = 1 - \mathcal{O}(1/n^{\lambda})$ for some positive constant $\lambda > 0$.
[Section 3, p. 9:] The Voter Model, which for consistency we call here \textsc{Voter} dynamics, is arguably the simplest \emph{nontrivial} dynamics: at each round, every node copies tha state of a neighbor sampled uniformly at random.
[Section 3, p. 10:] More formally, let $G(V,E)$ be a connected graph with node set $V$ (of cardinality $n$) and edge set $E$ (of cardinality $m$). Let $\Sigma$ be a palette of colors of size $n$. Let $d(u)$ be the number of neighbours of $u \in V$.
\textbf{Definition 3} (\textsc{Voter} dynamics). The Voter Model $\{X_t\}_t$ on $G$ is the discrete time Markov process where the state space is the set of color functions $c : V \mapsto \Sigma$ and its time evolution is determined by the following elementary dynamics (denoted as \textsc{Voter} dynamics):
\begin{itemize}
\item Each node initially supports a color in $\Sigma$;
\item In each round one node is selected uniformly at random and it adopts the color of a neighbour sampled uniformly at random.
\end{itemize}
The \emph{asynchronous} version of the \textsc{Voter} dynamics, in which at each round only one node chosen uniformly at random updates its state, has long been studied in statistical mechanics as a model for consensus formation in population of spinless individuals [KRBN10, Lig12, Ald13].
The study of the synchronous version of the model, in which all nodes update their state, has been first considered in Distributed Computing in [HP01] as a proportionate agreement protocol. [...]
As usual, when the system reaches a configuration in which every node is supporting the same color, we say that the system has reached \emph{Consensus}.
[Section 3.1, p. 12, before the theorem:] As an example, by combining Theorem 6 with the application of drift analysis techniques to the CWR process, we obtain the following theorem that provides the time after which at most $k$ colors are still ``alive'' (for a proof, see e.g. Lemma 3 in [BCE+17]).
'''
notes = "Cited by PROVENANCE.md and ROADMAP.md (VOT-3: 'Survey Thms 6-7'); the library's item is the case k = 1 (consensus), with explicit constant 2 n log n and probability at least 1 - 1/n. Theorem 6 is in the previous entry. Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint matches the numbers the library cites. Page is the PDF page (printed p. 11). The theorem title is shown in brackets; the configuration is printed bold (\\mathbf{c}) and the reached configuration c' in plain italics. The survey does not state the base of log. Kept as printed: 'tha state'. As printed, the second bullet of Definition 3 updates one node per round, and the following paragraph calls this the asynchronous version."

[[source]]
items = ["voter:thm:hp25", "voter:thm:hp25-plain"]
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Theorem 8"
page = 12
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
[Convergence time on general topologies]
Let $G$ be any connected undirected graph. Starting from an arbitrary initial configuration $c$ on $G$, the \textsc{Voter} dynamics reaches consensus w.h.p. in $\mathcal{O}(n^3 \log n)$ rounds.
'''
context = '''
[Footnote 9, p. 9:] According to the standard definition, we say that a sequence of events $\mathcal{E}_n$, $n = 1, 2, \ldots$ holds \emph{with high probability} if $\mathbf{P}(\mathcal{E}_n) = 1 - \mathcal{O}(1/n^{\lambda})$ for some positive constant $\lambda > 0$.
[Section 3, p. 9:] The Voter Model, which for consistency we call here \textsc{Voter} dynamics, is arguably the simplest \emph{nontrivial} dynamics: at each round, every node copies tha state of a neighbor sampled uniformly at random.
[Section 3, p. 10:] More formally, let $G(V,E)$ be a connected graph with node set $V$ (of cardinality $n$) and edge set $E$ (of cardinality $m$). Let $\Sigma$ be a palette of colors of size $n$. Let $d(u)$ be the number of neighbours of $u \in V$.
\textbf{Definition 3} (\textsc{Voter} dynamics). The Voter Model $\{X_t\}_t$ on $G$ is the discrete time Markov process where the state space is the set of color functions $c : V \mapsto \Sigma$ and its time evolution is determined by the following elementary dynamics (denoted as \textsc{Voter} dynamics):
\begin{itemize}
\item Each node initially supports a color in $\Sigma$;
\item In each round one node is selected uniformly at random and it adopts the color of a neighbour sampled uniformly at random.
\end{itemize}
The \emph{asynchronous} version of the \textsc{Voter} dynamics, in which at each round only one node chosen uniformly at random updates its state, has long been studied in statistical mechanics as a model for consensus formation in population of spinless individuals [KRBN10, Lig12, Ald13].
The study of the synchronous version of the model, in which all nodes update their state, has been first considered in Distributed Computing in [HP01] as a proportionate agreement protocol. [...]
As usual, when the system reaches a configuration in which every node is supporting the same color, we say that the system has reached \emph{Consensus}.
[Section 3.1, p. 12, before the theorem:] More generally, by combining Theorem 6 with results on the \emph{meeting time} of random walks on general graphs [TW93], we obtain the following general bound on the convergence time of the \textsc{Voter} dynamics.
[Theorem 6, p. 12:] Let $\tau$ be the first round such that the \textsc{Voter} dynamics reaches consensus and let $\tau'$ be the first round such that all the tokens of the CWR process are on the same node. A coupling between the \textsc{Voter} dynamics and the CWR process exists such that $\tau = \tau'$.
'''
notes = "Cited by PROVENANCE.md, ROADMAP.md (VOT-6) and the blueprint. The library formalizes it for the lazy voter on every connected graph (voter:thm:hp25) and for the plain voter on connected nonbipartite graphs (voter:thm:hp25-plain); see voter/FORMALIZATION_DIFFERENCES.md, Section 4.1. Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint matches the numbers the library cites. Page is the PDF page (printed p. 11). The theorem title is shown in brackets. The survey does not state the base of log. Kept as printed: 'tha state', 'CWR'. As printed, the second bullet of Definition 3 updates one node per round, and the following paragraph calls this the asynchronous version; Theorem 8 does not say which version it refers to. The CWR process is Definition 5 (p. 11): each node initially holds one token, and in each round each node sends all its tokens to a neighbor chosen uniformly at random."

