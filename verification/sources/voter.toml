notes = "Macros replaced: \\Exp -> \\mathbf{E}, \\pot{t+1} -> \\Psi(S_{t+1}), \\potfixed{t} -> \\Psi(s_{t}), \\de -> d, \\vol -> \\operatorname{vol}. The equation label and a LaTeX comment inside the display are dropped. Kept as printed: the sum over all u in V in the statement (the last line of the proof, p. 6, has the sum over u in v^{(0)}, the minority side; see voter/FORMALIZATION_DIFFERENCES.md, Section 5.1), and 'v^1(t)' in the definition of lambda_{u,t}. The conductance form formalized by Voter.potential_drift_conductance is inequality (4) in the proof of Lemma 2.2 (next entry)."

