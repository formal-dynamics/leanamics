'''
context = '''
[Section 1.2, p. 3:] In every synchronous time step every node chooses a neighbour u.a.r. and adopts its opinion with probability $1/2$.
[Section 2, p. 5:] We denote by $v_t^{(i)}$ the set of nodes that have opinion $i$ after the first $t$ rounds and $t\geq0$. If we refer to the random variable we use $V_t^{(i)}$ instead. [...]
For $u\in v^{(0)}_t$, $\lambda_{u,t}$ is the number of neighbours of $u$ in $V\setminus v^1(t)$ and for $u\in v^{(1)}_t$, $\lambda_{u,t}$ is the number of neighbours of $u$ in $V\setminus v^{(0)}_t$; $d_u$ is the degree of $u$ (the degrees do not change over time).
[Proof of Lemma 2.1, pp. 5-6:] W.l.o.g. we assume that opinion $0$ is the minority opinion, i.e. $0 < \operatorname{vol}(V^{(0)}_t)\leq \operatorname{vol}(V^{(1)}_t)$. To simplify the notation we omit the index $t$ in this proof and write $v^{(0)}$ instead of $v_t{(0)}$, $v^{(1)}$ for $V\setminus v^{(0)}_t$, and $\lambda_u$ instead of $\lambda_{u,t}$. [...]
Now we define
$$
  X_u=\left\{\begin{array}{ll} d_u & w.p. \ \frac{\lambda_u}{2\cdot d_u}\ if\ u\in v^{(1)}\\
-d_u & w.p.\ \frac{\lambda_u}{2\cdot d_u}\ if\ u\in v^{(0)}\\
         0 & otherwise\end{array}
\right.
$$
and $\Delta=\sum_{u\in V}X_u$.
Note that we have $\Delta=\operatorname{vol}(V^{(0)}_{t+1}) - \operatorname{vol}(v^{(0)}) $ [...]
