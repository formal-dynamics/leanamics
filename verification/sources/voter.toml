item = "voter:def:conductance"
paper = "P. Berenbrink, G. Giakkoupis, A.-M. Kermarrec, F. Mallmann-Trenn. Bounds on the voter model in dynamic networks"
venue = "ICALP 2016"
version = "arXiv:1603.01895v2"
result = "Section 2, definitions"
page = 5
url = "https://arxiv.org/abs/1603.01895v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
Let $G = (V,E)$.
For a fixed set $S\subseteq V$ we define $cut(S,V\setminus S)$ to be the set of edges between the sets $S\subseteq V$ and $V\setminus S$ and let $\lambda_{u}$ be the number of neighbours of $u$ in $V\setminus S$. Let
 $\operatorname{vol}(S)=\sum_{u\in S} d_u.$
The \emph{conductance} of $G$ is defined as
$$\phi=\phi(G)=\min \left\{ \tfrac{\sum_{u \in U} \lambda_{u}}{\operatorname{vol}(U)}\colon U\subset V \text{ with } 0 < \operatorname{vol}(U) \leq m\right\}.$$
We note $1/n^2 \leq \phi \leq 1$.
We denote by $v_t^{(i)}$ the set of nodes that have opinion $i$ after the first $t$ rounds and $t\geq0$. If we refer to the random variable we use $V_t^{(i)}$ instead.
[...]
Let $s_t$ denote the set having the smaller volume, i.e., $s_t = v^{(0)}_t$ if $\operatorname{vol}(v^{(0)}_t)\leq \operatorname{vol}(v^{(1)}_t)$, and $s_t = v^{(1)}_t$ otherwise. Note that we use $s_t, v^{(0)}_t$ and $v_t^{(1)}$ whenever the state at time $t$ is fixed, and $S_t, V^{(0)}_t$ and $V_t^{(1)}$ for the corresponding random variables.
For $u\in v^{(0)}_t$, $\lambda_{u,t}$ is the number of neighbours of $u$ in $V\setminus v^1(t)$ and for $u\in v^{(1)}_t$, $\lambda_{u,t}$ is the number of neighbours of $u$ in $V\setminus v^{(0)}_t$; $d_u$ is the degree of $u$ (the degrees do not change over time).
[...]
We define $$\Psi(S_{t}) = \sqrt{\operatorname{vol}(S_t)}.$$
'''
context = '''
[Section 1, p. 2:] We show that consensus is reached with constant probability after $\tau$ rounds, where $\tau$ is the first round such that the sum of conductances up to round $\tau$ is at least $m /d_{min}$, where $m$ is the number of edges. For static graphs the above bound simplifies to $O(m/(d_{min} \cdot \phi))$, where $d_{min}$ is the minimum degree.
[Section 1.2, p. 3:] Our protocols work in synchronous steps. The consensus time $T$ is defined at the first time step at which all nodes have the same opinion.
[...] In every synchronous time step every node chooses a neighbour u.a.r. and adopts its opinion with probability $1/2$.
[Footnote 2:] The factor of $1/2$ ensures that the process converges on bipartite graphs.
We assume that the dynamic graphs $\mathcal{G}=G_1, G_2,\ldots$ are generated by an adversary. We assume that each graph has $n$ nodes and the nodes are numbered from $1$ to $n$. The sequence of conductances $\phi_1,\phi_2,\ldots$ is given in advance, as well as a degree sequence $d_1,d_2,\ldots, d_n$.
The adversary is now allowed to create every graph $G_i$ by redistributing the edges of the graph. The constraints are that each graph $G_i$ has to have conductance $\phi_i$ and node $j$ has to have degree $d_j$ (the degrees of the nodes do not change over time).
Note that the sequence of the conductances is fixed and, hence, cannot be regarded as a random variable in the following.
For the redistribution of the edges we assume that the adversary knows the distribution of all opinions during all previous rounds.
[Section 2, p. 5, between the excerpts of the statement:] First we show Theorem 1.1 for $\kappa=2$ (two opinions), which we call $0$ and $1$ in the following. Then we generalise the result to an arbitrary number of opinions. We model the system with a Markov chain $M_{t\ge 0}=(V^{(0)}_t,V^{(1)}_t)_{t\ge 0}$.
[Theorem 1.1, p. 3:] Assume $\kappa \leq n$ opinions are arbitrarily distributed over the nodes of $G_1$.
'''
notes = "The entry quotes the Section 2 definitions of volume, conductance, the sets v_t^(i) and s_t, lambda_{u,t} and the potential Psi. The item covers Voter.vol, conductance, discordant, minority, potential and dynamicLazy (voter/README.md: 'BGKM16 Section 2'); dynamicLazy is the dynamic graph model of Section 1.2, quoted in the context. Macros replaced: \\vol -> \\operatorname{vol}, \\de -> d, \\dmin -> d_{min}, \\pot{t} -> \\Psi(S_{t}). A commented-out alternative definition of the conductance (with |cut(U, V \\setminus U)| and vol(V)/2) is dropped. Kept as printed: 'v^1(t)' (elsewhere v^{(1)}_t). The number of edges m is defined in the introduction (quoted) and again in the proof of Lemma 2.1 ('We define $m$ as the number of edges.'). The minority opinion is called 0 in the proofs ('W.l.o.g. we assume that opinion $0$ is the minority opinion', proof of Lemma 2.1)."

