[Section 2.1, p. 12:] To show that the smaller colors $\mathcal{C}_j$ do also not interfere with $\mathcal{A}$ and thus the minimum of the difference between $\mathcal{A}$ and any $\mathcal{C}_j$ increases, we use the following coupling.

