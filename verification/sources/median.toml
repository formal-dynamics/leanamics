item = "median:def:two-choices"
paper = "R. Elsässer, T. Friedetzky, D. Kaaser, F. Mallmann-Trenn, H. Trinker. Rapid asynchronous plurality consensus (v1 to v4: Efficient k-party voting with two choices)"
venue = "arXiv:1602.04667"
version = "arXiv:1602.04667v5"
result = "Section 1.1 (Model) and Algorithm 1"
page = 3
url = "https://arxiv.org/abs/1602.04667v5"
status = "transcribed by an AI agent from the arXiv LaTeX source of v5 and compared with the PDF of v5; not yet checked by a person"
statement = '''
[Section 1.1, p. 3:] We consider the following plurality consensus process on the clique $G=(V,E) = K_n$ of size $n$. Initially, the nodes are partitioned into $k$ groups representing $k$ colors $\mathcal{C}_1, \dots, \mathcal{C}_k$. We will denote the number of nodes having color $\mathcal{C}_{j}$ as $c_j$. We furthermore denote the set of all colors as $C = \left\{\mathcal{C}_1, \dots, \mathcal{C}_k\right\}$. Also, we will occasionally abuse notation and use $\mathcal{C}_i$ to denote the \emph{set} of all vertices having color $\mathcal{C}_i$.

\subsubsection*{Synchronous Model}
In the synchronous model we assume that the protocol operates in discrete rounds. In each round, the nodes may simultaneously sample other nodes uniformly at random and then simultaneously change their opinion as a function of the observed samples. One prominent example here is the Two-Choices process where in each round every node samples two nodes chosen uniformly at random, with replacement. If the chosen nodes' colors coincide, then the node adopts this color. We denote this process as the \emph{plurality consensus process with two choices}.
'''
context = '''
[Algorithm 1, p. 9, "Distributed Voting Protocol with Two Choices":]
Algorithm two-choices($G = (V, E)$, color $: V \rightarrow C$)
  for round $t = 1$ to $|C|\cdot\log{|V|}$
    at each node $v$ do in parallel
      let $u_1, u_2 \in N(v)$ uniformly at random
      if color($u_1$) $=$ color($u_2$) then
        color($v$) $\gets$ color($u_1$)
'''
notes = "Macros replaced: \\TC -> Two-Choices, \\C{j} -> \\mathcal{C}_{j}. Algorithm 1 is typeset with algorithm2e; it is rendered here as indented pseudocode with the paper's keywords. The library's colours lie in any type with decidable equality and twice_i counts the nodes whose two samples both hold colour i (blueprint)."

