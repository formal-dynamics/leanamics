item = "median:thm:tc-lower"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Theorem 1 (Simplified), the 2-Choices part"
page = 4
url = "https://arxiv.org/abs/1702.04921v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
Starting from an arbitrary configuration, $3$-\textsc{Majority} reaches consensus with
high probability in $\mathrm{O}\bigl(n^{3/4}\log^{7/8} n \bigr)$ rounds. When
started from a configuration where each color is supported by at most
$\mathrm{O}\left(\log n\right)$ nodes, 2-\textsc{Choices} needs with high probability
$\Omega\left(n / \log n\right)$ rounds to reach consensus.
'''
context = '''
[Section 1, p. 2:] Two further natural and prominent consensus processes are the \emph{2-\textsc{Choices}} and the \emph{$3$-\textsc{Majority}} process. Their corresponding update rules, as executed synchronously by each node, are as follows:
\begin{itemize}
\item 2-\textsc{Choices}: Sample two nodes independently and uniformly at random. If the samples have the same color, adopt it. Otherwise, ignore them and keep your current color.
\end{itemize}

[Section 2.1, p. 6:] We consider the \emph{consensus problem} on the complete graph of $n$ nodes. Initially, each node supports one opinion (or color) from the set $[k] := \{1, 2, \dots, k\}$, where $k \leq n$. Nodes interact in synchronous, discrete rounds using the \emph{Uniform Pull} mechanism [DGHILSSST87]. That is, during every round each node can ask the opinion of a constant number of random neighbors. Given these opinions, it updates its own opinion according to some fixed update rule. The goal of the system is to reach \emph{consensus} (a configuration where all nodes support the same opinion).

[Section 1.2, p. 4:] The following theorem states slightly simplified versions of our upper and lower bounds (see Theorem 4 and Theorem 5 for the detailed statements).
'''
notes = "Theorem 1 is labelled '(Simplified)'. The library formalizes the 2-Choices half only (PROVENANCE.md). Macros replaced: \\hmajority{3} -> $3$-\\textsc{Majority}, \\twochoice -> 2-\\textsc{Choices}, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr), \\LDAUOmicron{x} -> \\mathrm{O}\\left(x\\right), \\LDAUOmega{x} -> \\Omega\\left(x\\right); in the context \\intcc{k} -> [k], \\set{.} -> \\{.\\}, \\coloneqq -> :=, \\cite{DGHILSSST87} rendered as the printed key. The paper gives no explicit definition of 'with high probability'; Theorem 5 states its failure probability as at most 1/n. The 3-Majority rule of the itemize (second bullet) is not quoted. PDF page 4 is printed page 3."

[[source]]
items = ["median:lem:tc-escape", "median:lem:tc-few-changes"]
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Proof of Theorem 5 (App. A.8), one colour"
page = 19
url = "https://arxiv.org/abs/1702.04921v1"
status = "transcribed by an AI agent from the arXiv LaTeX source of v1 and compared with the PDF of v1; not yet checked by a person"
statement = '''
Let $T_i=\min \{ t\geq 0 ~|~ c_i(t) > \ell' \}$.
For any fixed opinion $i\leq k$ we show that $\Pr\left[T_i < n/(\gamma \ell')\right] \leq
1/n^{2}$, so that, by a union bound over all opinions and using that $T=\min \{
T_i ~|~i\leq k\}$, we obtain $\Pr\left[T < n/(\gamma \ell')\right] \leq 1/n$.
Intuitively, we would like to show that, conditioning on $c_i  \leq \ell'$, the
expected number of nodes joining opinion $i$ is dominated by a binomial
distribution with parameters $n$ and $p = (\ell'/n)^2$.
[...]
Formally, process $\mathcal P$ is defined as follows. $P(0):=\ell$ and $P(t+1)
=P(t)+\sum_{j \leq n} X_j^{(t)}$, where $X_j^{(t)}$ is a Bernoulli random variable with
$\Pr\left[X_i=1\right] = p$ and, by a standard coupling, it
is $1$ whenever node $j$ sees two times color $i$ at round $t$ (note that the latter event
happens with probability at most $p$ for any $t<T_i$).
By definition, if $t<T_i$ it holds $c_i(t)\leq \ell'$, which implies that the probability that any node in the original process gets opinion $i$ is at most $p$. Thus, we can couple
2-\textsc{Choices} and $P$ for $t\leq T_i$ so that $c_i(t) \leq P(t)$.
'''
context = '''
[Theorem 5, p. 10:] Let $\gamma$ be a sufficiently large constant. Consider the 2-\textsc{Choices} process starting from any initial configuration $c \in \mathcal{C}$. Let $\ell := \max_i c_i(0)$ be the support of the largest color. Then, for $\ell' := \max\{ 2\ell, \gamma \log n\}$, it holds with high probability that no color has a support larger than $\ell'$ for $n/(\gamma \ell')$ rounds. In symbols,
\begin{equation}
    \Pr\left[ \max_i\hspace{2pt} c_i(t)   > \ell'\text{ for some }  t< \frac{n}{\gamma\ell'}\right] \leq \frac 1n. \qquad (8)
\end{equation}

[Section 1, p. 2:] 2-\textsc{Choices}: Sample two nodes independently and uniformly at random. If the samples have the same color, adopt it. Otherwise, ignore them and keep your current color.

[Section 2.1, p. 6:] We describe the system state after any round by an $n$-dimensional integral vector $c = (c_i)_{i \in [n]} \in \mathbb{N}_0^n$ with $\sum_{ i \in [n] } c_i = n$. Here, the $i$-th component $c_i \in \mathbb{N}_0$ corresponds to the number of nodes supporting opinion $i$. [...] We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid \sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible configurations.
'''
notes = "Opening of the full proof of Theorem 5 (Appendix A.8, PDF p. 19, printed p. 18); the [...] omits three sentences on why per-round Chernoff bounds are weak and on the plan of the majorizing process. The paper then bounds P(t_0) - P(0) ~ Bin(t_0 n, p) by a Chernoff bound. Macros replaced: \\Pr{X} -> \\Pr\\left[X\\right] (auxkling.sty), \\twochoice -> 2-\\textsc{Choices}, \\coloneqq -> :=, \\N_0 -> \\mathbb{N}_0, \\intoo{.} -> (.), \\intcc{n} -> [n], \\set{.} -> \\{.\\} (with | -> \\mid). 'Pr[X_i = 1]' (index i where X_j^{(t)} is meant) as printed. The library bounds one colour by an exponential supermartingale instead of the binomial domination (PROVENANCE.md; median/FORMALIZATION_DIFFERENCES.md); median:lem:tc-few-changes holds the facts it uses (the number of nodes that see colour i twice is a sum of n independent Bernoulli variables of parameter (c_i/n)^2)."
