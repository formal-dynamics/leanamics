[Section 1, p. 2:] To address these issues, we consider a modified version of pull voting in which each vertex $v$ randomly queries two neighbours at each step. On the basis of the sample taken, vertex $v$ revises its opinion as follows. If both neighbours have the same opinion, the calling vertex $v$ adopts this opinion. If the two opinions differ, the calling vertex $v$ retains its current opinion in this round. To distinguish this process from the conventional pull voting, as described above, we use terms {\em single-sample voting} and {\em two-sample voting}.

[Section 3, p. 8:] The $X_v$ are independent $\{0,1\}$ random variables with the expected value depending whether the neighbours are selected with or without replacement:
\[
\mathbf{E} X_v(\text{with replacement}) = \left(\frac{d_v^B}{d}\right)^2, \;\;\;
\mathbf{E} X_v(\text{no replacement}) = \; \frac{(d_v^B)( d_v^B-1)}{d(d-1)}.
\]
We give proofs for sampling with replacement.
'''
context = '''
[Section 1, p. 1:] In the beginning each vertex of a connected undirected graph $G=(V,E)$ has an initial opinion. The voting process proceeds synchronously in discrete time steps called rounds. During each round, each vertex independently contacts a random neighbour and adopts the opinion of that neighbour.

[Section 2, p. 4:] Assume that initially each vertex holds one of two opinions. For convenience, $A$ and $B$ will denote the opinions, the two sets of vertices who have these opinions, and the sizes of these sets, depending on the context.

[Section 3, p. 7:] At any step $t$ of the voting process, let $\Delta_{AB}=\Delta_{AB}(t)$ be the number of $A$ vertices converting to $B$ during this step. [...] For a vertex $v$ and a set of vertices $C$, let $d_v^C$ be the number of vertices in $C$ which are adjacent to $v$. For $v \in A$, let $X_v=1$ if $v$ chooses twice in $B$ at step $t$, and 0 otherwise.

[Section 4.1, p. 8:] The condition in Lemma 2 says that the number $E(X,Y)$ of edges between any disjoint large subsets of vertices $X$ and $Y$ is close to the value $dXY/n$ expected in the random regular graph.

[Lemma 5, p. 15:] [...] every superset $S \supseteq B$ of size at most $(1+1/\alpha)B$ spans at most $\alpha d S$ edges (that is, $|E(S)| \le \alpha d S$) [...]
'''
notes = "Macros replaced: \\E -> \\mathbf{E}, \\bfrac{a}{b} -> \\left(\\frac{a}{b}\\right), \\set{.} -> \\{.\\}, \\a -> \\alpha. 'Pull voting' in the first context excerpt is the single-sample process the paper starts from. The paper does not define E(X,Y) and E(S) beyond these phrases; the library's edgeCount counts ordered adjacent pairs, so that E(S,S) = 2|E(S)| (median/FORMALIZATION_DIFFERENCES.md, Expander item 2)."

