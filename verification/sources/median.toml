when the size $B_t$ of the $B$-vote is at least $cn$, we have
\begin{equation}
 A_{t+1} \; = \: A_t + \Delta_t
\; \ge \;  A_t + \frac{A_t B_t (A_t - B_t)}{n^2}  - 3 \eta_t n. \qquad (29)
\end{equation}
In~(29), substitute $\eta_t = \alpha n /\sqrt{A_t B_t}$, $A_t = n(1+\nu_t)/2$ and
$B_t = n(1-\nu_t)/2$ to get
\begin{align}
  \nu_{t+1} \;\; & \ge \; \nu_t + \frac{1}{2}\nu_t\left(1-\nu_t^2\right) - 12\frac{\alpha}{\sqrt{1-\nu_t^2}}
       \qquad (30).
\end{align}
Thus, while $K \alpha \le \nu_t \le 1/2$, we have
\begin{align}
  \nu_{t+1} \;\; & \ge \; \nu_t + \frac{3}{8}\nu_t - 15\alpha
   \; \ge \; \frac{5}{4}\nu_t. \nonumber
\end{align}
This means that the number of steps required to
increase the vote imbalance from $\nu_0$ to $1/2$ is at most
$\left\lceil \log_{5/4} (1/(2{\nu_0})) \right\rceil$.

For $1/2 \le \nu_t \le 1-2c$, we set $\delta_t = 1-\nu_t$
 and~(30) becomes
\begin{align}
  \delta_{t+1} \;\; & \le \; \delta_t - \frac{1}{2}(1-\delta_t)\delta_t \left(2-\delta_t\right) + 12\frac{\alpha}{\sqrt{\delta_t(2-\delta_t)}}
       \qquad (31).
\end{align}
Since $2c \le \delta_t \le 1/2$ and $\alpha \le c^{3/2}/36$,
\begin{align}
  \delta_{t+1} \;\; & \le \; \delta_t - \frac{3}{8}\delta_t + 9\frac{\alpha}{\sqrt{c}}
    \; \le \; \frac{3}{4} \delta_t
       \qquad (32).
