[Section 1.1, p. 3:] We consider the following plurality consensus process on the clique $G=(V,E) = K_n$ of size $n$. Initially, the nodes are partitioned into $k$ groups representing $k$ colors $\mathcal{C}_1, \dots, \mathcal{C}_k$. We will denote the number of nodes having color $\mathcal{C}_{j}$ as $c_j$. [...] W.l.o.g., we assume that colors are ordered in descending order such that $c_1 \geq c_2 \geq \dots \geq c_k$. We will denote the initial plurality color $\mathcal{C}_{1}$ as $\mathcal{A}$ with size $a = c_1$ and we will use $\mathcal{B}$ to denote the second largest color $\mathcal{C}_{2}$ of size $b = c_2$.

[Section 1.1, p. 3, Synchronous Model:] One prominent example here is the Two-Choices process where in each round every node samples two nodes chosen uniformly at random, with replacement. If the chosen nodes' colors coincide, then the node adopts this color.

[Footnote, p. 4:] Throughout this paper, the expression \emph{with high probability} means a probability of at least $1 - n^{-\Omega\left(1\right)}$.

[Section 1.2, p. 5:] That is, we assume that every node of the clique $G = (V,E) = K_n$ has one of $k$ possible opinions at the beginning, where $k = O\left(n^\epsilon\right)$ for some small positive constant $\epsilon$.

[Section 2.1, p. 9:] We will use $c_1', \dots, c_k'$ to denote the number of nodes of corresponding colors after the switching has been performed before the adversary changes $F$ arbitrary nodes. For simplicity of notation, we will assume that in the following the dominating color $\mathcal{C}_{1}$ is denoted as $\mathcal{A}$ with $a = c_1$. Furthermore, we will use $\mathcal{B}$ to denote the second largest color $\mathcal{C}_{2}$ of size $b = c_2$.

[Section 2.1, p. 10:] Observe that if $a \geq \left(1/2 + \varepsilon_{1}\right)n$ for some constant $\varepsilon_{1} > 0$, the process converges within $O\left(\log{n}\right)$ steps with high probability. [...] For the sake of readability we assume in the following that $a \leq n/2$. Furthermore, observe that $a>n/k$, since $\mathcal{A}$ is the largest of $k$ color classes.
'''
notes = "Macros replaced: \\A -> \\mathcal{A}, \\B -> \\mathcal{B}, \\C{j} -> \\mathcal{C}_{j}, \\ifrac{a}{b} -> a/b, \\whp -> 'with high probability' (its first use carries the footnote quoted in the context), \\BigO{x} -> O\\left(x\\right), \\BigOmega{x} -> \\Omega\\left(x\\right), \\eps{1} -> \\varepsilon_{1}. The Section 1.2 sentence states the assumption k = O(n^epsilon) of Theorem 1.2, which the proof of the lemma uses (a >= n/k >= n^{1-epsilon}, p. 12). The proof takes z >= 32. The library's version assumes a <= n/2 explicitly and states the failure probability C/n^2."

