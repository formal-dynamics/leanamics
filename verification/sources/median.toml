$c$.
Furthermore, let $\pi : V \rightarrow V$ be a bijection and let $P$
be the original process. We can couple a process  $P' = P(\pi)$ to the original
process $P$ such that $c'^{(P)}\leq b'^{(P')}$, where $c'^{(P)}$ is the random variable
$c'$ in the original process and $b'^{(P')}$ is the random variable $b'$ in
the coupled process.
'''
