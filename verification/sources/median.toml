statement = '''
For any initial state with $m$ different values and under any $T$-bounded adversary with $T \le \sqrt{n}$, the median rule reaches an almost stable consensus in $O(\log m \cdot \log\log n + \log n)$ rounds w.h.p.
'''
context = '''
[Section 1.1, p. 3:] We use the following strong adversarial model. A $T$-bounded adversary is allowed to know the entire history of the protocol. At the beginning of each round, it may decide to change the state of up to $T$ many of the processes in an arbitrary way subject to the constraint that it can only change the value of a process to one out of the initial set of values $\{v_1, \ldots, v_n\}$. [...]

Of course, in our adversarial model we cannot enforce any more that eventually all processes agree on a stable value. Hence we will only require that there is a round $r$ and value $v \in \{v_1, \ldots, v_n\}$ such that for any round later than $r$, all but up to $O(T)$ processes agree on $v$. We will call this \emph{almost stable consensus}.

[Section 1.2, p. 4:] We propose a very simple protocol for our model called the \emph{median rule}: In each round, every process $i$ picks two processes $j$ and $k$ uniformly and independently at random among all processes (including itself). It then updates $v_i$ to the \emph{median} of $v_i$, $v_j$ and $v_k$.

[Section 2.2, p. 5:] We write w.h.p. to refer to an event that holds with probability at least $1 - n^{-c}$ for $c > 1$.
'''
notes = "No LaTeX source; transcribed from the PDF. Theorem 20 (own entry) is the same result stated in Section 4.3. Theorem 1.1 of the SPAA 2011 proceedings."

