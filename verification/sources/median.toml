status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
However, if some processes can be corrupted, finding and staying at a consensus is much more tricky. We use the following strong adversarial model. A $T$-bounded adversary is allowed to know the entire history of the protocol. At the beginning of each round, it may decide to change the state of up to $T$ many of the processes in an arbitrary way subject to the constraint that it can only change the value of a process to one out of the initial set of values $\{v_1, \ldots, v_n\}$. This is necessary to stay within the original consensus problem (i.e., the processes agree on one of the initial values) but also reasonable in applications where the values are signed by some outside authority so that the adversary cannot just come up with a value by itself.

Of course, in our adversarial model we cannot enforce any more that eventually all processes agree on a stable value. Hence we will only require that there is a round $r$ and value $v \in \{v_1, \ldots, v_n\}$ such that for any round later than $r$, all but up to $O(T)$ processes agree on $v$. We will call this \emph{almost stable consensus}.
'''
context = '''
[Section 1.1, p. 3:] Each process $i$ initially has some value $v_i \in \mathbb{N}$ [...]. We assume that time proceeds in synchronized rounds.

[Section 3, p. 7:] We also consider an adversary with the following abilities. In each round after all $n$ balls have made their random choices, the adversary is allowed to change the choices of at most $\sqrt{n}$ balls.
'''
notes = "No LaTeX source; transcribed from the PDF. The library's adversary acts after the median step of each round (median/README.md); the paper's Section 1.1 adversary acts at the beginning of each round and its Section 3 adversary (two bins) changes the random choices after they are made."

