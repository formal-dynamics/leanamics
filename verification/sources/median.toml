statement = '''
[p. 12:] {\bf Lower bound on $\Delta_{BA}$.}
The expectation $\mathbf{E} \Delta_{BA}$, taken over the random selection of neighbours in the current voting step,
is equal to
\begin{eqnarray}
\mathbf{E} \Delta_{BA} & = & \sum_{v \in B} \left(\frac{d_v^A}{d}\right)^2
  \; \ge \; \frac{1}{Bd^2} \left(\sum_{v \in B} d_v^A\right)^2
  \; = \; \frac{1}{Bd^2}  \left(E(A,B)\right)^2  \nonumber \\
  & \ge & \frac{1}{Bd^2}  \left( \frac{dAB}{n} - \alpha d \sqrt{AB} \right)^2
  \; = \; \frac{A^2B}{n^2} \left(1 - \alpha \frac{n}{\sqrt{AB}}\right)^2  \qquad (19) \\
  & \ge & \frac{A^2B}{n^2} \left(1 - 2\alpha \frac{n}{\sqrt{AB}}\right)
  \; = \; \frac{A^2B}{n^2} \left(1 - 2\eta\right), \qquad (20)
\end{eqnarray}
where $\eta \equiv \eta_{AB} = \alpha n/\sqrt{AB} \le \alpha \sqrt{2/c} \le c/25$.

[p. 13:] The expectation $\mathbf{E} \Delta_{AB}$, taken over the random selection of neighbours in
the current voting step, is equal to
\begin{eqnarray}
\mathbf{E} \Delta_{AB} & = & \sum_{v \in A} \left(\frac{d_v^B}{d}\right)^2
   \; = \; \sum_{i=0}^q \sum_{v \in C_i} \left(\frac{d_v^B}{d}\right)^2
   \; \le \; C_q + \sum_{i=0}^{q-1} \sum_{v \in C_i} \left(\frac{d_v^B}{d}\right)^2  \nonumber \\
  & \le & C_q + \sum_{i=0}^{q-1} C_i \left(\frac{(dB/n)(1+2^i \eta)}{d}\right)^2
   \; = \; C_q + \frac{B^2}{n^2} \sum_{i=0}^{q-1} C_i (1+2^{i+1} \eta + 2^{2i} \eta^2)  \qquad (24) \\
   & = & C_q + \frac{B^2}{n^2}
                     \left( \sum_{i=0}^{q-1} C_i + C_0 (2\eta + \eta^2)
                              + \eta\sum_{i=1}^{q-1} 2^{i+1}C_i \left(1 + 2^{i-1} \eta\right)\right) \nonumber \\
    & \le & C_q + \frac{B^2}{n^2}
                     \left( A + A(2\eta + \eta^2) +
                              \eta\sum_{i=1}^{q-1} \frac{A}{2^{i-3}}\left(1 + 2^{i-1} \eta\right)\right) \qquad (25) \\
