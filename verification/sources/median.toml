{\rm (Expander Mixing Lemma~[3]).}
Let $G = (V,E)$ be a $d$-regular $n$-vertex graph.
Let $1 = \lambda_1 \ge \lambda_2 \ge \cdots \lambda_n \ge -1$ be the eigenvalues
of the transition matrix of the random walk on $G$,
and let $\lambda = \lambda_G = \max\{ |\lambda_2|, |\lambda_n| \}$. Then for all $S, T \subseteq V$,
\[ \left| E(S,T) - \frac{dST}{n} \right| \; \le \; \lambda d \sqrt{ST}.
\]
'''
context = '''
[Section 2, p. 4:] For convenience, $A$ and $B$ will denote the opinions, the two sets of vertices who have these opinions, and the sizes of these sets, depending on the context.

[Section 4.1, p. 8:] The condition in Lemma 2 says that the number $E(X,Y)$ of edges between any disjoint large subsets of vertices $X$ and $Y$ is close to the value $dXY/n$ expected in the random regular graph. This condition is of the form as in the Expander Mixing Lemma (stated below as Lemma 3), so Lemma 2 can be immediately applied to expanders (see Corollary 2).

[Lemma 2, p. 8:] Let $G$ be a $d$-regular $n$-vertex connected graph such that
\begin{equation}
   \left| E(X,Y) - \frac{dXY}{n} \right| \le \alpha d \sqrt{XY}, \qquad (9)
\end{equation}
for each pair $X$ and $Y$ of disjoint subsets of vertices of sizes $Y \ge cn$ and $X \ge (2/3)\alpha c^{3/2} n$.

[Proof of Corollary 2, p. 9:] If $\lambda \le 1/K_1$, then $\lambda \le c^{3/2}/36$ and we can apply Lemma 2 with $c$ and $\alpha = \lambda$. Now Lemmas 2 and 3 imply that [...]
'''
notes = "Macros replaced: \\l -> \\lambda, \\a -> \\alpha; printed equation number (9) written as \\qquad (9). Reference [3] is Alon and Chung, Explicit construction of linear sized tolerant networks, Discrete Math. 72 (1988/89). Sets and their sizes share a letter (S T in dST/n is |S||T|). 'lambda_2 \\ge \\cdots \\lambda_n' (a missing \\ge) as printed. median:lem:cer-mixing-prop (lambda_G <= alpha implies hypothesis (9)) is how the proof of Corollary 2 uses Lemma 3."

