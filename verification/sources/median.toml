statement = '''
This lemma follows from Corollary~4 applied with $c = 1 - (2/5)(1-\lambda)^{-1} > 0$, after checking that $|E(S)| \le (3/10)dS$ whenever $S \le cn$.
It is shown in~[20] that the conductance of graph $G = (V,E)$ defined as
\[ \Phi_G = \min_{\emptyset \neq S\subset V} \frac{n E(S,\bar{S})}{d S \bar{S}},
\]
is at least $1 - \lambda$.
This implies that
$E(S,\bar{S}) \ge (1 - \lambda) dS\bar{S}/n$,
so for any $S\subseteq V$ of size at most~$cn$,
\begin{eqnarray*}
    |E(S)| & = & \frac{1}{2} \left(dS - E(S,\bar{S})\right)
    \; \le \; \frac{1}{2} d S \left(1 - (1-\lambda) \bar{S}/n\right) \\
    & \le & \frac{1}{2} d S \left(1 - (1-\lambda)(1-c)\right)
    \; = \; \frac{3}{10} dS.
\end{eqnarray*}
'''
context = '''
[Lemma 6, p. 15:] Let $G$ be a $d$-regular $n$-vertex graph with $\lambda = \lambda_G < 3/5$. Then the minority vote $B$ reduces from $(3/13)(3/5 - \lambda)n$ to $\omega$ within $O(\log n)$ steps with probability at least $1-e^{-\Theta(\omega)}$.

[Section 2, p. 5:] [...] a $d$-regular graph $G$ with a small second eigenvalue $\lambda_G = \max \{\lambda_2, |\lambda_n|\}$, where $\lambda_1 \geq \lambda_2 \geq \dots \geq \lambda_n$ are the eigenvalues of the transition matrix $P = (1/d)A$ of a random walk on $G$ and $A$ is the adjacency matrix of $G$.

[Section 4.1, p. 8:] [...] the number $E(X,Y)$ of edges between any disjoint large subsets of vertices $X$ and $Y$ [...]

[Lemma 5, p. 15:] [...] spans at most $\alpha d S$ edges (that is, $|E(S)| \le \alpha d S$) [...]
'''
notes = "This passage is the proof of Lemma 6 (it continues onto p. 16); the paper has no separate statement of the sparsity bound. Macros replaced: \\l -> \\lambda, \\brac{x} -> \\left(x\\right). Reference [20] is Jerrum and Sinclair. The library proves its version (sets of at most epsilon n vertices when lambda_G <= 3/5 - epsilon) from the expander mixing lemma (Lemma 3) instead of the conductance bound (median/FORMALIZATION_DIFFERENCES.md, Expander item 6)."

