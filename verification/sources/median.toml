url = "https://arxiv.org/abs/1602.04667v5"
status = "transcribed by an AI agent from the arXiv LaTeX source of v5 and compared with the PDF of v5; not yet checked by a person"
statement = '''
Let $\mathcal{A} = \mathcal{C}_{1}$ be the dominant color and $\mathcal{B} = \mathcal{C}_{2}$ the second largest
color. Assume $a - b \geq z \cdot \sqrt{n\log{n}}$ for a sufficiently large
constant $z$. From Lemma~2.2 we know that $a' - b' \geq
\left(a-b\right)\cdot\left(1+a/(4n)\right)$ with high probability.
Since $\mathcal{B}$ is the second largest color, we obtain from Lemma~2.3 for any remaining color $\mathcal{C}_{j}$ with $j \geq 3$ that with high probability
$ a' - c_j' \geq a' - b' \geq
\left(a-b\right)\cdot\left(1+a/(4n)\right)$. [...]

Taking the union bound over all colors, we conclude that the distance between the first color $\mathcal{A}$ and every other color grows in every round by a factor of at least
$\left(1+a/(4n)\right)$ with high probability. Therefore, after
$\tau= 4n/a$ rounds, the relative distance between $\mathcal{A}$ and $\mathcal{B}$ doubles with high probability.
Hence, the required time for $\mathcal{A}$ to reach a size of at least
$(1/2+\varepsilon_{1})\cdot n$ for a constant $\varepsilon_{1} > 0$ is
bounded by $O\left(n/a\cdot\log{n}\right)$.
This bias is large enough that we assume in the following  that all nodes which are not of color $\mathcal{A}$ are of color $\mathcal{B}$.
In absence of an adversary, we can see that after additional $O\left(\log{n}\right)$
rounds every node has the same color $\mathcal{A}$, with high probability; see [15].
'''
context = '''
[Section 1.1, p. 3:] We consider the following plurality consensus process on the clique $G=(V,E) = K_n$ of size $n$. Initially, the nodes are partitioned into $k$ groups representing $k$ colors $\mathcal{C}_1, \dots, \mathcal{C}_k$. We will denote the number of nodes having color $\mathcal{C}_{j}$ as $c_j$. [...] W.l.o.g., we assume that colors are ordered in descending order such that $c_1 \geq c_2 \geq \dots \geq c_k$. We will denote the initial plurality color $\mathcal{C}_{1}$ as $\mathcal{A}$ with size $a = c_1$ and we will use $\mathcal{B}$ to denote the second largest color $\mathcal{C}_{2}$ of size $b = c_2$.

[Section 1.1, p. 3, Synchronous Model:] One prominent example here is the Two-Choices process where in each round every node samples two nodes chosen uniformly at random, with replacement. If the chosen nodes' colors coincide, then the node adopts this color.

[Footnote, p. 4:] Throughout this paper, the expression \emph{with high probability} means a probability of at least $1 - n^{-\Omega\left(1\right)}$.

[Section 2.1, p. 10:] Observe that if $a \geq \left(1/2 + \varepsilon_{1}\right)n$ for some constant $\varepsilon_{1} > 0$, the process converges within $O\left(\log{n}\right)$ steps with high probability. This follows from [15] since in the case of $a \geq \left(1/2 + \varepsilon_{1}\right)n$ the process is stochastically dominated by the two color voting process. For the sake of readability we assume in the following that $a \leq n/2$.

[Lemma 2.2, p. 11:] Let $\mathcal{A}$ be the dominating color and $\mathcal{B}$ be the second largest color. Assume that $a - b > z \cdot \sqrt{n\log{n}}$. There exists a constant $z$ such that $a'-b'>\left(a-b\right)\left(1+a/(4n)\right)$ with high probability.
'''
notes = "Passage of the proof of Theorem 1.2 (p. 14 to 15), quoted without the paragraph on the adversary (marked [...]) and without the final paragraphs. Macros replaced: \\A -> \\mathcal{A}, \\B -> \\mathcal{B}, \\C{j} -> \\mathcal{C}_{j}, \\ifrac{a}{b} -> a/b, \\eps{1} -> \\varepsilon_{1}, \\whp -> 'with high probability', \\BigO{x} -> O\\left(x\\right); \\autoref{...} rendered as the printed 'Lemma 2.2', 'Lemma 2.3'; \\cite{CER14} rendered as [15] (Cooper, Elsässer, Radzik, ICALP 2014). The library's growth step (factor 1 + a/(8n) up to a = 3n/4) and finishing phase (through the binary median process) are its versions of these two steps (median/README.md)."

