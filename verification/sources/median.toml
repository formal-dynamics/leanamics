item = "median:lem:tc-expect"
paper = "R. Elsässer, T. Friedetzky, D. Kaaser, F. Mallmann-Trenn, H. Trinker. Rapid asynchronous plurality consensus (v1 to v4: Efficient k-party voting with two choices)"
venue = "arXiv:1602.04667"
version = "arXiv:1602.04667v5"
result = "Section 2.1, Equation (1)"
page = 10
url = "https://arxiv.org/abs/1602.04667v5"
status = "transcribed by an AI agent from the arXiv LaTeX source of v5 and compared with the PDF of v5; not yet checked by a person"
statement = '''
Since all nodes perform their choices independently, the first sum $f_{\overline{\mathcal{C}_{i}}i}$ has a binomial distribution with parameters $f_{\overline{\mathcal{C}_{i}}i} \sim B(n-c_i,\,c_i^2/n^2)$. Furthermore, every node of color $\mathcal{C}_{i}$ changes its color away from $\mathcal{C}_{i}$ to any other opinion with probability $p^{\text{away}}_i = \sum_{j\neq i}c_j^2/n^2$. Therefore, the second sum $f_{i\overline{\mathcal{C}_{i}}}$ also has a binomial distribution with parameters $f_{i\overline{\mathcal{C}_{i}}} \sim B(c_i,\,p^{\text{away}}_i)$. That is, we have in expectation
\begin{equation}
\mathrm{E}\left[c_i'\right] =c_i + \frac{\left(n-c_i\right)c_i^2}{n^2} - \frac{c_i}{n^2}\sum_{j\neq i}c_j^2 . \qquad (1)
\end{equation}
'''
context = '''
[Section 1.1, p. 3:] We consider the following plurality consensus process on the clique $G=(V,E) = K_n$ of size $n$. Initially, the nodes are partitioned into $k$ groups representing $k$ colors $\mathcal{C}_1, \dots, \mathcal{C}_k$. We will denote the number of nodes having color $\mathcal{C}_{j}$ as $c_j$. [...] One prominent example here is the Two-Choices process where in each round every node samples two nodes chosen uniformly at random, with replacement. If the chosen nodes' colors coincide, then the node adopts this color.

[Section 2.1, p. 9:] Let $f_{ij}$ denote the random variable denoting the \emph{flow} from color $\mathcal{C}_i$ to color $\mathcal{C}_j$, that is, $f_{ij}$ at a given time step $t$ represents the number of nodes which had color $\mathcal{C}_i$ at the previous time step $t-1$ and switched to color $\mathcal{C}_j$ at time $t$. We will use $c_1', \dots, c_k'$ to denote the number of nodes of corresponding colors after the switching has been performed before the adversary changes $F$ arbitrary nodes.

[Section 2.1, p. 10:] Let $S \subseteq C$ be a set of colors. We will use the random variable $f_{iS}$ to denote the sum of all flows from color $\mathcal{C}_{i}$ to any color in $S$ and $f_{Si}$ to denote the sum of all flows from any color in $S$ to $\mathcal{C}_{i}$. [...] Let $\mathcal{C}_{i}$ be a color and $\overline{\mathcal{C}_{i}}$ be the set of all other colors, defined as $\overline{\mathcal{C}_{i}} = C \setminus \mathcal{C}_{i}$. We observe that after one round the new number of nodes supporting $\mathcal{C}_{i}$ is a random variable
\begin{equation*}
c_i' = c_i + \sum_{j \neq i} f_{ji} - \sum_{j \neq i} f_{ij} = c_i + f_{\overline{\mathcal{C}_{i}}i} - f_{i\overline{\mathcal{C}_{i}}} .
\end{equation*}
'''
notes = "Macros replaced: \\C{i} -> \\mathcal{C}_{i}, \\notC{i} -> \\overline{\\mathcal{C}_{i}}, \\ifrac{a}{b} -> a/b, \\Expected{x} -> \\mathrm{E}\\left[x\\right], \\TC -> Two-Choices; \\enspace dropped; \\label replaced by the printed equation number, written as \\qquad (1). The library's further one-round facts (the expected gap (a-b)(1 + (a+b)/n - sum c_i^2/n^2) and its lower bound (a-b)(1 + (a/n)(1 - a/n))) are steps of the proof of Lemma 2.2 (p. 11). Observation 2.1 has its own entry."

