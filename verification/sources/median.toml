status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
The algorithm has reached a fixed point (has stabilized) in the $i$-th iteration if and only if $b_{i,1} = \cdots = b_{i,n}$.
'''
context = '''
[Section 1.1, p. 3:] Each process $i$ initially has some value $v_i \in \mathbb{N}$ [...]. The goal is to eventually agree on a common, stable value $v \in \{v_1, \ldots, v_n\}$, that is, afterwards the processes will not deviate from $v$ anymore.

[Section 1.2, p. 4:] When taking the \emph{mean} of the three values instead of the median, the convergence properties towards a single number have already been formally analyzed [17]. However, with the mean rule we are no longer guaranteed to solve the consensus problem (i.e., one of the initial values wins).

[Section 2.1, p. 5:] We have $n$ balls (processes) numbered from $1$ to $n$, and $n$ bins (values) also numbered from $1$ to $n$. Write $b_{0,1}, \ldots, b_{0,n}$ for the initial assignment of each ball to its bin, where the bins are identified with integers in $\mathbb{N}$. [...] In the $i$-th iteration the algorithm does the following: Let $I_{i,1}, \ldots, I_{i,n}$ and $J_{i,1}, \ldots, J_{i,n}$ be $2n$ independent random variables, chosen uniformly in $[n] = \{1, \ldots, n\}$. Then the bin assignment of the $i$-th iteration is
\[ b_{i,j} = \mathrm{median}(b_{i-1,j}, b_{i-1,I_{i,j}}, b_{i-1,J_{i,j}}) \]
for $j = 1, \ldots, n$.
'''
notes = "No LaTeX source; transcribed from the PDF. The paper states validity (new values are current values), the range property and almost-sure consensus without a numbered result; this entry gives the passages that define the median rule, the goal of agreeing on one of the initial values and the fixed points. The library attributes the item to the paper as a whole (PROVENANCE.md, first row of the median table)."

[[source]]
item = "median:thm:expect"
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Proof of Lemma 11, E[L_j]"
page = 15
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
For any ball $i$ let $L_{j,i}$ be the random variables which equals $1$ if ball $i$ is in the left bin after $j$ rounds, and $0$ otherwise. If the ball $i$ was in the left bin in round $j-1$, then writing $p_{j-1} = L_{j-1}/n$, we have $\mathrm{E}[L_{j,i}] = \Pr(L_{j,i} = 1) = 1 - (1 - p_{j-1})^2$. Similarly, if the ball $i$ was in the right bin, we have $\mathrm{E}[L_{j,i}] = p_{j-1}^2$. Then $L_j = \sum_i L_{j,i}$ is the total number of balls in the left bin after $j$ rounds. Then we have
\[ \mathrm{E}[L_j] = L_{j-1} p_{j-1} (3 - 2p_{j-1}) = n (p_{j-1})^2 (3 - 2p_{j-1}). \]
'''
context = '''
[Section 2.1, p. 5:] In the $i$-th iteration the algorithm does the following: Let $I_{i,1}, \ldots, I_{i,n}$ and $J_{i,1}, \ldots, J_{i,n}$ be $2n$ independent random variables, chosen uniformly in $[n] = \{1, \ldots, n\}$. Then the bin assignment of the $i$-th iteration is
\[ b_{i,j} = \mathrm{median}(b_{i-1,j}, b_{i-1,I_{i,j}}, b_{i-1,J_{i,j}}) \]
for $j = 1, \ldots, n$.

[Section 3, p. 7:] In this section, we consider the case with only two bins. [...] Note that for the two bin-case, the median rule coincides with the \emph{majority rule}, where a balls next bin is chosen to be the majoritary bin of itself and two random balls. [...] In the following, let $L_t$ be the number of balls in the left bin at step $t$ and let $R_t$ be the number of balls in the right bin at step $t$.
'''
notes = "No LaTeX source; transcribed from the PDF. The paper has no numbered statement of the one-round expectation; this is the computation at the start of the proof of Lemma 11 (two bins), with p = L/n the fraction of balls in the left bin. 'the random variables which equals' and the middle expression L_{j-1} p_{j-1}(3 - 2p_{j-1}) as printed (it equals the right-hand side since L_{j-1} = n p_{j-1})."

[[source]]
item = "median:thm:threshold"
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Lemma 17"
page = 8
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
If the assignment $(k_i)_{i \in [n]}$ is finer than the assignment $(\tilde{k}_i)_{i \in [n]}$, then the number of iterations of the algorithm needed for convergence with the initial assignment $(k_i)_{i \in [n]}$ upper bounds the number of iterations needed with the initial assignment $(\tilde{k}_i)_{i \in [n]}$. This is true point wise in the probability space and hence applies to both average and high probability running times.
'''
context = '''
[Section 2.1, p. 5:] We have $n$ balls (processes) numbered from $1$ to $n$, and $n$ bins (values) also numbered from $1$ to $n$. [...] In the $i$-th iteration the algorithm does the following: Let $I_{i,1}, \ldots, I_{i,n}$ and $J_{i,1}, \ldots, J_{i,n}$ be $2n$ independent random variables, chosen uniformly in $[n] = \{1, \ldots, n\}$. Then the bin assignment of the $i$-th iteration is
\[ b_{i,j} = \mathrm{median}(b_{i-1,j}, b_{i-1,I_{i,j}}, b_{i-1,J_{i,j}}) \]
for $j = 1, \ldots, n$. The algorithm has reached a fixed point (has stabilized) in the $i$-th iteration if and only if $b_{i,1} = \cdots = b_{i,n}$.

[Section 4, p. 8:] In order to be able to reduce our problem with $n$ bins to the one with $2$ bins, we first establish a partial order of \emph{fineness} on the distribution of balls into bins.

[Section 4.1, p. 8:] We say that an initial assignment with $k_i$ balls in bin $i$ ($i \in [n]$) is \emph{finer} than an assignment $(\tilde{k}_i)_{i \in [n]}$, if there is a monotonic function $f : [n] \to [n]$ mapping bins to bins such that
\[ \tilde{k}_i = \sum_{j \in f^{-1}(i)} k_j \]
for each $i \in [n]$. Obviously, the ``is finer''-relation induces a partial order on the set of all balls-and-bins-distributions.
'''
notes = "No LaTeX source; transcribed from the PDF. The library's threshold reduction (the median commutes with monotone maps, so thresholding at a value gives the binary process for the same samples) is the mechanism behind Lemma 17: thresholding is the monotone map f onto two bins. PROVENANCE.md describes it as 'their reduction to two values'."

[[source]]
items = ["median:thm:whp", "median:thm:tc-two"]
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Lemma 12 (two bins, Case 2)"
page = 7
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
If there is a step $t$ with $c\sqrt{n \ln n} \le \Delta_t < n/3$ for a sufficiently large constant $c$, then $O(\log n)$ additional rounds of the majority rule suffice to arrive at case 1 w.h.p.
'''
context = '''
[Section 2.2, p. 5:] We write w.h.p. to refer to an event that holds with probability at least $1 - n^{-c}$ for $c > 1$.

[Section 3, p. 7:] In this section, we consider the case with only two bins. [...] We also consider an adversary with the following abilities. In each round after all $n$ balls have made their random choices, the adversary is allowed to change the choices of at most $\sqrt{n}$ balls. [...] Note that for the two bin-case, the median rule coincides with the \emph{majority rule}, where a balls next bin is chosen to be the majoritary bin of itself and two random balls.

In the following, let $L_t$ be the number of balls in the left bin at step $t$ and let $R_t$ be the number of balls in the right bin at step $t$. Let $X_t = \min(L_t, R_t)$ and let $Y_t = \max(L_t, R_t)$. For simplicity, we will assume that $n$ is even. The proof for odd $n$ follows along the same lines. The imbalance at a step $t$ is given by $\Delta_t = (Y_t - X_t)/2$ (which is a positive integer if $n$ is even). The labelled imbalance is given by $\Psi_t = (R_t - L_t)/2$. Based on the imbalance $\Delta_t$ we distinguish between three cases.

\textbf{Case 1: $\Delta_0 \ge n/3$} [...]

[Lemma 11, p. 7:] If $\Delta_0 \ge cn$, where $c > 0$ is any constant, then $O(\log\log n)$ rounds of the majority rule suffice to reach a stable consensus, w.h.p.
'''
notes = "No LaTeX source; transcribed from the PDF. The library's two-value result (consensus from a gap of order sqrt(n log n) within O(log n) rounds) is the combination of Lemmas 12 and 11 (Cases 2 and 1 of Section 3); Lemma 11 has its own entry. The paper writes ln in Lemma 12 and log elsewhere. 'a balls next bin' and 'majoritary' as printed. For median:thm:tc-two (two colours of k-party 2-Choices) the library uses the same two-value result."

