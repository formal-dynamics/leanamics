[[source]]
item = "median:def:median"
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Sections 1.2 and 2.1, median rule"
page = 4
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
[Section 1.2, p. 4:] We propose a very simple protocol for our model called the \emph{median rule}: In each round, every process $i$ picks two processes $j$ and $k$ uniformly and independently at random among all processes (including itself). It then updates $v_i$ to the \emph{median} of $v_i$, $v_j$ and $v_k$. For example, if $v_i = 10$, $v_j = 12$ and $v_k = 100$, then the new value of $v_i$ is $12$.

[Section 2.1, p. 5:] We have $n$ balls (processes) numbered from $1$ to $n$, and $n$ bins (values) also numbered from $1$ to $n$. Write $b_{0,1}, \ldots, b_{0,n}$ for the initial assignment of each ball to its bin, where the bins are identified with integers in $\mathbb{N}$. So, the ``all-one'' assignment that assigns each ball to a different bin, can be achieved by setting $b_{0,i} = i$ for $1 \le i \le n$.

In the $i$-th iteration the algorithm does the following: Let $I_{i,1}, \ldots, I_{i,n}$ and $J_{i,1}, \ldots, J_{i,n}$ be $2n$ independent random variables, chosen uniformly in $[n] = \{1, \ldots, n\}$. Then the bin assignment of the $i$-th iteration is
\[ b_{i,j} = \mathrm{median}(b_{i-1,j}, b_{i-1,I_{i,j}}, b_{i-1,J_{i,j}}) \]
for $j = 1, \ldots, n$. The algorithm has reached a fixed point (has stabilized) in the $i$-th iteration if and only if $b_{i,1} = \cdots = b_{i,n}$.
'''
context = '''
[Section 1.1, p. 3:] In our model we have $n$ processes that are completely interconnected in an anonymous network. [...] Each process $i$ initially has some value $v_i \in \mathbb{N}$ (which is assumed to require only $O(\log n)$ bits for its storage so that values can be efficiently exchanged). The goal is to eventually agree on a common, stable value $v \in \{v_1, \ldots, v_n\}$, that is, afterwards the processes will not deviate from $v$ anymore. We assume that time proceeds in synchronized rounds.

[Section 3, p. 7:] Note that for the two bin-case, the median rule coincides with the \emph{majority rule}, where a balls next bin is chosen to be the majoritary bin of itself and two random balls.
'''
notes = "No LaTeX source; transcribed from the PDF. The library's numbering follows this 2009 version; in the SPAA 2011 proceedings the results are renumbered (Theorem 1 is Theorem 1.1, Theorem 21 is Theorem 4.1, the lemmas are numbered differently). 'a balls next bin' and 'majoritary' as printed. The blueprint item also defines 2-Choices on two values, which the Section 3 sentence in the context relates to the median rule."

