Let $0 < c \le 1/2$, $0 < \alpha \le  c^{3/2}/36$, and $\alpha^2 c^2 n = \Omega(n^\epsilon)$, for
a constant $\epsilon > 0$.
Let $G$ be a $d$-regular $n$-vertex connected graph such that
\begin{equation}
   \left| E(X,Y) - \frac{dXY}{n} \right| \le \alpha d \sqrt{XY}, \qquad (9)
\end{equation}
for each pair $X$ and $Y$ of disjoint subsets of vertices of
sizes $Y \ge cn$ and $X \ge (2/3)\alpha c^{3/2} n$.
There exist absolute constants $K$ and $K'$ (independent of $d$, $c$ and $\alpha$) such that,
if the initial advantage of the $A$-vote in $G$ is
\begin{equation}
 \nu_0 \; \ge \; K \alpha, \qquad (10)
\end{equation}
then with probability at least $1 - e ^{-\Theta(\alpha^2 c^2 n)}$, the advantage of the $A$-vote
increases to $1-2c$ (that is, the $B$-vote decreases to $cn$)
within $K'(\log (1/\nu_0) + \log( 1/c))$ voting steps.
'''
context = '''
[Section 1, p. 2:] [...] we consider a modified version of pull voting in which each vertex $v$ randomly queries two neighbours at each step. On the basis of the sample taken, vertex $v$ revises its opinion as follows. If both neighbours have the same opinion, the calling vertex $v$ adopts this opinion. If the two opinions differ, the calling vertex $v$ retains its current opinion in this round. [...]

[Section 2, p. 4:] Assume that initially each vertex holds one of two opinions. For convenience, $A$ and $B$ will denote the opinions, the two sets of vertices who have these opinions, and the sizes of these sets, depending on the context. If opinion $A$ is  the majority, then the imbalance $\nu$ (also referred to as the relative difference between the votes, or the advantage of the $A$ vote) is given by $A - B = \nu n$.

[Section 3, p. 8:] We give proofs for sampling with replacement.

[Section 4.1, p. 8:] The condition in Lemma 2 says that the number $E(X,Y)$ of edges between any disjoint large subsets of vertices $X$ and $Y$ is close to the value $dXY/n$ expected in the random regular graph.
'''
notes = "Macros replaced: \\a -> \\alpha, \\e -> \\epsilon; \\label replaced by the printed equation numbers, written as \\qquad (9) and \\qquad (10). The library states the lemma with K = 120 and an explicit failure probability (median/README.md)."

