status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
Assume that each of the $n$ balls is initially assigned uniformly at random to one of the $m$ bins. Then the median rule reaches a stable consensus in the following number of rounds w.h.p.:
\[
\begin{array}{ll}
O(\log m + \log\log n) & \text{if $m$ is odd,} \\
\Theta(\log n) & \text{if $m$ is even.}
\end{array}
\]
'''
context = '''
[Section 1.2, p. 4:] We propose a very simple protocol for our model called the \emph{median rule}: In each round, every process $i$ picks two processes $j$ and $k$ uniformly and independently at random among all processes (including itself). It then updates $v_i$ to the \emph{median} of $v_i$, $v_j$ and $v_k$.

[Section 2.1, p. 5:] We have $n$ balls (processes) numbered from $1$ to $n$, and $n$ bins (values) also numbered from $1$ to $n$. [...] The algorithm has reached a fixed point (has stabilized) in the $i$-th iteration if and only if $b_{i,1} = \cdots = b_{i,n}$.

[Section 2.2, p. 5:] We write w.h.p. to refer to an event that holds with probability at least $1 - n^{-c}$ for $c > 1$.

[Section 5, p. 10:] In this section, we investigate the case where all $n$ balls are initially put independently and randomly into $m$ bins.

[Section 5.1, p. 10:] Without the adversary, we get the following result.
'''
notes = "No LaTeX source; transcribed from the PDF. Theorem 4.1 in the SPAA 2011 proceedings. The library formalizes the odd case for exactly equal supports (median:thm:odd-split) and, as steps of its proof, the margin statements median:thm:binary-fast and median:thm:median-fast; the proof of Theorem 21 merges the (m-1)/2 leftmost and rightmost bins into two superbins and lets the middle bin win (p. 10). PROVENANCE.md attributes all three items to Theorem 21 (odd case)."

[[source]]
item = "median:thm:binary-adv"
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Theorem 10"
page = 7
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
For any initial distribution of the balls, $O(\log n)$ rounds of the majority rule suffice to get $n - O(\sqrt{n})$ balls into the same bin, w.h.p. This holds even if an adversary is allowed to manipulate the random choices of at most $O(\sqrt{n})$ balls.
'''
context = '''
[Section 2.2, p. 5:] We write w.h.p. to refer to an event that holds with probability at least $1 - n^{-c}$ for $c > 1$.

[Section 3, p. 7:] In this section, we consider the case with only two bins. This special case is of more general interest, as the later analysis with more than two bins will use some results of this section.

We also consider an adversary with the following abilities. In each round after all $n$ balls have made their random choices, the adversary is allowed to change the choices of at most $\sqrt{n}$ balls. We prove that despite the adversary, we reach a stable state where one bin contains at least $n - \sqrt{n}$ balls w.~h.~p.

Note that for the two bin-case, the median rule coincides with the \emph{majority rule}, where a balls next bin is chosen to be the majoritary bin of itself and two random balls.
'''
notes = "No LaTeX source; transcribed from the PDF. median/README.md cites Theorem 10 for the two-value case with the adversary; PROVENANCE.md cites Theorems 2, 3, 10 and 20 for the row (see the entries of median:thm:median-adv). 'a balls next bin' and 'majoritary' as printed. The Section 3 adversary changes the random choices of balls after they are made; the Section 1.1 adversary changes the states of processes at the beginning of each round (see median:def:adversary)."

[[source]]
items = ["median:thm:median-adv", "median:thm:binary-adv"]
paper = "B. Doerr, L. A. Goldberg, L. Minder, T. Sauerwald, C. Scheideler. Stabilizing consensus with the power of two choices"
venue = "Dagstuhl Seminar Proceedings 09371 (2009); later SPAA 2011"
version = "Dagstuhl Sem. Proc. 09371 (2009)"
result = "Theorem 2"
page = 4
url = "https://drops.dagstuhl.de/entities/document/10.4230/DagSemProc.09371.6"
status = "transcribed by an AI agent from the PDF of the 2009 Dagstuhl version (no LaTeX source available; formulas written in LaTeX) and compared with that PDF; not yet checked by a person"
statement = '''
For any initial state with a constant number of different values and under any $T$-bounded adversary with $T \le \sqrt{n}$, the median rule reaches an almost stable consensus in $O(\log n)$ rounds w.h.p.
'''
context = '''
[Section 1.1, p. 3:] We use the following strong adversarial model. A $T$-bounded adversary is allowed to know the entire history of the protocol. At the beginning of each round, it may decide to change the state of up to $T$ many of the processes in an arbitrary way subject to the constraint that it can only change the value of a process to one out of the initial set of values $\{v_1, \ldots, v_n\}$. [...]

Of course, in our adversarial model we cannot enforce any more that eventually all processes agree on a stable value. Hence we will only require that there is a round $r$ and value $v \in \{v_1, \ldots, v_n\}$ such that for any round later than $r$, all but up to $O(T)$ processes agree on $v$. We will call this \emph{almost stable consensus}.

[Section 1.2, p. 4:] We propose a very simple protocol for our model called the \emph{median rule}: In each round, every process $i$ picks two processes $j$ and $k$ uniformly and independently at random among all processes (including itself). It then updates $v_i$ to the \emph{median} of $v_i$, $v_j$ and $v_k$.

[Section 2.2, p. 5:] We write w.h.p. to refer to an event that holds with probability at least $1 - n^{-c}$ for $c > 1$.
'''
