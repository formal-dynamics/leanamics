[[source]]
items = ["moran:thm:star-amplifier", "moran:thm:star-limit"]
paper = "E. Lieberman, C. Hauert, M. A. Nowak. Evolutionary dynamics on graphs"
venue = "Nature 433:312-316 (2005)"
version = "author manuscript, November 2004"
result = "Main text, the star (rho_2)"
page = 4
url = "https://legacy-www.math.harvard.edu/archive/153_fall_04/Additional_reading_material/evolutionary%20graph%20theory.pdf"
status = "transcribed by an AI agent from the PDF of an author manuscript (no LaTeX source; the published article is not openly accessible and was not compared) and checked against the rendered page; not yet checked by a person"
statement = '''
The star structure (Fig 3a) consists of a center that is connected with each vertex on the periphery. All the peripheral vertices are connected only with the center. For large $N$, the fixation probability of a randomly placed mutant on the star is $\rho_2 = (1-1/r^2)/(1-1/r^{2N})$. Thus, any selective difference $r$ is amplified to $r^2$. The star acts as evolutionary amplifier, favoring advantageous mutants and inhibiting disadvantageous mutants. The balance tilts towards selection, and against drift.
'''
context = '''
[p. 2:] Consider a homogeneous population of size $N$. At each time step an individual is chosen for reproduction with a probability proportional to its fitness. The offspring replaces a randomly chosen individual. In this so-called Moran process (Fig 1a), the population size remains constant. Suppose all the resident individuals are identical and one new mutant is introduced. The new mutant has relative fitness $r$, as compared to the residents, whose fitness is 1. The fixation probability of the new mutant is
\[ \rho_1 = \frac{1-1/r}{1-1/r^N}. \qquad (1) \]
[pp. 2-3:] We introduce population structure as follows. Individuals are labelled $i = 1, 2, ...N$. The probability that individual $i$ places its offspring into position $j$ is given by $w_{ij}$. [...] In each iteration, an individual $i$ is chosen for reproduction with a probability proportional to its fitness. The resulting offspring will occupy vertex $j$ with probability $w_{ij}$. Note that $W$ is a stochastic matrix, which means that all its rows sum to 1. We want to calculate the fixation probability $\rho$ of a randomly placed mutant.
[p. 4:] Thus, it is easy to construct graphs that foster drift and suppress selection. Is it possible to suppress drift and amplify selection? Can we find structures where the fixation probability of advantageous mutants exceeds $\rho_1$?
[p. 11, legend of Figure 2:] Whenever the weights of edges are not shown, a weight of one is distributed evenly across all those edges emerging from a given vertex.
[p. 12, legend of Figure 3:] Selection amplifiers have remarkable symmetry properties. As the number of leaves and the number of vertices in each leaf grows large, these amplifiers dramatically increase the apparent fitness of advantageous mutants: a mutant with fitness $r$ on an amplifier of parameter $K$ will fare as well as a mutant of fitness $r^K$ in the Moran process. \textbf{a}, The star structure is a $K = 2$ amplifier.
'''
notes = "The entry quotes the paragraph of the main text on the star (rho_2). The author manuscript (dated November 2004) is hosted on a course page of the Harvard Mathematics Department (see `url`); the published main text is not openly accessible and was not compared. The paper gives no definition of 'amplifier' beyond the sentences quoted. N is the population size, so a star with N vertices has N - 1 leaves. Broom and Rychtar 2008 (Section 5) quote this formula as (1 - 1/r^2)/(1 - 1/r^{2n}) with n the number of leaves (see their entries)."

# Moran, J. Austral. Math. Soc. 1 (1959), and Moran, Proc. Camb. Phil. Soc. 54 (1958).

[[source]]
items = ["moran:thm:moran", "moran:thm:selection-fixation"]
paper = "P. A. P. Moran. The survival of a mutant gene under selection"
venue = "J. Austral. Math. Soc. 1:121-126 (1959)"
version = "journal version (scanned PDF)"
result = "Eq. (2)"
page = 3
url = "https://doi.org/10.1017/S1446788700025155"
status = "transcribed by an AI agent from the page images of the journal's scanned PDF (no LaTeX source; the OCR text layer was not used); not yet checked by a person"
statement = '''
The process is now identical with that of the gambler's ruin problem (Feller [2]) from which we see that if $\pi \neq \frac12$ the probability of $a$ not surviving is
\[ (2) \qquad P_0 = \frac{\left(\frac{1-\pi}{\pi}\right)^{2n} - \left(\frac{1-\pi}{\pi}\right)^{k_0}}{\left(\frac{1-\pi}{\pi}\right)^{2n} - 1} = 1 - P_{2n} \]
where $k_0$ is the initial value of $k$.
'''
context = '''
[p. 121:] In the present note we give an exact solution starting from any initial number of mutants in a model in which the generations overlap. This model was introduced for other purposes in a previous paper (Moran [6]). We suppose we have a population of $2n$ haploid individuals in which $k_0$ are initially of the mutant type $a$ and the rest $A$. The development of the process takes place in continuous time and each individual has a life time with a negative exponential distribution whose parameter depends only on whether the individual is $a$ or $A$. The state of the system at any time $t$
[p. 122:] is then defined by the number, $k$, of mutant individuals. When an individual dies it is immediately replaced by a new individual which is the offspring of the population immediately before the death. We can introduce selection into this model in two different ways.
[p. 122, first method (selection through the lifetimes, with parameters $\lambda_1$ for $a$ and $\lambda_2$ for $A$), after the death probabilities:] The individual born as a replacement is chosen at random from the gametic output of the previously existing generation and so the probability that it is $a$ is $k(2n)^{-1}$, and that it is $A$ is $(2n-k)(2n)^{-1}$.

We may now consider the discrete Markov chain embedded in this continuous process defined for those discrete instants of time at which a birth-death event occurs. This chain has $2n+1$ states defined by the integer $k (k = 0, 1, \cdots 2n)$ and transition probabilities $p_{ij}$ from state $i$ to state $j$ given by the formulae
\begin{align*}
p_{k,k-1} &= \lambda_2 k(2n-k)(2n)^{-1}\{\lambda_2 k + \lambda_1(2n-k)\}^{-1}.\\
p_{k,k+1} &= \lambda_1 k(2n-k)(2n)^{-1}\{\lambda_2 k + \lambda_1(2n-k)\}^{-1}.\\
p_{k,k} &= 1 - p_{k,k-1} - p_{k,k+1}.
\end{align*}
[p. 122:] In the second method of introducing selection we suppose that all individuals have the same negative exponential lifetime distribution so that when a death occurs the probability that it is the death of an $a$-individual is $k(2n)^{-1}$, and of an $A$ individual $(2n-k)(2n)^{-1}$. If the relative reproductive powers of the two kinds of gamete have the ratio $\mu_1\mu_2^{-1}$ the probability of the birth of an $a$-individual is $\mu_1 k\{\mu_1 k + \mu_2(2n-k)\}^{-1}$, and of an $A$ individual $\mu_2(2n-k)\{\mu_1 k + \mu_2(2n-k)\}^{-1}$. The transition probabilities of the embedded Markov chain are then
\begin{align*}
p_{k,k-1} &= \mu_2 k(2n-k)(2n)^{-1}\{\mu_1 k + \mu_2(2n-k)\}^{-1}.\\
p_{k,k+1} &= \mu_1 k(2n-k)(2n)^{-1}\{\mu_1 k + \mu_2(2n-k)\}^{-1}.\\
p_{k,k} &= 1 - p_{k,k-1} - p_{k,k+1}.
\end{align*}
[p. 123:] We notice that in both this and the former case the ratio $p_{k,k+1}(p_{k,k-1})^{-1}$ is constant, being $\mu_1\mu_2^{-1}$ and $\lambda_1\lambda_2^{-1}$ respectively. This suggests that we now embed another chain in this one by considering only those jumps of the process at which $k$ changes its value. Writing $\pi = \lambda_1(\lambda_1+\lambda_2)^{-1}$ or $\mu_1(\mu_1+\mu_2)^{-1}$ we thus get a process in which the transition probabilities are
\[ (1) \qquad \begin{cases} p_{k,k-1} = 1-\pi. \\ p_{k,k} = 0. \\ p_{k,k+1} = \pi. \end{cases} \]
If we now start the process with an initial value $k_0$ the probabilities of ultimate absorption $P_0$, $P_{2n}$, in the two absorbing states $(k = 0, 2n)$ will be the same as in the original continuous process. $P_0$ and $P_{2n}$ are in fact the probabilities of the mutant form not surviving, and surviving, respectively. When $\pi > \frac12$, $a$ has a selective advantage and when $\pi < \frac12$, a selective disadvantage.
'''
notes = "Scanned journal pages 121-126 are pages 1-6 of the PDF; `page` is the PDF page (journal p. 123). The PDF is freely accessible on Cambridge Core. Notation as printed: the population size is 2n, inverses are written (.)^{-1}. In the first method the mutant's lifetime density is printed as \\lambda_1^{-1} exp -(\\lambda_1^{-1} t) dt, so \\lambda_1 is a mean lifetime. With r = \\mu_1\\mu_2^{-1} (second method, selection on reproduction) one has (1 - \\pi)/\\pi = 1/r, so Eq. (2) gives P_{2n} = (1 - r^{-k_0})/(1 - r^{-2n}). The free access of this article was confirmed from outside any institutional network."

