# Antal, Redner, Sood, Phys. Rev. Lett. 96 (2006).

[[source]]
item = "moran:def:pull"
paper = "T. Antal, S. Redner, V. Sood. Evolutionary dynamics on degree-heterogeneous graphs"
venue = "Phys. Rev. Lett. 96:188104 (2006)"
version = "arXiv:q-bio/0601031v2"
result = "biased voter model (VM) and Eq. (1)"
page = 1
url = "https://arxiv.org/abs/q-bio/0601031v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
\texttt{Biased Voter Model (VM):} An individual dies with probability inversely proportional to its fitness, and is then replaced by the offspring of a randomly-chosen neighbor. Equivalently, death occurs randomly and replacement is proportional to the fitness of the donor. We implement the VM by updating a randomly-chosen genotype $\mathbf{0}$ with probability 1, while the fitter genotype $\mathbf{1}$ is updated with a probability $1-s$. Each individual in this death-first/birth-second process can equivalently be viewed as a voter that adopts the opinion of a randomly-selected neighbor [9, 10, 11].

We first study the evolution in VM dynamics. We symbolically represent the state of the system by $\eta$. In an elemental time interval $\delta t$ we choose a random node $x$. If the genotype at this node at time $t$, denoted as $\eta^t(x)$, equals $\mathbf{0}$, then node $x$ is updated by choosing a random neighbor $y$ and setting $\eta^{(t+\delta t)}(x)=\eta^t(y)$ (Fig. 1). However if $\eta^t(x) = \mathbf{1}$, the VM update is implemented with probability $1-s$. This update rule can be written as
\begin{equation}
\mathbf{P}[\eta\to\eta_x]=
\sum_y \frac{A_{x y}}{Nk_x}\Big\{[1-\eta(x)]\eta(y)
+(1-s)\eta(x)[1-\eta(y)]\Big\}, \qquad (1)
\end{equation}
where $\eta_x$ denotes the state obtained from $\eta$ by changing only the genotype at node $x$. The first term describes the update step for the case where $(\eta(x),\eta(y))= (\mathbf{0},\mathbf{1})$ and $x, y$ are connected. Each of the nearest neighbors $y$ of $x$ may be selected with probability $A_{xy}/k_x$. Here $A_{xy}$ is the adjacency matrix whose elements equal 1 if $xy$ are connected and zero otherwise. The second term in Eq. (1) is explained analogously.
'''
context = '''
[p. 1:] At each update event, two individuals from a total population $N$ are chosen at random. One individual replicates while the other dies and is replaced by the newly-born offspring, so that $N$ remains constant. A selective advantage, or fitness, also exists in which each each individual may be a unit-fitness genotype $\mathbf{1}$ or genotype $\mathbf{0}$ with lower fitness $1-s$, with $0<s<1$. These fitnesses determine the replication or death rates of each individual.
[p. 1:] We consider three evolutionary models, distinguished by the order in which a pair individuals replicate and die:
[p. 1, after the definitions of LD and VM:] \texttt{Biased Invasion Process (IP):} In this birth-first/death-second process, a randomly-chosen individual replicates with probability proportional to its fitness, and its offspring then replaces an individual at a randomly-chosen neighboring node [4, 5, 8].
[p. 1:] One genotype ultimately replacing all other genotypes in the population is termed fixation. An important, and easily checked fact is that these evolutionary models are equivalent on degree-regular graphs
[p. 3:] Here a randomly-selected individual reproduces with probability proportional to its fitness; hence the transition probability is
\begin{equation}
\mathbf{P}[\eta\to\eta_x]=
\sum_y \frac{A_{x y}}{Nk_y}\Big\{[1-\eta(x)]\eta(y)
+(1-s)\eta(x)[1-\eta(y)]\Big\}, \qquad (16)
\end{equation}
Notice an essential difference between VM and IP dynamics. In the VM the transition rate is proportional to the inverse degree $k_x$ of the node of the disappearing genotype [Eq. (1)], while in the IP the transition rate is proportional to the inverse degree $k_y$ of the node of the reproducing genotype [Eq. (16)].
'''
notes = "Macros replaced: {\\bf 0}, {\\bf 1}, {\\bf P} by \\mathbf{...}, {\\tt ...} by \\texttt{...}, \\eqref{...} by the equation numbers of the PDF, \\cite by the reference numbers of the PDF; equation numbers written as '(n)' after the display; '\\!' spacing removed. 'each each' and 'a pair individuals' as printed. v1 (January 2006) has different wording in the introduction and model definitions; v2 (11 May 2006) is the revised version; the journal version (Phys. Rev. Lett. 96, 188104) is not openly accessible and was not compared. The neutral case is s = 0."

