items = ["moran:def:repro", "moran:thm:pushpull-invariance"]
paper = "T. Antal, S. Redner, V. Sood. Evolutionary dynamics on degree-heterogeneous graphs"
venue = "Phys. Rev. Lett. 96:188104 (2006)"
