# Lieberman, Hauert, Nowak, Nature 433 (2005).

[[source]]
items = ["moran:thm:isothermal", "moran:thm:neutral"]
paper = "E. Lieberman, C. Hauert, M. A. Nowak. Evolutionary dynamics on graphs"
venue = "Nature 433:312-316 (2005)"
version = "published Supplementary Notes"
result = "Theorem 2 (Isothermal Theorem)"
page = 5
url = "https://static-content.springer.com/esm/art%3A10.1038%2Fnature03204/MediaObjects/41586_2005_BFnature03204_MOESM1_ESM.pdf"
status = "transcribed by an AI agent from the published Supplementary Notes PDF (no LaTeX source exists) and compared with the rendered pages of that PDF; the main-text excerpts of the context come from an author manuscript dated November 2004 (the published article is not openly accessible and was not compared); not yet checked by a person"
statement = '''
\textbf{Theorem 2.} \emph{(Isothermal Theorem.) $G$ is $\rho$-equivalent to the Moran process $\Leftrightarrow$ $G$ is isothermal, e.g., $W$ is doubly-stochastic.}
'''
context = '''
[Main text, author manuscript, p. 2:] Consider a homogeneous population of size $N$. At each time step an individual is chosen for reproduction with a probability proportional to its fitness. The offspring replaces a randomly chosen individual. In this so-called Moran process (Fig 1a), the population size remains constant. Suppose all the resident individuals are identical and one new mutant is introduced. The new mutant has relative fitness $r$, as compared to the residents, whose fitness is 1. The fixation probability of the new mutant is
\[ \rho_1 = \frac{1-1/r}{1-1/r^N}. \qquad (1) \]
[Main text, author manuscript, pp. 2-3:] We introduce population structure as follows. Individuals are labelled $i = 1, 2, ...N$. The probability that individual $i$ places its offspring into position $j$ is given by $w_{ij}$. Thus the individuals can be thought of as occupying the vertices of a graph. The matrix $W = [w_{ij}]$ determines the structure of the graph (Fig 1b). If $w_{ij} = 0$ and $w_{ji} = 0$ then the vertices $i$ and $j$ are not connected. In each iteration, an individual $i$ is chosen for reproduction with a probability proportional to its fitness. The resulting offspring will occupy vertex $j$ with probability $w_{ij}$. Note that $W$ is a stochastic matrix, which means that all its rows sum to 1. We want to calculate the fixation probability $\rho$ of a randomly placed mutant.
[Main text, author manuscript, p. 3:] There is an even wider class of graphs whose fixation probability is $\rho_1$. Let $T_i = \sum_j w_{ij}$ be the temperature of vertex $i$. A vertex is \emph{hot} if it is replaced often and \emph{cold} if it is replaced rarely. The `isothermal theorem' states that an evolutionary graph has fixation probability $\rho_1$ if and only if all vertices have the same temperature. Fig 2d gives an example of an isothermal graph where $W$ is not symmetric. Isothermality is equivalent to the requirement that $W$ is doubly stochastic, which means that each row and each column sums to one.
[Supplementary Notes, p. 1:] Let $G$ be a graph whose adjacency matrix is given by $W$. Let $\mathbf{P}\subset\mathbf{V}$ be the set of vertices occupied by a mutant at some iteration. $\mathbf{P}$ represents a state of the typical Markov chain $E_G$ which arises on an evolutionary graph. Analogously, the states $P = \{1, 2, ...N\}$ are the typical states of the Moran process $M$.

(For two types of individuals, the states of the explicit Markov chain $E_G$ are the $2^n$ possible arrangements of mutants on the graph. The transition probability between two states $\mathbf{P}$, $\mathbf{P}'$ is 0 unless $| \mathbf{P}\setminus \mathbf{P}' | = 1$ or vice versa. Otherwise, if $\mathbf{P}\setminus \mathbf{P}' = v^*$, then the probability of a transition from $\mathbf{P}$ to $\mathbf{P}'$ is
\[ \frac{\sum_{v\in G\setminus \mathbf{P}} w(v,v^*)}{N + | \mathbf{P} | (r-1)} \]
where the numerator is the sum of the weights of edges entering v* from vertices outside $\mathbf{P}$. Similarly, the probability of a transition from $\mathbf{P}'$ to $\mathbf{P}$ is
\[ \frac{\sum_{v\in\mathbf{P}'} w(v,v^*)}{N + | \mathbf{P}' | (r-1)} \]
In practice, the resulting matrix is large and not very sparse. Consequently, it can be difficult to work with directly, and we will not revisit it in the course of these notes.)
[Supplementary Notes, p. 2:] \textbf{Definition 1.} A graph $G$ is $\rho$-equivalent to the Moran process if the cardinality map f($\mathbf{P}$) $= | \mathbf{P} |$ from the states of $E_G$ to the states of $M$ preserves the ultimate fixation probabilities of the states. Equivalently, we need
\[ \rho(r, G, P, N) = \frac{1-1/r^P}{1-1/r^N} \]
where $\rho(r, G, P, N)$ is the probability that a mutant of fitness r on a graph G, given any initial population of size P, eventually reaches the fixation population of N. (Note that this function is often undefined: on most graphs, different initial conditions with the same number of mutants have different fixation probabilities.)

Note that eq (1) is obtained in the case $P = 1$.
[Supplementary Notes, p. 2:] We now provide a necessary and sufficient condition for $\rho$-equivalence to the Moran process for the case of an arbitrary weighted digraph $G$. The isothermal theorem for stochastic matrices is obtained as a corollary. First we state the definition of a circulation.

\textbf{Definition 2.} The matrix W defines a circulation $\leftrightarrow$
\[ \forall i, \sum_j w_{ij} = \sum_j w_{ji} \]
This is precisely the statement that the graph $G_W$ satisfies
\[ \forall v \in G, w_o(v) = w_i(v) \]
where $w_o$ and $w_i$ represent the sum of the weights entering and leaving v.
[Supplementary Notes, p. 3:] \textbf{Theorem 1.} \emph{(Circulation Theorem.) The following are equivalent:
(1) $G$ is a circulation.
(2) $| \mathbf{P} |$ performs a random walk with forward bias $r$ and absorbing states at $\{0, N\}$.
(3) $G$ is $\rho$-equivalent to the Moran process
(4)
\[ \rho(r, G, P, P') = \frac{1-1/r^P}{1-1/r^{P'}} \]
where $\rho(r, G, P, P')$ is the probability that a mutant of fitness $r$ on a graph $G$ given any initial condition with $P$ mutants eventually reaches a mutant population of $P'$.}
[Supplementary Notes, p. 5, just before Theorem 2:] The isothermal result is just a corollary.
'''
notes = "The Supplementary Notes are those of doi:10.1038/nature03204. No LaTeX source exists: the statement and the Supplementary Notes excerpts were transcribed from the published PDF into LaTeX (bold P and V as printed; 'e.g.' in Theorem 2, the lower-case n in '2^n' and the order 'entering and leaving' in Definition 2 kept as printed; the set difference, printed as a backslash, is written \\setminus). The published main text is behind the publisher's paywall, so the main-text excerpts are from an author manuscript dated November 2004 (43 pages, hosted on a course page of the Harvard Mathematics Department: https://legacy-www.math.harvard.edu/archive/153_fall_04/Additional_reading_material/evolutionary%20graph%20theory.pdf); they may differ from the published text, which was not compared. In that manuscript the temperature reads T_i = sum_j w_ij (as printed there), and its own copy of the Supplementary Notes states Theorem 2 as 'Given a stochastic matrix W, G_W is rho-equivalent to the Moran process <=> G_W is isothermal.' The Supplementary Notes do not state the case r = 1 separately (the formula of Definition 1 is 0/0 at r = 1); moran:thm:neutral is listed here because PROVENANCE.md attributes it to this paper together with Moran 1959 (see the entry for Eq. (3) of Moran 1959). For an undirected graph with weights w_ij = 1/(degree of i) on its edges, Broom and Rychtar (Proc. R. Soc. A 464, 2008, Theorem 3.1) show that a simple connected graph is isothermal if and only if it is regular."

