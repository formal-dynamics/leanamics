'''
context = '''
[p. 2:] Consider a homogeneous population of size $N$. At each time step an individual is chosen for reproduction with a probability proportional to its fitness. The offspring replaces a randomly chosen individual. In this so-called Moran process (Fig 1a), the population size remains constant. Suppose all the resident individuals are identical and one new mutant is introduced. The new mutant has relative fitness $r$, as compared to the residents, whose fitness is 1.
[p. 11, legend of Figure 1:] Models of evolution. \textbf{a}, The Moran process describes stochastic evolution of a finite population of constant size. In each time step, an individual is chosen for reproduction with a probability proportional to its fitness; a second individual is chosen for death. The offspring of the first individual replaces the second. \textbf{b}, In the setting of evolutionary graph theory, individuals occupy the vertices of a graph. In each time step, an individual is selected with a probability proportional to its fitness; the weights of the outgoing edges determine the probabilities that the corresponding neighbor will be replaced by the resulting offspring. The process is described by a stochastic matrix $W$, where $w_{ij}$ denotes the probability that an offspring of individual $i$ will replace individual $j$. In a more general setting, at each time step, an edge $ij$ is selected with a probability proportional to its weight and the fitness of the individual at its tail. The Moran process is the special case of a complete graph with identical weights.
[p. 11, legend of Figure 2:] Whenever the weights of edges are not shown, a weight of one is distributed evenly across all those edges emerging from a given vertex.
'''
notes = "The entry quotes the evolutionary graph model of the main text (Fig. 1b). The author manuscript (dated November 2004) is hosted on a course page of the Harvard Mathematics Department (see `url`); the published main text is not openly accessible and was not compared. The published main text (Nature 433:312-316) is behind the publisher's paywall; this manuscript (43 pages: main text, references, figure legends, figures, and two copies of a draft of the Supplementary Notes) may differ from it. The process on an undirected graph with w_ij = 1/(number of edges at i) for each edge ij is the setting of Broom and Rychtar 2008, Section 2 (see the entries for that paper)."

