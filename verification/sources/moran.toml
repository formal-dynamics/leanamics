url = "https://arxiv.org/abs/q-bio/0601031v2"
status = "transcribed by an AI agent from the arXiv LaTeX source of v2 and compared with the PDF of v2; not yet checked by a person"
statement = '''
For degree-heterogeneous graphs, the conserved quantity for neutral dynamics ($s=0$) is the average degree-weighted density $\omega_1$ [11, 12], where the degree-weighted moments are
\begin{equation}
  \omega_{n} = \frac{1}{N\mu_{n}} \sum_x k_x^n \eta(x) = \frac{1}{\mu_{n}} \sum_k k^n n_k \rho_k\,, \qquad (7)
\end{equation}
while the overall density $\rho$ of genotype $\mathbf{1}$ is no longer conserved.

[p. 2, after Eq. (8):] Notice that $\omega$ is conserved in the absence of selection ($s=0$) a feature that ultimately stems from the update rate being inversely proportional to node degree [Eq. (1)].

[p. 4:] In contrast to the VM, the conserved quantity in the unbiased IP is $\omega_{-1}$, the inverse degree-weighted frequency.
'''
context = '''
[p. 1:] A selective advantage, or fitness, also exists in which each each individual may be a unit-fitness genotype $\mathbf{1}$ or genotype $\mathbf{0}$ with lower fitness $1-s$, with $0<s<1$.
[p. 1, Eq. (1), VM transition probability:]
\begin{equation}
\mathbf{P}[\eta\to\eta_x]=
\sum_y \frac{A_{x y}}{Nk_x}\Big\{[1-\eta(x)]\eta(y)
+(1-s)\eta(x)[1-\eta(y)]\Big\}, \qquad (1)
\end{equation}
where $\eta_x$ denotes the state obtained from $\eta$ by changing only the genotype at node $x$. [...] Here $A_{xy}$ is the adjacency matrix whose elements equal 1 if $xy$ are connected and zero otherwise.
[p. 2:] For degree-heterogeneous graphs, the density $\rho_k$ of genotype $\mathbf{1}$ at nodes of degree $k$ increases by $1/N_k$ with probability $\mathbf{F}_k(\eta)$ and decreases by $1/N_k$ with probability $\mathbf{B}_k(\eta)$ in an elemental update
[p. 2:] where the moments of the degree distribution are defined by $\mu_n \equiv N^{-1} \sum_x k_x^n = \sum_k k^n n_k$.
[p. 2:] The existence of this new conservation law suggests that we study the time evolution of the expectation value of $\omega_1$ which we henceforth denote as $\omega$ for notational simplicity. Since $\omega(\eta_x) = \omega(\eta) + k_x(1-2\eta(x))/\mu_1 N$,
\begin{align*}
\partial_t\omega &= \frac{1}{\delta t}\sum_x
\left[\omega(\eta_x) - \omega(\eta)\right]\mathbf{P}[\eta\to\eta_x]\\
&= \frac{s}{\mu_1 N}\sum_{x,y}A_{x y} \eta(x)(1-\eta(y)) = s \alpha\,. \qquad (8)
\end{align*}
[p. 2, definition of $\alpha$ (Eq. (4)), stated for degree-regular graphs:] the total number $\alpha$ of active links between different genotypes
\[ \alpha = \frac{1}{N \mu_1} \sum_{x,y} A_{xy} \eta(x) [1-\eta(y)] \,, \qquad (4) \]
[p. 3, Eq. (16), IP transition probability:] Here a randomly-selected individual reproduces with probability proportional to its fitness; hence the transition probability is
\begin{equation}
\mathbf{P}[\eta\to\eta_x]=
\sum_y \frac{A_{x y}}{Nk_y}\Big\{[1-\eta(x)]\eta(y)
+(1-s)\eta(x)[1-\eta(y)]\Big\}, \qquad (16)
\end{equation}
[p. 4:] from which low-order moments obey the equations of motion:
\begin{align*}
\partial_t \omega_{-1} &= \frac{s}{\mu_1 \mu_{-1}} \rho(1-\rho) \,,\\
\partial_t \rho &= \rho - \omega + s \omega(1-\rho)\,, \\
\partial_t \omega &= \frac{\mu_2}{\mu_1}[\rho-\omega_2 + s \omega_2(1-\rho)]\,.
\end{align*}
'''
notes = "Macros replaced: {\\bf 0}, {\\bf 1}, {\\bf F}, {\\bf B}, {\\bf P} by \\mathbf{...}, \\eqref{...} by the equation numbers of the PDF, \\cite by the reference numbers of the PDF; equation numbers written as '(n)' after the display; '\\!' spacing removed. 'each each' as printed. N_k is the number of nodes of degree k and n_k = N_k/N their fraction (from \\delta\\rho_k = 1/N_k = 1/(N n_k) after Eq. (3)). The equations of motion on p. 4 are derived for degree-uncorrelated graphs (mean-field), from \\partial_t\\rho_k = (k/\\mu_1)[\\rho - \\rho_k + s\\rho_k(1-\\rho)]. 'Conserved' refers to the expectation value over the dynamics (the paper studies 'the time evolution of the expectation value of \\omega_1'). Same version remarks as for moran:def:pull."

