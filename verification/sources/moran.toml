p_{k,k} &= 1 - p_{k,k-1} - p_{k,k+1}.
\end{align*}
We notice that in both this and the former case the ratio $p_{k,k+1}(p_{k,k-1})^{-1}$ is constant, being $\mu_1\mu_2^{-1}$ and $\lambda_1\lambda_2^{-1}$ respectively. This suggests that we now embed another chain in this one by considering only those jumps of the process at which $k$ changes its value. Writing $\pi = \lambda_1(\lambda_1+\lambda_2)^{-1}$ or $\mu_1(\mu_1+\mu_2)^{-1}$ we thus get a process in which the transition probabilities are
\[ (1) \qquad \begin{cases} p_{k,k-1} = 1-\pi. \\ p_{k,k} = 0. \\ p_{k,k+1} = \pi. \end{cases} \]
If we now start the process with an initial value $k_0$ the probabilities of ultimate absorption $P_0$, $P_{2n}$, in the two absorbing states $(k = 0, 2n)$ will be the same as in the original continuous process.
'''
context = '''
[p. 121:] In the present note we give an exact solution starting from any initial number of mutants in a model in which the generations overlap. This model was introduced for other purposes in a previous paper (Moran [6]). We suppose we have a population of $2n$ haploid individuals in which $k_0$ are initially of the mutant type $a$ and the rest $A$. The development of the process takes place in continuous time and each individual has a life time with a negative exponential distribution whose parameter depends only on whether the individual is $a$ or $A$. The state of the system at any time $t$
[p. 122:] is then defined by the number, $k$, of mutant individuals. When an individual dies it is immediately replaced by a new individual which is the offspring of the population immediately before the death. We can introduce selection into this model in two different ways.
[p. 122, first method (selection through the lifetimes, with parameters $\lambda_1$ for $a$ and $\lambda_2$ for $A$):] We may now consider the discrete Markov chain embedded in this continuous process defined for those discrete instants of time at which a birth-death event occurs. This chain has $2n+1$ states defined by the integer $k (k = 0, 1, \cdots 2n)$ and transition probabilities $p_{ij}$ from state $i$ to state $j$ given by the formulae
\begin{align*}
p_{k,k-1} &= \lambda_2 k(2n-k)(2n)^{-1}\{\lambda_2 k + \lambda_1(2n-k)\}^{-1}.\\
p_{k,k+1} &= \lambda_1 k(2n-k)(2n)^{-1}\{\lambda_2 k + \lambda_1(2n-k)\}^{-1}.\\
p_{k,k} &= 1 - p_{k,k-1} - p_{k,k+1}.
\end{align*}
'''
notes = "Pages 122-123 describe the second method of selection. Scanned journal pages 121-126 are pages 1-6 of the PDF; `page` is the PDF page (journal p. 122). Notation as printed (population size 2n, inverses written (.)^{-1}). The dying individual is drawn among all 2n individuals and the newborn's type from the whole population, so the newborn may replace its own parent's position; the chain (1) is the jump chain (only the jumps at which k changes). With r = \\mu_1\\mu_2^{-1}, \\pi = r/(1 + r)."

