statement = '''
The solution to $G\Phi=0$, with $G$ given by Eq. (12) is
\begin{equation}
\Phi(\omega) = \frac{1-e^{-sN_{\mathrm{eff}}\omega /(1-s/2)\,}}{1-e^{-sN_{\mathrm{eff}}/(1-s/2)}}\,. \qquad (14)
\end{equation}
[...] Eq. (14) also provides the fixation probability when the system starts with a single mutant at a node of degree $k$:
\begin{equation}
\Phi_1 =
\begin{cases}
k/(N\mu_{1}) & s\ll 1/N_{\mathrm{eff}}\,; \\
sk\mu_1/\mu_2 & 1/N_{\mathrm{eff}} \ll s\ll 1\,.
\end{cases} \qquad (15)
\end{equation}

[p. 4, IP:] from which, in close analogy with our previous analysis of the VM, the fixation probability is
\begin{equation}
\Phi(\omega_{-1}) = \frac{1-e^{-sN\omega_{-1}/(1-s/2)}}{1-e^{-sN/(1-s/2)}}. \qquad (19)
\end{equation}
From Eq. (19), the effective population size $N_{\mathrm{eff}}$ equals $N$, contrary to VM dynamics (Eq. (14)). More strikingly, the fixation probability of a single mutant acquires the non-trivial dependence of the degree $k$ of the occupied node (Fig. 4)
\begin{equation}
\Phi_1=
\begin{cases}
1/(Nk\mu_{-1}) & s\ll 1/N \,; \\
s/(k\mu_{-1}) & 1/N \ll s \ll 1\,.
\end{cases} \qquad (20)
\end{equation}
'''
context = '''
[p. 1:] A selective advantage, or fitness, also exists in which each each individual may be a unit-fitness genotype $\mathbf{1}$ or genotype $\mathbf{0}$ with lower fitness $1-s$, with $0<s<1$.
[p. 1:] \texttt{Biased Voter Model (VM):} An individual dies with probability inversely proportional to its fitness, and is then replaced by the offspring of a randomly-chosen neighbor. [...] \texttt{Biased Invasion Process (IP):} In this birth-first/death-second process, a randomly-chosen individual replicates with probability proportional to its fitness, and its offspring then replaces an individual at a randomly-chosen neighboring node [4, 5, 8].
[p. 2:] We seek the fixation probability $\Phi$ to the state consisting entirely of genotype $\mathbf{1}$ as a function of the initial densities of $\mathbf{1}$. This probability obeys the backward Kolmogorov equation $G\Phi=0$ [14], subject to the boundary conditions $\Phi(0)=0$ and $\Phi(1)=1$. In the diffusion approximation, the generator $G$ of this equation may be expressed as a sum of the changes in $\rho_k$ over all $k$,
[p. 2:] where the moments of the degree distribution are defined by $\mu_n \equiv N^{-1} \sum_x k_x^n = \sum_k k^n n_k$.
[p. 2:] For degree-heterogeneous graphs, the conserved quantity for neutral dynamics ($s=0$) is the average degree-weighted density $\omega_1$ [11, 12], where the degree-weighted moments are
\[ \omega_{n} = \frac{1}{N\mu_{n}} \sum_x k_x^n \eta(x) = \frac{1}{\mu_{n}} \sum_k k^n n_k \rho_k\,, \qquad (7) \]
[...] we study the time evolution of the expectation value of $\omega_1$ which we henceforth denote as $\omega$ for notational simplicity.
[p. 2:] To evaluate the expression in Eq. (8) we make the mean-field assumption that the degrees of connected nodes in the graph are uncorrelated. Thus we replace the elements of the adjacency matrix by their expected values, $A_{x y} = k_x k_y/\mu_1 N$.
[p. 2:] We now determine the fixation probability simply by replacing the $\rho_k$ by $\omega$ in the forward and backward rates $\mathbf{F}$ and $\mathbf{B}$ in Eqs. (9). In a similar vein, we replace the derivative $\partial_k$ by $(k n_k/\mu_1)\partial_{\omega}$ [11]. Then the generator in Eq. (3) becomes [...]
\[ G = \omega(1-\omega)\left[ s\partial_{\omega} + \frac{\mu_2}{\mu_1^2 N}\left(1-\frac{s}{2}\right)\partial^2_{\omega}\right]\,. \qquad (12) \]
[p. 3:] Apart from an overall constant for the time scale, this generator is identical to that of degree-regular graphs (5) if we replace $N$ by an effective population size $N_{\mathrm{eff}} \equiv N\mu_1^2/\mu_2$.
[p. 4:] In contrast to the VM, the conserved quantity in the unbiased IP is $\omega_{-1}$, the inverse degree-weighted frequency. For the biased IP, $\omega_{-1}$ becomes the most slowly changing quantity (see Fig. 2). Hence we transform all derivatives with respect to $\rho_k$ in the generator to derivatives with respect to $\omega_{-1}$ to yield
\[ G = \frac{\omega_{-1}(1-\omega_{-1})}{\mu_1 \mu_{-1}} \left[ s\frac{\partial}{\partial \omega_{-1}} + \frac{1}{N}(1-\frac{s}{2})\frac{\partial^2}{\partial \omega_{-1}^2}\right]\,, \qquad (18) \]
'''
notes = "Macros replaced: {\\bf 0}, {\\bf 1}, {\\bf F}, {\\bf B} by \\mathbf{...}, {\\tt ...} by \\texttt{...}, \\eqref{...} and \\ref{...} by the numbers of the PDF, \\cite by the reference numbers of the PDF; equation numbers written as '(n)' after the display; {\\rm eff} written \\mathrm{eff}. The '[...]' in the statement omits the paragraph on Fig. 3 between Eqs. (14) and (15). 'each each' as printed. The IP analysis uses the degree-uncorrelated rates of Eq. (17). For s = 0 the continuum solutions (14) and (19) reduce to \\Phi = \\omega_1 and \\Phi = \\omega_{-1}; the paper states the single-mutant values only in the regimes of Eqs. (15) and (20). Same version remarks as for moran:def:pull."

