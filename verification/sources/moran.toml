notes = "Scanned journal pages 121-126 are pages 1-6 of the PDF; `page` is the PDF page (journal p. 123). Notation as printed: population size 2n, inverses written (.)^{-1}; \\lambda_1, \\lambda_2 are the lifetime parameters of the first method (selection through the lifetimes). With \\mu_1 = \\mu_2 the chain of the second method moves from k to k - 1 and to k + 1 with probability k(2n - k)(2n)^{-2} each, which is the neutral Moran chain. moran:thm:neutral (regular graphs) is listed here because PROVENANCE.md attributes it to Lieberman, Hauert, Nowak 2005 and Moran 1959; moran:thm:moran-counts-fixation is the k/n law for the count chains of Moran's model, which this equation states for Moran's chain."

