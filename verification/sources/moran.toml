[[source]]
items = ["moran:thm:star", "moran:thm:star-sum"]
paper = "M. Broom, J. Rychtář. An analysis of the fixation probability of a mutant on special classes of non-directed graphs"
venue = "Proc. R. Soc. A 464(2098):2609-2627 (2008)"
version = "City Research Online eprint 979"
result = "Section 5, unnumbered displays"
page = 9
url = "https://openaccess.city.ac.uk/id/eprint/979/"
status = "transcribed by an AI agent from the PDF of the City Research Online copy (no LaTeX source; the publisher's version could not be retrieved by the transcribing agent and was not compared) and checked against the rendered pages; not yet checked by a person"
statement = '''
We can use (5.3) and (5.2) to inductively calculate $P^\emptyset_1, P^0_2, P^\emptyset_2, \ldots$ as a function of $P^0_1$ to get
\[ P^0_i = P^0_1 \cdot \left(1 + \frac{n}{n+r}\sum_{j=1}^{i-1}\left(\frac{n+r}{r(nr+1)}\right)^j\right) \]
Since $P^0_n = 1$, we get
\[ P^0_1 = \frac{1}{1 + \frac{n}{n+r}\sum_{j=1}^{n-1}\left(\frac{n+r}{r(nr+1)}\right)^j} \]
Since, by (5.1) and (5.2),
\begin{align*}
P^0_0 &= \frac{r}{r+n}P^0_1\\
P^\emptyset_1 &= \frac{nr}{nr+1}P^0_1
\end{align*}
we get that the average fixation probability for a mutant is
\[ \varrho = \frac{n \frac{nr}{nr+1} + \frac{r}{r+n}}{(n+1)\cdot\left(1 + \frac{n}{n+r}\sum_{j=1}^{n-1}\left(\frac{n+r}{r(nr+1)}\right)^j\right)} \]
'''
context = '''
[Section 2, p. 2:] Let $G = (V,E)$ be a finite, undirected and connected graph, where $V$ is the set of vertices and $E$ is the set of edges. We assume that the graph is simple, i.e. no vertex is connected to itself. We study evolutionary dynamics as described in Lieberman et al. (2005), see also Nowak (2006). We treat the dynamics as a discrete time Markov chain. At the beginning, a vertex is chosen uniformly at random and replaced by a mutant with fitness $r$, all remaining vertices having fitness 1.

If the mutants already inhabit precisely the vertices in the set $C \subset V$, then in the next step the mutants will inhabit vertices in either
1) a set $C\cup\{j\}$, $j \notin C$, provided a) a vertex $i \in C$ was chosen for reproduction and b) it placed its offspring into vertex $j$; or
2) a set $C\setminus\{i\}$, $i \in C$, provided a) a vertex $j \notin C$ was selected for reproduction and b) it placed its offspring into $i$; or
[Section 2, p. 3:] 3) a set $C$, provided an individual from $C$ ($V\setminus C$) replaces another individual from $C$ ($V\setminus C$).

The states $\emptyset$ and $V$ are the absorbing points of the dynamics. The transition probabilities of the above Markov chain are determined by a) the probability that a given vertex will be selected for reproduction and b) the probability that, once selected, it places its offspring into another given vertex.

We set the fitness of an individual at vertex $i$ as $f_i \in \{1, r\}$, where $f_i = r$ means that the individual is a mutant. An individual at $i$ is selected for reproduction with probability
\[ s_i = \frac{f_i}{\sum_{j\in V} f_j}. \qquad (2.1) \]
The graph structure is represented by a matrix $W = (w_{ij})$, where $w_{ij}$ is the probability of replacing a vertex $j$ by a copy of a vertex $i$, provided vertex $i$ was selected for reproduction,
\[ w_{ij} = \begin{cases} \frac{1}{e_i}, & \text{if $i$ and $j$ are connected,}\\ 0, & \text{otherwise,} \end{cases} \]
where $e_i$ is the number of edges incident to the vertex $i$, so that edges have equal weights.

Let $P_C$ denote the probability of mutant fixation given mutants currently inhabit a set $C$. The rules of the dynamics yield, see Lieberman et al. (2005),
\[ P_C = \frac{\sum_{i\in C}\sum_{j\notin C}\left(r w_{ij} P_{C\cup\{j\}} + w_{ji} P_{C\setminus\{i\}}\right)}{r\sum_{i\in C}\sum_{j\notin C} w_{ij} + \sum_{i\in C}\sum_{j\notin C} w_{ji}} \qquad (2.2) \]
with $P_\emptyset = 0$ and $P_V = 1$.
[Section 5, p. 7:] In this section we consider a star - a non-directed graph with $N = n+1$ vertices labeled $0, 1, \ldots, n$ where the only edges are between vertices $0$ and $i$, $i = 1, \ldots, n$. The vertex $0$ is called a centre and the vertices $1, \ldots, n$ can be called the leaves. The automorphism group is isomorphic to the group of permutations on leaves and the state of the dynamics can be described by the number of mutants at the leaves and by an indicator of whether or not there is a mutant at the centre. See figure 3 for a scheme of the dynamics. Let $P^0_i$ ($P^\emptyset_i$, respectively) denote the probability of fixation given there are $i$ mutants at the leaves and there is a (there is no, respectively) mutant at the centre. The rules of the dynamics yield the following system of $2n+1$ equations.
[Section 5, p. 8:]
\begin{align*}
P^0_i &= \frac{r}{r+n}P^0_{i+1} + \frac{n}{r+n}P^\emptyset_i \qquad (5.1)\\
P^\emptyset_i &= \frac{nr}{nr+1}P^0_i + \frac{1}{nr+1}P^\emptyset_{i-1} \qquad (5.2)
\end{align*}
for $i = 0, \ldots, n$ with boundary conditions $P^\emptyset_0 = 0$ and $P^0_n = 1$. The equation (5.1) can be rearranged to
\[ P^0_i = P^0_{i-1} + \frac{n}{r}(P^0_{i-1} - P^\emptyset_{i-1}) \qquad (5.3) \]
'''
notes = "The entry quotes the unnumbered displays of Section 5 for P^0_i, P^0_1, P^0_0, P^empty_1 and the average fixation probability. City Research Online labels the eprint 'unspecified version'. City Research Online labels this copy 'unspecified version'; its pages are marked 'Article submitted to Royal Society'. No LaTeX source; transcribed from the PDF into LaTeX. Pages are those of the City PDF, whose first page is a repository cover sheet: printed page p of the paper is PDF page p + 1 (the statement is on printed p. 8, Section 5 starts on printed p. 7, Section 2 on printed pp. 2-3; the bracketed pages in the context are printed pages). The publisher's site refused the plain download (HTTP 403), so this copy (possibly the submitted version) was not compared with the published one. As printed: '\\varrho' for the average, 'labeled', the range 'i = 0, ..., n' for (5.1) and (5.2) (which use P^0_{n+1} and P^\\emptyset_{-1} at the ends). P^0_i has the mutant at the centre: the boundary conditions and the text say so."

[[source]]
item = "moran:thm:star-limit"
paper = "M. Broom, J. Rychtář. An analysis of the fixation probability of a mutant on special classes of non-directed graphs"
venue = "Proc. R. Soc. A 464(2098):2609-2627 (2008)"
version = "City Research Online eprint 979"
result = "Section 5, display for large n"
page = 9
url = "https://openaccess.city.ac.uk/id/eprint/979/"
status = "transcribed by an AI agent from the PDF of the City Research Online copy (no LaTeX source; the publisher's version could not be retrieved by the transcribing agent and was not compared) and checked against the rendered pages; not yet checked by a person"
statement = '''
Notice that for large $n$ we get
\[ \varrho \approx \frac{1}{1 + \sum_{j=1}^{n-1}\frac{1}{r^{2j}}} = \frac{1-\frac{1}{r^2}}{1-\frac{1}{r^{2n}}} \]
which means that we are recovering the formula (1.2) from Lieberman \emph{et al.} (2005).
'''
context = '''
[Section 1, p. 2:] In homogeneous populations the probability of fixation in a population with $N$ individuals (and so $N$ vertices) is given by the Moran probability
\[ P_{Moran} = \frac{1-1/r}{1-1/r^N} \qquad (1.1) \]
where resident individuals have baseline fitness 1 and mutants have fitness $r$ (each individual being chosen as the reproducing individual with probability proportional to its fitness).
[Section 1, p. 2:] We use symmetries to reduce the number of equations to $2n+1$ for a star with $N = n+1$ vertices. In Lieberman et al. (2005), the approximation of the fixation probability for stars for large $n$ was given by
\[ P = \frac{1-1/r^2}{1-1/r^{2n}} \qquad (1.2) \]
Here we find the exact fixation probabilities for any $r$ and $n$.
[Section 5, p. 7:] In this section we consider a star - a non-directed graph with $N = n+1$ vertices labeled $0, 1, \ldots, n$ where the only edges are between vertices $0$ and $i$, $i = 1, \ldots, n$. The vertex $0$ is called a centre and the vertices $1, \ldots, n$ can be called the leaves. [...] Let $P^0_i$ ($P^\emptyset_i$, respectively) denote the probability of fixation given there are $i$ mutants at the leaves and there is a (there is no, respectively) mutant at the centre.
[Section 5, p. 8:] we get that the average fixation probability for a mutant is
\[ \varrho = \frac{n \frac{nr}{nr+1} + \frac{r}{r+n}}{(n+1)\cdot\left(1 + \frac{n}{n+r}\sum_{j=1}^{n-1}\left(\frac{n+r}{r(nr+1)}\right)^j\right)} \]
