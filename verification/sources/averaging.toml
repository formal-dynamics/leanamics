We next discuss the expected evolution of $\mathbf{x}^{(t)}$ under the action of the \textsc{Averaging}$(\delta)$ dynamics. For simplicity of exposition, in the remainder we assume $G$ is regular. Again, we set $\mathbf{x}^{(0)} = \mathbf{x}$, with $\mathbf{x}$ realized according to the initialization step in Algorithm 31. When $G$ is regular, we have
