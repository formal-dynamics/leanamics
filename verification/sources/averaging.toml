item = "averaging:lem:b1"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Find your place: simple distributed algorithms for community detection"
venue = "SODA 2017 / SIAM J. Comput. 2020"
version = "arXiv:1511.03927v4"
result = "Lemma B.1"
page = 18
url = "https://arxiv.org/abs/1511.03927v4"
status = "transcribed by an AI agent from the arXiv LaTeX source of v4 and compared with the PDF of v4; not yet checked by a person"
statement = '''
If we pick $\mathbf{x}$ uniformly at random in $\{-1,1\}^{2n}$ then, for any $\delta >0$ and any fixed vector $\mathbf{w} \in \{-1,1\}^{2n}$ with $\pm 1$ entries, it holds
\[ \mathbf{P}\left( \big| \langle (1/ \sqrt{2n})\, \mathbf{w} ,\, \mathbf{x} \rangle \big| \leqslant \delta \right) \leqslant \mathcal{O}(\delta). \]
'''
context = '''
[Appendix B, p. 18, before the lemma:] For the analysis of the \textsc{Averaging} dynamics on both regular and non-regular graphs, it is important to understand the distribution of the projection of $\mathbf{x}$ on $\mathbf{1}$ and $\boldsymbol{\chi}$, that is (up to scaling) the distribution of the inner products $\langle \mathbf{x}, \mathbf{1} \rangle$ and $\langle \mathbf{x}, \boldsymbol{\chi} \rangle$. In particular we are going to use the following bound.

[Proof of Lemma B.1, p. 18:] Since $\mathbf{x}$ is a vector of independent and uniformly distributed random variables in $\{-1,1\}$, both $\langle \mathbf{x}, \boldsymbol{\chi} \rangle$ and $\langle \mathbf{x} , \mathbf{1} \rangle$ have the distribution of a sum of $2n$ Rademacher random variables. Such a sum takes the value $2k-2n$ with probability $\frac{1}{2^n} \binom{2n}{k}$, and so every possible value has probability at most $\frac{1}{2^n}\binom{2n}{n} \approx \frac{1}{\sqrt {2\pi n}}$. Consequently, if $R$ is the sum of $2n$ Rademacher random variables, we have $\mathbf{P}\left( |R| \leqslant \delta \sqrt {2n}\right) \leqslant \mathcal{O}(\delta)$.

[Outline of proof of Theorem 3.2, p. 8, how the lemma is used:] This implies that $|\alpha_2| = \frac{1}{2n} \langle \boldsymbol{\chi} , \mathbf{x} \rangle \geqslant n^{-\gamma}$, for some positive constant $\gamma$, w.h.p. (see Lemma B.1).

[Section 2, p. 6:] we define the partition indicator vector $\boldsymbol{\chi} = \mathbf{1}_{V_1} - \mathbf{1}_{V_2}$.
'''
notes = "Cited by PROVENANCE.md and averaging/README.md ('Lemma B.1 (exact form)') for prob_dotProduct_clusterIndicator_eq_zero and choose_div_four_pow_le: the blueprint's exact count P(<x, chi> = 0) = C(2n,n)/4^n is the point-probability step of the proof quoted in the context (averaging/FORMALIZATION_DIFFERENCES.md, AVG-2 item 6). The display is an equation environment in the source and is printed without a number in the PDF of v4. Kept as printed: the factor 1/2^n in the proof, and '|alpha_2| = (1/2n) <chi, x>' without absolute value on the right. Macros replaced: \\pr{}{X} -> \\mathbf{P}\\left(X\\right), \\bx -> \\mathbf{x}, \\bw -> \\mathbf{w}, \\bchi -> \\boldsymbol{\\chi}, \\bone -> \\mathbf{1}, \\avg -> \\textsc{Averaging}, \\bigO -> \\mathcal{O}; \\leq and \\geq are typeset as \\leqslant and \\geqslant by the preamble, written here directly. The factors 1/2^n in the quoted proof of Lemma B.1 are as printed."

