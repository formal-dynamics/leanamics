item = "averaging:thm:opp-31"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Lemma B.1"
page = 23
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
[Main decomposition] Let $\mathbf{x} \in \{-1,1\}^n$ be an arbitrary initial vector of values and, for $h = 1, 2$, let $\mu_h = \mu_h(\mathbf{x}) = (2/n) \sum_{i \in V_h} \mathbf{x}(i)$ be the average of the initial values in block $h$. The expected vector of values at round $t$ conditional on the initial vector being $\mathbf{x}$ can be written as
\[ \mathbb{E}\left[\mathbf{x}^{(t)} \,|\, \mathbf{x}^{(0)} = \mathbf{x}\right] = \alpha_1 \mathbf{1} + \alpha_2 \bar{\lambda}_2^t \boldsymbol{\chi} + \alpha_2 \sqrt{n} \, \bar{\lambda}_2^t \mathbf{f}_\perp + \mathbf{e}^{(t)} \, , \]
where
\[ \alpha_1 = \frac{\mu_1 + \mu_2}{2} \, , \qquad\quad \alpha_2 = \frac{1}{\|\mathbf{f} - \mathbf{f}_\perp\|^2} \left( \frac{\mu_1 - \mu_2}{2} - \frac{\langle \mathbf{x}, \mathbf{f}_\perp\rangle}{\sqrt{n}} \right) \]
and, moreover,
\[ \left\|\mathbf{e}^{(t)} \right\| \leqslant \bar{\lambda}_3^t \sqrt{n} \, . \]
'''
context = '''
[Section 3, p. 8 to 9:] \[ \overline{W} := \mathbb{E}\left[W_t\right] = I - \frac{1}{2m} L \, , \qquad (2) \] where $L = D - A$ is the Laplacian matrix of $G$. Matrix $\overline{W}$ is thus symmetric and doubly-stochastic. We denote its eigenvalues as $\bar{\lambda}_1, \dots, \bar{\lambda}_n$, with $1 = \bar{\lambda}_1 \geqslant \bar{\lambda}_2 \geqslant \cdots \bar{\lambda}_n \geqslant -1\,.$

[Section 3, outline of proof of Theorem 3.1, p. 9:] In Lemma B.1, we decompose $\mathbb{E}\left[\mathbf{x}^{(t)}\right]$ into its components along the first two eigenvectors of $\overline{W}$ and into the corresponding orthogonal component $\mathbf{e}^{(t)}$ (note that $\overline{W}$ admits an orthonormal eigenvector basis since it is symmetric). We further decompose the component along the second eigenvector of $\overline{W}$ into its component parallel to the partition indicator vector ($\alpha_2 \bar{\lambda}_2^t \boldsymbol{\chi}$) and into the corresponding orthogonal one ($\alpha_2 \sqrt{n} \, \bar{\lambda}_2^t \mathbf{f}_\perp$).

[Proof of Lemma B.1, p. 23:] Let $1 = \bar{\lambda}_1 > \bar{\lambda}_2 \geqslant \cdots \geqslant \bar{\lambda}_n$ be the eigenvalues of $\overline{W}$ and let $\mathbf{w}_1 = \mathbf{1} / \sqrt{n}, \mathbf{w}_2, \dots, \mathbf{w}_n$ be a basis of orthonormal eigenvectors of $\overline{W}$ [...] Since $\mathbf{w}_2 = (\mathbf{f} - \mathbf{f}_\perp) / \| \mathbf{f} - \mathbf{f}_\perp \|$ we have that [...] $\frac{\langle \mathbf{x}, \mathbf{f} \rangle}{\sqrt{n}} [...] = \frac{\langle \mathbf{x}, \boldsymbol{\chi} \rangle}{n}$ [...]

[Section 4.1, p. 11:] For $(n,d,b)$-clustered regular graphs, [...] the partition indicator vector $\boldsymbol{\chi}$ turns out to be the eigenvector of $\overline{W}$ corresponding to $\bar{\lambda}_2$ (see (2)). As a consequence, the orthogonal component $\mathbf{f}_\perp$ in (4) is $\mathbf{0}$ in this case.
'''
notes = "Cited by averaging/README.md ('Theorem 3.1 on clustered regular graphs (Lemmas B.1, B.3, B.4)') and the doc comment of expList_avgRun_decomp ('Lemma B.1 (main decomposition) on a clustered regular graph'); the library states the clustered regular case, where f_perp = 0 (Section 4.1, quoted). The paper does not define f and f_perp in a displayed definition; the context quotes the sentences that determine them (f has <x, f>/sqrt(n) = <x, chi>/n, i.e. f = chi/sqrt(n), and f - f_perp is its component along w_2). The lemma title is shown in brackets. Macros replaced: \\bx -> \\mathbf{x}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}, \\bfied -> \\mathbf{f}, \\be -> \\mathbf{e}, \\bw -> \\mathbf{w}, \\avgW -> \\overline{W}, \\Expec{}{X} -> \\mathbb{E}\\left[X\\right]; \\leq and \\geq typeset as \\leqslant and \\geqslant, written here directly."

