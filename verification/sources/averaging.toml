item = "averaging:def:clustered"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Find your place: simple distributed algorithms for community detection"
venue = "SODA 2017 / SIAM J. Comput. 2020"
version = "arXiv:1511.03927v4"
result = "Section 2, protocol and reconstruction definitions"
page = 6
url = "https://arxiv.org/abs/1511.03927v4"
status = "transcribed by an AI agent from the arXiv LaTeX source of v4 and compared with the PDF of v4; not yet checked by a person"
statement = '''
Distributed block reconstruction. Let $G = \left((V_1, V_2), E\right)$ be a graph with $V_1 \cap V_2 = \emptyset$. A weak (block) reconstruction is a two-coloring of the nodes that separates $V_1$ and $V_2$ up to a small fraction of the nodes. Formally, we define an $\varepsilon$-weak reconstruction as a map $f \,:\, V_1 \cup V_2 \rightarrow \{ \texttt{red}, \texttt{blue} \}$ such that there are two subsets $W_1 \subseteq V_1$ and $W_2 \subseteq V_2$ with $|W_1 \cup W_2| \geqslant (1 - \varepsilon) |V_1 \cup V_2|$ and $f(W_1) \cap f(W_2) = \emptyset$. When $\varepsilon = 0$ we say that $f$ is a strong reconstruction.

[...]
\textsc{Averaging} protocol:
\begin{description}
\item[Rademacher initialization:] At round $t = 0$ every node $v \in V$ independently samples its value from $\{- 1, +1\}$ uniformly at random;
\item[Updating rule:] At each subsequent round $t \geqslant 1$, every node $v \in V$
\begin{enumerate}
\item (\textsc{Averaging} dynamics) Updates its value $\mathbf{x}^{(t)}(v)$ to the average of the values of its neighbors at the end of the previous round
\item (Coloring) If $\mathbf{x}^{(t)}(v) \geqslant \mathbf{x}^{(t-1)}(v)$ then $v$ sets $\texttt{color}^{(t)}(v) = \texttt{blue}$ otherwise $v$ sets $\texttt{color}^{(t)}(v) = \texttt{red}$.
\end{enumerate}
\end{description}
'''
context = '''
[Section 2, p. 6, between the two quoted parts:] Given a graph $G = \left((V_1, V_2), E\right)$, the block reconstruction problem requires computing an $\varepsilon$-reconstruction of $G$. In this paper, we propose the following distributed protocol. It is based on the averaging dynamics and produces a coloring of the nodes at the end of every round. In the next two sections we show that, within $\mathcal{O}(\log n)$ rounds, the coloring computed by the algorithm we propose achieves strong reconstruction of the two blocks in the case of clustered regular graphs and weak reconstruction in the case of clustered non-regular graphs.

[Section 2, p. 6:] If $\mathbf{x}$ is the initial vector of values, after $t$ rounds of the \textsc{Averaging} dynamics the vector of values at time $t$ is $\mathbf{x}^{(t)} = P^t \mathbf{x}$.
'''
notes = "The entry quotes the Averaging protocol (coloring rule) and the definitions of weak and strong reconstruction. Cited by averaging/README.md ('coloring rule, strong reconstruction') and the doc comments of color and IsStrongReconstruction ('Section 2'). The protocol is a framed box in the PDF; its paragraph label 'Distributed block reconstruction.' is bold. Macros replaced: \\bx -> \\mathbf{x}, \\avg -> \\textsc{Averaging}, \\bigO -> \\mathcal{O}; the preamble typesets \\epsilon as \\varepsilon and \\geq as \\geqslant, written here directly. The source writes \\textit{weak reconstruction}, \\textit{strong reconstruction} (italics dropped here)."

