item = "averaging:lem:opp-onestep"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Lemma C.2"
page = 26
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
Let $\mathbf{x} = \mathbf{x}_{\|} + \mathbf{y} +\mathbf{z} \in [-1,1]^n$ be an arbitrary vector of states. After one step of Algorithm 1 it holds that
\[ \mathbb{E}\left[\lVert\mathbf{y}^{(t+1)}\rVert^{2} \,|\, \mathbf{x}^{(t)} = \mathbf{x}\right] \geqslant \left(1-\frac{2\lambda_{2}}{n}\right)\lVert\mathbf{y}\rVert^{2}. \]
Moreover, if the underlying graph $G$ is an $(n, d, b)$-clustered regular graph with $\lambda_2 = 2b/d = o(\lambda_3 / \log n)$ we also have that
\[ \mathbb{E}\left[\lVert\mathbf{y}^{(t+1)}\rVert^{2} \,|\, \mathbf{x}^{(t)} = \mathbf{x}\right] \leqslant \left(1-\frac{2\lambda_{2}}{n}\right)\lVert\mathbf{y}\rVert^{2} + 2 \frac{\lambda_{2}}{n^{2}}\left(\lVert\mathbf{y}\rVert^{2} + \lVert\mathbf{z}\rVert^{2}\right). \]
'''
context = '''
[Section 2, p. 7:] For a graph $G$ with $n$ nodes and adjacency matrix $A$, let $0 = \lambda_{1} \leqslant \cdots \leqslant \lambda_{n}$ be the eigenvalues of the normalized Laplacian $\mathcal{L} = I - D^{-1/2}AD^{-1/2}$, where $D$ is the diagonal matrix with the degrees of the nodes.

[Section 2, Definition 2.2 (Clustered regular graphs), p. 8:] Let $n \geqslant 2$ be an even integer and $d$ and $b$ two positive integers such that $2 b < d < n$. An $(n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over node set $V = V_1 \cup V_2$, with $|V_1|=|V_2|=n/2$ and such that: (i) Every node has degree $d$ and (ii) Every node in $V_1$ has $b$ neighbors in $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.

[Section 4.1, p. 11:] For the sake of readability, we here denote by $\mathbf{y}^{(t)} = Q_2 \mathbf{x}^{(t)}$ the component of the state vector in the eigenspace of the second eigenvalue of $\overline{W}$, while $\mathbf{z}^{(t)} = Q_{3 \cdots n} \mathbf{x}^{(t)}$ denotes $\mathbf{x}^{(t)}$'s projection onto the subspace orthogonal to $\mathbf{1}$ and $\boldsymbol{\chi}$. If we also set $\mathbf{x}_{\|} = Q_1 \mathbf{x}^{(0)}$, we can write: $\mathbf{x}^{(t)} = \mathbf{x}_{\|} + \mathbf{y}^{(t)} + \mathbf{z}^{(t)}$ (7).

[Appendix C.1, p. 26:] For readability sake, in the following proofs of this section we use $\mathbf{y}'$ and $\mathbf{z}'$ for random variables $\mathbf{y}^{(t+1)}$ and $\mathbf{z}^{(t+1)}$ conditional on the state at round $t$ being $\mathbf{x}^{(t)} = \mathbf{x} = \mathbf{x}_{\|} + \mathbf{y} + \mathbf{z}$.

[Section 2, p. 7, and Algorithm 1:] In each round, one edge of the graph is sampled uniformly at random and the two endpoints of the sampled edge execute the following algorithm. [\textsc{Averaging}$(\delta)$; Appendix C concerns $\delta = 1/2$, Section 4: 'We next provide a second moment analysis of the \textsc{Averaging}$(\delta)$ with $\delta = 1/2$'.]
'''
notes = "Cited by averaging/README.md ('Lemmas C.2, C.3 (one round)') and the doc comment of avg_cutDev_edgeAvg_le. The library's one-round bound for the cut component is in a different form (with a reference gamma; averaging/FORMALIZATION_DIFFERENCES.md, AVG-3 item 6). Macros replaced: \\norm{v} -> \\lVert v\\rVert, \\Expec{}{X} -> \\mathbb{E}\\left[X\\right], \\bx -> \\mathbf{x}, \\by -> \\mathbf{y}, \\bz -> \\mathbf{z}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}, \\avgW -> \\overline{W}, \\lapl -> \\mathcal{L}, \\aveproc -> \\textsc{Averaging}; \\leq and \\geq are typeset as \\leqslant and \\geqslant by the preamble, written here directly. 'Algorithm 1' is the source's \\ref{algo:sparse_update}."

