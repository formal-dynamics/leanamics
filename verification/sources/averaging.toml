[[source]]
item = "averaging:def:avg"
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Definition 30"
page = 31
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
[\textsc{Averaging} dynamics on $\mathcal{LOCAL}$]
\begin{itemize}
\item (Initialization). At round $t = 0$ every node $v \in V$ independently samples its value from $\{-1, +1\}$ uniformly at random;
\item (Updating rule). In each subsequent round $t \geqslant 1$, every node $u \in V$ updates its value $x_u$ to the average of the values of its neighbors at the end of the previous round.
\end{itemize}
'''
context = '''
[Section 7.1, p. 31:] In the $\mathcal{LOCAL}$ communication model, the averaging dynamics can be defined as follows.

[Section 7.1, Notation and preliminaries, p. 31:] We use the following notation in the remainder of this section. Whatever the communication model, we denote by $\mathbf{x}^{(t)}$ the global state of the \textsc{Averaging} dynamics at time $t$, i.e., the vector of values held by the nodes at time $t$. In particular, we let $\mathbf{x}^{(0)} = \mathbf{x}$ for simplicity. [...] For the rest of this section, we refer to an undirected graph $G = (V, E)$ with $n$ nodes. We denote by $d(v)$ $v$'s degree and we let $m = \sum_v d(v)$.

[Section 7.2, Theorem 32 (Convergence, see Section 1 of [L+93]), p. 32:] The random walk on $G$ is ergodic, whenever $G$ is not bipartite. Moreover, the corresponding stationary distribution is given by the vector $\boldsymbol{\pi}$ defined as:
\[ \boldsymbol{\pi}(v) = \frac{d(v)}{2m}, \forall v \in V. \]

[Section 7.2, p. 32:] As a result, for every $\mathbf{x} \in \mathbb{R}^n$, $P^t \mathbf{x}$ converges to $\alpha \mathbf{1}$, where $\alpha = \sum_v \boldsymbol{\pi}(v)\mathbf{x}(v)$. Hence, the \textsc{Averaging} dynamics achieves consensus on the (generally weighted) average of the values they initially hold.
'''
notes = "Attribution: the blueprint item (avgStep, avgIter, degAvg) names no numbered source; averaging/FORMALIZATION_DIFFERENCES.md lists Section 7.1 (Definitions 30, 31) among the sources of the AVG-1 part and refers to Definition 30 (item 7), and the item is used by averaging:thm:conv, which PROVENANCE.md attributes to Survey Section 7.2. The context quotes the Survey's alpha = sum_v pi(v) x(v), the counterpart of degAvg. Version: the published SIGACT News version could not be retrieved; the numbering of the HAL preprint (Section 7.2, Definitions 30 and 31, Theorems 32 and 33, equations (2) to (5)) matches the numbers the library cites. Pages are PDF pages (printed page plus one). The definition title is shown in brackets; the name is set in small caps (\\textsc{Averaging}) and LOCAL in calligraphic letters in the PDF. Kept as printed: m = sum_v d(v) in the notation paragraph (with pi(v) = d(v)/2m in Theorem 32; averaging/FORMALIZATION_DIFFERENCES.md, AVG-1 item 5, discusses it). [L+93] is L. Lovász, Random walks on graphs: a survey."

[[source]]
items = ["averaging:thm:conv", "averaging:thm:bip"]
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Section 7.2, 'Random walks and Consensus'"
page = 32
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
In the $\mathcal{LOCAL}$ model, the \textsc{Averaging} dynamics is perhaps one of the simplest, yet most interesting examples of a linear dynamics. In the first place, it always converges when the underlying graph $G$ is connected and not bipartite. In more detail, it converges to the global average of the initial values if the graph is regular and to a weighted global average if it isn't, the weight of each node/value being the corresponding entry of the main left eigenvector of $G$'s transition matrix [BGPS06, Sha09].

[...]
While proving ergodicity requires some (small) extra work, one can immediately check that $\boldsymbol{\pi}$ above is a stationary distribution for $P$, i.e., it satisfies $\boldsymbol{\pi}^T P = \boldsymbol{\pi}^T$, which in turn implies that $\boldsymbol{\pi}$ is a left eigenvector of $P$, with $\lambda_1(P) = 1$ as the associated eigenvalue. On the other hand, the vector $\mathbf{1} = (1, \ldots, 1)^T$ is a trivial, right eigenvector of $P$ associated to $\lambda_1(P) = 1$. These two facts imply that, whenever $G$ is not bipartite, $P^T$ converges to $\boldsymbol{\pi}^T \mathbf{1}$ as $t \to \infty$. As a result, for every $\mathbf{x} \in \mathbb{R}^n$, $P^t \mathbf{x}$ converges to $\alpha \mathbf{1}$, where $\alpha = \sum_v \boldsymbol{\pi}(v)\mathbf{x}(v)$. Hence, the \textsc{Averaging} dynamics achieves consensus on the (generally weighted) average of the values they initially hold.
'''
context = '''
[Section 7.1, Definition 30 (Averaging dynamics on LOCAL), p. 31:] (Initialization). At round $t = 0$ every node $v \in V$ independently samples its value from $\{-1, +1\}$ uniformly at random; (Updating rule). In each subsequent round $t \geqslant 1$, every node $u \in V$ updates its value $x_u$ to the average of the values of its neighbors at the end of the previous round.

[Section 7.1, Notation and preliminaries, p. 31:] Whatever the communication model, we denote by $\mathbf{x}^{(t)}$ the global state of the \textsc{Averaging} dynamics at time $t$, i.e., the vector of values held by the nodes at time $t$. In particular, we let $\mathbf{x}^{(0)} = \mathbf{x}$ for simplicity. [...] Finally, given an $n \times n$ matrix $M$, we denote by $\lambda_1(M) \geqslant \ldots \geqslant \lambda_n(M)$ its eigenvalues. For the rest of this section, we refer to an undirected graph $G = (V, E)$ with $n$ nodes. We denote by $d(v)$ $v$'s degree and we let $m = \sum_v d(v)$.

[Section 7.2, the omitted part of the statement, p. 32:] Seeing this is relatively simple if we consider that a single step of the \textsc{Averaging} dynamics amounts to applying the transition matrix $P$ of $G$ to the current global state. $P$ operates as the random walk process on $G$ by left multiplication, and as the \textsc{Averaging} dynamics by right multiplication. So, the global state of the system after $t$ steps of the \textsc{Averaging} dynamics is
\[ \mathbf{x}^{(t)} = P\mathbf{x}^{(t-1)} = \cdots = P^t \mathbf{x}^{(0)}. \]
If $G$ is undirected and non-bipartite very interesting properties hold: i) the Markov chain described by $P$ is ergodic; ii) as a consequence, as $t \to \infty$, $P^t$ converges to a rank one matrix, whose rows are copies of $P$'s main left eigenvector; iii) the mixing time of this Markov chain crucially depends on $\lambda_2(P)$. In more detail, the following results holds:
Theorem 32 (Convergence, see Section 1 of [L+93]). The random walk on $G$ is ergodic, whenever $G$ is not bipartite. Moreover, the corresponding stationary distribution is given by the vector $\boldsymbol{\pi}$ defined as:
\[ \boldsymbol{\pi}(v) = \frac{d(v)}{2m}, \forall v \in V. \]

[Section 7.2, footnote 24, p. 32:] Recall that, if $G = (V, E)$ is an undirected graph (possibly with multiple edges and self loops), $A$ its adjacency matrix and $d_i$ the degree of node $i$, the transition matrix of (the random walk on) $G$ is the matrix $P = D^{-1} A$, where $D$ is the diagonal matrix such that $D_{i,i} = d_i$. $P_{i,j} = (1/d_i) \cdot A_{i,j}$ is thus the probability of going from $i$ to $j$ in one-step of the random walk on $G$.
'''
notes = "The paragraph 'Random walks and Consensus' of Section 7.2 is about the convergence of the Averaging dynamics. PROVENANCE.md attributes both Averaging.tendsto_degAvg (averaging:thm:conv) and Averaging.not_tendsto_of_colorable (averaging:thm:bip) to 'Classical (survey §7.2)'. The Survey states no result for bipartite graphs; its only text about them is the non-bipartite hypothesis quoted here. Footnote markers 24 to 27 are omitted; footnote 26 (after 'as t to infinity') reads 'The algebraic argument is relatively easy, but beyond the scope of this survey.', footnote 27 (after 'initially hold') says that the final common value is in general not one of the initial values. Kept as printed: 'P^T converges to pi^T 1' (the passage is about P^t), 'results holds', m = sum_v d(v) in the notation paragraph. Version and pages as in the averaging:def:avg entry of this file (HAL preprint, numbering matches the library; PDF page = printed page plus one). [BGPS06] is Boyd, Ghosh, Prabhakar, Shah 2006; [Sha09] is D. Shah, Gossip algorithms (2009); [L+93] is L. Lovász, Random walks on graphs: a survey."

