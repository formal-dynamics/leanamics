item = "averaging:thm:opp-main"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Lemma A.1"
page = 21
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed by an AI agent from the arXiv LaTeX source of v3 and compared with the PDF of v3; not yet checked by a person"
statement = '''
[Projection on the first two eigenvectors] For all $\varepsilon \in (0,1)$, for a random $\mathbf{x} \in \{-1,1\}^n$, with probability at least $1-\mathcal{O}(\varepsilon)$ we have,
\begin{align*}
& \mathbb{P}\left[|\mathbf{x} \cdot \mathbf{1} \pm \mathbf{x} \cdot \boldsymbol{\chi}| \geqslant \varepsilon \cdot \sqrt{n}\right] \geqslant 1 - \mathcal{O}(\varepsilon) \quad \text{and}\\
& \mathbb{P}\left[|\mathbf{x} \cdot \mathbf{1}| \leqslant |\mathbf{x} \cdot \boldsymbol{\chi}| - \varepsilon \cdot \sqrt{n} \,\,|\,\, |\mathbf{x} \cdot \mathbf{1} \pm \mathbf{x} \cdot \boldsymbol{\chi}| \geqslant \varepsilon \cdot \sqrt{n}\right] = \frac{1}{2} .
\end{align*}
'''
context = '''
[Section 2, Definition 2.2 (Clustered regular graphs), p. 8:] [...] An $(n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over node set $V = V_1 \cup V_2$, with $|V_1|=|V_2|=n/2$ [...]

[Section 2, p. 8, after Definition 2.2:] We remark that if a graph is clustered regular then we easily get that the indicator vector $\boldsymbol{\chi}$ of the cut $(V_1, V_2)$ is an eigenvector of $\mathcal{L}$ with eigenvalue $\frac {2b}d$ [...]

[Proof of Lemma A.1, p. 21:] Note that $\mathbf{x} \cdot (\mathbf{1} + \boldsymbol{\chi}) = 2 \mathbf{x} \cdot \mathbf{1}_{V_1}$ and $\mathbf{x} \cdot (\mathbf{1} - \boldsymbol{\chi}) = 2 \mathbf{x} \cdot \mathbf{1}_{V_2}$. [...] Since $\mathbf{x} \cdot \mathbf{1}$ and $\mathbf{x} \cdot \boldsymbol{\chi}$ are independent sums of Rademacher random variables, they have the same chances of being positive or negative, thus with probability at least $\frac{1}{2}$ we will have $|\mathbf{x} \cdot \mathbf{1}| \leqslant |\mathbf{x} \cdot \boldsymbol{\chi}|$.
'''
notes = "Cited by PROVENANCE.md (Lemma A.1) and averaging/README.md ('Sign of the values over the phase (Section 4.2, Lemma A.1)') for sign_phase; averaging/FORMALIZATION_DIFFERENCES.md (AVG-3 item 9) describes the form of the lemma the library uses. The lemma title is shown in brackets. Kept as printed: 'with probability at least 1 - O(epsilon) we have,' before two probability statements. The proof's identities x.(1 + chi) = 2 x.1_{V_1} and x.(1 - chi) = 2 x.1_{V_2} show that chi = 1_{V_1} - 1_{V_2} here. Macros replaced: \\Prob{}{X} -> \\mathbb{P}\\left[X\\right], \\bx -> \\mathbf{x}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}, \\lapl -> \\mathcal{L}, \\bigO -> \\mathcal{O}; the preamble typesets \\epsilon as \\varepsilon and \\geq, \\leq as \\geqslant, \\leqslant, written here directly."
