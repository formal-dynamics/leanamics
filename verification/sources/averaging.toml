[Section 4.1, p. 11:] For the sake of readability, we here denote by $\mathbf{y}^{(t)} = Q_2 \mathbf{x}^{(t)}$ the component of the state vector in the eigenspace of the second eigenvalue of $\overline{W}$, while $\mathbf{z}^{(t)} = Q_{3 \cdots n} \mathbf{x}^{(t)}$ denotes $\mathbf{x}^{(t)}$'s projection onto the subspace orthogonal to $\mathbf{1}$ and $\boldsymbol{\chi}$. If we also set $\mathbf{x}_{\|} = Q_1 \mathbf{x}^{(0)}$, we can write: $\mathbf{x}^{(t)} = \mathbf{x}_{\|} + \mathbf{y}^{(t)} + \mathbf{z}^{(t)}$ (7).

