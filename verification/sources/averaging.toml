statement = '''
[Clustered regular graphs] Let $n \geqslant 2$ be an even integer and $d$ and $b$ two positive integers such that $2 b < d < n$. An $(n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over node set $V = V_1 \cup V_2$, with $|V_1|=|V_2|=n/2$ and such that: (i) Every node has degree $d$ and (ii) Every node in $V_1$ has $b$ neighbors in $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.
'''
context = '''
[Section 2, p. 7:] For a graph $G$ with $n$ nodes and adjacency matrix $A$, let $0 = \lambda_{1} \leqslant \cdots \leqslant \lambda_{n}$ be the eigenvalues of the normalized Laplacian $\mathcal{L} = I - D^{-1/2}AD^{-1/2}$, where $D$ is the diagonal matrix with the degrees of the nodes.

[Section 2, p. 8, after Definition 2.2:] We remark that if a graph is clustered regular then we easily get that the indicator vector $\boldsymbol{\chi}$ of the cut $(V_1, V_2)$ is an eigenvector of $\mathcal{L}$ with eigenvalue $\frac {2b}d$; If we further assume that $\lambda_3 > \frac{2b}d$, then $\boldsymbol{\chi}$ is an eigenvector of $\lambda_2$.

[Section 4.1, p. 11:] For $(n,d,b)$-clustered regular graphs, these facts and our preliminary remarks in Section 2 further imply $\bar{\lambda}_2 = 1 - \lambda_2/n = 1 - 2b/dn$ whenever $\lambda_3 > \frac{2b}{d}$ while, very importantly, the partition indicator vector $\boldsymbol{\chi}$ turns out to be the eigenvector of $\overline{W}$ corresponding to $\bar{\lambda}_2$ (see (2)).
'''
notes = "Cited by averaging/README.md ('Definition 2.2, chi, Q_1, Q_2, Q_3...n (equation (7)), lambda_3') and the doc comment of IsClusteredRegular. The printed text calls chi 'the indicator vector of the cut (V_1, V_2)' and 'the partition indicator vector' without a formula (the formula chi = 1_{V_1} - 1_{V_2} appears only in commented-out parts of the source). The paper uses lambda_2, lambda_3 for eigenvalues of the normalized Laplacian (quoted); the library takes lambda_3 as a Rayleigh-quotient lower bound (averaging/FORMALIZATION_DIFFERENCES.md, AVG-3 item 4). The definition title is shown in brackets. Kept as printed: 'eigenvector of lambda_2', '1 - 2b/dn'. Macros replaced: \\bchi -> \\boldsymbol{\\chi}, \\lapl -> \\mathcal{L}, \\avgW -> \\overline{W}; \\geq and \\leqs are typeset as \\geqslant and \\leqslant, written here directly."

