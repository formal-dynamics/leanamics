[[source]]
item = "averaging:def:clustered"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Find your place: simple distributed algorithms for community detection"
venue = "SODA 2017 / SIAM J. Comput. 2020"
version = "arXiv:1511.03927v4"
result = "Definition 3.1"
page = 7
url = "https://arxiv.org/abs/1511.03927v4"
status = "transcribed by an AI agent from the arXiv LaTeX source of v4 and compared with the PDF of v4; not yet checked by a person"
statement = '''
[Clustered Regular Graph] A $(2n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over vertex set $V_1 \cup V_2$, with $|V_1|=|V_2|=n$ and such that: (i) Every node has degree $d$ and (ii) Every node in cluster $V_1$ has $b$ neighbors in cluster $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.
'''
context = '''
[Section 2, p. 6:] Let $G = \left((V_1, V_2), E\right)$ be a graph with $V_1 \cap V_2 = \emptyset$.

[Section 2, p. 6:] Let $G=(V,E)$ be an undirected graph (possibly with multiple edges and self loops), $A$ its adjacency matrix and $d_i$ the degree of node $i$. The transition matrix of (the random walk on) $G$ is the matrix $P = D^{-1} A$, where $D$ is the diagonal matrix such that $D_{i,i} = d_i$. $P_{i,j} = (1/d_i) \cdot A_{i,j}$ is thus the probability of going from $i$ to $j$ in one-step of the random walk on $G$. $P$ operates as the random walk process on $G$ by left multiplication, and as the \textsc{Averaging} dynamics by right multiplication. For $i = 1, 2$, define $\mathbf{1}_{V_i}$, as the $|V|$-dimensional vector, whose $j$-th component is $1$ if $j\in V_i$, it is $0$ otherwise. If $(V_1, V_2)$ is a bipartition of the nodes with $|V_1| = |V_2| = n$, we define the partition indicator vector $\boldsymbol{\chi} = \mathbf{1}_{V_1} - \mathbf{1}_{V_2}$. If $\mathbf{x}$ is the initial vector of values, after $t$ rounds of the \textsc{Averaging} dynamics the vector of values at time $t$ is $\mathbf{x}^{(t)} = P^t \mathbf{x}$.

[Section 2, p. 7:] In what follows we always denote by $\lambda_1 \geqslant \ldots \geqslant \lambda_{2n}$ the eigenvalues of $P$. Recall that, since $P$ is a stochastic matrix we have $\lambda_1 = 1$ and $\lambda_{2n} \geqslant -1$, moreover for all graphs that are connected and not bipartite it holds that $\lambda_2 < 1$ and $\lambda_{2n} > -1$. We denote by $\lambda$ the largest, in absolute value, among all but the first two eigenvalues, namely $\lambda = \max\left\{ | \lambda_i | \,:\, i = 3, 4, \dots, 2n \right\}$.

[Section 3, p. 7:] If $G$ is $d$-regular then $P = (1/d) A$ is a real symmetric matrix and $P$ and $A$ have the same set of eigenvectors.

[Section 3, p. 7, after Definition 3.1:] We know that $\mathbf{1}$ is an eigenvector of $P$ with eigenvalue $1$, and it is easy to see that the partition indicator vector $\boldsymbol{\chi}$ is an eigenvector of $P$ with eigenvalue $1 - 2b/d$ (see Observation A.3 in Appendix A).
'''
