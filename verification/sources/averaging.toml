statement = '''
[Weak Reconstruction] A function $f: V \rightarrow \{\pm 1\}$ is said to be an $\varepsilon$-weak reconstruction of $G$ if subsets $W_1 \subseteq V_1$ and $W_2 \subseteq V_2$ exist, each of size at least $(1 - \varepsilon)n/2$, such that $f(W_1) \cap f(W_2) = \emptyset$.
'''
context = '''
[Section 2, Definition 2.2 (Clustered regular graphs), p. 8:] Let $n \geqslant 2$ be an even integer and $d$ and $b$ two positive integers such that $2 b < d < n$. An $(n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over node set $V = V_1 \cup V_2$, with $|V_1|=|V_2|=n/2$ and such that: (i) Every node has degree $d$ and (ii) Every node in $V_1$ has $b$ neighbors in $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.

[Section 2, p. 8, before Definition 2.3:] We next recall the notion of weak reconstruction [BCN+17].
'''
notes = "Cited by averaging/README.md ('Definitions 4.1, 2.3 | IsGood, IsWeakReconstruction'); IsWeakReconstruction is part of averaging:thm:opp-main (the library's labelling by signs is described in averaging/FORMALIZATION_DIFFERENCES.md, AVG-3 item 9). [BCN+17] is the Find your place paper (SODA 2017). The definition title is shown in brackets. The source writes \\emph{$\\varepsilon$-weak reconstruction} (italics dropped here)."

