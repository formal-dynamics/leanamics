[Proof of Lemma C.3, p. 28:] From Pythagoras' Theorem and Lemmas C.1 and C.2, we get
\[ \mathbb{E}\left[\lVert\mathbf{z}'\rVert^{2}\right] = \mathbb{E}\left[\lVert\mathbf{y}'+\mathbf{z}'\rVert^{2}\right]-\mathbb{E}\left[\lVert\mathbf{y}'\rVert^{2}\right] \leqslant [\ldots] = \frac{\lambda_{2}}{n}\lVert\mathbf{y}\rVert^{2}+\left(1-\frac{\lambda_{3}}{n}\right) \lVert\mathbf{z}\rVert^{2}. \]

