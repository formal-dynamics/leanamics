statement = '''
Assume we run the \textsc{Averaging} dynamics in a $(2n, d, b)$-clustered regular graph $G$ (see Definition 3.1) with any initial vector $\mathbf{x} \in \{ -1,1\}^{2n}$. If $\lambda < 1 - 2b/d$ then there are reals $\alpha_1,\alpha_2$ such that at every round $t$ we have
\[ \mathbf{x}^{(t)} = \alpha_1 \mathbf{1} + \alpha_2 \lambda_2^t \boldsymbol{\chi} + \mathbf{e}^{(t)} \ \ \mbox{ where } \ \left\| \mathbf{e}^{(t)} \right\|_\infty \leqslant \lambda^t \sqrt {2n} \, . \]
'''
context = '''
[Section 3, Definition 3.1 (Clustered Regular Graph), p. 7:] A $(2n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over vertex set $V_1 \cup V_2$, with $|V_1|=|V_2|=n$ and such that: (i) Every node has degree $d$ and (ii) Every node in cluster $V_1$ has $b$ neighbors in cluster $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.

[Section 2, p. 6:] The transition matrix of (the random walk on) $G$ is the matrix $P = D^{-1} A$, where $D$ is the diagonal matrix such that $D_{i,i} = d_i$. [...] If $(V_1, V_2)$ is a bipartition of the nodes with $|V_1| = |V_2| = n$, we define the partition indicator vector $\boldsymbol{\chi} = \mathbf{1}_{V_1} - \mathbf{1}_{V_2}$. If $\mathbf{x}$ is the initial vector of values, after $t$ rounds of the \textsc{Averaging} dynamics the vector of values at time $t$ is $\mathbf{x}^{(t)} = P^t \mathbf{x}$.

[Section 2, p. 7:] In what follows we always denote by $\lambda_1 \geqslant \ldots \geqslant \lambda_{2n}$ the eigenvalues of $P$. [...] We denote by $\lambda$ the largest, in absolute value, among all but the first two eigenvalues, namely $\lambda = \max\left\{ | \lambda_i | \,:\, i = 3, 4, \dots, 2n \right\}$. Unless otherwise specified, the norm of a vector $\mathbf{x}$ is the $\ell_2$ norm $\| \mathbf{x} \| := \sqrt{\sum_i (\mathbf{x}(i))^2}$ [...]

[Section 3, p. 7:] If $G$ is $d$-regular then $P = (1/d) A$ is a real symmetric matrix and $P$ and $A$ have the same set of eigenvectors.

[Proof of Lemma C.1, p. 19:] where $1 = \lambda_1 > \lambda_2 = 1 - 2b/d > \lambda_3 \geqslant \cdots \geqslant \lambda_{2n}$ are the eigenvalues of $P$ [...] where we set $\alpha_1 = \frac{1}{2n}\langle \mathbf{1}, \mathbf{x} \rangle$ and $\alpha_2 = \frac{1}{2n} \langle \boldsymbol{\chi}, \mathbf{x} \rangle$.
'''
notes = "Cited by PROVENANCE.md and averaging/README.md for abs_avgIter_sub_le; the item also contains avgIter_eq_transitionMatrix_pow_mulVec (the sentence 'x^(t) = P^t x' of Section 2, quoted in the context) and transitionMatrix_mulVec_clusterIndicator (Observation A.3, separate entry). The statement names lambda_2 without defining it; the context quotes the proof's identification lambda_2 = 1 - 2b/d and its definitions of alpha_1, alpha_2. Macros replaced: \\avg -> \\textsc{Averaging}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}, \\be -> \\mathbf{e}, \\bx -> \\mathbf{x}; \\leq and \\geq are typeset as \\leqslant and \\geqslant by the preamble, written here directly. Numbering: Lemma C.1 in v4 (as cited by PROVENANCE.md)."

