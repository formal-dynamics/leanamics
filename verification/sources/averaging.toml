statement = '''
[Monotonicity property] Let $G$ be a connected graph, let $\bar{\lambda}_i$ for $i = 1, \dots, n$ be the eigenvalues of matrix $\overline{W}$, let $\varepsilon$ be such that $0 < \varepsilon < 1$, and let $\mathbf{x} \in \{-1,1\}^n$ be an arbitrary initial vector such that $|\alpha_2| = |\alpha_2(\mathbf{x})| > 0$. Then, for every node $u \notin B_\varepsilon$ and for any round $t$ such that $t \geqslant 3 \log \left(\frac{n}{1-\varepsilon} \right) / \log(\bar{\lambda}_2 /\bar{\lambda}_3)$, it holds that
\[ \mathbf{sgn}\left( \mathbb{E}\left[\mathbf{x}^{(t-1)}_u \,|\, \mathbf{x}^{(0)} = \mathbf{x}\right] - \mathbb{E}\left[\mathbf{x}^{(t)}_u \,|\, \mathbf{x}^{(0)} = \mathbf{x}\right] \right) = \mathbf{sgn}\left( \alpha_2 \boldsymbol{\chi}_u \right) \ . \qquad (19) \]
'''
context = '''
[Section 3, p. 9:] We denote its eigenvalues as $\bar{\lambda}_1, \dots, \bar{\lambda}_n$, with $1 = \bar{\lambda}_1 \geqslant \bar{\lambda}_2 \geqslant \cdots \bar{\lambda}_n \geqslant -1\,.$ [$\overline{W} = \mathbb{E}[W_t] = I - \frac{1}{2m} L$, equation (2)]

[Lemma B.1 (Main decomposition), p. 23:] Let $\mathbf{x} \in \{-1,1\}^n$ be an arbitrary initial vector of values and, for $h = 1, 2$, let $\mu_h = \mu_h(\mathbf{x}) = (2/n) \sum_{i \in V_h} \mathbf{x}(i)$ be the average of the initial values in block $h$. The expected vector of values at round $t$ conditional on the initial vector being $\mathbf{x}$ can be written as
\[ \mathbb{E}\left[\mathbf{x}^{(t)} \,|\, \mathbf{x}^{(0)} = \mathbf{x}\right] = \alpha_1 \mathbf{1} + \alpha_2 \bar{\lambda}_2^t \boldsymbol{\chi} + \alpha_2 \sqrt{n} \, \bar{\lambda}_2^t \mathbf{f}_\perp + \mathbf{e}^{(t)} \, , \]
where $\alpha_1 = \frac{\mu_1 + \mu_2}{2}$, $\alpha_2 = \frac{1}{\|\mathbf{f} - \mathbf{f}_\perp\|^2} \left( \frac{\mu_1 - \mu_2}{2} - \frac{\langle \mathbf{x}, \mathbf{f}_\perp\rangle}{\sqrt{n}} \right)$ and, moreover, $\left\|\mathbf{e}^{(t)} \right\| \leqslant \bar{\lambda}_3^t \sqrt{n}$.

[Definition B.1 (Bad nodes), p. 24:] We say a node $u \in [n]$ is $\varepsilon$-bad if $|\mathbf{f}_{\perp,u}| \geqslant \varepsilon/\sqrt n$, for some $\varepsilon > 0$ and we call $B_\varepsilon$ the set of $\varepsilon$-bad nodes.

[Section 4.1, p. 11:] For $(n,d,b)$-clustered regular graphs, [...] the partition indicator vector $\boldsymbol{\chi}$ turns out to be the eigenvector of $\overline{W}$ corresponding to $\bar{\lambda}_2$ (see (2)). As a consequence, the orthogonal component $\mathbf{f}_\perp$ in (4) is $\mathbf{0}$ in this case.
'''
notes = "Cited by averaging/README.md and the doc comment of monotone_criterion ('Lemma B.3 (monotonicity property) on a clustered regular graph, where no node is bad'). The paper does not state the base of log. The lemma title is shown in brackets. Macros replaced: \\sgn -> \\mathbf{sgn}, \\Expec{}{X} -> \\mathbb{E}\\left[X\\right], \\bx -> \\mathbf{x}, \\bchi -> \\boldsymbol{\\chi}, \\bfied -> \\mathbf{f}, \\be -> \\mathbf{e}, \\bone -> \\mathbf{1}, \\avgW -> \\overline{W}; \\geq and \\leq typeset as \\geqslant and \\leqslant, written here directly."

