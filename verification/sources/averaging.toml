\[ \mathbb{E}\left[\lVert\mathbf{y}^{(t+1)}+\mathbf{z}^{(t+1)}\rVert^{2} \,|\, \mathbf{x}^{(t)} = \mathbf{x}\right] \leqslant \left(1-\frac{\lambda_{2}}{n}\right)\lVert\mathbf{y}\rVert^{2} + \left(1-\frac{\lambda_{3}}{n}\right)\lVert\mathbf{z}\rVert^{2}. \]
'''
notes = "Cited by averaging/README.md ('Lemmas C.2, C.3 (one round)') and the doc comment of avg_restSq_edgeAvg_le. Kept as printed: the left-hand side is the square of the conditional expectation of the norm, E[||z^(t+1)|| | x^(t) = x]^2 (source: \\Expec{}{\\norm{\\bz^{(t+1)}} \\,|\\, \\bx^{(t)} = \\bx}^{2}); the proof (quoted in the context) bounds E[||z'||^2]. Lemma C.1 is quoted because the proof uses it; its own proof starts from E||W(y+z)||^2 = (y+z)^T (I - L/n)(y+z), the identity behind avg_sum_sq_edgeAvg. Macros replaced: \\norm{v} -> \\lVert v\\rVert, \\Expec{}{X} -> \\mathbb{E}\\left[X\\right], \\bx -> \\mathbf{x}, \\by -> \\mathbf{y}, \\bz -> \\mathbf{z}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}, \\avgW -> \\overline{W}, \\lapl -> \\mathcal{L}; \\leq typeset as \\leqslant, written here directly. 'Algorithm 1' is the source's \\ref{algo:sparse_update}."

