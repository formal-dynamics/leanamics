[Section 7.2, Theorem 32 (Convergence, see Section 1 of [L+93]), p. 32:] The random walk on $G$ is ergodic, whenever $G$ is not bipartite. Moreover, the corresponding stationary distribution is given by the vector $\boldsymbol{\pi}$ defined as: $\boldsymbol{\pi}(v) = \frac{d(v)}{2m}, \forall v \in V$.

