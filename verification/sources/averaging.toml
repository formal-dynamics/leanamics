items = ["averaging:def:edge-matrix", "averaging:lem:edge-matrix"]
paper = "L. Becchetti, A. Clementi, E. Natale. Consensus dynamics: an overview"
venue = "SIGACT News 51(1), 2020"
version = "HAL preprint hal-02507613v1"
result = "Equation (2)"
page = 33
url = "https://hal.science/hal-02507613v1"
status = "transcribed by an AI agent from the PDF of the HAL preprint hal-02507613v1 (no LaTeX source available; text extracted with pdftotext and read against the rendered page); not yet checked by a person"
statement = '''
In more detail, it is easy to see [BGPS06] that, if edge $(i, j)$ is selected for communication in the $t$-step we have:
\[ W(t) = I - \frac{(\mathbf{e}_i - \mathbf{e}_j)(\mathbf{e}_i - \mathbf{e}_j)^T}{2}, \qquad (2) \]
where $I$ is the identiy matrix and $\mathbf{e}_h$ denotes the $h$-th canonical vector.
'''
context = '''
[Section 7.1, Definition 31 (Averaging(delta) on the random sequential model), p. 31:] In the random sequential case, a node performs some action whenever it is one of the endpoints of the edge selected for communication in the current step.
Definition 31 (\textsc{Averaging}$(\delta)$ on the random sequential model). Let $\delta \in (0, 1)$ be the parameter measuring the weight given to the neighbor's value.
\begin{itemize}
\item (Initialization). If it is the first time $u$ is active, then pick $x_u \in \{-1, +1\}$ u.a.r.
\item (Updating rule). Send $x_u$ to the other endpoint of the active edge and then update $x_u := (1 - \delta)x_u + \delta r$, where $r$ is the value received from the other endpoint.
\end{itemize}

[Section 7.2, p. 33:] The picture changes completely in process over the random sequential model described in Definition 30. Here, the global state $\mathbf{x}^{(t)}$ at time $t$ depends on the global state at time $t - 1$ according to a non-homogeneous Markov chain. In more detail, we have:
\[ \mathbf{x}^{(t)} = W(t)\mathbf{x}^{(t-1)}, \]
where $W(t)$ is a matrix that corresponds to the averaging between the end nodes of the edge that is selected for communication in the $t$-th step.

[Section 7.2, footnote 28, p. 33:] We remind the reader that we focus on the case $\delta = 1/2$.

[Section 7.2, p. 33, after equation (3):] A few remarks are in order: i) the $W(t)$'s are independent and identically distributed random variables, their distribution corresponding to the one over the edges that defines the random sequential process; ii) each $W(t)$ is a doubly stochastic matrix; iii) it is easy to see that $W^{(t)}$ is a (doubly) stochastic matrix that defines a non-homogeneous Markov chain.
'''
notes = "Cited by averaging/README.md ('Edge step W (equation (2)), doubly stochastic, W^T W = W') for Sequential.edgeMatrix (averaging:def:edge-matrix) and for edgeMatrix_mulVec, edgeMatrix_mem_doublyStochastic, transpose_edgeMatrix_mul_self (averaging:lem:edge-matrix). The Survey's remark ii) is its text on double stochasticity; it does not state W^T W = W (see the entry of Boyd et al., equations (26) to (29)). Footnote marker 28 (after 'In more detail') and 29 (after 'random variables'; it reads 'If edges are selected independently across different time steps as we assume.') omitted. Kept as printed: 'identiy', 'in the t-step', 'in process over the random sequential model described in Definition 30' (the random sequential model is Definition 31). [BGPS06] is Boyd, Ghosh, Prabhakar, Shah 2006. Version and pages as in the averaging:def:avg entry of this file."

