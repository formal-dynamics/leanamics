notes = "Footnote 24 defines the transition matrix P; Theorems 32 and 33 give pi and lambda. The statement collects the three places where the Survey defines the objects of the item: P (footnote 24, attached to the sentence 'a single step of the Averaging dynamics amounts to applying the transition matrix P of G to the current global state'), pi (Theorem 32) and lambda (Theorem 33). The Survey does not mention the symmetric matrix N = D^{-1/2} A D^{-1/2} of the blueprint item. Kept as printed: m = sum_v d(v) in the notation paragraph, while pi(v) = d(v)/2m (averaging/FORMALIZATION_DIFFERENCES.md, AVG-1 item 5, discusses it). Version and pages as in the averaging:def:avg entry of this file. [L+93] is L. Lovász, Random walks on graphs: a survey."

