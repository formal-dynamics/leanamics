[[source]]
items = ["averaging:def:edge-matrix", "averaging:lem:edge-matrix"]
paper = "S. Boyd, A. Ghosh, B. Prabhakar, D. Shah. Randomized gossip algorithms"
venue = "IEEE Transactions on Information Theory 52(6), 2006"
version = "IEEE Trans. Inf. Theory 52(6), 2006"
result = "Equation (2), Section I-A"
page = 2
url = "https://web.stanford.edu/~boyd/papers/pdf/gossip.pdf"
status = "transcribed by an AI agent from the PDF of the published version (no LaTeX source available; the PDF's text layer omits most of the mathematics, so the formulas were read from the rendered pages); not yet checked by a person"
statement = '''
The asynchronous algorithm associated with $P$, denoted by $\mathcal{A}(P)$, is described as follows: In the $k$th time slot, let node $i$'s clock tick and let it contact some neighboring node $j$ with probability $P_{ij}$. At this time, both nodes set their values equal to the average of their current values. Formally, let $x(k)$ denote the vector of values at the end of the time slot $k$. Then
\[ x(k) = W(k)x(k-1) \qquad (1) \]
where with probability $\frac{1}{n}P_{ij}$ (the probability that the $i$th node's clock ticks is $1/n$, and the probability that it contacts node $j$ is $P_{ij}$) the random matrix $W(k)$ is
\[ W_{ij} = I - \frac{(e_i - e_j)(e_i - e_j)^T}{2} \qquad (2) \]
where $e_i = [0 \ \ldots \ 0 \ 1 \ 0 \ \ldots 0]^T$ is an $n \times 1$ unit vector with the $i$th component equal to $1$.
'''
context = '''
[Section I-A, p. 2509:] Consider a connected graph $G = (V, E)$, where the vertex set $V$ contains $n$ nodes and $E$ is the edge set. The $i$th component of the vector $x(0) = [x_1(0), \ldots, x_n(0)]^T$ represents the initial value at node $i$. Let $x_{\mathrm{ave}} = \sum_i x_i(0)/n$ be the average of the entries of $x(0)$. Our goal is to compute $x_{\mathrm{ave}}$ in a distributed manner.
Asynchronous time model: Each node has a clock which ticks at the times of a rate 1 Poisson process. Thus, the inter-tick times at each node are rate 1 exponentials, independent across nodes and over time. Equivalently, this corresponds to a single clock ticking according to a rate $n$ Poisson process at times $Z_k$, $k \geq 1$, where $\{Z_{k+1} - Z_k\}$ are i.i.d. exponentials of rate $n$. Let $I_k \in \{1, \ldots, n\}$ denote the node whose clock ticked at time $Z_k$. Clearly, the $I_k$ are i.i.d. variables distributed uniformly over $\{1, \ldots, n\}$. We discretize time according to clock ticks since these are the only times at which the value of $x(\cdot)$ changes. [...]
Algorithm $\mathcal{A}(P)$: We consider a particular class of time-invariant gossip algorithms, denoted by $\mathcal{A}$. An algorithm in this class is characterized by an $n \times n$ matrix $P = [P_{ij}]$ of nonnegative entries with the condition that $P_{ij} > 0$ only if $(i, j) \in E$. For technical reasons, we assume that $P$ is a stochastic matrix with its largest eigenvalue equal to 1, and all remaining $n - 1$ eigenvalues strictly less than 1 in magnitude. [...]

[Section III-A, p. 2512:] Note that $W(k)$ are doubly stochastic matrices for all $(i, j)$.

[Section III-A, p. 2513:] It is not an accident that $W(k)^T W(k) = W(k)$: each $W_{ij}$ is a projection matrix, which projects a vector $x$ onto the subspace $x_i = x_j$. The entries of $x$ except the $i$ and $j$th stay unchanged, and $x_i$ and $x_j$ average their values. Since every projection matrix $Q$ satisfies $Q^2 = Q$, and $W_{ij}$ are symmetric, we have $W_{ij}^T W_{ij} = W_{ij}$.
'''
notes = "Equation (2) is the asynchronous algorithm A(P). Version: the published version (IEEE Trans. Inf. Theory 52(6):2508-2530, June 2006), PDF on S. Boyd's web page. The blueprint section 'Sequential averaging' names this paper as the source of the Survey's equations (4) and (5); averaging/FORMALIZATION_DIFFERENCES.md (AVG-1) cites it for the edge step and its properties. The page field is the PDF page (journal page 2509). Kept as printed: '0 1 0 ...0' without a space before the last 0. The definition of A(P) quoted in the context goes on: '(Such a matrix can always be found if the underlying graph is connected and nonbipartite; we will assume that the network graph G satisfies these conditions for the remainder of the paper.)'."

[[source]]
items = ["averaging:thm:mean-step", "averaging:def:edge-matrix"]
paper = "S. Boyd, A. Ghosh, B. Prabhakar, D. Shah. Randomized gossip algorithms"
venue = "IEEE Transactions on Information Theory 52(6), 2006"
version = "IEEE Trans. Inf. Theory 52(6), 2006"
result = "Equations (24) and (25)"
page = 6
url = "https://web.stanford.edu/~boyd/papers/pdf/gossip.pdf"
status = "transcribed by an AI agent from the PDF of the published version (no LaTeX source available; the PDF's text layer omits most of the mathematics, so the formulas were read from the rendered pages); not yet checked by a person"
statement = '''
Computing $W$:
Let $W$ denote the expected value of $W(0)$ (which is the same as $E[W(k)]$)
\[ W = \frac{1}{n}\sum_{i,j} P_{ij} W_{ij}. \qquad (24) \]
Then, the entries of $W$ are as follows:
1) for $i \neq j$, $W_{ij} = \frac{P_{ij} + P_{ji}}{2n}$ and
2) $W_{ii} = 1 - \frac{\left[\sum_{j=1}^{n} (P_{ij} + P_{ji})\right] - 2P_{ii}}{2n}$.
This yields the $W$ defined in (7), that is,
\[ W = I - \frac{1}{2n}D + \frac{P + P^T}{2n} \qquad (25) \]
where $D = \mathrm{diag}([D_1 \cdots D_n])$ is the diagonal matrix with entries
\[ D_i = \left(\sum_{j=1}^{n} [P_{ij} + P_{ji}]\right). \]
Note that if $P = P^T$, then $P$ is doubly stochastic. This implies that $D_i = 2$, which in turn means that $W = (1 - 1/n)I + (1/n)P$.
'''
context = '''
[Section I-A, p. 2509, Algorithm A(P):] An algorithm in this class is characterized by an $n \times n$ matrix $P = [P_{ij}]$ of nonnegative entries with the condition that $P_{ij} > 0$ only if $(i, j) \in E$. For technical reasons, we assume that $P$ is a stochastic matrix with its largest eigenvalue equal to 1, and all remaining $n - 1$ eigenvalues strictly less than 1 in magnitude. [...] The asynchronous algorithm associated with $P$, denoted by $\mathcal{A}(P)$, is described as follows: In the $k$th time slot, let node $i$'s clock tick and let it contact some neighboring node $j$ with probability $P_{ij}$. At this time, both nodes set their values equal to the average of their current values.

[Section III-A, p. 2512:] Recall that under algorithm $\mathcal{A}(P)$
\[ x(k+1) = W(k+1)x(k) \qquad (21) \]
where, with probability $\frac{1}{n}P_{ij}$, the random matrix $W(k)$ is
\[ W_{ij} = I - \frac{(e_i - e_j)(e_i - e_j)^T}{2}. \qquad (22) \]

[Section I-C, Theorem 3, p. 2510 to 2511, where equation (7) is introduced:] The averaging time $T_{\mathrm{ave}}(\epsilon, P)$ of the asynchronous algorithm $\mathcal{A}(P)$ (in terms of number of clock ticks) is bounded as follows: [(5) and (6)] where
\[ W \triangleq I - \frac{1}{2n}D + \frac{P + P^T}{2n} \qquad (7) \]
and $D$ is the diagonal matrix with entries $D_i = \sum_{j=1}^{n} [P_{ij} + P_{ji}]$.
'''
notes = "Equations (24) and (25) are in Section III-A, 'Computing W', and give the matrix of equation (7). Version: the published version (IEEE Trans. Inf. Theory 52(6):2508-2530, June 2006), PDF on S. Boyd's web page. The source the blueprint names for the Survey's equation (4) (blueprint section 'Sequential averaging'; averaging/FORMALIZATION_DIFFERENCES.md, AVG-1 item 9). The page field is the PDF page (journal page 2513). Kept as printed: the expected matrix is written W without an overline in (7), (24) and (25) (Section II-A writes the mean of the matrices W(t) as an overlined W); in item 1) W_ij denotes an entry of the expected matrix, while in (22) and (24) W_ij is the matrix of one step. The last sentence is the paper's counterpart of the Survey's equation (5)."

[[source]]
items = ["averaging:lem:edge-matrix", "averaging:thm:moments"]
paper = "S. Boyd, A. Ghosh, B. Prabhakar, D. Shah. Randomized gossip algorithms"
venue = "IEEE Transactions on Information Theory 52(6), 2006"
version = "IEEE Trans. Inf. Theory 52(6), 2006"
result = "Equations (26) to (29)"
page = 6
url = "https://web.stanford.edu/~boyd/papers/pdf/gossip.pdf"
status = "transcribed by an AI agent from the PDF of the published version (no LaTeX source available; the PDF's text layer omits most of the mathematics, so the formulas were read from the rendered pages); not yet checked by a person"
statement = '''
Computing the second moment $E[y(k)^T y(k)]$:
With probability $\frac{P_{ij}}{n}$, the edge $(i, j)$ is chosen to average, that is, $W(k) = W_{ij}$. Then
\[ W(k)^T W(k) = \left(I - \frac{(e_i - e_j)(e_i - e_j)^T}{2}\right)^2 \qquad (26) \]
\[ = \left(I - \frac{(e_i - e_j)(e_i - e_j)^T}{2}\right) \qquad (27) \]
\[ = W(k). \qquad (28) \]
It is not an accident that $W(k)^T W(k) = W(k)$: each $W_{ij}$ is a projection matrix, which projects a vector $x$ onto the subspace $x_i = x_j$. The entries of $x$ except the $i$ and $j$th stay unchanged, and $x_i$ and $x_j$ average their values. Since every projection matrix $Q$ satisfies $Q^2 = Q$, and $W_{ij}$ are symmetric, we have $W_{ij}^T W_{ij} = W_{ij}$.
Since (28) holds for each instance of the random matrix $W$, we have
\[ E[W(0)^T W(0)] = E[W(0)] = W. \qquad (29) \]
'''
context = '''
[Section I-A, p. 2509:] The asynchronous algorithm associated with $P$, denoted by $\mathcal{A}(P)$, is described as follows: In the $k$th time slot, let node $i$'s clock tick and let it contact some neighboring node $j$ with probability $P_{ij}$. At this time, both nodes set their values equal to the average of their current values. Formally, let $x(k)$ denote the vector of values at the end of the time slot $k$. Then $x(k) = W(k)x(k-1)$ (1) where with probability $\frac{1}{n}P_{ij}$ [...] the random matrix $W(k)$ is
\[ W_{ij} = I - \frac{(e_i - e_j)(e_i - e_j)^T}{2} \qquad (2) \]
where $e_i = [0 \ \ldots \ 0 \ 1 \ 0 \ \ldots 0]^T$ is an $n \times 1$ unit vector with the $i$th component equal to $1$.

[Section III-A, p. 2512 to 2513:] Note that $W(k)$ are doubly stochastic matrices for all $(i, j)$. [...] Given our assumptions on the matrix of transition probabilities $P$, we can conclude from the previous section that $x(k) \to x_{\mathrm{ave}}\mathbf{1}$. We want to find out how fast $x_k$ converges; in particular, we want to obtain probabilistic bounds on $y(k) = x(k) - x_{\mathrm{ave}}\mathbf{1}$.

[Section III-A, p. 2513, 'Computing W':] Let $W$ denote the expected value of $W(0)$ (which is the same as $E[W(k)]$)
\[ W = \frac{1}{n}\sum_{i,j} P_{ij} W_{ij}. \qquad (24) \]
'''
notes = "Equations (26) to (29) are in Section III-A, 'Computing the second moment'. Version: the published version (IEEE Trans. Inf. Theory 52(6):2508-2530, June 2006), PDF on S. Boyd's web page. averaging/FORMALIZATION_DIFFERENCES.md (AVG-1 item 12) cites this paper for E[W^T W] = E[W] ('since W is a symmetric projection'), the identity of Sequential.avg_transpose_edgeMatrix_mul_self (averaging:thm:moments); the projection identity W_ij^T W_ij = W_ij is transpose_edgeMatrix_mul_self (averaging:lem:edge-matrix). The paper's edge law is that of A(P) (a uniformly random node i contacts j with probability P_ij); the library states the identities for a uniformly random oriented edge. The page field is the PDF page (journal page 2513). Kept as printed: W without an overline in (29)."

