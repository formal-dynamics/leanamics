statement = '''
Restriction to $(n,d,b)$-clustered regular graphs simplifies the analysis of the \textsc{Averaging} dynamics. When $G$ is regular, $\overline{W}$ defined in (2) can be written as
\[ \overline{W} = \left( 1 - \frac 1n \right) I + \frac 1n \, P = I - \frac 1n \, \mathcal{L} \]
This obviously implies that $\overline{W}$ and $\mathcal{L}$ share the same eigenvectors, while every eigenvalue $\lambda_i$ of $\mathcal{L}$ corresponds to an eigenvalue $\bar{\lambda}_i = 1- \lambda_i/n$ of $\overline{W}$. For $(n,d,b)$-clustered regular graphs, these facts and our preliminary remarks in Section 2 further imply $\bar{\lambda}_2 = 1 - \lambda_2/n = 1 - 2b/dn$ whenever $\lambda_3 > \frac{2b}{d}$ while, very importantly, the partition indicator vector $\boldsymbol{\chi}$ turns out to be the eigenvector of $\overline{W}$ corresponding to $\bar{\lambda}_2$ (see (2)). As a consequence, the orthogonal component $\mathbf{f}_\perp$ in (4) is $\mathbf{0}$ in this case.
'''
context = '''
[Section 2, Definition 2.2 (Clustered regular graphs), p. 8:] Let $n \geqslant 2$ be an even integer and $d$ and $b$ two positive integers such that $2 b < d < n$. An $(n,d,b)$-clustered regular graph $G = ((V_1,V_2),E)$ is a graph over node set $V = V_1 \cup V_2$, with $|V_1|=|V_2|=n/2$ and such that: (i) Every node has degree $d$ and (ii) Every node in $V_1$ has $b$ neighbors in $V_2$ and every node in $V_2$ has $b$ neighbors in $V_1$.

[Section 2, p. 7 to 8:] For a graph $G$ with $n$ nodes and adjacency matrix $A$, let $0 = \lambda_{1} \leqslant \cdots \leqslant \lambda_{n}$ be the eigenvalues of the normalized Laplacian $\mathcal{L} = I - D^{-1/2}AD^{-1/2}$, where $D$ is the diagonal matrix with the degrees of the nodes. [...] We remark that if a graph is clustered regular then we easily get that the indicator vector $\boldsymbol{\chi}$ of the cut $(V_1, V_2)$ is an eigenvector of $\mathcal{L}$ with eigenvalue $\frac {2b}d$; If we further assume that $\lambda_3 > \frac{2b}d$, then $\boldsymbol{\chi}$ is an eigenvector of $\lambda_2$.

[Section 3, p. 8 to 9:] \[ \overline{W} := \mathbb{E}\left[W_t\right] = I - \frac{1}{2m} L \, , \qquad (2) \] where $L = D - A$ is the Laplacian matrix of $G$. [...] We denote its eigenvalues as $\bar{\lambda}_1, \dots, \bar{\lambda}_n$, with $1 = \bar{\lambda}_1 \geqslant \bar{\lambda}_2 \geqslant \cdots \bar{\lambda}_n \geqslant -1\,.$

[Section 3, p. 9, equation (4):] \[ \mathbb{E}\left[\mathbf{x}^{(t)}_u\right] = \alpha_1 + \alpha_2 \bar{\lambda}_2^t \left[ \boldsymbol{\chi}_u + \sqrt{n}\, \mathbf{f}_{\perp,u} \right] + \mathbf{e}^{(t)}_u, \qquad (4) \] where $\left\|\mathbf{e}^{(t)} \right\| \leqslant \bar{\lambda}_3^t \sqrt{n}$.

