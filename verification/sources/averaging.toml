statement = '''
From (2), we have that $\mathtt{sgn}\left( \mathbf{x}^{(t-1)}(u) - \mathbf{x}^{(t)}(u) \right) = \mathtt{sgn}\left(\alpha_2 \boldsymbol{\chi}(u) \right)$ whenever
\[ \left| \alpha_2 \lambda_2^{t-1} (1 - \lambda_2) \right| > \left| \mathbf{e}^{(t-1)}(u) - \mathbf{e}^{(t)}(u) \right| \qquad (3) \]
From (1) we have that $\left| \mathbf{e}^{(t)}(u) \right| \leqslant \lambda^t \sqrt{2n}$, thus (3) is satisfied for all $t$ such that
\[ t - 1 \geqslant \log \left(\frac{2 \sqrt{2n}}{|\alpha_2| (1 - \lambda_2)} \right) \cdot \frac{1}{\log\left(\lambda_2 / \lambda \right)}\,. \]
'''
context = '''
[Section 2, p. 7:] In what follows we always denote by $\lambda_1 \geqslant \ldots \geqslant \lambda_{2n}$ the eigenvalues of $P$. [...] We denote by $\lambda$ the largest, in absolute value, among all but the first two eigenvalues, namely $\lambda = \max\left\{ | \lambda_i | \,:\, i = 3, 4, \dots, 2n \right\}$.

[Section 3, p. 7, after Definition 3.1:] We know that $\mathbf{1}$ is an eigenvector of $P$ with eigenvalue $1$, and it is easy to see that the partition indicator vector $\boldsymbol{\chi}$ is an eigenvector of $P$ with eigenvalue $1 - 2b/d$ (see Observation A.3 in Appendix A). We first show that, if $1 - 2b/d$ happens to be the second eigenvalue, after $t$ rounds of the \textsc{Averaging} dynamics, the configuration $\mathbf{x}^{(t)}$ is close to a linear combination of $\mathbf{1}$ and $\boldsymbol{\chi}$. Formally, if $\lambda < 1 - 2b/d$ we prove (see Lemma C.1 in Appendix C) that there are reals $\alpha_1,\alpha_2$ such that for every $t$
\[ \mathbf{x}^{(t)} = \alpha_1 \mathbf{1} + \alpha_2 \lambda_2^t \boldsymbol{\chi} + \mathbf{e}^{(t)} \ \ \mbox{ where } \ \left\| \mathbf{e}^{(t)} \right\|_\infty \leqslant \lambda^t \sqrt {2n} \, . \qquad (1) \]
Informally speaking, the equation above naturally ``suggested'' the choice of the coloring rule in the \textsc{Averaging} protocol, once we considered the difference of two consecutive values of any node $u$, i.e.,
\[ \mathbf{x}^{(t-1)}(u) - \mathbf{x}^{(t)}(u) = \alpha_2 \lambda_2^{t-1} (1 - \lambda_2) \boldsymbol{\chi}(u) + \mathbf{e}^{(t-1)}(u) - \mathbf{e}^{(t)}(u) \, . \qquad (2) \]

[Theorem 3.2 (Strong reconstruction), p. 7:] Let $G = ((V_1, V_2),E)$ be a connected $(2n,d,b)$-clustered regular graph with $1 - 2b/d > (1+\delta) \lambda$ for an arbitrarily-small constant $\delta > 0$. Then the \textsc{Averaging} protocol produces a strong reconstruction within $\mathcal{O}(\log n)$ rounds, w.h.p.

[Proof of Lemma C.1, p. 19:] we set $\alpha_1 = \frac{1}{2n}\langle \mathbf{1}, \mathbf{x} \rangle$ and $\alpha_2 = \frac{1}{2n} \langle \boldsymbol{\chi}, \mathbf{x} \rangle$.
'''
notes = "Cited by averaging/README.md ('Theorem 3.2, deterministic part (inequality (3))') for sign_avgIter_sub_eq, exists_sign_avgIter_sub_clusters, isStrongReconstruction_color and reconstructionTime_le. The statement is a passage of the paper's 'Outline of Proof' of Theorem 3.2 (no numbered statement of its own). The references 'From (2)' and 'From (1)' are the source's \\eqref{eq:diffregular} and \\eqref{eq:metaregular}, written here with the numbers the PDF gives these displays; in the PDF of v4 all these cross-references (and 'in (3)' before Theorem 3.2) print as '(3)', as printed. Macros replaced: \\texttt{sgn} -> \\mathtt{sgn}, \\bx -> \\mathbf{x}, \\bchi -> \\boldsymbol{\\chi}, \\be -> \\mathbf{e}, \\bone -> \\mathbf{1}, \\avg -> \\textsc{Averaging}, \\strong -> 'strong reconstruction', \\bigO -> \\mathcal{O}; \\leq and \\geq are typeset as \\leqslant and \\geqslant by the preamble, written here directly."

