'''
notes = "The theorem title is shown in brackets. Kept as printed: the factor sqrt(d(v)/d(v)) (the library states sqrt(d(v)/d(u)), following Lovász's Theorem 5.1; averaging/FORMALIZATION_DIFFERENCES.md, AVG-1 item 2), 'The following result hold', and m = sum_v d(v) in the notation paragraph while pi(v) = d(v)/2m (FORMALIZATION_DIFFERENCES.md, AVG-1 item 5). The Survey states no hypothesis on G inside Theorem 33; the surrounding paragraph is about connected non-bipartite graphs. [L+93] is L. Lovász, Random walks on graphs: a survey (see the separate entry for its Theorem 5.1). Version and pages as in the averaging:def:avg entry of this file."

