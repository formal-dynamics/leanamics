context = '''
[Section 4.1, p. 10 to 11:] Restriction to $(n,d,b)$-clustered regular graphs simplifies the analysis of the \textsc{Averaging} dynamics. When $G$ is regular, $\overline{W}$ defined in (2) can be written as
\[ \overline{W} = \left( 1 - \frac 1n \right) I + \frac 1n \, P = I - \frac 1n \, \mathcal{L} \]
This obviously implies that $\overline{W}$ and $\mathcal{L}$ share the same eigenvectors, while every eigenvalue $\lambda_i$ of $\mathcal{L}$ corresponds to an eigenvalue $\bar{\lambda}_i = 1- \lambda_i/n$ of $\overline{W}$. For $(n,d,b)$-clustered regular graphs, these facts and our preliminary remarks in Section 2 further imply $\bar{\lambda}_2 = 1 - \lambda_2/n = 1 - 2b/dn$ whenever $\lambda_3 > \frac{2b}{d}$ while, very importantly, the partition indicator vector $\boldsymbol{\chi}$ turns out to be the eigenvector of $\overline{W}$ corresponding to $\bar{\lambda}_2$ (see (2)).

[Section 3, p. 8 to 9:] \[ \overline{W} := \mathbb{E}\left[W_t\right] = I - \frac{1}{2m} L \, , \qquad (2) \] where $L = D - A$ is the Laplacian matrix of $G$. Matrix $\overline{W}$ is thus symmetric and doubly-stochastic. We denote its eigenvalues as $\bar{\lambda}_1, \dots, \bar{\lambda}_n$, with $1 = \bar{\lambda}_1 \geqslant \bar{\lambda}_2 \geqslant \cdots \bar{\lambda}_n \geqslant -1\,.$

[Proof of Lemma C.2, p. 27:] $Q_2$ is the projector along the direction of $\mathbf{v}_2 = \boldsymbol{\chi} / \| \boldsymbol{\chi} \|$, which in turn is $L$'s second eigenvector.
'''
