[Section 7.1, Definition 31 (Averaging(delta) on the random sequential model), p. 31:] Let $\delta \in (0, 1)$ be the parameter measuring the weight given to the neighbor's value. (Initialization). If it is the first time $u$ is active, then pick $x_u \in \{-1, +1\}$ u.a.r. (Updating rule). Send $x_u$ to the other endpoint of the active edge and then update $x_u := (1 - \delta)x_u + \delta r$, where $r$ is the value received from the other endpoint.

