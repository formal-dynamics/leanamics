item = "averaging:thm:strong"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Find your place: simple distributed algorithms for community detection"
venue = "SODA 2017 / SIAM J. Comput. 2020"
version = "arXiv:1511.03927v4"
result = "Theorem 3.2"
page = 7
url = "https://arxiv.org/abs/1511.03927v4"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G = ((V_1, V_2),E)$ be a connected $(2n,d,b)$-clustered regular graph with
$1 - 2b/d > (1+\delta) \lambda$ for an arbitrarily-small constant $\delta > 0$.
Then the \textsc{Averaging} protocol produces a strong reconstruction within $\mathcal{O}(\log n)$ rounds, w.h.p.
'''
context = '''
In what follows we always denote by $\lambda_1 \geq \ldots \geq
\lambda_{2n}$ the eigenvalues of $P$. [...] We denote by $\lambda$ the largest, in
absolute value, among all but the first two eigenvalues, namely
$\lambda = \max\left\{ | \lambda_i | \,:\, i = 3, 4, \dots, 2n \right\}$.
'''
notes = "Theorem title: 'Strong reconstruction'. Numbering: Theorem 4.3 in v2 (v1 has no such theorem); Theorem 3.2 in v3 and v4 with identical LaTeX statements; transcribed from v4 (latest), whose Lemmas B.1 and C.1 also match the numbering of PROVENANCE.md. Macros replaced: \\avg -> \\textsc{Averaging}, \\strong -> 'strong reconstruction', \\bigO -> \\mathcal{O}. Context from Section 2 (P = (1/d)A is the transition matrix of the d-regular graph). The paper's statement has no explicit number of rounds or failure probability; the blueprint's T(n, delta) and 1 - 1/sqrt(pi n) come from the proof."

[[source]]
item = "averaging:thm:opp-31"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Theorem 3.1"
page = 9
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G = (V,E)$ be an $(n, d, \beta)$-almost regular graph $G = (V,E)$ with a
balanced partition $V = (V_1,V_2)$ and such that: (i) The cut  $E(V_1,V_2)$ is
sparse, i.e.,  $m_{1,2} = |E(V_1,V_2)| = o(m)$; (ii) The gap $\lambda_3 -
\lambda_2 = \Omega(1)$. If nodes of $G$
execute Protocol~\textsc{Averaging} then, with constant probability w.r.t. the initial
random vector $\mathbf{x}^{(0)} \in \{-1,1\}^n$, after $\Theta(n \log n)$ rounds the
following holds for all but $o(n)$ nodes: (i) The expected value of a node $u$
increases or decreases depending on the community it belongs to, i.e.,
$\mathbf{sgn}\left( \mathbb{E}\left[\mathbf{x}^{(t-1)}_u\,|\,\mathbf{x}^{(0)}\right] -
\mathbb{E}\left[\mathbf{x}^{(t)}_u\,|\,\mathbf{x}^{(0)}\right] \right) = \mathbf{sgn}\left( \boldsymbol{\chi}_u \right)$; (ii)
Over a time window of length $\Omega(n \log n)$ the sign of the expected value
of a    node $u$ reflects the community $u$ belongs to, i.e.,  $ \mathbf{sgn}\left(
\mathbb{E}\left[\mathbf{x}^{(t)}_u\,|\,\mathbf{x}^{(0)}\right] \right) = \mathbf{sgn}\left( \alpha_2 \boldsymbol{\chi}_u
\right)$, for some $\alpha_2 = \alpha_2(\mathbf{x}^{(0)})$.
'''
notes = "The paper's Theorem 3.1 is for (n,d,beta)-almost regular graphs; the blueprint item is its clustered-regular case (through Lemmas B.1, B.3, B.4). Footnote after condition (ii) removed: 'In practice, this means that each of the subgraphs induced by community $V_i$ ($i=1,2$) is an expander.' Macros replaced: \\aveproc -> \\textsc{Averaging}, \\sgn -> \\mathbf{sgn}, \\Expec{}{X} -> \\mathbb{E}\\left[X\\right], \\bx -> \\mathbf{x}, \\bchi -> \\boldsymbol{\\chi}."

[[source]]
item = "averaging:thm:opp-41"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Theorem 4.1"
page = 11
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be  an $(n,d,b)$-clustered regular graph with $\lambda_2
= \frac{2b}{d} = o\left(\lambda_3 / \log n \right)$.
Then, for every
$\frac{3n}{\lambda_3}\log n\le t \le \frac{n}{4\lambda_2}$ it holds that
\begin{equation*}
    \mathbb{E}\left[\left\| \mathbf{y}^{(t)} + \mathbf{z}^{(t)} - \mathbf{y}^{(0)} \right\|^2\right]
    \leq  \frac{3 \lambda_2 t}{n} \,.
\end{equation*}
'''
context = '''
For the sake of readability, we here denote by $\mathbf{y}^{(t)} = Q_2 \mathbf{x}^{(t)}$ the component
of the state vector in the eigenspace of the second eigenvalue of
$\overline{W}$, while $\mathbf{z}^{(t)} = Q_{3 \cdots n} \mathbf{x}^{(t)}$ denotes
$\mathbf{x}^{(t)}$'s projection onto the subspace
orthogonal to $\mathbf{1}$ and $\boldsymbol{\chi}$.
'''
notes = "Theorem title: 'Second moment analysis'. Commented-out lines of the source removed. Macros replaced: \\Expec{}{X} -> \\mathbb{E}\\left[X\\right], \\by -> \\mathbf{y}, \\bz -> \\mathbf{z}, \\bx -> \\mathbf{x}, \\avgW -> \\overline{W}, \\bone -> \\mathbf{1}, \\bchi -> \\boldsymbol{\\chi}. The blueprint item also covers Lemma C.4 (the unrolled recursions, Appendix C.1)."

[[source]]
item = "averaging:thm:opp-42"
paper = "L. Becchetti, A. Clementi, P. Manurangsi, E. Natale, F. Pasquale, P. Raghavendra, L. Trevisan. Average whenever you meet: opportunistic protocols for community detection"
venue = "ESA 2018"
version = "arXiv:1703.05045v3"
result = "Lemma 4.2"
page = 12
url = "https://arxiv.org/abs/1703.05045v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\varepsilon > 0$ be an arbitrarily small value, let $G$ be an
$(n,d,b)$-clustered regular graph with
$\frac{\lambda_2}{\lambda_3}\le\frac{\lambda_3\epsilon^4}{c \log^2 n}$, for a
large enough costant $c$. If we  execute \textsc{Averaging}$(1/2)$ on $G$, it holds that
\[
\mathbb{P}\left[  |B_t|  \leq 3 \epsilon\cdot n \, ,   \, \forall  \, t \, : \,
 6 \frac{n}{\lambda_3} \log n \leq t\leq 12 \frac{n}{\lambda_3}
\log n \right] \geq 1 - \epsilon \,.
\]
'''
context = '''
Definition 4.1. A node $v$ is \emph{$\epsilon$-good} at time $t$ if
\[
    ( \mathbf{x}^{(t)}_{v} - ( \mathbf{x}_{\|,{v}} + \mathbf{y}^{(0)}_{v}) )^2 \leq
    \frac {\epsilon^2}{n}\|\mathbf{y}^{(0)}\|^2,
\]
it is \emph{$\epsilon$-bad} otherwise. We define by $B_t$ the set of
nodes  that are $\epsilon$-bad at time $t$:
$B_t = \{u: u\makebox{ is $\epsilon$-bad at time $t$}\}$.
'''
notes = "Lemma title: 'Non-ephemeral good nodes'. The source mixes \\varepsilon and \\epsilon (kept). Commented-out lines removed. Macros replaced: \\aveproc{$(1/2)$} -> \\textsc{Averaging}$(1/2)$, \\Prob{}{X} -> \\mathbb{P}\\left[X\\right], \\bx -> \\mathbf{x}, \\by -> \\mathbf{y}. In Definition 4.1, $\\mathbf{x}_{\\|} = Q_1 \\mathbf{x}^{(0)}$ (projection on $\\mathbf{1}$) and $\\mathbf{y}^{(0)} = Q_2 \\mathbf{x}^{(0)}$ (see the opp-41 entry)."
