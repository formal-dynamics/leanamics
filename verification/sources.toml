Assuming that the input symbols are $g$ (for green) and $r$ (for red), the set of states in the ambassador protocol is $Q=\{(g,0),(g,1),(r,0),(r,1)\}$. The input function $\iota $ is such that $\iota(g)=(g,1)$ and $\iota(r)=(r,1)$. The output function $\gamma$ is such that $\gamma((g,i))=g$ and $\gamma((r,i))=r$, where $i \in \{0,1\}$. Finally, for simplicity of the presentation, we present the transition function $\delta$ in the form of a table in Figure 1.
'''
