[[source]]
item = "crn:thm:three-states"
paper = "G. B. Mertzios, S. E. Nikoletseas, C. L. Raptopoulos, P. G. Spirakis. Determining majority in networks with local interactions and very small local memory"
venue = "ICALP 2014"
version = "arXiv:1404.7671v1"
result = "Theorem 1"
page = 6
url = "https://arxiv.org/abs/1404.7671v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\mathcal{P}_{majority}$ be the class of population protocols that stably compute the majority function in any 2-type population of agents and for any interaction graph. Then $R(\mathcal{P}_{majority}) > 3$.
'''
context = '''
For any population protocol $P$, denote by $Q(P)$ the set of types used by $P$.
Let $\mathcal{P}_{g}$ be a class of population protocols that stably compute the function $g$.
The \emph{rank} of $\mathcal{P}_{g}$ is
\begin{equation}
R(\mathcal{P}_{g}) \stackrel{def}{=} \min_{P \in \mathcal{P}_{g}} |Q(P)|.
\end{equation}
'''
notes = "Replaced {\\cal P} by \\mathcal{P}. Context is Definition 1 (rank). The only arXiv version is v1."

