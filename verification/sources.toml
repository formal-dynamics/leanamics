[[source]]
item = "plurality:thm:4_2"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Theorem 4.2"
page = 18
url = "https://arxiv.org/abs/1310.2858v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $C_t$ be the random variable indicating the coloring at time $t$ according to the $3$-majority protocol and let $\tau = \inf\{ t \in \mathbb{N} \,:\, C_t \mbox{ is monochromatic} \}$ be the random variable indicating the first time step such that $C_t$ is monochromatic. If the initial number of colors is $k \leqslant (n/\log n)^{1/4}$ and the initial coloring is $C_0 = (c_1, \dots, c_k)$ with $\max \{ c_h \,:\, h = 1, \dots, k \} \leqslant \frac{n}{k} + \left( \frac{n}{k} \right)^{1-\varepsilon}$ then $\tau = \Omega(k \log n)$ w.h.p.
'''
context = '''
Let us say that a coloring $\overline{c} = (c_1, \dots, c_k) \in \{ 0, 1, \dots, n \}^k$ with $\sum_{h=1}^k c_h = n$ is \emph{monochromatic} if there is an $h \in [k]$ such that $c_h = n$.
'''
notes = "Same numbering in arXiv v1 and v2; the journal version v3 keeps the number 4.2 with a slightly reworded statement. The paper's statement is asymptotic (k <= (n/log n)^{1/4}, imbalance (n/k)^{1-eps}, tau = Omega(k log n)); the explicit form with b >= k sqrt(n log n) and (1+3/k)^T in the blueprint comes from Lemma 4.1 and the proof, not from the statement. No paper macros."

[[source]]
item = "plurality:thm:4_8_a"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Theorem 4.8 (a)"
page = 21
url = "https://arxiv.org/abs/1310.2858v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
[properties for good solvers] (a) If a protocol $\mathcal{P}$ is an $(n/4,1/4)$-solver in $\mathcal{D}_3$ then its $f$ must have the clear-majority property.
'''
context = '''
\begin{definition}[$\mathcal{D}_h(k)$ protocols]
An \emph{$h$-dynamics} is a synchronous protocol where at each time step every node picks $h$ random neighbors (including itself and with repetition) and recolors itself according to some deterministic rule that depends only on the colors it sees.
Let $\mathcal{D}_h(k)$ be the class of $h$-dynamics and observe that a dynamics $\mathcal{P} \in \mathcal{D}_h$ can be specified by a function
\[
f\,:\, [k]^h \rightarrow [k]
\]
such that $f(x_1, \dots, x_h) \in \{ x_1, \dots, x_h \}$. Where $f(x_1, \dots, x_h)$ is the color chosen by a node that sees the (ordered) sequence $(x_1, \dots, x_h)$ of colors.
\end{definition}
\begin{definition}[clear-majority property]
Let $(x_1,x_2,x_3) \in [k]^3$ be a triple of colors. We say that $(x_1,x_2,x_3)$ has a \emph{clear majority} if at least two of the three entries have the same value.
A dynamics $\mathcal{P} \in \mathcal{D}_3(k)$ has the \emph{clear-majority} property if whenever its $f$ sees a clear majority it returns the majority color.
\end{definition}
\begin{definition}[$(s,\varepsilon)$-majority consensus solver]
We say that a protocol $\mathcal{P}$ is an \emph{$(s,\varepsilon)$-solver} (for the majority consensus problem) if for every initial
$s$-biased  coloring $\overline c$, when running $\mathcal{P}$,   with probability at least $1-\varepsilon$ there is a time step $t$ by which all
nodes   gets the majority color of $c$.
\end{definition}
'''
notes = "Part (a) of Theorem 4.8 (one theorem environment with parts (a) and (b)); the optional theorem title is shown in brackets. Same numbering in arXiv v1 and v2; the journal version v3 keeps the number 4.8 (titled 'properties of good solvers', reworded). s-biased: a color m exists with c_m >= c_j + s for every other color j (Section 2)."

[[source]]
item = "plurality:thm:4_8_b"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Theorem 4.8 (b)"
page = 21
url = "https://arxiv.org/abs/1310.2858v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
[properties for good solvers] (b) A constant $\eta > 0$ exists such that, if $\mathcal{P}$ is an $(\eta \cdot n,1/4)$-solver, then its $f$ must have the uniform property.
'''
context = '''
Given any $3$-input dynamics function
$f(x_1,x_2,x_3)$, for any triple of distinct colors $r,g,b \in [k]$, let $\Pi(r,g,b)$ be the subset of permutations of the colors $r,g,b$ and define the following ``counters'':
\begin{eqnarray*}
\delta_r & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = r \}| \\
\delta_g & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = g \}| \\
\delta_b & = & |\{(z_1,z_2,z_3) \in \Pi(r,g,b) , \ s.t. \ f(z_1,z_2,z_3) = b \}|
\end{eqnarray*}
\begin{definition} [uniform property]
A dynamics $\mathcal{P} \in \mathcal{D}_3(k)$ has the \emph{uniform} property if, for any triple of distinct colors $r,g,b \in [k]$, it holds that $\delta_r = \delta_g = \delta_b \ (= 2)$.
\end{definition}
'''
notes = "Part (b) of Theorem 4.8; the optional theorem title is shown in brackets. The paper leaves eta unspecified (the blueprint uses eta = 1/20). D_3, (s, eps)-solver: see the plurality:thm:4_8_a entry. Same numbering in arXiv v1 and v2."

[[source]]
item = "plurality:thm:as-main-unconditional"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Theorem 4"
page = 8
url = "https://arxiv.org/abs/1702.04921v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Starting from \emph{any} configuration $c \in \mathcal{C}$, $3$-\textsc{Majority}
reaches consensus w.h.p. in $\mathrm{O}\bigl( n^{3/4}\log^{7/8} n \bigr)$ rounds.
'''
context = '''
We
describe the system state after any round by an $n$-dimensional integral vector
$c = (c_i)_{i \in [n]} \in \mathbb{N}_0^n$ with $\sum_{ i \in [n] }
c_i = n$. Here, the $i$-th component $c_i \in \mathbb{N}_0$ corresponds to the number of
nodes supporting opinion $i$. If $k < n$, then $c_i = 0$ for all $i \in
\{k+1, k+2, \dots, n\}$. We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid
\sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible
configurations.
'''
notes = "arXiv v1 is the only version. Macros replaced: \\hmajority{3} -> $3$-\\textsc{Majority}, \\LDAUOmicron[small]{x} -> \\mathrm{O}\\bigl(x\\bigr); in the context \\N -> \\mathbb{N}, \\intoo{.} -> (.), \\intcc{n} -> [n], \\set{.} -> \\{.\\} (with | -> \\mid), \\coloneqq -> :=. The paper gives no explicit definition of w.h.p."

[[source]]
item = "median:thm:tc-lower-strong"
paper = "P. Berenbrink, A. Clementi, R. Elsässer, P. Kling, F. Mallmann-Trenn, E. Natale. Ignore or comply? On breaking symmetry in consensus"
venue = "PODC 2017"
version = "arXiv:1702.04921v1"
result = "Theorem 5"
page = 10
url = "https://arxiv.org/abs/1702.04921v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\gamma$ be a sufficiently large constant.
Consider the 2-\textsc{Choices} process
starting from any initial configuration $c \in \mathcal{C}$. Let $\ell := \max_i c_i(0)$ be the support of the largest color.
Then, for  $\ell' := \max\{ 2\ell, \gamma \log n\}$, it holds with high probability that no color has a support  larger than $\ell'$ for $n/(\gamma \ell')$ rounds. In symbols,
\begin{equation}
    \Pr\left[ \max_i\hspace{2pt} c_i(t)   > \ell'\text{ for some }  t< \frac{n}{\gamma\ell'}\right] \leq \frac 1n.
\end{equation}
In particular, starting from the $n$-color configuration,
it holds with high probability that no color has a support  larger than $\gamma \log n$ for $  \frac{n}{\gamma^2\log n}$ rounds.
'''
context = '''
We use $\mathcal{C} := \{ c\in\mathbb{N}_0^n \mid
\sum_{ i \in [k] } c_i = n \}$ to denote the set of all possible
configurations.
'''
notes = "arXiv v1 is the only version. Macros replaced: \\twochoice -> 2-\\textsc{Choices}, \\coloneqq -> :=, \\Pr{X} -> \\Pr\\left[X\\right] (auxkling.sty); LaTeX comment lines (%) dropped. Context as in the plurality:thm:as-main-unconditional entry."

[[source]]
item = "plurality:thm:mo-phase2"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, L. Trevisan. Stabilizing consensus with many opinions"
venue = "SODA 2016"
version = "arXiv:1508.06782v1"
result = "Theorem 3.1"
page = 7
url = "https://arxiv.org/abs/1508.06782v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
[The Adversary-Free Case.]
Starting from any initial configuration with $k \leqslant n^{1/3 - \varepsilon}$ active opinions,
where $\varepsilon > 0$ is an arbitrarily-small constant, the 3-majority dynamics reaches
consensus within
$\mathcal{O}\left( (k^{2} \log^{1/2} n + k \log n) (k + \log n) \right)$ rounds, w.h.p.
'''
context = '''
According to
the standard definition, we say that a sequence  of  events
$\mathcal E_n$,  $n= 1,2, \ldots$ holds \emph{with high
probability} if  $ \mathbf{P}_{} \left( \mathcal E_n \right) = 1-\mathcal{O} (1/n^{\lambda})$ for
some positive constant $\lambda >0$.
'''
notes = "arXiv v1 is the only version. The optional theorem title is shown in brackets. Context is the w.h.p. footnote of the introduction, with \\Prob{}{X} -> \\mathbf{P}_{} \\left( X \\right) and \\bigO -> \\mathcal{O}. BCEKMN17 (arXiv:1702.04921v1) restates this result in its appendix, citing it as [BCNPT16, Theorem 3.1]."

[[source]]
item = "undecided:thm:plurality"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri. Plurality consensus in the gossip model"
venue = "SODA 2015"
version = "arXiv:1407.2565v2"
result = "Theorem 11"
page = 20
url = "https://arxiv.org/abs/1407.2565v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $k=O\left( (n/\log n)^{1/3} \right)$
and let $\bar c$ be any initial configuration such that for any $i\neq 1$
$c_{1}\geq\left(1+\alpha\right)\cdot c_{i}$ holds, where
$\alpha$ is an arbitrarily small positive constant.
Then, w.h.p. after at most $T=O\left(\mathsf{md}(\bar{\mathbf{c}})\cdot\log n\right)$ time steps
all agents support the initial plurality color.
'''
context = '''
It naturally induces a function $\mathsf{md}(\cdot)$, called the \emph{monochromatic distance},
which
equals the \emph{distance} between any configuration $\mathbf{c}$ and the target configuration:
\[
	\mathsf{md}(\mathbf{c}) \ = \ \sum_{i=1}^k \, \left(\frac{c_i}{c_{1}}\right)^2
\]
'''
notes = "Section 3.6 (supremacy.tex), label thm:upperB; theorem-like environments share one counter. v1 and v2 have the same numbering and the same statement (latest version v2 used; the repo does not name a version). Macros replaced: \\m -> 1, \\cdist -> \\mathsf{md}(\\bar{\\mathbf{c}}) (paper: \\mbox{\\textsf{md}}(\\bar \\genc)), \\genc -> \\mathbf{c}, \\mdist -> \\mathsf{md} (paper: \\textnormal{\\textsf{md}}). Context is from the introduction (Our Contributions). The paper has no separate two-colour majority theorem; the two-colour SODA 2015 form used in undecided:thm:majority is this Theorem 11 with k = 2."

[[source]]
item = "undecided:thm:lb"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri. Plurality consensus in the gossip model"
venue = "SODA 2015"
version = "arXiv:1407.2565v2"
result = "Theorem 8"
page = 18
url = "https://arxiv.org/abs/1407.2565v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\bar{\mathbf{c}}$ be the initial color configuration. If the initial number of colors is $k \leqslant \varepsilon \cdot (n/\log n)^{1/6}$, where $\varepsilon > 0$ is a sufficiently small positive constant, then the convergence time of the Undecided-State Dynamics is $\Omega(\mathsf{md}(\bar{\mathbf{c}}))$ w.h.p.
'''
context = '''
It naturally induces a function $\mathsf{md}(\cdot)$, called the \emph{monochromatic distance},
which
equals the \emph{distance} between any configuration $\mathbf{c}$ and the target configuration:
\[
	\mathsf{md}(\mathbf{c}) \ = \ \sum_{i=1}^k \, \left(\frac{c_i}{c_{1}}\right)^2
\]
'''
notes = "Section 3.5 (middleage.tex), label thm:lowerbound. v1 and v2 have the same numbering and the same statement (latest version v2 used). Macros replaced: \\genc -> \\mathbf{c}, \\mdist -> \\mathsf{md}, \\threestate -> the text 'Undecided-State Dynamics' (paper: $\\textrm{Undecided-State Dynamics}$), \\m -> 1 in the context."

[[source]]
item = "undecided:thm:majority"
paper = "A. Clementi, M. Ghaffari, L. Gualà, E. Natale, F. Pasquale, G. Scornavacca. A tight analysis of the parallel undecided-state dynamics with two colors"
venue = "MFCS 2018"
version = "arXiv:1707.05135v3"
result = "Theorem 3.2"
page = 8
url = "https://arxiv.org/abs/1707.05135v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\gamma$ be any positive constant. Assume that the U-Process
starts at any biased configuration such that $\vert s \vert \geq \gamma\sqrt{n \log
n}$ and assume w.l.o.g. the majority color is \texttt{Alpha}. Then the process converges
to the monochromatic configuration with $a = n$ within $\mathcal{O}(\log n)$ rounds,
w.h.p. Furthermore, the result is almost tight in a twofold sense: (i) An
initial configuration exists, with $\vert s \vert = \Omega(\sqrt{n \log n})$, such
that the process requires $\Omega(\log n)$ rounds to converge w.h.p. and (ii)
there is an initial configuration with $\vert s \vert = \Theta(\sqrt{n})$ such that
the process converges to the minority color with constant probability.
'''
context = '''
It is convenient to give names also to two other quantities that will appear
often in the analysis: The number $q(\textbf{x}) = n - a(\textbf{x}) - b(\textbf{x})$ of undecided
nodes and the difference $s(\textbf{x}) = a(\textbf{x}) - b(\textbf{x})$ called the \textit{bias} of $\textbf{x}$.
'''
notes = "Theorem titled 'Plurality consensus' (label thm:mainmajority), Section 3. v2 and v3 number it Theorem 3.2; v1 has unnumbered-by-section theorems (Theorem 2). Latest version v3 used; the repo does not name a version. Macros replaced: \\threestateprocess -> the text 'U-Process' (paper: $\\textrm{U-Process}$), \\abs{s} -> \\vert s \\vert, \\colA -> \\texttt{Alpha}, \\bigO -> \\mathcal{O}, \\x -> \\textbf{x} in the context. Here a, b are the numbers of Alpha- and Beta-coloured nodes. The blueprint item also covers the SODA 2015 ratio form (no undecided nodes, a >= (1+alpha) b): the SODA 2015 paper (arXiv:1407.2565) has no separate two-colour theorem, so that form is its Theorem 11 with k = 2 (see the undecided:thm:plurality entry)."

[[source]]
item = "median:thm:expander"
paper = "C. Cooper, R. Elsässer, T. Radzik. The power of two choices in distributed voting"
venue = "ICALP 2014"
version = "arXiv:1404.7479v1"
result = "Theorem 4"
page = 5
url = "https://arxiv.org/abs/1404.7479v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be a $d$-regular $n$-vertex graph with
$\lambda = \lambda_G = 3/5 - \epsilon$.
Then, provided
the initial size of the minority vote $B$ is at most $(\epsilon/5)n$,
with high probability two-sample voting is completed in $O(\log n)$ steps and
the winner is the initial majority opinion~$A$.
'''
context = '''
We give a similar result for expanders, that is, for a $d$-regular graph $G$ with a small
second eigenvalue $\lambda_G = \max \{\lambda_2, |\lambda_n|\}$, where $\lambda_1 \geq \lambda_2
\geq \dots \geq \lambda_n$ are the eigenvalues of the transition matrix $P = (1/d)A$ of a random walk on
$G$ and $A$ is the adjacency matrix of $G$.
'''
notes = "Label phaseIIandIII-expander. Only one arXiv version exists. Macro replaced: \\l -> \\lambda. 'With high probability' is defined in a footnote of the introduction as 'with probability tending to 1 as n increases'. The paper adds that its theorems hold under an adversary that redistributes the opinions at the start of each step without changing their counts."

[[source]]
item = "median:thm:cer-theorem2"
paper = "C. Cooper, R. Elsässer, T. Radzik. The power of two choices in distributed voting"
venue = "ICALP 2014"
version = "arXiv:1404.7479v1"
result = "Theorem 2"
page = 5
url = "https://arxiv.org/abs/1404.7479v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be an $n$-vertex $d$-regular graph
and let opinions $A$ and $B$ be placed  on the vertices of $G$.
There is an absolute constant $K$ (independent of $d$ and  $\lambda_G$) such that, provided
\[ \nu_0 \; \ge \;  K \lambda_G,
\]
 with high probability two-sample voting is completed in $O(\log n)$ steps and
the winner is the opinion with the initial majority.
'''
context = '''
We give a similar result for expanders, that is, for a $d$-regular graph $G$ with a small
second eigenvalue $\lambda_G = \max \{\lambda_2, |\lambda_n|\}$, where $\lambda_1 \geq \lambda_2
\geq \dots \geq \lambda_n$ are the eigenvalues of the transition matrix $P = (1/d)A$ of a random walk on
$G$ and $A$ is the adjacency matrix of $G$.
'''
notes = "Label Th1-expanders. Only one arXiv version exists. Macro replaced: \\l -> \\lambda; a commented-out line inside the display (%\\min\\left\\{ K \\l_G, \\frac{6(3/5 - \\lambda_G)}{13}\\right\\} ,) was dropped. The initial imbalance is defined in Theorem 1 as $\\nu_0 = |A-B|/n$ (introduction: $\\nu_0 = (|A| -|B|)/n$). 'With high probability' = with probability tending to 1 as n increases (footnote in the introduction)."

[[source]]
item = "median:thm:tc-plurality"
paper = "R. Elsässer, T. Friedetzky, D. Kaaser, F. Mallmann-Trenn, H. Trinker. Rapid asynchronous plurality consensus (v1 to v4: Efficient k-party voting with two choices)"
venue = "arXiv:1602.04667"
version = "arXiv:1602.04667v5"
result = "Theorem 1.2"
page = 5
url = "https://arxiv.org/abs/1602.04667v5"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider the synchronous model. Let $G=K_{n}$ be the complete graph with $n$
nodes. Let $k=O\left(n^\varepsilon\right)$ be the number of opinions for some small
constant $\varepsilon > 0$. The Two-Choices plurality consensus process defined in
Algorithm~1 converges with high probability to $\mathcal{A}$ within $O\left({n}/{c_1} \cdot
\log{n}\right)$ rounds, if the initial bias is at least $c_1-c_2 \geq z \cdot
\sqrt{n\log{n}}$ for some constant $z$. Assuming this bias, the process
fulfills the stabilizing near-plurality conditions in presence of any
$F=c_1(c_1-c_2)/(8n)$-dynamic adversary.

Furthermore, if we assume that $c_1-c_2 = z \cdot \sqrt{n\log{n}}$ for some
constant $z$, and $c_j =c_2$ for any $j = 3, \dots , k$, then the Two-Choices protocol
requires $\Omega\left(n/c_1+\log n\right)$ rounds in expectation to converge.
'''
context = '''
W.l.o.g., we assume
that colors are ordered in descending order such that $c_1 \geq c_2 \geq \dots
\geq c_k$. We will denote the initial plurality color $\mathcal{C}_{1}$ as $\mathcal{A}$ with size $a =
c_1$ and we will use $\mathcal{B}$ to denote the second largest color $\mathcal{C}_{2}$ of size $b =
c_2$.
'''
notes = "v5 numbering, as named in median/README.md (label thm:main-result, Section 1.2 'Our Contributions'; theorem counter per section, Definition 1.1 precedes it). Macros replaced: \\TC -> Two-Choices, \\BigO{x} -> O\\left(x\\right), \\BigOmega{x} -> \\Omega\\left(x\\right), \\whp -> 'with high probability' (defined in a footnote as probability at least $1 - n^{-\\Omega(1)}$), \\A -> $\\mathcal{A}$, \\B -> $\\mathcal{B}$, \\C{j} -> $\\mathcal{C}_{j}$; \\autoref{alg:two-choices} rendered as Algorithm~1 (the PDF reads 'Algorithm 1'). Algorithm 1: every node samples u_1, u_2 in N(v) uniformly at random and adopts color(u_1) if color(u_1) = color(u_2). The stabilizing near-plurality conditions are Definition 1.1. Context is from Section 1.1 (Model)."

[[source]]
item = "voter:thm:bgkm-two"
paper = "P. Berenbrink, G. Giakkoupis, A.-M. Kermarrec, F. Mallmann-Trenn. Bounds on the voter model in dynamic networks"
venue = "ICALP 2016"
version = "arXiv:1603.01895v2"
result = "Theorem 1.1 (i)"
page = 3
url = "https://arxiv.org/abs/1603.01895v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider the Standard Voter model and in the dynamic graph model. Assume
$\kappa \leq n$  opinions are  arbitrarily distributed over the nodes of $G_1$.
Let $\phi_t$ be a lower bound on the conductance at time step $t$.
Let $b>0$ be a suitable chosen constant.
Then, with a probability of $1/2$ we
have that $T\le \min\{\tau,\tau'\}$, where
\begin{enumerate}[(i)]
\item $\tau$ is the first round so that
$\sum_{t=1}^\tau \phi_t \geq b \cdot m/d_{min}$. \emph{(part 1)}
\item  $\tau'$ is the first round so that $\sum_{t=1}^{\tau'} \phi_t^2 \geq b \cdot n \log n.$  \phantom{2}\emph{(part 2)}
\end{enumerate}
For static graphs ($G_{i+1}=G_i$ for all $i$), we have $T\leq \min \{m/(d_{min} \cdot \phi), n\log n/\phi^2\}$.
'''
context = '''
The consensus time $T$ is defined at the first time step at which all nodes have the same opinion.
[...] In every synchronous time step every node chooses a neighbour u.a.r. and adopts its opinion with probability $1/2$.
[...] The constraints are that each  graph $G_i$  has to have conductance $\phi_i$ and node $j$ has to have degree $d_j$ (the degrees of the nodes do not change over time).
[Section 2:] let $\lambda_{u}$ be the number of  neighbours of $u$ in $V\setminus S$. Let
 $\operatorname{vol}(S)=\sum_{u\in S} d_u.$
The \emph{conductance} of $G$ is defined as
$$\phi=\phi(G)=\min \left\{  \tfrac{\sum_{u \in U} \lambda_{u}
}{\operatorname{vol}(U)}\colon U\subset V \text{ with } 0 < \operatorname{vol}(U) \leq m\right\}.$$
'''
notes = "The theorem has one statement with two parts; this item is part (i) (the whole theorem is quoted). The item also formalizes Lemma 2.2 (next entry). Macros replaced: \\dmin -> d_{min}, \\vol -> \\operatorname{vol}, \\de -> d. LaTeX comments inside the statement dropped ('%generation' after 'dynamic graph', and a commented-out line). v1 has the same numbering; v2 (latest) fixes typos ('first rounds' -> 'first round') and adds '(part 1)', '(part 2)'."

[[source]]
