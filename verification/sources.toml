statement = '''
Let $G=(V,E)$ be a graph of maximum degree $d$, $\varepsilon >0$ be an
arbitrary positive number, $p < (1-\varepsilon)/(d-1)$  be a bond percolation  probability, and $I_0$ be a subset of $V$.
  Consider the percolation graph $G_p$.  Then,
w.h.p.,  all the connected components of $G_p$ have size $\mathcal{O}_{\varepsilon}(\log n)$.
'''
context = '''
As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
'''
notes = "Theorem title in the paper: 'Percolation on bounded-degree graphs'. Macro \\bigO replaced by \\mathcal{O}, \\Prc{.} by \\mathbf{Pr} \\left( . \\right). The context is the footnote of Theorem 2.1 defining w.h.p. The paper states the Reed-Frost consequence of Theorem 2.3 only informally ('we omit here the formal statement', end of Section 2), so for the item cor:subcritical this entry is the closest numbered result, not its exact source; the quantitative version (exp tail) is Theorem E.1. The repo cites the paper only via arXiv (it does not name a venue)."

