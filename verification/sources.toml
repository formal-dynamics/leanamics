# Source references and original statements of blueprint items.
#
# One [[source]] table per (item, numbered result of the source). Fields:
#   item       blueprint item id `<package>:<label>` (or `items = [...]` for several items)
#   paper      authors and title
#   venue      where it appeared
#   version    the version the statement was transcribed from (e.g. arXiv:1310.2858v2)
#   result     the numbering in that version (Theorem 3.8, Lemma C.1, ...)
#   page       page of that version's PDF where the statement starts (optional)
#   url        link to that version (optional)
#   status     how the statement was obtained, e.g. "transcribed from the arXiv LaTeX source,
#              not yet compared with the PDF"; update it when someone compares it with the PDF
#   statement  the original statement, verbatim (LaTeX; statement only, no proof)
#   context    verbatim definitions the statement depends on (optional)
#   notes      macros replaced, numbering differences between versions, typos kept (optional)
#
# The hash of an item's source side includes version, result, statement and context, so
# editing them makes earlier checks of the item stale. The checker reads this file with
# Python's tomllib; `python3 scripts/check_statements.py --validate` checks it.
#
# The entries below were transcribed by an AI agent from the arXiv LaTeX sources (macros of
# the papers replaced by standard LaTeX, as listed in `notes`). None has been compared with the
# PDF yet. Further entries, per package, are in `verification/sources/<package>.toml`.

# Group 1: package plurality (SPAA 2014, PODC 2017, SODA 2016) and median:thm:tc-lower-strong.

[[source]]
item = "plurality:thm:3_8"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Theorem 3.8"
page = 14
url = "https://arxiv.org/abs/1310.2858v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
[the general upper bound]
Let $\lambda$ be any value such that  $ 3  \leqslant  \lambda <  \sqrt{n}$. If $\overline{c}$ is a $k$-cd such that, for some $m \in [k]$,
$M(\overline{c}) = \{m\}$, $c_m \geqslant n / \lambda $, and $s(\overline{c}) \geqslant 22\sqrt{\lambda \, n \log n}$, then
w.h.p. the 3-majority protocol converges to color $m$ in $\mathrm{O}\left(\lambda \, \log n \right)$ time.
'''
context = '''
A \emph{$k$-color distribution}, \emph{$k$-cd} for short, is any $k$-tuple $\overline{c} = (c_1,\ldots, c_k)$ such that $c_j$s are non negative integers and $\sum_{j=1,\ldots,k} c_j = n$.
[Section 3:] For a $k$-cd $\overline{c}$, we define
\begin{align*}
& m(\overline{c}) = \max_{h\in [k]} c_h\\
& M(\overline{c}) = \left\{ j \in [k] \;\left|\; c_j = m(\overline{c}) \right.\right\}\\
& s(\overline{c}) = \left\{ \begin{array}{ll}
m(\overline{c})- \max_{h \in [k] - M(\overline{c})} & \mbox{if $|M(\overline{c})| = 1$}\\
0 & \mbox{otherwise}
\end{array}\right.
\end{align*}
'''
notes = "arXiv v1 and v2 use the SPAA 2014 numbering (v3 is the journal version, where Theorem 3.8 and Corollaries 3.10-3.12 become Theorem 3.1 and Corollaries 3.2-3.4); the section files of v1 and v2 are identical (only abstract, introduction and conclusions differ), so v1 has the same statement on the same page. The optional theorem title is shown in brackets. The definition of s(c) is quoted verbatim, including the source's missing c_h after the max (the paper later uses s(c) = m(c) - max_{h in [k]-{m}} c_h). No paper macros in the statement."

[[source]]
item = "plurality:cor:3_10"
paper = "L. Becchetti, A. Clementi, E. Natale, F. Pasquale, R. Silvestri, L. Trevisan. Simple dynamics for plurality consensus"
venue = "SPAA 2014"
version = "arXiv:1310.2858v2"
result = "Corollary 3.10"
page = 16
url = "https://arxiv.org/abs/1310.2858v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
If  $\overline{c}$ is a $k$-cd such that, for some $m \in [k]$,  $M(\overline{c}) = \{m\}$ and
\[
s(\overline{c}) \geqslant 22\sqrt{\min\left\{2k,\; \sqrt[3]{\frac{n}{\log n}}\right\}n\log n}
\]
then, w.h.p. the 3-majority protocol converges to color $m$ in $\mathrm{O}\left(\min\left\{2k,\; \sqrt[3]{\frac{n}{\log n}}\right\}\log n\right)$ time.
'''
context = '''
Corollary~3.10 is obtained by setting
 $\lambda = \min\left\{ 2k,\; \sqrt[3]{\frac{ n}{\log n}}\right\}$ and it provides a bound which does not assume any condition on $c_m$.
'''
notes = "Same numbering in arXiv v1 and v2 (SPAA numbering). k-cd, M(c), s(c) as in Theorem 3.8 (see the plurality:thm:3_8 entry). Context quoted from the sentence before the corollary, with the \\ref replaced by its number."

