item = "epidemics:thm:swg-sub"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Theorem 2.1 (claim 2)"
page = 4
url = "https://arxiv.org/abs/2103.16398v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $V$ be a set of $n$ vertices and $p>0$ be a bond percolation  probability. For any constant
$c>0$,  sample a graph $G=(V, E_1 \cup E_2)$ from the $\mathcal{SWG}(n,c/n)$ distribution, and consider the percolation graph $G_p$. For any constant $\varepsilon>0$:
\begin{enumerate}
\item If $p>\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} + \varepsilon$,  w.h.p.
      a subset of nodes of size $\Omega_\varepsilon(n)$ exists
      that induces   a   subgraph  of $G_p$ having  diameter $\mathcal{O}_{\varepsilon}(\log n)$;
\item If  $p<\frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon$,  w.h.p.  all the connected components of  $G_p$ have size $\mathcal{O}_{\varepsilon}(\log n)$.
\end{enumerate}
'''
context = '''
As usual, we say that an event
$\mathcal{E}_n$ occurs \emph{with high probability} if $\mathbf{Pr} \left( \mathcal{E}_n \right)
\geq 1-(1/n)^{\Omega(1)}$.
'''
notes = "Full statement of Theorem 2.1 ('Percolation on the SWG(n,q) model'); the formalized part is claim 2 (item 2). The footnote defining w.h.p. (attached to 'w.h.p.' in item 1) is moved to context. Macros replaced: \\SWGm -> \\mathcal{SWG}, \\bigO -> \\mathcal{O}, \\Prc{.} -> \\mathbf{Pr} \\left( . \\right). The blueprint item also cites Lemma C.1 (separate entry below), which is what the formal statement follows. The repo cites v3 explicitly; v3 is the latest arXiv version."

[[source]]
item = "epidemics:thm:swg-sub"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Lemma C.1"
page = 32
url = "https://arxiv.org/abs/2103.16398v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $V$ be a set of $n$ nodes. For every $\varepsilon>0$, $c>0$ and for every
contagion probability $p$ such that
\[
0 \, \leq \, p \, \leq \, \frac{\sqrt{c^{2} + 6c +1}-c-1}{2c} - \varepsilon
\]
there is a positive constant $\beta$ that depends only on $c$ and $\varepsilon$
such that the following holds. Sample a graph $G=(V,E)$ according to the
$\mathcal{SWG}(n,c/n)$ distribution, and let $G_p$ be the percolation graph of
$G$ with parameter $p$. If $n$ is sufficiently large, with probability at least
$1 - 1/n$ with respect to the randomness of $G$ and the randomness of $G_p$,
$G_p$ contains no connected component of size exceeding $\beta \log n$.
'''
notes = "Secondary source of the item (the blueprint title is 'Lemma C.1 and Theorem 2.1, claim 2'). No paper macros in the statement."

[[source]]
item = "epidemics:thm:perc"
paper = "L. Becchetti, A. Clementi, R. Denni, F. Pasquale, L. Trevisan, I. Ziccardi. Percolation and Epidemic Processes in One-Dimensional Small-World Networks"
venue = "arXiv preprint"
version = "arXiv:2103.16398v3"
result = "Theorem A.3"
page = 19
url = "https://arxiv.org/abs/2103.16398v3"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider the bond percolation process and the   $\mathrm{IC}$ protocol   on the same graph $G=(V,E)$ and
let $I_0 = A_0 = V_0$, where $V_0$ is any fixed subset of $V$, and with
transmission probabilities and percolation probabilities equal to $\{ p(e) \}_{e\in
E}$.

Then,  for every integer $t \geq 1$ and for every subsets $V_1, \dots, V_{t-1}
\subseteq V$, the events $\{I_0 = V_0, \dots, I_{t-1} = V_{t-1}\}$ and $\{A_0 =
V_0, \dots, A_{t-1} = V_{t-1}\}$ have either both zero probability   or
non-zero probability, and, in the latter case, the  distribution of the
infectious set $I_{t}$,  conditional to the event $\{I_0 = V_0, \dots, I_{t-1}
= V_{t-1}\}$, is   the same  to that of  the $t$-active set $A_t$, conditional
to the event  $\{A_0 = V_0, \dots, A_{t-1} = V_{t-1}\}$.
'''
context = '''
Definition A.1 (The Bond Percolation process). Given a graph $G = (V,E)$, and given, for every edge $e \in E$, a
\emph{percolation probability} $p(e) \in [0,1]$, the \emph{bond percolation}  process consists to
\emph{remove} each edge $e \in E$, independently, with probability $1-p(e)$.
The random subgraph, called the \emph{percolation graph} $G_p=(V,E_p)$, is
defined by the edges that are not removed (i.e. they are activated), i.e., $E_p = \{ e \in E \, : \,
\mbox{edge $e$ is not removed} \}$. Given an initial subset $A_0 \subseteq V$ of
\emph{active} nodes, for every integer $t \leq n-1$, we define the random
subset $A_{t}$ of  $t$-active nodes as the subset of nodes that are at distance
$t$ from $A_{0}$ in the percolation graph $G_p=(V,E_p)$, i.e., $A_{t} =
N_{G_{p}}^{t}(A_{0})$. Finally, the subset of all active nodes from $A_{0}$ is
the subset $N^*_{G_p}(A_0)$.
'''
notes = "Theorem title in the paper: 'Bond percolation and IC processes are equivalent, [KKT15]' (Kempe, Kleinberg, Tardos). Macro \\IC replaced by $\\mathrm{IC}$. The IC protocol (Definition A.2, of which Reed-Frost is the special case with equal transmission probabilities) is too long to quote here. The blueprint label of this item is thm:perc."

[[source]]
item = "epidemics:thm:path"
paper = "M. Krivelevich, B. Sudakov. The phase transition in random graphs: a simple proof"
venue = "Random Structures & Algorithms 43 (2013)"
version = "arXiv:1201.6529v4"
result = "Theorem 1 (2)"
page = 4
url = "https://arxiv.org/abs/1201.6529v4"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $\epsilon>0$ be a small enough constant. Let $G\sim G(n,p)$.
\begin{enumerate}
\item Let $p=\frac{1-\epsilon}{n}$. Then \textbf{whp} all connected
components of $G$ are of size at most $\frac{7}{\epsilon^2}\ln n$.
\item Let $p=\frac{1+\epsilon}{n}$. Then \textbf{whp} $G$ contains a path of
length at least $\frac{\epsilon^2 n}{5}$.
\end{enumerate}
'''
context = '''
We say that an event  $\mathcal{E}_n$ occurs with high
probability, or \textbf{whp} for brevity, in the probability space $G(n,p)$
if $\lim_{n\rightarrow\infty}Pr[G\sim G(n,p)\in \mathcal{E}_n]=1$.
'''
notes = "Full statement of Theorem 1; the formalized part is item 2. Macro \\whp ({\\bf whp}) replaced by \\textbf{whp}, {\\cal E} by \\mathcal{E}. Context is the footnote of the introduction defining whp. The repo names no arXiv version; v4 (latest) is used, and its numbering matches the repo's."

[[source]]
item = "epidemics:thm:giant"
paper = "M. Krivelevich, B. Sudakov. The phase transition in random graphs: a simple proof"
venue = "Random Structures & Algorithms 43 (2013)"
version = "arXiv:1201.6529v4"
result = "Theorem 2"
page = 5
url = "https://arxiv.org/abs/1201.6529v4"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $p=\frac{1+\epsilon}{n}$, for $\epsilon>0$ a small enough
constant. Let $G\sim G(n,p)$. Then \textbf{whp} $G$ has a connected
component with at least $\frac{\epsilon n}{2}$ vertices.
'''
context = '''
We say that an event  $\mathcal{E}_n$ occurs with high
probability, or \textbf{whp} for brevity, in the probability space $G(n,p)$
if $\lim_{n\rightarrow\infty}Pr[G\sim G(n,p)\in \mathcal{E}_n]=1$.
'''
notes = "Macro \\whp replaced by \\textbf{whp}, {\\cal E} by \\mathcal{E}. The repo names no arXiv version; v4 (latest) is used, and its numbering matches the repo's. The blueprint item's second claim (a linear component for every epsilon > 0) has no counterpart in this theorem, which assumes epsilon small."

[[source]]
item = "epidemics:thm:duality"
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Theorem 4"
page = 5
url = "https://arxiv.org/abs/1602.05768v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be a connected regular graph and consider the COBRA and BIPS processes on $G$ with parameter $k \ge 1$.
For each $v \in V$, $C \subseteq V$ and $t \geq 0$ we have
$$\widehat{\mathbf{P}}(\mathrm{Hit}_C(v)> t| C_0 = C) \;\; = \; \; \mathbf{P}(C \cap  A_t = \emptyset| A_0 = v).$$
'''
context = '''
For a connected graph $G=(V,E)$, denote $\mathrm{Hit}_C(v) = \min\{t: v \in C_t, C_0=C\}$ the hitting time of vertex $v$ for a COBRA process starting from $C$.
In particular, $\mathrm{Hit}_u(v)$ is the hitting time of $v$ starting from $u$. [...]
\begin{equation}
\mathbf{P}(\mathrm{Hit}_u(v)> t) = \mathbf{P}(u \not \in A_t | A_0 = \{ v\} ).  \tag{2}
\end{equation}
[...] To avoid confusion, we use the notation $\mathbf{P}( \cdot)$ for probabilities in the BIPS process, and
$\widehat{\mathbf{P}}(\cdot)$ in the COBRA process.
To simplify notation, we will write ``$A_0 = v$'' for the frequently appearing condition ``$A_0 = \{ v \}$.''
'''
notes = "Macros replaced: \\Prob (\\mbox{{\\bf P}}) -> \\mathbf{P}, \\wh -> \\widehat, \\Hit -> \\mathrm{Hit}, \\COBRA/\\BIPS -> COBRA/BIPS. Context quotes Section 1 (definition of Hit and equation (2), label bkp09e23; the \\tag{2} is added to show its number) and Section 2 (notation). The repo names no arXiv version; v2 (latest) is used, and its numbering matches the repo's."

[[source]]
item = "epidemics:thm:crr-cobra"
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Theorem 1"
page = 3
url = "https://arxiv.org/abs/1602.05768v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be a connected regular $n$-vertex graph with
$1-\lambda\gg \sqrt{(\log n)/n}$. \footnote{%
$(1-\lambda) \ge  C\sqrt{(\log n)/n}$ for some suitably large constant $C$.}
Let
\begin{eqnarray*}
T= \frac{\log(n)}{(1-\lambda)^3}.
\end{eqnarray*}
Let $\mathrm{COV}(G)=\max_{u \in V} \mathrm{COV}(u)$ be the cover time of $G$ by a COBRA process with branching factor $k=2$. Then $COV(G)=\mathcal{O}(T)$ and for all $u \in V$, w.h.p. $\mathbf{cov}(u)=\mathcal{O}(T)$.
'''
context = '''
Let
$\lambda=\lambda_{\max}=\max_{i=2,...,n} |\lambda_i|$ be the second largest eigenvalue (in absolute value). [...]
For $C_0 = \{ u \}$, let $\mathbf{cov}(u) = \min\{ T: \bigcup_{t=1}^{T} C_t = V\}$
be the number of steps needed for the COBRA process
to visit all vertices of the graph $G$ starting from vertex $u$; and let $\mathrm{COV}(u) = \mathbf{E}(\mathbf{cov}(u))$.
'''
notes = "Macros replaced: \\COV -> \\mathrm{COV}, \\cov -> \\mathbf{cov}, \\COBRA -> COBRA, \\bigO -> \\mathcal{O}, \\E -> \\mathbf{E}, \\l -> \\lambda. '$COV(G)' (without backslash) is verbatim from the source. lambda is defined for the random-walk transition matrix P = A(G)/r. The repo names no arXiv version; v2 (latest) is used, and its numbering matches the repo's."

[[source]]
item = "epidemics:thm:crr-bips"
paper = "C. Cooper, T. Radzik, N. Rivera. The coalescing-branching random walk on expanders and the dual epidemic process"
venue = "PODC 2016"
version = "arXiv:1602.05768v2"
result = "Theorem 2"
page = 3
url = "https://arxiv.org/abs/1602.05768v2"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Let $G$ be a connected $n$-vertex $r$-regular graph with $1-\lambda \gg \sqrt{(\log n)/n}$. Then  for every
$v \in V$, the infection time, $\mathbf{infec}(v)$, by a BIPS process with $k=2$ satisfies $\mathbf{infec}(v) = \mathcal{O}(\log(n)/(1-\lambda)^3)$ in expectation and with probability at least $1-\mathcal{O}(1/n^3)$. Moreover $\mathrm{Infec}(G)= \mathcal{O}(\log(n)/(1-\lambda)^3)$.
'''
context = '''
If we define $\mathbf{infec}(v)$ as the first time when all vertices are infected when the source is $v$,
 $\mathrm{Infec}(v) = \mathbf{E}(\mathbf{infec}(v))$, and $\mathrm{Infec}(G)= \max_{u \in V} \mathrm{Infec}(v)$, then we have the analogue theorem of Theorem 1.
'''
notes = "Macros replaced: \\inf -> \\mathbf{infec}, \\INF -> \\mathrm{Infec}, \\BIPS -> BIPS, \\bigO -> \\mathcal{O}, \\E -> \\mathbf{E}. The footnote of Theorem 1 reads '$(1-\\lambda) \\ge C\\sqrt{(\\log n)/n}$ for some suitably large constant $C$'. The repo names no arXiv version; v2 (latest) is used, and its numbering matches the repo's."

[[source]]
item = "epidemics:thm:rumor-growth"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Theorem 21"
page = 19
url = "https://arxiv.org/abs/2303.11150v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider a homogeneous epidemic protocol satisfying the upper exponential growth conditions in $[1,fn[$.
Then there exist constant $A', \alpha'$ such that
\begin{eqnarray*}
	&& \mathbb{E}[T(1, fn)] \le \log_{1+\gamma_n} n + O(1), \\
	&& \mathbb{P}[T(1,fn) > \log_{1+\gamma_n} n + r] \le A' e^{-\alpha' r} \, \mbox{for any $r \in N$}.
\end{eqnarray*}
'''
context = '''
Definition 9 (upper exponential growth conditions). Let $\gamma_n$ be bounded between two positive constants.
Let $a, b, c \ge 0$ and $0 < f < 1$ with $af<1$.
We say that a homogeneous epidemic protocol satisfies the \emph{upper exponential growth conditions} in $[1,fn[$ if for any $n \in \mathbb{N}$ big enough the following properties are satisfied for any $k < fn$.
(i) $p_k \ge \gamma_n \tfrac{k}{n} \cdot \left(1- a\tfrac{k}{n} - \tfrac{b}{\ln n}\right)$.
(ii) $c_k \le c\tfrac{k}{n^2}$.

Definition 8 (Rumor spreading times). Consider a homogeneous rumor spreading process. For all $t = 0, 1, \dots$ denote by $I_t$ the number of informed nodes at the end of the $t$-th round ($I_0 := 1$). Let $k \le m \le n$. By $T(k,m)$ we denote the time it takes to increase the number of informed nodes from $k$ to $m$ or more, that is,
\[ T(k,m) = \min\{ t-s | I_s = k \operatorname{ and } I_t \ge m \}. \]
We call $T(1,n)$ the rumor spreading time of the process.
'''
notes = "Theorem title in the paper: 'upper bound for the spreading time'. Macros replaced: \\Expect -> \\mathbb{E}, \\Pr (redefined by the paper) -> \\mathbb{P}, \\Pk -> p_k, \\Ck -> c_k, \\N -> \\mathbb{N}. The source writes '$r \\in N$' (plain N) in the statement. Context: Definitions 9 and 8 (page 19 and 17), enumerate environment flattened to (i), (ii). p_k is the probability that an uninformed node becomes informed in a round starting with k informed nodes, c_k the covariance number (Definitions 6, 7). Only arXiv version: v1."

[[source]]
item = "epidemics:thm:rumor-shrinking"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Theorem 31"
page = 28
url = "https://arxiv.org/abs/2303.11150v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider a homogeneous epidemic protocol satisfying the upper exponential shrinking conditions.
Then there are constant $A', \alpha' > 0$ such that
\begin{eqnarray*}
	&& \mathbb{E}[T(n-\lfloor g n \rfloor, n)] \le \tfrac1{\rho_n}\ln n + O(1), \\
	&& \mathbb{P}[T(n-\lfloor g n \rfloor, n) > \tfrac1{\rho_n}\ln n + r] \le A' e^{-\alpha r}\,
		\mbox{ for all $r \in \mathbb{N}$}.
\end{eqnarray*}
'''
context = '''
Definition 11 (upper exponential shrinking conditions). Let $\rho_n$ be bounded between two positive constants.
Let $0 < g < 1$ and $a, c \in \mathbb{R}_{\ge0}$ such that $e^{-{\rho_n}} + ag < 1$.
We say that a homogeneous epidemic protocol satisfies \emph{the upper exponential shrinking conditions} if for any $n \in \mathbb{N}$ big enough, the following properties are satisfied, for all $u = n-k \le gn$.
(i) $1-p_k = 1-p_{n-u} \le e^{-{\rho_n}} + a\frac{u}{n}$;
(ii) $c_k = c_{n-u} \le \frac{c}{u}$.
'''
notes = "Theorem title in the paper: 'upper bound for spreading time'. The tail bound is written $A' e^{-\\alpha r}$ (alpha without prime) in the source although the constants introduced are $A', \\alpha'$. Macros replaced: \\Expect -> \\mathbb{E}, \\Pr (redefined by the paper) -> \\mathbb{P}, \\N -> \\mathbb{N}, \\R -> \\mathbb{R}. Context: Definition 11 (page 27), enumerate flattened. T(k,m) as in Definition 8 (see the rumor-growth entry)."

[[source]]
item = "epidemics:thm:rumor-double"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Theorem 43"
page = 35
url = "https://arxiv.org/abs/2303.11150v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Consider a homogeneous epidemic protocol satisfying the upper double exponential shrinking conditions in $[n^{-\alpha},g]$.
Suppose further that there exists $\tau > 0$ such that $1-p_{n-u} \le n^{-\tau}$ for all $u \le n^{1-\alpha}$.

Then there exist constant $A', \alpha' > 0$ such that
\begin{eqnarray*}
	&& \mathbb{E}[T(\lceil (1-g)n \rceil,n)] \le \log_\ell \ln n + O(1), \\
	&& \mathbb{P}[T(\lceil (1-g)n \rceil,n) \ge \log_\ell \ln n + r] \le O(n^{-\alpha' r+A'})\, \mbox{ for all $r \in \mathbb{N}$}.
\end{eqnarray*}
'''
context = '''
Definition 13 (upper double exponential shrinking conditions). Let $g, \alpha \in [0,1]$, $\ell > 1$, and $a, c \in \mathbb{R}_{\ge0}$ such that $ag^{\ell-1} < 1$.
We say that a homogeneous epidemic protocol satisfies \emph{the upper double exponential shrinking conditions}
if for any $n$ big enough, the following properties are satisfied for all $u \in [n^{1-\alpha}, gn]$.
(i) $1-p_{n-u} \le a\left(\tfrac{u}{n}\right)^{\ell-1}$.
(ii) $c_{n-u} \le c \tfrac{n}{u^2}$.
'''
notes = "Untitled theorem in the paper. Macros replaced: \\Expect -> \\mathbb{E}, \\Pr (redefined by the paper) -> \\mathbb{P}, \\N -> \\mathbb{N}, \\R -> \\mathbb{R}. Context: Definition 13 (page 34), enumerate flattened. T(k,m) as in Definition 8 (see the rumor-growth entry)."

[[source]]
item = "epidemics:thm:rumor-protocols"
paper = "B. Doerr, A. Kostrygin. Randomized rumor spreading revisited"
venue = "ICALP 2017 (long version arXiv:2303.11150)"
version = "arXiv:2303.11150v1"
result = "Theorems 51, 52, 53"
page = 39
url = "https://arxiv.org/abs/2303.11150v1"
status = "transcribed from the arXiv LaTeX source, not yet compared with the PDF"
statement = '''
Theorem 51. The expected rumor spreading time of the push protocol on the complete graph with $n$ vertices is $\log_2 n + \ln n \pm O(1)$.

Theorem 52. The expected rumor spreading time of the pull protocol on the complete graph with $n$ vertices is $\log_2 n + \log_2 \ln n \pm O(1)$.

Theorem 53. The expected rumor spreading time of the push-pull protocol on the complete graph with $n$ vertices is $\log_3n + \log_2\ln n \pm O(1)$.
'''
notes = "One entry with all three statements (each is one sentence); the labels 'Theorem 51.' etc. are added to separate them. Theorem 51 is on page 39, Theorems 52 and 53 on page 41. The paper states these as expected times only (no tail bounds); the blueprint item covers the upper halves (with tails), the lower halves are in the separate lower-bound section."

