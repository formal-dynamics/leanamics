  # ---------------------------------------------------------------------------------------------
  - id: daley-kendall
    group: spreading
    title: Rumour models with stifling
    dc:
      name: Rumor mongering with feedback loss of interest
      description: >-
        Demers et al.'s rumor mongering: "When an active individual makes an unnecessary phone
        call (the recipient already knows the rumor), then with probability $1/k$ the active
        individual loses interest in sharing the rumor"; in their mean-field equations the residue
        (sites never reached) solves $s = e^{-(k+1)(1-s)}$, about 20% for $k = 1$ (their
        simulation on 1000 sites, in cycles, gives 18%).
      refs: [DemersEtAl1987]
    popgen:
      none: No counterpart.
    epi:
      name: Daley–Kendall and Maki–Thompson rumour models
      description: >-
        Ignorants, spreaders and stiflers: a spreader meeting an ignorant makes it a spreader, a
        spreader meeting a stifler becomes a stifler, and when two spreaders meet both become
        stiflers (Daley–Kendall) or only the initiator does (Maki–Thompson). The fraction never
        hearing the rumour tends to $0.203$.
      refs: [DaleyKendall1964, DaleyKendall1965, MakiThompson1973, Sudbury1985]
    crn:
      name: 'Daley–Kendall: $X + Y \to 2Y$, $2Y \to 2Z$, $Y + Z \to 2Z$'
      description: >-
        Common rate constant (propensities $XY$, $\binom{Y}{2}$, $YZ$); Maki–Thompson replaces
        $2Y \to 2Z$ by $2Y \to Y + Z$ with propensity $Y(Y-1)$.
      refs: [LebensztaynRodriguez2025]
    physics:
      none: No counterpart found.
    social:
      none: >-
        No separate counterpart found: the rumour models of the epidemiology column are
        themselves the classical models of this social phenomenon.
    relation:
      kinds: [same-ctmc, mean-field]
      statement: >-
        The Daley–Kendall model is the stochastic mass-action chain of its network, and the
        continuous-time Maki–Thompson model that of its own. Demers et al.'s feedback–coin rule
        with $k = 1$ is Maki–Thompson's rule (the calling spreader stops after reaching a site
        that already knows), and their mean-field residue $s = e^{-2(1-s)}$ has the root $0.2032$,
        the limit of both rumour models.
      conditions:
        - Well mixed.
        - >-
          Demers et al. do not cite Daley–Kendall or Maki–Thompson; the identification of their
          rule with Maki–Thompson's is ours, and so is the writing of both models as reaction
          networks, from their transition rates (as tabulated by Lebensztayn and Rodriguez). The original Maki–Thompson model is in discrete time;
          the continuous-time chain is its modern restatement.
      refs: [LebensztaynMachadoRodriguez2011, LebensztaynRodriguez2025, Sudbury1985, DemersEtAl1987]
    leanamics:
      status: roadmap
      summary: >-
        Not formalized; the Daley–Kendall limit is listed as remaining work of CRN-2, whose law of
        large numbers covers the SIR network.
      correspondence: []
      results: []
      packages: []
      blueprint: []
      roadmap: [CRN-2]
    paper:
      dc: 'rumor mongering (feedback)'
      popgen: '--'
      epi: 'Daley--Kendall rumours'
      crn: '$X{+}Y\to 2Y$, $2Y\to 2Z$, $Y{+}Z\to 2Z$'
      physics: '--'
      social: '--'
      relation: 'CTMC; mean field'
      cite:
        dc: [DemersEtAl1987]
        epi: [DaleyKendall1965]

  # ---------------------------------------------------------------------------------------------
  - id: cobra-bips
    group: spreading
    title: COBRA walk and the BIPS epidemic
    dc:
      name: Coalescing-branching random walk (COBRA)
      description: >-
        Synchronous: every vertex holding the token sends it to $k$ neighbours drawn uniformly
        with replacement; tokens arriving at the same vertex coalesce.
      refs: [DuttaEtAl2013, DuttaEtAl2015, CooperRadzikRivera2016]
    popgen:
      none: No counterpart.
    epi:
      name: BIPS (biased infection with persistent source)
      description: >-
        "A discrete epidemic process of the SIS (Susceptible-Infected-Susceptible) type": the
        source $v$ stays infected, and every other vertex samples $k$ neighbours and is infected
        in the next round iff one of them is infected now.
      refs: [CooperRadzikRivera2016]
    crn:
      none: Synchronous rounds.
    physics:
      none: >-
        No exact counterpart: Cooper, Radzik and Rivera call COBRA "a discrete version of the
        contact process", the continuous-time SIS model of interacting particle systems, but "a
        contact process can die out, whereas the COBRA one does not", and no identity between the
        two is stated.
    social:
      none: No counterpart found.
    relation:
      kinds: [duality]
      statement: >-
        $\Pr(\text{COBRA from } C \text{ has not visited } v \text{ by time } t) =
        \Pr(C \cap A_t = \emptyset \mid A_0 = \{v\})$ for every set $C$, vertex $v$ and time $t$,
        where $A_t$ is BIPS with source $v$ (Cooper, Radzik and Rivera, Theorem 4, proved by
        induction on $t$); pathwise, the two events coincide along reversed rounds (the form
        proved in the library).
      conditions:
        - Same $k$ and the same neighbour sampling in both processes.
        - >-
          The source states it for connected regular graphs; neither hypothesis is needed, only a
          neighbour for every vertex to sample.
        - >-
          The identity is about the BIPS state at time $t$; BIPS infection is not monotone, so it
          does not equate the COBRA hitting time with a first infection time of BIPS.
      refs: [CooperRadzikRivera2016]
    leanamics:
      status: proved
      summary: >-
        The duality on every finite graph and for every $k$, pathwise and by time reversal of
        i.i.d. rounds (EPI-4). As a duality of kernels (`Dynamics.Kernel.Dual`), when rounds
        exist (every vertex has a neighbour to sample), COBRA stopped when it visits $v$ and BIPS
        with source $v$, on the sets that contain $v$, are dual with respect to
        $1\{C \cap A = \emptyset\}$ (`Epidemics.cobra_bips_dual`), which gives the theorem again
        by the Markov property, as in the source's induction on $t$. The COBRA cover time and the
        BIPS infection time on regular expanders.
      correspondence:
        - Epidemics.cobra_bips_duality
        - Epidemics.cobra_bips_duality_singleton
        - Epidemics.cobra_hit_iff_bips_reverse
        - Epidemics.cobra_bips_dual
        - Epidemics.cobra_bips_duality_hitProb
      results:
        - Epidemics.cobra_cover_time
        - Epidemics.bips_infection_time
        - Epidemics.cobra_cover_time_branching
      packages: [epidemics]
      blueprint:
        - /epidemics/blueprint/#sec:crr-cobra-bips
        - /epidemics/blueprint/#thm:duality-kernels
        - /epidemics/blueprint/#sec:crr-cover
      roadmap: [EPI-4]
    paper:
      dc: 'COBRA walk'
      popgen: '--'
      epi: 'BIPS (SIS type)'
      crn: '--'
      physics: '--'
      social: '--'
      relation: 'dual'
      cite:
        dc: [DuttaEtAl2013]
        epi: [CooperRadzikRivera2016]

paper_caption: >-
  The same processes under different names (--: no counterpart). Relation: \emph{same chain}
  (same transition kernel); \emph{jump chain} (same chain once idle steps are removed, a random
  time change that preserves absorption probabilities); \emph{CTMC} (same continuous-time chain
  up to a constant time factor); \emph{dual} (duality); \emph{coupling} (pathwise);
  \emph{limit} (large population); \emph{same recursion} (same deterministic system);
  \emph{mean field} (same expected one-step map); a field name restricts a relation to its
  column. CRN counterparts exist only on $K_n$ and for sequential dynamics: a CRN is well mixed and
  fires one reaction at a time. Lean: \checkmark{} correspondence proved; partial: part of it;
  def.: one definition under both names; results: results on the columns only; roadmap: a
  roadmap target, not formalized yet; none: not formalized, not a roadmap target. Conditions and
  references for every cell: project website.

