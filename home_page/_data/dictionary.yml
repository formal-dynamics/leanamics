  # ---------------------------------------------------------------------------------------------
  - id: population-protocols
    group: protocols
    title: Population protocols and bimolecular reaction networks
    dc:
      name: Population protocols
      description: >-
        Anonymous finite-state agents; one ordered pair of distinct agents interacts per step
        (uniformly at random in the probabilistic model) and both update by a transition
        function. Examples formalized here: exact majority with four states on any connected
        graph (the ambassador protocol, which on $K_n$ has the count chain of binary interval
        consensus) and deterministic plurality protocols.
      refs: [AngluinEtAl2006, AngluinEtAl2007, MertziosEtAl2014, BenezitThiranVetterli2009, AlistarhAspnesGelashvili2018, GasieniecEtAl2016]
    popgen:
      none: >-
        No general counterpart; individual protocols on $K_n$ are Moran-type models (the copying
        rows).
    epi:
      none: >-
        No general counterpart; the SI epidemic and the Daley–Kendall and Maki–Thompson rumour
        models are instances (spreading rows), while the removal $I \to R$ of the SIR epidemic
        involves a single agent.
    crn:
      name: Stochastic CRNs whose reactions have two reactants and two products
      description: Mass-action kinetics with a common rate constant, in a volume proportional to $n$.
      refs: [Doty2014, ChenDotySoloveichik2014, DotyEftekhari2021, SoloveichikEtAl2008]
    physics:
      none: >-
        No general counterpart beyond the chemistry column: on $K_n$ a population protocol is a
        well-mixed system of pairwise reactions; the kinetic exchange model of row
        approximate-majority is one instance.
    social:
      none: No counterpart found.
    relation:
      kinds: [jump-chain, same-ctmc]
      statement: >-
        The uniformly random pair model "coincides precisely with the model of stochastic chemical
        kinetics, so long as the CRN's reactions each have two reactants and two products"
        (Doty). A uniformly random ordered pair of distinct agents has species $\{A, B\}$ with
        probability $x_A x_B/\binom{n}{2}$, or $\binom{x_A}{2}/\binom{n}{2}$ if $A = B$,
        proportional to the propensity, so the protocol conditioned on the pair reacting is the
        jump chain of the network, on count vectors; unequal rate constants correspond to a
        weighted scheduler. Population protocols stably compute exactly the semilinear
        predicates, hence so do these networks.
      conditions:
        - Common rate constant; Gillespie's propensity $k\binom{x_A}{2}$ for $A + A$.
        - >-
          Several reactions with the same reactants (or probabilistic outcomes) need a randomized
          or initiator/responder protocol; deterministic one-way protocols such as approximate
          majority use the asymmetry of the pair.
        - Complete interaction graph; protocols on other graphs have no CRN counterpart.
      refs: [Doty2014, DotyEftekhari2021, Gillespie1977, AngluinEtAl2006, AngluinEtAl2007]
    leanamics:
      status: proved
      summary: >-
        The jump chain of mass-action kinetics equals the protocol conditioned on reacting
        (CRN-1): the protocol on count vectors and the network have the same jump chain
        (`Crn.ppStepKernel_sameJumpChain`, a `Dynamics.Kernel.SameJumpChain`). The easy direction
        of stable computation (CRN-3): Boolean combinations of threshold and remainder predicates
        are stably computable, hence stably decided by such networks. Majority on connected graphs
        with four states, optimal (CRN-4), and deterministic exact majority and plurality (CRN-5)
        in the same framework.
      correspondence:
        - Crn.jumpKernel_eq_ppKernel
        - Crn.condStep_eq_jumpKernel
        - Crn.pair_prob_eq_propensity
        - Crn.ppStepKernel_sameJumpChain
      results:
        - Crn.IsSemilinearPred.stablyComputable
        - Crn.IsSemilinearPred.exists_network
        - Crn.ambassador_graphStablyComputes
        - Crn.rank_majority_eq_four
        - Crn.absoluteMajority_stablyComputes
        - Crn.relativeMajority_stablyMarks
      packages: [crn]
      blueprint:
        - /crn/blueprint/#thm:crn1
        - /crn/blueprint/#thm:crn1-jump
        - /crn/blueprint/#sec:aadfp-stable
        - /crn/blueprint/#sec:mnrs-graph-majority
        - /crn/blueprint/#sec:ghmss-exact-majority
      roadmap: [CRN-1, CRN-3, CRN-4, CRN-5]
    paper:
      dc: 'population protocols'
      popgen: '--'
      epi: '--'
      crn: '$A{+}B\to C{+}D$, common rate'
      physics: '--'
      social: '--'
      relation: 'jump chain'
      cite:
        dc: [AngluinEtAl2006]
        crn: [Doty2014]

  # ---------------------------------------------------------------------------------------------
  - id: si-rumor
    group: spreading
    title: Rumor spreading and the SI epidemic
    dc:
      name: Push, pull and push–pull rumor spreading
      description: >-
        On $K_n$ every node calls a uniformly random node; the rumor goes from caller to callee
        (push), from callee to caller (pull), or both (push–pull). Synchronously, in rounds, push
        informs everybody in $\log_2 n + \ln n + O(1)$ rounds; asynchronously, every node calls at
        the times of a rate-1 Poisson clock. Demers et al. call anti-entropy, in which sites
        reconcile their databases with random sites by push, pull or push–pull, a "simple
        epidemic".
      refs: [FriezeGrimmett1985, Pittel1987, KarpEtAl2000, DoerrKostrygin2017, DemersEtAl1987, AcanEtAl2017]
    popgen:
      none: No counterpart.
    epi:
      name: SI epidemic (Bailey's simple stochastic epidemic)
      description: >-
        Susceptible and infected individuals, no removal; in continuous time, new infections occur
        at rate $\beta S I$ (Bailey writes $\beta y(n - y + 1)$, with $y$ the number of
        susceptibles).
      refs: [Bailey1950]
    crn:
      name: $S + I \to 2I$
      description: Autocatalytic conversion with mass-action kinetics.
      refs: [Kahramanogullari2019]
    physics:
      name: First-passage percolation with exponential passage times (Richardson's growth model)
      description: >-
        Every edge gets an independent passage time and the infection crosses it in that time;
        with exponential times "the memoryless property of the distribution implies that the
        growth of the infected/colonized region is equal in distribution to a time change of a
        type of Eden process", and for general times the growth "is called a 1-type Richardson
        model" (Auffinger, Damron and Hanson). Richardson's original model of 1973 is in discrete
        time: every healthy site with an infected neighbour is infected with probability $p$ at
        each step.
      refs: [AuffingerDamronHanson2017, Richardson1973, Aldous2013, Janson1999]
    social:
      name: Bass model of new-product diffusion with imitation only
      description: >-
        The adopted fraction $F$ has hazard $f/(1 - F) = P + QF$, with $P$ the external
        influence (advertising) and $Q$ the internal one (word of mouth), so for $P = 0$ it is the
        logistic equation $F' = QF(1 - F)$. In Goldenberg, Libai and Muller's individual-level
        version a non-adopter adopts in a period with probability $1 - (1-p)(1-q)^{k(t)}$,
        "where $k(t)$ is the number of previous adopters": every adopter keeps influencing in
        every period.
      refs: [Bass1969, GoldenbergLibaiMuller2001b]
    relation:
      kinds: [same-ctmc, mean-field]
      statement: >-
        On $K_n$, asynchronous push and asynchronous pull have exactly the same law: every
        informed–uninformed pair transmits at rate $1/(n-1)$, so the number of informed nodes is
        Bailey's simple epidemic with $\beta = 1/(n-1)$, the chain of $S + I \to 2I$ with rate
        constant $1/(n-1)$; push–pull is the same process at twice the speed. The synchronous
        protocols are discrete-time SI models with one call per node per round; their spreading
        times differ ($\log_2 n + \ln n$ for push, $\log_2 n + \log_2 \ln n$ for pull,
        $\log_3 n + \log_2 \ln n$ for push–pull, up to $O(1)$) and they have no CRN counterpart.
        Physics column: with independent exponential passage times of rate $\nu$, the
        first-passage ball around the initial set grows as the SI epidemic with rate $\nu$ per
        edge, by the memoryless property; Aldous calls this epidemic the Pandemic process and
        notes that from a given initial agent its infection times have the law of the
        first-passage distances, although the two models differ as arrays over all pairs of
        agents. On $K_n$, asynchronous push or pull is therefore first-passage percolation with
        rate $1/(n-1)$, Janson's model with rate 1 slowed down by a factor $n - 1$; on regular
        graphs "the asynchronous push&pull protocol, Richardson's model, and first-passage
        percolation are essentially the same process, assuming appropriate parameters are chosen"
        (Acan et al.).
        Social column: for $P = 0$ the Bass equation is the logistic equation, the mean field of
        Bailey's epidemic with $Q = \beta N$ ($N$ the population size). Goldenberg, Libai and
        Muller's model with $p = 0$ is a discrete-time SI epidemic on $K_N$ in which every
        informed–uninformed pair transmits with probability $q$ in each period; for $q = 1/n$ a
        node is informed with the same probability as in synchronous push with calls to oneself,
        but the two chains differ (push informs at most as many new nodes as there are callers).
      conditions:
        - Complete graph; the identity with the network is for the asynchronous protocols.
        - >-
          The jump chain of $S + I \to 2I$ is deterministic (one more infected per reaction), so
          the correspondence is in the timing, between continuous-time chains.
        - >-
          Calls to oneself: Frieze and Grimmett and Karp et al. allow them, as `epidemics/` does;
          `rumor_spread/` does not. The identification above is an elementary computation, not
          stated in the sources.
        - >-
          The first-passage description holds on every graph, for the infected set grown from a
          given initial set; with other passage-time distributions the growth is not a Markov
          chain.
        - >-
          The Bass model is deterministic and shares only the mean field; the comparisons with the
          Bass equation and with Goldenberg, Libai and Muller's rule are our computation.
      refs: [AcanEtAl2017, DemersEtAl1987, Bailey1950, Aldous2013, AuffingerDamronHanson2017, Richardson1973, Janson1999, Bass1969, GoldenbergLibaiMuller2001b]
    leanamics:
      status: results
      summary: >-
        Synchronous push, pull and push–pull on $K_n$: all nodes informed within $O(\log n)$
        rounds w.h.p. (`rumor_spread/`), and the sharp times with matching lower bounds
        (`epidemics/`, Doerr and Kostrygin). The asynchronous protocols and the network are not
        formalized.
      correspondence: []
      results:
        - RumorPush.push_informs_all_whp
        - RumorPush.pull_informs_all_whp
        - RumorPush.pushPull_informs_all_whp
        - Epidemics.Revisited.push_spreading_tail
        - Epidemics.Revisited.push_spreading_lower_tail
        - Epidemics.Revisited.pull_spreading_tail
        - Epidemics.Revisited.pushPull_spreading_tail
      packages: [rumor_spread, epidemics]
      blueprint:
        - /rumor_spread/blueprint/#sec:main-statement
        - /rumor_spread/blueprint/#sec:pull
        - /epidemics/blueprint/#sec:doerr-kostrygin
        - /epidemics/blueprint/#sec:doerr-kostrygin-lower
      roadmap: [EPI-5, EPI-8]
    paper:
      dc: 'push, pull, push--pull rumor spreading'
      popgen: '--'
      epi: 'SI (simple) epidemic'
      crn: '$S{+}I\to 2I$'
      physics: 'first-passage percolation, exponential times'
      social: 'Bass model, imitation only'
      relation: 'CTMC (asynchronous); Bass: mean field'
      cite:
        dc: [KarpEtAl2000]
        epi: [Bailey1950]
        physics: [AuffingerDamronHanson2017]
        social: [Bass1969]

  # ---------------------------------------------------------------------------------------------
  - id: reed-frost
    group: spreading
    title: Reed–Frost epidemic, Independent Cascade and bond percolation
    dc:
      name: Independent Cascade model
      description: >-
        Synchronous rounds; "When node $v$ first becomes active in step $t$, it is given a single
        chance to activate each currently inactive neighbor $w$; it succeeds with a probability
        $p_{v,w}$" (Kempe, Kleinberg and Tardos, who note its study in marketing by Goldenberg,
        Libai and Muller); used for influence maximization.
      refs: [KempeKleinbergTardos2003, KempeKleinbergTardos2015, GoldenbergLibaiMuller2001]
    popgen:
      none: No counterpart.
    epi:
      name: Reed–Frost chain-binomial SIR epidemic (on a graph)
      description: >-
        Discrete generations; each infective infects each susceptible neighbour independently
        with probability $p$, and the infectives of a generation are removed at its end (a fixed
        infectious period).
      refs: [Abbey1952, Britton2010, DraiefGaneshMassoulie2008]
    crn:
      none: >-
        Generations are synchronous and the infectious period is fixed. The mass-action SIR
        network (row sir-kermack-mckendrick) has exponentially distributed infectious periods: a
        different epidemic, which shares only the large-population final-size equation.
    physics:
      name: Bond percolation; the general epidemic process with a fixed infectious period
      description: >-
        In Bernoulli bond percolation, introduced by Broadbent and Hammersley, "each edge is open
        with probability $p$ ... independently of the state of other edges" (Duminil-Copin); the
        final set of the epidemic is the set of vertices joined to the initial set by open paths.
        Grassberger studies the SIR epidemic on lattices as the general epidemic process, which
        with a fixed infectious period is bond percolation (relation).
      refs: [BroadbentHammersley1957, DuminilCopin2019, Grassberger1983]
    social:
      none: >-
        No counterpart found. Kempe, Kleinberg and Tardos place Independent Cascade in the
        marketing work of Goldenberg, Libai and Muller, but in the homogeneous model of their
        AMS Review paper every previous adopter influences each non-adopter in every period,
        not once (row si-rumor).
    relation:
      kinds: [same-chain, coupling]
      statement: >-
        Independent Cascade with $p_{v,w} = p$ on an undirected graph is the Reed–Frost epidemic
        on that graph (Draief, Ganesh and Massoulié call this rule "the Reed-Frost model"). Both
        are coupled pathwise with bond percolation (physics column): "A node $x$ ends up active if
        and only if there is a path from some node in $A$ to $x$ consisting entirely of live
        edges" (Kempe,
        Kleinberg and Tardos, Claim 2.3), and with one coin per edge the nodes infected in round
        $t$ are those at distance $t$ from the initial set in the graph of open edges. This is
        exact because the infectious
        period is fixed: Grassberger shows that a fixed period gives "precisely the problem of
        bond percolation" while exponential periods give "neither site nor bond percolation";
        Newman's 2002 claim of an exact isomorphism for random infectious periods needs a major
        correction (Kenah and Robins: the mapping gives the right threshold and final size, but not
        the distribution of outbreak sizes or the probability of an epidemic).
      conditions:
        - >-
          Each edge is tried at most once (after its coin is seen from an infected endpoint, that
          endpoint is removed), so one coin per edge has the same law as fresh coins.
        - With asymmetric $p_{v,w}$ the coupling is with directed percolation.
        - >-
          Of the two marketing papers that Kempe, Kleinberg and Tardos cite for Independent
          Cascade, the AMS Review paper of Goldenberg, Libai and Muller has adopters influence in
          every period (a discrete-time SI process, row si-rumor); the Marketing Letters paper, on
          strong and weak ties, could not be read.
      refs: [KempeKleinbergTardos2003, DraiefGaneshMassoulie2008, Grassberger1983, Newman2002, KenahRobins2007, DuminilCopin2019, GoldenbergLibaiMuller2001, GoldenbergLibaiMuller2001b]
    leanamics:
      status: proved
      summary: >-
        The pathwise coupling with one coin per edge, and the equality of infection and
        connection probabilities with i.i.d. coins (EPI-1); subcritical and supercritical
        outbreaks through percolation (EPI-2, EPI-3, EPI-6). The identity in law between one coin
        per edge and fresh coins in every round is not formalized.
      correspondence:
        - Epidemics.infected_iff
        - Epidemics.final_recovered_iff
        - Epidemics.prob_infected_eq_prob_connected
      results:
        - Epidemics.reedFrost_subcritical
        - Epidemics.reedFrost_large_outbreak
        - Epidemics.swg_reedFrost_subcritical
        - Epidemics.swg3_reedFrost_subcritical
      packages: [epidemics]
      blueprint:
        - /epidemics/blueprint/#sec:kkt-live-edge
        - /epidemics/blueprint/#sec:bcdptz-small-world
        - /epidemics/blueprint/#sec:krivelevich-sudakov
      roadmap: [EPI-1, EPI-2, EPI-3, EPI-6]
    paper:
      dc: 'Independent Cascade'
      popgen: '--'
      epi: 'Reed--Frost SIR'
      crn: '--'
      physics: 'bond percolation'
      social: '--'
      relation: 'same chain; coupling'
      cite:
        dc: [KempeKleinbergTardos2003]
        epi: [DraiefGaneshMassoulie2008]
        physics: [BroadbentHammersley1957]

  # ---------------------------------------------------------------------------------------------
  - id: threshold
    group: spreading
    title: Threshold models, the Linear Threshold model and bootstrap percolation
    dc:
      name: Linear Threshold model
      description: >-
        "Each node $v$ chooses a threshold $\theta_v$ uniformly at random from the interval
        $[0, 1]$", and in every step a node becomes active, for good, once the total weight
        $\sum_w b_{v,w}$ of its active neighbours (with $\sum_w b_{v,w} \le 1$) is at least
        $\theta_v$ (Kempe, Kleinberg and Tardos, for influence maximization). The random
        thresholds model "our lack of knowledge of their values"; they contrast approaches that
        "hard-wire all thresholds at a known value like 1/2".
      refs: [KempeKleinbergTardos2003]
    popgen:
      none: No counterpart found.
    epi:
      none: No counterpart found.
    crn:
      none: >-
        No counterpart: once the thresholds are drawn the dynamics is deterministic, in synchronous
        rounds.
    physics:
      name: Bootstrap percolation
      description: >-
        In $r$-neighbour bootstrap percolation "a (typically random) set $A$ of initially
        'infected' vertices spreads by infecting (at each time step) vertices with at least $r$
        already-infected neighbours", the vertices of $A$ being usually chosen independently with
        density $p$; it "was introduced in 1979 by Chalupa, Leath and Reich in the context of
        disordered magnetic systems" (Balogh, Bollobás, Duminil-Copin and Morris).
      refs: [ChalupaLeathReich1979, BaloghEtAl2012]
    social:
      name: Threshold models of collective behavior
      description: >-
        A person's threshold is "the proportion of the group he would have to see join before he
        would do so", so the proportion of the group that has joined follows
        "$r(t + 1) = F[r(t)]$", with $F$ the distribution function of the thresholds; with social
        structure, friends count more than strangers in a weighted "perceived proportion"
        (Granovetter). On random networks with thresholds that are fractions of the neighbours,
        it is Watts's cascade model.
      refs: [Granovetter1978, Watts2002]
    relation:
      kinds: [same-recursion]
      statement: >-
        Given the thresholds, the three models are the same deterministic dynamics: an inactive
        node becomes active, for good, once the weight of its active neighbours reaches its
        threshold, and since activation is monotone the final set does not depend on the order of
        the updates. Granovetter's model is this dynamics on the complete graph with weight $1/N$
        for every other member of a group of $N$ (members with threshold 0 act first), and his
        friendship weights give other weights. Bootstrap percolation with threshold $r$ is the
        case $b_{v,w} = 1/\deg v$, $\theta_v = r/\deg v$, and Watts's model with a common
        threshold fraction $\phi$ on a $d$-regular graph is bootstrap percolation with
        $r = \lceil \phi d \rceil$ (Watts updates the nodes in random asynchronous order, which
        changes the intermediate sets but not the final one). The models differ in what is
        random: Linear Threshold draws independent uniform thresholds and fixes the initial set,
        bootstrap percolation fixes the thresholds and draws the initial set, Granovetter takes
        both as given, and Watts draws both. With uniform thresholds, the final active set of Linear
        Threshold has the law of the set reached from $A$ by live-edge paths when every node $v$
        keeps at most one incoming edge, from $w$ with probability $b_{v,w}$ (Kempe, Kleinberg and
        Tardos, Claim 2.6); their proof goes iteration by iteration, and indeed the whole sequence
        of active sets has the law of the sequence of sets reached within $t$ steps. Independent
        Cascade is reachability with independent live edges (row reed-frost); both are special
        cases of their triggering model, and their general threshold and general cascade models
        are equivalent. The two processes differ: a node with two active in-neighbours of weight
        $1/2$ becomes active surely under Linear Threshold, and with probability $3/4$ under
        Independent Cascade with $p = 1/2$.
      conditions:
        - >-
          Same dynamics given the thresholds and the initial set; weights $b_{v,w}$ are arbitrary
          in Linear Threshold, $1/N$ (or friendship weights) for Granovetter, $1/\deg v$ for
          bootstrap percolation.
        - The live-edge representation needs independent uniform thresholds.
        - >-
          The identifications of Granovetter's model, bootstrap percolation and Watts's model as
          threshold dynamics with fixed thresholds, and the identity in law of the whole
          sequences, are our computation; Kempe, Kleinberg and Tardos name Granovetter among the
          first to propose models with node-specific thresholds, Balogh et al. mention that
          sociologists (Granovetter, Watts) have studied the bootstrap process, and Watts
          contrasts his fractional thresholds with bootstrap percolation.
      refs: [KempeKleinbergTardos2003, Granovetter1978, Watts2002, BaloghEtAl2012]
    leanamics:
      status: not-formalized
      summary: >-
        Not formalized and not a target of the roadmap; the closest formal result is the live-edge
        coupling of Independent Cascade with bond percolation (row reed-frost, EPI-1).
      correspondence: []
      results: []
      packages: []
      blueprint: []
      roadmap: []
    paper:
      dc: 'Linear Threshold model'
      popgen: '--'
      epi: '--'
      crn: '--'
      physics: 'bootstrap percolation'
      social: 'Granovetter threshold model'
      relation: 'same recursion, given thresholds'
      cite:
        dc: [KempeKleinbergTardos2003]
        physics: [ChalupaLeathReich1979]
        social: [Granovetter1978]

  # ---------------------------------------------------------------------------------------------
  - id: sir-kermack-mckendrick
    group: spreading
    title: Markovian SIR epidemic and the Kermack–McKendrick equations
    dc:
      name: Rumor mongering with blind loss of interest
      description: >-
        Demers et al.'s "blind" variant: an infective site calls a random site and, whatever the
        outcome, stops spreading with probability $1/k$ ("coin").
      refs: [DemersEtAl1987]
    popgen:
      none: No counterpart.
    epi:
      name: General stochastic epidemic (Markovian SIR) and the Kermack–McKendrick equations
      description: >-
        Infection at rate $\beta SI/N$, removal at rate $\gamma I$; the deterministic model
        $s' = -\beta s i$, $i' = \beta s i - \gamma i$, $r' = \gamma i$, with
        $R_0 = \beta/\gamma$, has an epidemic ($i$ first increases) iff $R_0 s_0 > 1$, and, when
        $r_0 = 0$, the final size $s_\infty = s_0 e^{-R_0(1 - s_\infty)}$.
      refs: [KermackMcKendrick1927, Bartlett1949, Hethcote2000, BrittonPardoux2019]
    crn:
      name: '$S + I \to 2I$ (rate $\beta/N$), $I \to R$ (rate $\gamma$)'
      description: >-
        Stochastic mass-action kinetics; its deterministic rate equations are Kermack and
        McKendrick's.
      refs: [Kahramanogullari2019, Kurtz1972]
    physics:
      none: >-
        No separate counterpart: statistical physics studies the Markovian SIR epidemic on
        lattices as the general epidemic process, which with exponentially distributed infectious
        periods corresponds to neither site nor bond percolation (row reed-frost).
    social:
      none: No counterpart found.
    relation:
      kinds: [same-ctmc, limit, mean-field]
      statement: >-
        The Markovian SIR epidemic is the stochastic mass-action chain of the network, and the
        Kermack–McKendrick equations are its rate equations; by Kurtz's law of large numbers the
        scaled counts $(S, I, R)/N$ converge to their solution, uniformly on bounded time
        intervals. On $K_n$, the asynchronous blind–coin rule (calls at rate 1, removal with
        probability $1/k$ per call) has the infection rate $SI/(n-1)$ and the removal rate $I/k$
        of the network with $\beta/N = 1/(n-1)$ and $\gamma = 1/k$, but it is not the same chain
        (one call can infect the callee and remove the caller); its mean field is
        Kermack–McKendrick with $R_0 = k$, consistent with the residues simulated by Demers et
        al. The Reed–Frost epidemic has the same large-population
        final-size equation $1 - z = e^{-R_0 z}$ but a different law (for instance, a different
        probability of a major outbreak).
      conditions:
        - Well mixed; mass action in volume $N$.
        - >-
          The SIR reading of Demers et al.'s blind–coin variant and its mean field are ours; they
          do not call it SIR.
      refs: [Kurtz1970, BrittonPardoux2019, Britton2010, vonBahrMartinLof1980]
    leanamics:
      status: partial
      summary: >-
        Kermack–McKendrick (EPI-7): threshold, peak and final-size equation for every solution.
        Kurtz's law of large numbers (CRN-2) for the uniformized chain in discrete time, with
        natural-number rates; the continuous-time chain is not formalized.
