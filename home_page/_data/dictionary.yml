# The cross-field dictionary of Leanamics: the same Markov processes under different names.
#
# Single source of truth for the dictionary section of the website and for the table of the
# paper, which scripts/dictionary_tex.py generates from the `paper` field of each row
# (`python3 scripts/dictionary_tex.py --check` checks this file against the blueprints).
#
# Each row is one correspondence. The six field cells (dc, popgen, epi, crn, physics, social) give
# the name of the process in that field, a precise description and references (keys of
# `references` below), or `none:` with the reason why the field has no counterpart. `relation`
# says what kind of correspondence it is (kinds from `relations`), under which conditions it
# holds, and which sources state it; `leanamics` gives the formal status. Text may contain
# inline TeX math ($...$), rendered by MathJax on the website; Lean names are in backticks.

title: The same processes under different names

intro: >-
  The same few Markov chains are studied under different names in distributed computing,
  population genetics and evolutionary biology, epidemiology, chemistry, statistical physics,
  and the social sciences. Each entry of this
  dictionary is one correspondence: what the process is called in each field (or why a field has
  no counterpart), what kind of correspondence it is and under which conditions it holds, and
  what Leanamics proves about it. The conditions matter: two processes can be the same chain on
  the complete graph and differ on other graphs, or agree only up to a time change or in the
  limit of a large population.

notes:
  - >-
    Relations. Two processes are the same chain when they have the same transition kernel. They
    have the same jump chain when they agree once idle steps are removed (a lazy step, or the
    holding times of a continuous-time chain): they differ by a random time change, so they have
    the same absorption and fixation probabilities but not the same running times. Duality and
    pathwise coupling are exact identities between two different processes. A limit holds only as
    the population size tends to infinity, and a common mean-field map says nothing about
    fluctuations. In Lean, four kinds are definitions about finite kernels in the shared library
    (`dynamics/Dynamics/Relations.lean`): the same chain on counts is a lumping
    (`Dynamics.Kernel.Lumps`), the same jump chain is `Dynamics.Kernel.SameJumpChain` (kernels
    with the same jump chain have the same absorption probabilities), duality is
    `Dynamics.Kernel.Dual`, and a common mean-field map is `Dynamics.Kernel.MeanField`.
  - >-
    Chemistry. A stochastic chemical reaction network (CRN) with mass-action kinetics is a
    continuous-time Markov chain on molecule counts in a well-mixed solution. It fires one
    reaction at a time, so synchronous-round dynamics, in which every individual is updated at
    once, have no CRN counterpart (their sequential versions may have one); and since the
    solution is well mixed, a dynamics on a graph has a CRN counterpart only on the complete
    graph $K_n$. Propensities follow Gillespie: $k\,x_A x_B$ for $A + B$ and $k\binom{x_A}{2}$ for
    $A + A$, with $k$ the rate constant (the volume absorbed in $k$).
  - >-
    Statistical physics. The column holds the interacting particle systems of probability theory
    and the models of sociophysics, opinion models proposed in physics journals (Galam's majority
    rule, the $q$-voter and Sznajd models, kinetic exchange). Interacting particle systems run in
    continuous time, every site acting at the times of its own Poisson clock, usually on
    $\mathbb Z^d$; on a finite graph the chain observed at the clock rings is the sequential chain
    (see Time), and simulations that count $N$ updates as one unit of time change no chain. Rules
    that differ on irregular graphs coincide on $\mathbb Z^d$ and on every regular graph (pull and
    push copying, the forms of the biased voter model), so a name from this column fixes the chain
    on other graphs only when the rule is stated for every graph.
  - >-
    Social sciences. The column holds models from sociology, social psychology, economics,
    marketing and the statistics of opinion pooling. Many are deterministic recursions for
    proportions or opinions (French and DeGroot, Granovetter, Bass), so they share with a
    stochastic chain only a recursion or a mean field; individual-level versions are compared where
    their authors define them. Cultural evolution, which models cultural transmission with the
    methods of population genetics, stays in the population-genetics column (rows wright-fisher and
    three-majority), and sociophysics in the physics column.
  - >-
    Time. Sequential dynamics draw one ordered pair of distinct agents per step. If instead every
    agent acts at the times of its own rate-1 Poisson clock, the chain observed at its event
    times is the sequential chain; population protocols count $n$ interactions as one unit of
    parallel time, which corresponds to mass-action time in a volume proportional to $n$.
  - >-
    Formal status. proved: the correspondence itself is a Lean theorem. partial: part of it is a
    Lean theorem, and the summary says which part. definitional: the library defines the process
    once and names it after both fields (for example, neutral push is the Birth–death Moran
    kernel with $r = 1$), so every result proved for it holds under both names, but no theorem
    compares two definitions. results: the library proves results about some of the columns, not
    the correspondence. roadmap: a target of the roadmap, not formalized yet. not formalized:
    neither in the library nor a target of the roadmap.
  - >-
    Blueprint links point to the section of a package's blueprint that contains the result; where
    that section has no label, they point to the label of the theorem itself. References were
    checked against Crossref, DataCite, arXiv or Open Library. Where a source states a
    correspondence only for a special case, or where the identification is an elementary
    computation not found in the sources, the relation says so. Some classic sources could not
    be read in full (Wright 1931, Moran 1958 beyond its first page, Bartlett 1949, Abbey 1952,
    Kingman 1982, Daley and Kendall 1965, Kurtz 1970 and 1972, Maki and Thompson 1973, DeGroot
    1974, and for the physics and social-science columns Broadbent and Hammersley 1957, French
    1956, Bass 1969, Clifford and Sudbury 1973, Richardson 1973, Holley and Liggett 1975,
    Chalupa, Leath and Reich 1979, Bramson and Griffeath 1981, and Goldenberg, Libai and Muller's
    Marketing Letters paper); what the dictionary says about them follows later sources that
    restate them, cited in the same row. One marketing paper has no identifier and was read in a
    copy on a university website.

fields:
  - key: dc
    name: Distributed computing
    short: Distributed computing
  - key: popgen
    name: Population genetics and evolutionary biology
    short: Population genetics
  - key: epi
    name: Epidemiology
    short: Epidemiology
  - key: crn
    name: Chemistry (chemical reaction networks)
    short: Chemistry (CRN)
  - key: physics
    name: Statistical physics and interacting particle systems
    short: Statistical physics
  - key: social
    name: Social sciences
    short: Social sciences

relations:
  - key: same-chain
    name: Same chain
    short: same chain
    description: The same transition kernel, on configurations or, where stated, on counts.
  - key: same-ctmc
    name: Same continuous-time chain
    short: CTMC
    description: The same continuous-time Markov chain, possibly after scaling time by a constant.
  - key: jump-chain
    name: Same jump chain
    short: jump chain
    description: >-
      The same chain once idle steps are removed (lazy steps, or the holding times of a
      continuous-time chain); the processes differ by a random time change, so absorption
      probabilities agree but running times need not.
  - key: coupling
    name: Pathwise coupling
    short: coupling
    description: Built on the same randomness, the processes agree path by path.
  - key: duality
    name: Duality
    short: dual
    description: >-
      An exact identity between probabilities of one process and of a dual process run backwards
      in time.
  - key: limit
    name: Large-population limit
    short: limit
    description: >-
      One process, or its scaled counts, converges to the other as the population size tends to
      infinity.
  - key: same-recursion
    name: Same deterministic recursion
    short: same recursion
    description: Both are the same deterministic dynamical system.
  - key: mean-field
    name: Same mean-field map
    short: mean field
    description: >-
      The expected one-step change, or the deterministic infinite-population recursion,
      coincides; the stochastic processes may differ.

groups:
  - key: neutral
    title: Neutral copying
  - key: selection
    title: Selection
  - key: genealogy
    title: Duality and genealogy
  - key: averaging
    title: Averaging
  - key: majority
    title: Majority-type dynamics
  - key: protocols
    title: Population protocols and reaction networks
  - key: spreading
    title: Spreading processes

rows:
  # ---------------------------------------------------------------------------------------------
  - id: wright-fisher
    group: neutral
    title: Synchronous neutral copying on the complete graph
    dc:
      name: Synchronous pull voter on $K_n$ with self-loops
      description: >-
        In every round each of the $n$ nodes copies the opinion of a node drawn uniformly from all
        $n$ nodes, itself included, independently of the other nodes. On a general graph each
        node copies a random neighbour (Hassin and Peleg's synchronous voter).
      refs: [HassinPeleg2001, BecchettiClementiNatale2020]
    popgen:
      name: Neutral Wright–Fisher model
      description: >-
        Haploid, non-overlapping generations of constant size $N$: each individual of the next
        generation chooses its parent independently and uniformly at random from the current
        generation, so the number of copies of an allele evolves as
        $X_{t+1} \sim \mathrm{Bin}(N, X_t/N)$ and fixes with probability $X_0/N$.
      refs: [Wright1931, Etheridge2011, Durrett2008]
    epi:
      none: >-
        No counterpart: neutral copying is symmetric between the types, while an epidemic has a
        distinguished infectious state.
    crn:
      none: >-
        Synchronous rounds replace every individual at once, while a stochastic CRN fires one
        reaction at a time.
    physics:
      name: Voter model with parallel updates
      description: >-
        All sites update at once, each copying the type of a uniformly random neighbour: the
        discrete-time parallel version of the voter model, which itself runs in continuous time
        (next row). On the complete graph probabilists call this version the Fisher–Wright model
        (relation).
      refs: [AvenaEtAl2024]
    social:
      none: >-
        No counterpart found in sociology or economics. Unbiased cultural transmission, the same
        chain on cultural traits, belongs to cultural evolution and is listed with population
        genetics (relation).
    relation:
      kinds: [same-chain]
      statement: >-
        The same chain: node $v$ takes the type of node $r(v)$, where $r$ is a uniformly random
        map $V \to V$, so the two processes have the same kernel on labelled configurations and
        the same binomial chain on counts. The voter model on the complete graph is "referred to
        as the Moran model or the Fisher-Wright model (depending on whether continuous-time
        asynchronous or discrete-time parallel updates are considered)" (Avena et al.). In
        cultural evolution the same chain is unbiased oblique transmission: "Each new individual
        of each new generation picks a member of the previous generation at random and copies
        their cultural trait" (Acerbi, Mesoudi and Smolla, who sample with replacement from the
        whole previous generation).
      conditions:
        - Complete graph with self-loops (every node samples among all $n$ nodes, itself included).
        - Neutral (no selection).
        - >-
          Without self-loops the offspring numbers are still exchangeable but not multinomial, so
          the chains differ, although a colour still fixes with probability equal to its initial
          frequency (for $n \ge 3$).
        - >-
          On other graphs the synchronous voter has no documented population-genetics name; no
          source defining a "Wright–Fisher model on graphs" with neighbour-restricted parents was
          found.
      refs: [AvenaEtAl2024, AcerbiMesoudiSmolla2022]
    leanamics:
      status: proved
      summary: >-
        The synchronous voter model on $K_n$ with self-loops (Wright–Fisher sampling,
        `Voter.wfKernel`) lumps to the Wright–Fisher chain on allele counts, defined from the
        binomial law alone ($X_{t+1} \sim \mathrm{Bin}(n, X_t/n)$, `Voter.wfCountKernel`), under
        the number of vertices of any colour (`Voter.transition_wfKernel_lumps`, a lumping
        `Dynamics.Kernel.Lumps`); on labelled configurations the two processes coincide by
        definition. Neutral fixation $c_a/n$ follows from Hassin and Peleg's proportionate
        agreement and transfers to the count chain through the lumping, and consensus within
        $2n\log n$ rounds follows from the duality with coalescing walks (row coalescing).
      correspondence: [Voter.wfKernel, Voter.wfCountKernel, Voter.transition_wfKernel_lumps]
      results:
        - Voter.wrightFisher_fixation
        - Voter.wfCountKernel_fixation
        - Voter.wrightFisher_fixation_of_three_le
        - Voter.consensus_probability_of_selfLoop
        - Voter.voter_consensus_whp
      packages: [voter]
      blueprint:
        - /voter/blueprint/#sec:hassin-peleg
        - /voter/blueprint/#thm:wright-fisher
        - /voter/blueprint/#thm:wf-counts
      roadmap: [VOT-1, VOT-2, VOT-3]
    paper:
      dc: 'synchronous pull voter, $K_n$ with self-loops'
      popgen: 'neutral Wright--Fisher'
      epi: '--'
      crn: '--'
      physics: 'voter model, parallel updates'
      social: '--'
      relation: 'same chain'
      cite:
        dc: [HassinPeleg2001]
        popgen: [Wright1931]

  # ---------------------------------------------------------------------------------------------
  - id: moran-death-birth
    group: neutral
    title: Sequential pull copying (death–Birth)
    dc:
      name: Sequential pull voter (the voter model in discrete time)
      description: >-
        "In each round one node is selected uniformly at random and it adopts the color of a
        neighbour sampled uniformly at random" (Becchetti, Clementi and Natale, Definition 3).
      refs: [BecchettiClementiNatale2020]
    popgen:
      name: Neutral Moran process with death–Birth (dB) updating; on $K_n$ with self-loops, Moran's model
      description: >-
        A uniformly random individual dies and its neighbours compete for the vacancy
        proportionally to fitness, so in the neutral case the parent is a uniformly random
        neighbour. Moran's model draws the reproducing and the dying individual independently and
        uniformly from the whole population, so the reproducer may be the one that dies (the
        complete graph with self-loops).
      refs: [OhtsukiEtAl2006, HindersinTraulsen2015, Moran1958, Moran1959]
    epi:
      none: No counterpart (neutral copying).
    crn:
      name: 'On $K_n$: $X + Y \to 2X$, $X + Y \to 2Y$ with a common rate constant'
      description: >-
        The two copying reactions in a well-mixed solution, an instance of the correspondence
        between population protocols and bimolecular networks (row population-protocols).
      refs: [Doty2014]
    physics:
      name: Voter model
      description: >-
        The interacting particle system introduced independently by Clifford and Sudbury and by
        Holley and Liggett on $\mathbb Z^d$, and defined in the same way on any graph: "with rate
        1, the organism living at a given site dies, and is replaced by a descendant chosen with
        equal probability from its neighbors"; in the reading that gave the model its name, a
        voter "asks a randomly chosen neighbor, and copies his/her opinion" (Swart).
      refs: [CliffordSudbury1973, HolleyLiggett1975, Swart2017, DurrettMoseley2015]
    social:
      name: 'On $K_n$: Kirman''s ant (recruitment) model with $\varepsilon = \delta = 0$'
      description: >-
        In economics, $N$ ants (or traders) feed at a black or a white source: "Two ants meet at
        random ... The first is converted to the second's color with probability $(1 - \delta)$",
        and with probability $\varepsilon$ the first "will change his own color independently
        before meeting anyone"; the count of ants at the black source goes up with probability
        $(1 - k/N)(\varepsilon + (1-\delta)\,k/(N-1))$. Kirman names the special case
        $\varepsilon = \delta = 0$, in which "the first person always moves with certainty to the
        second's group", a martingale absorbed in $N$ with probability $k_0/N$.
      refs: [Kirman1993]
    relation:
      kinds: [same-chain, jump-chain, same-ctmc]
      statement: >-
        The same chain on every graph: the copier is the individual that dies and the copied
        neighbour is the parent. A neutral mutant set $S$ fixes with probability
        $\sum_{v\in S}\deg v/2m$, its reproductive value under death–Birth. On $K_n$ without
        self-loops the count moves up and down with the same probability $xy/(n(n-1))$, so its
        jump chain is that of the network (each reaction with probability $1/2$), and the
        continuous-time voter model in which every node copies at rate 1 is the network's chain
        with rate constant $1/(n-1)$; Moran's model (with self-loops) has the same jump chain.
        That continuous-time process is the voter model of interacting particle systems (physics
        column): on every graph, observed at the rings of its $n$ clocks, it is the sequential
        pull voter.
      conditions:
        - Neutral; uniform choice among the neighbours (with edge weights, the same weights on both sides).
        - The CRN counterpart exists only on $K_n$.
        - >-
          Kirman's model is the same chain (on counts) only when $\varepsilon = \delta = 0$; with
          $0 < \delta < 1$ and $\varepsilon = 0$ it is a lazy version with the same jump chain. With
          $\varepsilon > 0$, the case Kirman studies, spontaneous switching prevents absorption and
          the object of interest is the stationary distribution, which this row does not cover.
        - >-
          On regular graphs, $K_n$ in particular, this row coincides with the next one: neutral push
          and pull are then the same chain.
        - >-
          With selection the names diverge: the "biased voter model" of Antal, Redner and Sood
          puts selection on the death step (their remark that this is equivalent to random death
          and fitness-proportional replacement needs a minor correction), so it is death–Birth
          only in the neutral case, and "biased voter" denotes different chains in different
          communities.
      refs: [SoodAntalRedner2008, AntalRednerSood2006, Maciejewski2014, Aldous2013, Swart2017, CliffordSudbury1973]
    leanamics:
      status: partial
      summary: >-
        The pull kernel is defined as death–Birth (`Moran.pullKernel`), and a mutant set $S$ fixes
        with probability $\sum_{v\in S}\deg v/2m$ on every connected graph, exactly (Antal,
        Redner and Sood's degree laws with selection are mean-field approximations). On $K_n$ the
        library's kernel has no self-loops (a simple graph), and its number of mutants is the
        neutral Moran chain on counts that moves up and down with probability $xy/(n(n-1))$
        (`Moran.pullKernel_top_lumps`), whose jump chain moves up or down with probability $1/2$
        (`Moran.pullCountKernel_jump`); Moran's model, with self-loops and probability $xy/n^2$,
        has the same jump chain (`Moran.moranCountKernel_sameJumpChain`), and for $n \ge 2$ both
        fix with probability $x/n$. The network is an instance of CRN-1 (`Crn.jumpKernel_eq_ppKernel`),
        not stated for it, and the continuous-time chains are not formalized.
      correspondence:
        - Moran.pullKernel
        - Moran.pullKernel_top_lumps
        - Moran.pullCountKernel_jump
        - Moran.moranCountKernel_sameJumpChain
        - Crn.jumpKernel_eq_ppKernel
      results:
        - Moran.pull_fixation
        - Moran.pull_value_invariant
        - Moran.pullCountKernel_fixation
        - Moran.moranCountKernel_fixation
      packages: [moran, crn]
      blueprint:
        - /moran/blueprint/#sec:ars-push-pull
        - /moran/blueprint/#sec:moran-counts
        - /crn/blueprint/#thm:crn1
      roadmap: [VOT-4, CRN-1]
    paper:
      # one line of the paper for this row and the next (pull and push)
      dc: 'sequential pull / push voter on a graph'
      popgen: 'neutral Moran, death--Birth / Birth--death'
      epi: '--'
      crn: 'on $K_n$: $X{+}Y\to 2X$, $X{+}Y\to 2Y$'
      physics: 'voter model / invasion process'
      social: 'on $K_n$: Kirman''s ants, $\varepsilon{=}\delta{=}0$'
      relation: 'same chain; CRN: jump chain'
      cite:
        dc: [BecchettiClementiNatale2020]
        popgen: [HindersinTraulsen2015]
        physics: [HolleyLiggett1975, Castellano2005]
        social: [Kirman1993]

  # ---------------------------------------------------------------------------------------------
  - id: moran-birth-death
    group: neutral
    title: Sequential push copying (Birth–death)
    dc:
      name: Sequential push voter
      description: >-
        At each step a uniformly random node pushes its opinion to a uniformly random neighbour.
      refs: []
    popgen:
      name: Neutral Moran process with Birth–death (Bd) updating
      description: >-
        An individual chosen proportionally to fitness (uniformly in the neutral case) reproduces,
        and its offspring replaces a uniformly random neighbour; called the invasion process in
        statistical physics.
      refs: [LiebermanHauertNowak2005, HindersinTraulsen2015, AntalRednerSood2006]
    epi:
      none: No counterpart (neutral copying).
    crn:
      name: 'On $K_n$: the network of the previous row'
      description: On $K_n$, neutral push and pull have the same chain.
      refs: []
    physics:
      name: Invasion process (reverse voter model)
      description: >-
        "(i) pick a random node (an invader); (ii) the invader exports its state to a random
        neighbor", time advancing by $1/N$ per update (Sood, Antal and Redner); Castellano
        introduced it as the reverse voter model and notes that it coincides with the voter model
        when all degrees are equal.
      refs: [SoodAntalRedner2008, Castellano2005]
    social:
      none: No counterpart found.
    relation:
      kinds: [same-chain, jump-chain]
      statement: >-
        The same chain on every graph (pushing node = reproducing individual, target = replaced
        neighbour), called the invasion process in statistical physics (physics column). A
        neutral mutant set $S$ fixes with probability
        $\sum_{v\in S}1/\deg v \,\big/ \sum_{v}1/\deg v$, its reproductive value under Birth–death,
        against $\sum_{v\in S}\deg v/2m$ for pull: the push/pull asymmetry of distributed
        computing is the Birth–death/death–Birth asymmetry of evolutionary graph theory. The two
        agree on regular graphs; with selection, most random graphs amplify selection under
        Birth–death and suppress it under death–Birth (Hindersin and Traulsen).
      conditions:
        - Neutral; uniform choice of the target among the neighbours.
        - The CRN counterpart exists only on $K_n$, where push and pull coincide.
      refs: [SoodAntalRedner2008, Maciejewski2014, HindersinTraulsen2015, Castellano2005]
    leanamics:
      status: definitional
      summary: >-
        Neutral push is the Birth–death Moran kernel with $r = 1$ (`Moran.moranKernel`); its
        fixation probability is proved exactly on every connected graph, and $k/n$ on regular
        graphs.
      correspondence: [Moran.moranKernel]
      results: [Moran.push_fixation, Moran.push_value_invariant, Moran.isothermal_neutral]
      packages: [moran]
      blueprint:
        - /moran/blueprint/#sec:ars-push-pull
        - /moran/blueprint/#sec:lhn-isothermal
      roadmap: [VOT-4, MOR-2]
    paper:
      include: false   # merged with the previous row in the paper's table

  # ---------------------------------------------------------------------------------------------
  - id: moran-selection
    group: selection
    title: Birth–death with selection
    dc:
      name: Push voter with fitness-biased senders
      description: >-
        The sender is drawn with probability proportional to its fitness ($r$ for mutants, $1$ for
        residents) and pushes its type to a uniformly random neighbour. There is no distributed
        computing name; algorithmic work studies it under its biological name.
      refs: [DiazEtAl2014, GalanisEtAl2017]
    popgen:
      name: Moran process with Birth–death updating and mutant fitness $r$
      description: >-
        "At each time step an individual is chosen for reproduction with a probability
        proportional to its fitness"; its offspring replaces a neighbour (Lieberman, Hauert and
        Nowak). On regular graphs, as on $K_n$, $k$ mutants fix with probability
        $(1 - r^{-k})/(1 - r^{-n})$ from every initial set (the "if" direction of the isothermal
        theorem). Moran's 1958 model is neutral; on the complete graph with self-loops, with
        selection by fecundity, Moran (1959) found this fixation probability as a gambler's ruin.
      refs: [Moran1959, LiebermanHauertNowak2005, HindersinTraulsen2015, GalanisEtAl2017]
    epi:
      none: No counterpart.
    crn:
      name: 'On $K_n$: $M + W \to 2M$ (rate $r$), $M + W \to 2W$ (rate $1$)'
      description: Mutant and wild-type molecules converting each other, with rate constants in ratio $r$.
      refs: []
    physics:
      name: Biased voter (Williams–Bjerknes) model
      description: >-
        On $\mathbb Z^d$, "Cells give birth at a rate equal to their fitness, and the offspring
        replaces a nearest neighbor chosen at random" (Durrett and Moseley, after Bramson and
        Griffeath); equivalently, with bias $s = r - 1$, a site switches $0 \to 1$ at rate
        $(1+s) f_1$ and $1 \to 0$ at rate $f_0$, where $f_i$ is the fraction of its neighbours of
        type $i$ (Swart). The name also denotes other chains (relation).
      refs: [BramsonGriffeath1981, DurrettMoseley2015, Swart2017]
    social:
      none: No counterpart found.
    relation:
      kinds: [same-chain, jump-chain, same-ctmc]
      statement: >-
        The same chain on every graph. On $K_n$ every mixed state moves up with probability
        $r/(1+r)$ among its moves, as the jump chain of the network, so the fixation
        probabilities agree; the continuous-time process in which each individual reproduces at
        rate equal to its fitness is the network's chain with rate constants $r/(n-1)$ and
        $1/(n-1)$ (on $\mathbb Z^d$, and on every regular graph, it is the biased voter, or
        Williams–Bjerknes, model of probability theory; on irregular graphs that model's
        per-edge rates give a different chain).
      conditions:
        - Parent chosen proportionally to fitness among all individuals, target uniform among its neighbours.
        - The CRN counterpart exists only on $K_n$.
        - >-
          Death–Birth with selection on $K_n$ without self-loops has a state-dependent up/down
          ratio, so no network of two copying reactions with constant rates has its jump chain;
          with self-loops (Moran's independent draws) it coincides with Birth–death.
        - >-
          The isothermal theorem's informal "only if" needs a minor correction (Galanis et al.,
          Proposition 12: a non-isothermal weighted graph on three vertices on which a uniformly
          placed mutant fixes with the Moran probability); its formal statement in Lieberman,
          Hauert and Nowak's supplement is correct.
        - >-
          "Biased voter" names three chains. (i) In probability (Bramson and Griffeath; Durrett
          and Moseley; Swart), defined on $\mathbb Z^d$: births at rate equal to fitness onto a
          uniform neighbour, or equivalently there rates per ordered pair of neighbours or
          proportional to neighbour frequencies. Read on any graph, the birth form is the
          continuous-time version of this row (observed at its births it is this row's chain);
          the other two forms have the jump chain of this row on regular graphs, and on irregular
          graphs they differ from each other and from this row. (ii)
          Antal, Redner and Sood: death with probability inversely proportional to fitness, the
          parent a uniform neighbour; on regular graphs it has the jump chain of this row, so a
          uniformly placed mutant fixes with the Moran probability, but not on irregular graphs.
          (iii) Durocher et al.: death–Birth with the parent drawn proportionally to fitness among
          the neighbours, which they attribute to Antal, Redner and Sood; a different chain, also
          on regular graphs and on $K_n$ without self-loops (third condition), which coincides
          with this row on $K_n$ with self-loops and, on $\mathbb Z$, up to a time change while the
          mutants form an interval of at least two sites (Durrett and Moseley, who compare this
          death-driven rule with the biased voter model). The comparisons on finite graphs are our computation.
      refs: [HindersinTraulsen2015, GalanisEtAl2017, DurrettMoseley2015, AntalRednerSood2006, DurocherEtAl2022, Swart2017]
    leanamics:
      status: definitional
      summary: >-
        The Birth–death kernel (`Moran.moranKernel`) is the push voter with fitness-biased senders.
        The library proves the "if" direction of the isothermal theorem, Moran's formula on $K_n$
        and exact fixation on the star. Networks with unequal rate constants are not formalized
        (CRN-1 assumes a common rate constant).
      correspondence: [Moran.moranKernel]
      results:
        - Moran.isothermal
        - Moran.moran_formula
        - Moran.star_fixation
        - Moran.star_amplifier
        - Moran.star_fixation_uniform_tendsto
      packages: [moran]
      blueprint:
        - /moran/blueprint/#sec:lhn-isothermal
        - /moran/blueprint/#sec:broom-rychtar
      roadmap: [MOR-1, MOR-2, MOR-3]
    paper:
      dc: 'push voter, sender chosen $\propto$ fitness'
      popgen: 'Moran Birth--death, fitness $r$'
      epi: '--'
      crn: 'on $K_n$: $M{+}W\to 2M$ (rate $r$), $M{+}W\to 2W$ (rate 1)'
      physics: 'biased voter (regular graphs)'
      social: '--'
      relation: 'same chain; CRN: jump chain'
      cite:
        popgen: [Moran1959, LiebermanHauertNowak2005]
        physics: [BramsonGriffeath1981]

  # ---------------------------------------------------------------------------------------------
  - id: coalescing
    group: genealogy
    title: Voter model and coalescing random walks; the coalescent
    dc:
      name: Duality of the voter model with coalescing random walks
      description: >-
        For every sampling kernel, the synchronous voter after rounds $r_1, \dots, r_T$ is the
        initial configuration read through $r_1 \circ \cdots \circ r_T$, whose point images are
        coalescing random walks run backwards in time; from $n$ distinct opinions, consensus time
        and coalescence time have the same law.
      refs: [HassinPeleg2001, CooperEtAl2013, BecchettiClementiNatale2020]
    popgen:
      name: Genealogy of a sample; Kingman's coalescent
      description: >-
        The ancestral lineages of a Wright–Fisher sample are coalescing random walks on $K_N$ with
        self-loops (each lineage picks a uniform parent). As $N \to \infty$, with time in units of
        $N$ generations, they converge to Kingman's coalescent, in which every pair of lineages
        merges at rate 1; the genealogy of the continuous-time Moran model is exactly a
        time-changed Kingman coalescent for every $N$.
      refs: [Kingman1982, Kingman1982b, Etheridge2011, Durrett2008]
    epi:
      none: No counterpart found.
    crn:
      name: Constant-kernel coagulation $A_i + A_j \to A_{i+j}$ (Marcus–Lushnikov)
      description: >-
        Clusters merge pairwise at a rate independent of their sizes. Kingman's coalescent is the
        stochastic coalescent with constant kernel, the Marcus–Lushnikov process up to a
        rescaling of time (Aldous); its number of clusters is the mass-action chain of
        $2A \to A$ with propensity $k\binom{a}{2}$.
      refs: [Aldous1999, Lushnikov1978]
    physics:
      name: Coalescing random walks, dual of the voter model
      description: >-
        "The voter model $X$ is pathwise dual, with respect to the additive duality function ...,
        to a collection $Y$ of coalescing random walks", particles that jump at rate 1 to a uniform
        neighbour and merge when they meet; "duality is really the key to understanding the voter
        model", which on $\mathbb Z^d$ clusters for $d \le 2$ because such walks meet (Swart,
        Proposition 6.25).
      refs: [Swart2017]
    social:
      none: No counterpart found.
    relation:
      kinds: [duality, limit, same-ctmc]
      statement: >-
        The duality is exact and pathwise, on every graph and for every sampling kernel, in
        discrete and in continuous time; in continuous time it is the voter-model duality of
        interacting particle systems (physics column). The Wright–Fisher genealogy is exactly the
        coalescing walks on $K_N$ with self-loops (two lineages meet in a generation with
        probability $1/N$), and Kingman's coalescent is its large-population limit, with multiple
        and simultaneous mergers vanishing; for coalescing walks on $K_n$ in continuous time, and
        for the continuous-time Moran model, the number of lineages jumps $k \to k-1$ at a rate
        proportional to $\binom{k}{2}$, Kingman's coalescent up to a constant time change. The
        reading of the constant-kernel coalescent as the reaction $2A \to A$ is ours.
      conditions:
        - Neutral copying; the duality needs no assumption on the graph or the kernel.
        - >-
          Kingman's coalescent is exact only in continuous time (coalescing walks on $K_n$, or the
          Moran model), and a limit for Wright–Fisher.
      refs: [Aldous2013, Etheridge2011, Durrett2008, Aldous1999, Swart2017]
    leanamics:
      status: partial
      summary: >-
        The pathwise duality for every sampling kernel (the configuration after $T$ rounds is the
        initial one composed with the backward map), its two-token form, and on $K_n$ with
        self-loops the exact probability $(1 - 1/n)^T$ that two backward walks have not met, i.e.
        that two Wright–Fisher lineages have not coalesced after $T$ generations. Kingman's
        coalescent and the coagulation reading are not formalized.
      correspondence:
        - Voter.runRounds_eq_comp
        - Voter.disagreement_runRounds_eq_zero
        - Voter.iterate_transition_eq_leftRounds
        - Voter.iterate_disagreement_le_pairWalk
        - ThreeMajority.voter_dual
      results:
        - Voter.expList_backward_ne
        - Voter.voter_consensus_whp
        - Voter.lazy_voter_consensus_whp
        - Voter.plain_voter_consensus_whp
      packages: [voter, 3-majority]
      blueprint:
        - /voter/blueprint/#lem:duality
        - /voter/blueprint/#sec:kms-meeting-time
        - /3-majority/blueprint/#sec:bcekmn-any-start
      roadmap: [VOT-3, VOT-6, MAJ-6]
    paper:
      dc: 'voter $\Leftrightarrow$ coalescing random walks'
      popgen: 'Wright--Fisher genealogy $\to$ Kingman coalescent'
      epi: '--'
      crn: 'coagulation, $2A\to A$'
      physics: 'coalescing random walks (dual)'
      social: '--'
      relation: 'dual; limit; CRN: CTMC'
      cite:
        dc: [HassinPeleg2001]
        popgen: [Kingman1982]
        crn: [Aldous1999]
        physics: [Swart2017]

  # ---------------------------------------------------------------------------------------------
  - id: averaging-migration
    group: averaging
    title: Averaging and migration
    dc:
      name: Averaging dynamics
      description: >-
        Synchronous: every node replaces its value by the average of its neighbours' values,
        $x(t+1) = P x(t)$ with $P = D^{-1}A$. The random sequential version is gossip averaging
        (a random edge averages its endpoints).
      refs: [BecchettiClementiNatale2020, BoydEtAl2006]
    popgen:
      name: Migration between demes (without selection and drift)
      description: >-
        The allele frequencies of the demes follow $p' = M p$, where $m_{\alpha\beta}$ is the
        probability that an individual of deme $\alpha$ immigrated from deme $\beta$ (the
        backward migration matrix, row stochastic).
      refs: [Burger2014]
    epi:
      none: No counterpart found.
    crn:
      none: No counterpart found.
    physics:
      name: Averaging process
      description: >-
        "Initially each agent has some (real-valued) amount of money. Whenever two agents meet,
        they divide their money equally", every pair $\{i, j\}$ meeting at the times of a
        rate-$\nu_{ij}$ Poisson process; the expected configuration solves
        $\dot x = \frac12 N x$, with $N$ the generator of the random walk with rates $\nu$ (Aldous,
        Proposition 4.1).
      refs: [Aldous2013]
    social:
      name: French–DeGroot model of opinion formation; Deffuant's pairwise model
      description: >-
        Opinions follow $x(k+1) = W x(k)$ with $W$ a stochastic matrix of influence weights
        (Proskurnikov and Tempo). In French's model every agent has a self-loop and "uniformly
        distributes influence between itself and the other nodes connected to it"; DeGroot's
        iterative opinion pooling allows any stochastic $W$ and vector opinions (subjective
        probability distributions). In the model of Deffuant et al., "any two randomly chosen
        agents meet" and, if their opinions differ by less than a threshold $d$, each moves
        towards the other by a fraction $\mu \le 1/2$ of the difference.
      refs: [French1956, DeGroot1974, ProskurnikovTempo2017, DeffuantEtAl2000]
    relation:
      kinds: [same-recursion, same-ctmc, jump-chain]
      statement: >-
        The same linear recursion when $M = P$, i.e. when every deme draws its individuals in
        equal proportions from the neighbouring demes; on a connected non-bipartite graph both
        converge to the average weighted by the stationary distribution,
        $\sum_v \deg(v)\, x_0(v)/2m$. In population genetics the recursion is the deterministic
        (infinitely large demes) part of migration; the same recursion is DeGroot's model of
        consensus in the social sciences, and the expected configuration of the synchronous voter
        model follows it too. DeGroot's model with $W = P$ is exactly the averaging dynamics, and
        French's model is the averaging dynamics of the graph with a self-loop added at every
        node (social column). The random sequential version is the averaging process of
        interacting particle systems (physics column): Boyd et al.'s asynchronous gossip, in
        which a node ticks at rate 1, contacts $j$ with probability $P_{ij}$, and "both nodes set
        their values equal to the average of their current values", is the averaging process
        with $\nu_{ij} = P_{ij} + P_{ji}$, and Aldous remarks that "the only place I have seen
        the basic process itself is in the 'gossip algorithms' literature". Deffuant et al.'s
        model with $\mu = 1/2$ and $d$ above the range of the opinions averages a uniformly random
        pair at every step: the averaging process on $K_n$, with equal rates, observed at its
        meetings.
      conditions:
        - Deterministic recursions; no drift (infinitely large demes) and no selection.
        - The identification compares the two equations; no source stating it was found.
        - >-
          The averaging process, asynchronous gossip and Deffuant et al.'s model are random
          sequential processes; their expected configurations solve a linear differential
          equation (or, step by step, a different recursion), not $x \mapsto Px$.
        - >-
          The identifications with French's model, asynchronous gossip and Deffuant et al.'s
          model compare the definitions (our computation).
      refs: [Burger2014, DeGroot1974, ProskurnikovTempo2017, French1956, BoydEtAl2006, Aldous2013, DeffuantEtAl2000]
    leanamics:
      status: results
      summary: >-
        Convergence to the degree-weighted average on connected non-bipartite graphs, its spectral
        rate, and the expected step of sequential averaging; migration is not defined in the
        library.
      correspondence: []
      results:
        - Averaging.tendsto_degAvg
        - Averaging.abs_walkMatrix_pow_sub_walkStationary_le
        - Averaging.Sequential.avg_expect_edgeMatrix
      packages: [averaging]
      blueprint:
        - /averaging/blueprint/#thm:conv
        - /averaging/blueprint/#sec:lovasz
        - /averaging/blueprint/#sec:bgps-gossip
      roadmap: [AVG-1]
    paper:
      dc: 'averaging dynamics $x\mapsto Px$'
      popgen: 'migration $p\mapsto Mp$'
      epi: '--'
      crn: '--'
      physics: 'averaging process (gossip)'
      social: 'French--DeGroot $x\mapsto Wx$'
      relation: 'same recursion; gossip: CTMC'
      cite:
        dc: [BoydEtAl2006]
        popgen: [Burger2014]
        physics: [Aldous2013]
        social: [DeGroot1974]

  # ---------------------------------------------------------------------------------------------
  - id: three-majority
    group: majority
    title: Majority of three samples (binary 3-Majority)
    dc:
      name: 3-Majority dynamics
      description: >-
        Synchronous rounds: every node samples three nodes uniformly at random, with replacement
        and possibly itself, and adopts the majority opinion of the three samples, ignoring its
        own opinion.
      refs: [BecchettiEtAl2014, BecchettiClementiNatale2020]
    popgen:
      name: Conformist transmission with three models (cultural evolution)
      description: >-
        Each naive individual samples three models from the previous generation and acquires a
        variant held by 3, 2, 1, 0 of them with probability $1$, $\frac23 + \frac D3$,
        $\frac13 - \frac D3$, $0$, so the variant's frequency follows
        $p' = p + Dp(1-p)(2p-1)$ (Boyd and Richerson, Eq. 7.1). Individual-based versions sample
        the three models with replacement from the whole previous generation.
      refs: [BoydRicherson1985, HenrichBoyd1998, AcerbiMesoudiSmolla2022]
    epi:
      none: No counterpart found.
    crn:
      none: >-
        Synchronous rounds. The sequential version updates one agent from three others, an
        interaction of four agents rather than a standard reaction; Condon et al. call synchronous
        3-Majority "quite similar" to their trimolecular network with three or more species (next
        row).
    physics:
      name: Galam's majority-rule model with groups of three
      description: >-
        Agents meet in randomly formed discussion groups and every group adopts its local majority
        at once (in a group of even size a tie makes the whole group adopt the status-quo
        opinion); with groups of three only, the proportion $P$ of one opinion follows
        $P \mapsto P^3 + 3P^2(1 - P)$ (Galam, Eq. 4 with $a_3 = 1$).
      refs: [Galam2002]
    social:
      none: >-
        No counterpart found in sociology or economics; conformist transmission of cultural
        evolution is in the population-genetics column, and Galam's majority rule of sociophysics
        in the physics column.
    relation:
      kinds: [same-chain, mean-field]
      statement: >-
        With $D = 1$ the conformist recursion is $p' = 3p^2 - 2p^3$, the expected one-round map of
        binary 3-Majority with samples drawn with replacement. In a population of $N$ with
        non-overlapping generations in which every new individual samples its three models with
        replacement from the whole previous generation, $D = 1$ gives exactly synchronous binary
        3-Majority on $K_N$ with self-loops; for $0 \le D \le 1$ the rule adopts the majority of
        the three with probability $D$ and otherwise copies one of them uniformly (the voter
        rule). Galam's majority rule of sociophysics (physics column), with groups of three, has
        the same map but updates whole groups at once, so only the mean-field maps agree.
      conditions:
        - Two variants (opinions); sampling with replacement from the whole population; $D = 1$.
        - >-
          No source in either field cites the other; the identification compares the rules, and
          the reading of Boyd and Richerson's table as "majority with probability $D$, otherwise
          copy" is ours.
      refs: [BoydRicherson1985, AcerbiMesoudiSmolla2022, Galam2002]
    leanamics:
      status: results
      summary: >-
        The exact expected one-round map $\mathbb E[X_{t+1}] = n(3x^2 - 2x^3)$ (the mean-field
        identity) and consensus theorems for 3-Majority; conformist transmission is not defined in
        the library.
      correspondence: []
      results:
        - ThreeMajority.avg_card_step
        - ThreeMajority.majority3_consensus_whp
        - Plurality.majority3_vanishing_bias
        - Plurality.majority3_any_start
        - Plurality.theorem_3_8
      packages: [3-majority, plurality]
      blueprint:
        - /3-majority/blueprint/#sec:map
        - /3-majority/blueprint/#sec:main-statement
        - /plurality/blueprint/#sec:upper
        - /plurality/blueprint/#sec:any_start
      roadmap: [MAJ-2, MAJ-7, MAJ-8]
    paper:
      dc: '3-Majority, two opinions'
      popgen: 'conformist transmission, three models'
      epi: '--'
      crn: '--'
      physics: 'Galam majority rule, groups of 3'
      social: '--'
      relation: 'same chain; mean field'
      cite:
        dc: [BecchettiEtAl2014]
        popgen: [BoydRicherson1985]
        physics: [Galam2002]

  # ---------------------------------------------------------------------------------------------
  - id: two-choices
    group: majority
    title: Majority of oneself and two samples (2-Choices, binary median rule)
    dc:
      name: 2-Choices; with two values, the median rule
      description: >-
        A node samples two nodes and adopts their opinion if they agree, otherwise keeps its own:
        the majority of its own and two sampled opinions (the median of three values). Studied
        synchronously and sequentially (one activated node per step).
      refs: [DoerrEtAl2011, BecchettiClementiNatale2020, CooperEtAl2025]
    popgen:
      none: >-
        No counterpart found; conformist transmission uses three models and ignores the learner's
        own variant (previous row).
    epi:
      none: No counterpart found.
    crn:
      name: 'Trimolecular approximate majority $2X + Y \to 3X$, $X + 2Y \to 3Y$'
      description: >-
        Common rate constant; with $k$ species, $2Z_i + Z_j \to 3Z_i$ for all $i \ne j$.
      refs: [CondonEtAl2020]
    physics:
      name: >-
        Nonlinear $q$-voter model with $q = 2$, $\varepsilon = 0$; on $K_n$, the Sznajd model and
        the majority-rule model with groups of three
      description: >-
        "Choose one spin at random", then "$q$ neighbors (with possible repetition)"; "If all the
        $q$ neighbors are in the same state, the original spin takes the value of the $q$
        neighbors", otherwise it flips with probability $\varepsilon$, and time advances by $1/N$
        (Castellano, Muñoz and Pastor-Satorras). In Slanina and Lavička's formulation of the
        Sznajd model on the complete graph, agents $i$, then $j \ne i$, then $k \notin \{i, j\}$
        are drawn and $k$ takes the opinion of $i$ and $j$ if they agree, "schematically as
        reactions $AAB \to AAA$, $BBA \to BBB$". In Krapivsky and Redner's majority rule, in its
        mean-field form, a random group of $G$ agents ($G$ odd) is picked and "The spins in the
        group all adopt the state of the local majority".
      refs: [CastellanoMunozPastorSatorras2009, SlaninaLavicka2003, KrapivskyRedner2003]
    social:
      none: No counterpart found; the Sznajd model of opinion formation is in the physics column.
    relation:
      kinds: [same-chain, jump-chain, mean-field]
      statement: >-
        Condon et al. note that the binary median rule "involves rules that are identical to the
        interactions" of this network. In the sequential version on $K_n$, where the activated
        node samples two distinct other nodes, a node of opinion $j$ switches to $i$ at a rate
        proportional to $x_j\binom{x_i}{2}$, the propensity of $2Z_i + Z_j \to 3Z_i$: the same
        jump chain. With samples drawn with replacement the rates are proportional to $x_j x_i^2$
        instead, a difference of order $1/n$. The synchronous dynamics shares only the mean-field
        map $3p^2 - 2p^3$ with 3-Majority. The $q$-voter model with $q = 2$ and $\varepsilon = 0$
        (physics column) is, rule for rule, sequential 2-Choices with the two neighbours sampled
        with replacement, on every graph; its authors note that it "practically coincides" with
        the Sznajd model in Slanina and Lavička's formulation. On $K_n$ that formulation draws a
        uniformly random ordered triple of distinct agents, so it is exactly sequential 2-Choices
        with two distinct samples other than the updating node, the version with the jump chain of
        the network. Krapivsky and Redner's majority rule with groups of three (a uniformly random
        group of three distinct agents adopts its majority) changes the configuration exactly when
        that version does, with three times its probability: the two have the same jump chain,
        and Slanina and Lavička note that on the complete graph their process differs from the
        majority model only by "rescaling certain variables".
      conditions:
        - Complete graph; sequential updates; two distinct samples other than the updating node.
        - The exact identity is an elementary computation, not stated in the sources.
        - >-
          The $q$-voter identity holds on every graph, with the two neighbours sampled with
          replacement; on a graph the Sznajd model of Slanina and Lavička draws the updated agent
          among the common neighbours of an agreeing pair, a different rule, so its identity
          with 2-Choices is stated for $K_n$ only.
        - >-
          The identities with the $q$-voter, Sznajd and majority-rule models compare the rules (our
          computation); Slanina and Lavička's printed transition probabilities are first-order
          expansions in $1/N$ of the exact ones.
      refs: [CondonEtAl2020, CastellanoMunozPastorSatorras2009, SlaninaLavicka2003, KrapivskyRedner2003]
    leanamics:
      status: results
      summary: >-
        Synchronous 2-Choices and the median rule: the expected one-round map $n(3p^2 - 2p^3)$,
        consensus from a gap and from any configuration, with an adversary, on expanders and with
        many colours. The sequential version and the network are not formalized.
      correspondence: []
      results:
        - Median.expected_ones
        - Median.consensus_whp
        - Median.binary_any_start
        - Median.median_consensus_any
        - Median.binary_almost_stable
        - Median.two_choices_expander
        - Median.TwoChoices.plurality_whp
      packages: [median]
      blueprint:
        - /median/blueprint/#sec:dgmss-median
        - /median/blueprint/#thm:binary-adv
        - /median/blueprint/#sec:cer-two-choices
        - /median/blueprint/#sec:efkmt-plurality
      roadmap: [MAJ-1, MAJ-3, MAJ-4, MAJ-5, MAJ-8]
    paper:
      dc: '2-Choices (binary median rule)'
      popgen: '--'
      epi: '--'
      crn: 'sequential: $2X{+}Y\to 3X$, $X{+}2Y\to 3Y$'
      physics: '$q$-voter, $q{=}2$; on $K_n$: Sznajd, majority rule'
      social: '--'
      relation: 'jump chain; $q$-voter, Sznajd: same chain'
      cite:
        dc: [DoerrEtAl2011]
        crn: [CondonEtAl2020]
        physics: [CastellanoMunozPastorSatorras2009, SlaninaLavicka2003, KrapivskyRedner2003]

  # ---------------------------------------------------------------------------------------------
  - id: approximate-majority
    group: majority
    title: Sequential undecided-state dynamics and approximate majority
    dc:
      name: Sequential undecided-state dynamics, i.e. the approximate-majority population protocol
      description: >-
        One uniformly random ordered pair (initiator, responder) of distinct agents per step; a
        decided responder becomes undecided if the initiator holds the other opinion, and an
        undecided responder adopts the initiator's opinion. In the undecided-state dynamics the
        node that samples is the responder. Perron, Vasudevan and Vojnović study the
        continuous-time version.
      refs: [AngluinAspnesEisenstat2008, BecchettiClementiNatale2020, ClementiEtAl2018, PerronVasudevanVojnovic2009]
    popgen:
      none: No counterpart found.
    epi:
      none: No counterpart found.
    crn:
      name: 'Approximate-majority network $X + Y \to X + B$, $X + Y \to Y + B$, $B + X \to 2X$, $B + Y \to 2Y$'
      description: >-
        Common rate constant. Cardelli and Csikász-Nagy argue that the cell-cycle switch computes
        it; a variant with $X + Y \to 2B$ was built with DNA strand displacement (Chen et al.).
      refs: [CardelliCsikaszNagy2012, ChenEtAl2013]
    physics:
      name: Three-state kinetic exchange opinion model without negative interactions
      description: >-
        Opinions $+1$, $-1$ and $0$ (undecided) on the complete graph; a random agent $i$ meets
        another agent $j$, "in a way that $j$ will influence $i$", and
        $o_i(t+1) = \mathrm{sgn}[o_i(t) + o_j(t)]$ (Crokidakis, the case of no independent
        behaviour), which he presents as the model of Biswas, Chatterjee and Sen with no negative
        interactions; in theirs both agents of the pair update.
      refs: [Crokidakis2014, BiswasChatterjeeSen2012]
    social:
      none: No counterpart found.
    relation:
      kinds: [same-chain, jump-chain, same-ctmc]
      statement: >-
        The ordered pairs that change the configuration have weights $xy$, $yx$, $xb$, $yb$ out of
        $n(n-1)$, proportional to the mass-action propensities, so the protocol's count chain has
        the jump chain of the network; when every ordered pair interacts at rate $1/(n-1)$ it is
        the network's continuous-time chain with rate constant $1/(n-1)$. Angluin, Aspnes and
        Eisenstat consider "the Population-Protocol model which is, in our specific context,
        equivalent to the sequential PULL model" (Clementi et al.). In the kinetic exchange model
        (physics column) $\mathrm{sgn}(o_i + o_j)$ is the protocol's rule for all nine pairs of
        states, with $i$ the responder and $j$ the initiator, so with a uniformly random ordered
        pair of distinct agents per step it is the same chain as the approximate-majority
        protocol. If both agents update, as for Biswas, Chatterjee and Sen, two opposite opinions
        both become $0$: the count chain has the jump chain of $X + Y \to 2B$, $B + X \to 2X$,
        $B + Y \to 2Y$, the variant built by Chen et al.
      conditions:
        - Complete graph (well mixed), sequential.
        - >-
          The synchronous undecided-state dynamics is a different chain (for instance, it can make
          every node undecided) and has no CRN counterpart; on other interaction graphs the
          protocol is a graph population protocol, without CRN counterpart.
        - >-
          The identities with the kinetic exchange models compare the rules (our computation); no
          source relating them to approximate majority was found.
      refs: [BecchettiClementiNatale2020, ClementiEtAl2018, Doty2014, Crokidakis2014, BiswasChatterjeeSen2012, ChenEtAl2013]
    leanamics:
      status: partial
      summary: >-
        The network's jump chain equals the population protocol of the network conditioned on
        reacting (`Crn.ApproxMajority.network_jumpKernel_eq_ppKernel`, a protocol that also draws
        a uniform reaction): the protocol on count vectors and the network have the same jump
        chain (`Crn.ApproxMajority.network_sameJumpChain`, a `Dynamics.Kernel.SameJumpChain`). The
        sequential undecided-state dynamics is defined as Angluin, Aspnes and Eisenstat's
        protocol, and its convergence and correctness are proved. That the two protocols have the
        same count chain is not formalized.
      correspondence:
        - Crn.ApproxMajority.network_jumpKernel_eq_ppKernel
        - Crn.ApproxMajority.network_sameJumpChain
        - Undecided.Sequential.step
